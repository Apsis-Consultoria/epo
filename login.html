  <script src="assets/supabase-config.js?v=116"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js?v=116"></script>
  <script>
    (function () {
      "use strict";
      var $ = function (id) { return document.getElementById(id); };

      // ---------------------------------------------------------------- captcha
      // Protege os dois caminhos de fora da APSIS: entrar com e-mail e senha, e
      // pedir o link de senha. A conta Microsoft nao passa por aqui.
      //
      // Sem chave do site configurada, nada disso roda e a tela segue igual a
      // antes: e assim que o captcha fica desligado sem quebrar a entrada.
      var CAPTCHA_KEY = (window.CAPTCHA_SITE_KEY || "").trim();
      var captchaId = null;
      var captchaToken = "";

      function captchaLigado() { return !!CAPTCHA_KEY; }

      function carregarCaptcha() {
        if (!captchaLigado() || window.turnstile || document.getElementById("turnstile-js")) return;
        var tag = document.createElement("script");
        tag.id = "turnstile-js";
        tag.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
        tag.async = true;
        tag.defer = true;
        tag.onload = montarCaptcha;
        document.head.appendChild(tag);
      }

      function montarCaptcha() {
        if (!captchaLigado() || !window.turnstile || captchaId !== null) return;
        var caixa = $("captcha-caixa");
        if (!caixa) return;
        caixa.classList.remove("hidden");
        captchaId = window.turnstile.render(caixa, {
          sitekey: CAPTCHA_KEY,
          callback: function (t) { captchaToken = t || ""; },
          "expired-callback": function () { captchaToken = ""; },
          "error-callback": function () { captchaToken = ""; }
        });
      }

      // Token do Turnstile serve UMA vez: depois de cada tentativa o desafio e
      // refeito, senao a segunda tentativa vai com um token ja gasto e o
      // servidor recusa sem dizer por que.
      function renovarCaptcha() {
        captchaToken = "";
        if (captchaLigado() && window.turnstile && captchaId !== null) {
          try { window.turnstile.reset(captchaId); } catch (e) { /* segue sem token */ }
        }
      }

      // Com o captcha ligado, agir sem token seria recusa do servidor com
      // mensagem crua. Melhor dizer o que falta.
      function faltaCaptcha() {
        if (!captchaLigado()) return false;
        if (captchaToken) return false;
        msg("Conclua a verificação de segurança abaixo e tente de novo.", true);
        return true;
      }

      function msg(texto, erro) {
        var el = $("cli-msg");
        el.textContent = texto;
        el.classList.remove("hidden");
        el.style.color = erro ? "#dc2626" : "#16a34a";
      }

      // A tela de carregamento sai quando esta entrada vai FICAR na tela. Quem
      // ja tem sessao valida e mandado para dentro, e nesse caso ela nao sai:
      // sem isso a entrada aparecia por um instante e era trocada, o que parecia
      // defeito para quem so quis abrir o sistema.
      var saiuCarregando = false;
      function mostrarEntrada() {
        if (saiuCarregando) return;
        saiuCarregando = true;
        var el = $("tela-carregando");
        if (!el) return;
        el.style.opacity = "0";
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
      }
      // Nada pode prender a pessoa atras do logo, nem falha de rede.
      setTimeout(mostrarEntrada, 7000);

      // Já logado? Vai direto para o app.
      if (window.Auth && Auth.pronto) {
        // Ja entrou antes: vai direto para a tela dele, e nao para a visao
        // geral, que a equipe de campo e o responsavel da EPO nao alcancam.
        // Saida garantida: login?sair=1 encerra a sessao guardada neste
        // navegador e fica aqui, sem conferir nada. Serve para o caso em que a
        // sessao esta num estado que nao da para completar - e o unico caminho
        // que nao depende de o servidor responder nem de o segundo fator existir.
        if (/[?&]sair=1/.test(location.search)) {
          var limparTudo = function () {
            try {
              Object.keys(localStorage).forEach(function (k) {
                if (/^sb-.*-auth-token/.test(k)) localStorage.removeItem(k);
              });
            } catch (e) {}
            msg("Sessão encerrada neste navegador. Informe o seu e-mail para receber um código.");
            mostrarEntrada();
          };
          Auth.cliente.auth.signOut({ scope: "local" }).then(limparTudo, limparTudo);
          return;
        }

        Auth.sessao().then(function (s) {
          if (!s) { mostrarEntrada(); return; }
          // Sessao que ainda pede o codigo do segundo fator NAO entra sozinha.
          //
          // Era um laco fechado: a entrada via a sessao e mandava para dentro, o
          // guard via que faltava o codigo e mandava para a tela do codigo, e la o
          // envio podia falhar (token velho da epoca da senha) - sem jeito de
          // voltar para a entrada, porque a entrada mandava para dentro de novo.
          //
          // Sessao antiga, da epoca da senha, e sobra: encerra e fica aqui, que e
          // onde se entra agora, por codigo.
          Auth.mfaSituacao().then(function (m) {
            if (m && m.precisa) {
              function avisar() {
                msg("A sua sessão anterior expirou. Informe o seu e-mail para receber um código.", true);
                mostrarEntrada();
              }
              // Se o servidor recusar a saida (token velho), a sessao sai daqui
              // de dentro: guardada, ela seria encontrada outra vez no proximo
              // carregamento e o laco voltaria.
              return Auth.cliente.auth.signOut()
                .then(function (r) {
                  if (r && r.error) return Auth.cliente.auth.signOut({ scope: "local" });
                  return null;
                }, function () { return Auth.cliente.auth.signOut({ scope: "local" }); })
                .then(avisar, avisar);
            }
            Auth.telaInicial().then(function (d) { location.replace(d); },
                                   function () { location.replace("index"); });
          }, function () {
            // Sem resposta sobre o segundo fator, nao arrisca o laco: fica aqui.
            Auth.cliente.auth.signOut({ scope: "local" })
              .then(mostrarEntrada, mostrarEntrada);
          });
        }, mostrarEntrada);
      } else {
        // Sem a biblioteca de dados: a entrada aparece do mesmo jeito.
        mostrarEntrada();
      }

      // SSO Microsoft (Entra ID)
      var msOriginal = $("btn-ms").innerHTML;
      function msFalhou() {
        $("btn-ms").disabled = false;
        $("btn-ms").innerHTML = msOriginal;
        msg("A entrada pela conta Microsoft ainda não está liberada. Use o código por e-mail.", true);
      }

      $("btn-ms").addEventListener("click", function () {
        if (!window.Auth || !Auth.pronto) { location.href = "index"; return; }
        $("btn-ms").disabled = true;
        // Esta pagina nao carrega a folha de icones; um <i class="ti"> aqui
        // vira quadrado vazio. Texto simples resolve.
        $("btn-ms").textContent = "Abrindo a conta Microsoft...";
        Auth.entrarMicrosoft().then(function (r) {
          if (r && r.error) msFalhou();
        }).catch(msFalhou);
      });

      // O painel do e-mail: dois passos, um por vez. Primeiro o e-mail, depois o
      // codigo que chegou nele. Nao existe senha neste caminho - nao ha o que
      // criar, guardar, esquecer nem redefinir.
      //
      // Escolher este caminho tira os dois botoes de escolha da frente: com o
      // painel aberto eles nao servem para mais nada e empurravam os campos para
      // baixo.
      function mostrarEscolha(mostrar) {
        ["btn-ms", "sep-ou", "btn-cliente"].forEach(function (id) {
          $(id).classList.toggle("hidden", !mostrar);
        });
      }

      function abrirPainel() {
        carregarCaptcha();
        montarCaptcha();
        mostrarEscolha(false);
        $("painel-cliente").classList.remove("hidden");
        $("etapa-codigo").classList.add("hidden");
        $("etapa-email").classList.remove("hidden");
        $("cli-msg").classList.add("hidden");
        $("cli-email").focus();
      }

      function fecharPainel() {
        $("painel-cliente").classList.add("hidden");
        $("cli-msg").classList.add("hidden");
        mostrarEscolha(true);
      }

      $("btn-cliente").addEventListener("click", abrirPainel);
      $("btn-fechar-painel").addEventListener("click", fecharPainel);
      $("btn-voltar-email").addEventListener("click", abrirPainel);

      function emailDigitado() {
        return ($("cli-email").value || "").trim().toLowerCase();
      }

      function emailValido(e) {
        return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
      }

      // Esta tela nao carrega o app.js, entao a limpeza do texto e daqui mesmo.
      // O endereco encoberto vem do servidor, mas o que vai para dentro de HTML
      // se limpa de qualquer forma.
      function limpar(t) {
        return String(t == null ? "" : t)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // ------------------------------------------------------------ 1) pedir
      function pedirCodigo(botao) {
        var email = emailDigitado();
        if (!emailValido(email)) { msg("Informe um e-mail válido.", true); return; }
        if (faltaCaptcha()) return;

        var rotulo = botao.textContent;
        botao.disabled = true;
        botao.textContent = "Enviando...";
        function liberar() { botao.disabled = false; botao.textContent = rotulo; }

        Auth.pedirCodigoDeEntrada(email, captchaToken).then(function (r) {
          liberar();
          renovarCaptcha();
          // O servico deixa pedir um codigo por minuto para o mesmo endereco.
          // Dizer "enviamos" quando ele recusou faz a pessoa esperar um e-mail
          // que nao vem.
          if (r && !r.enviado) {
            if (r.espere) {
              msg("Você pediu um código agora há pouco. Aguarde " + r.espere +
                  " segundos e peça de novo.", true);
            } else {
              msg("Não foi possível enviar o código agora. Tente de novo em alguns instantes.", true);
            }
            return;
          }
          // A mesma resposta vale para e-mail com e sem acesso, de proposito:
          // esta tela nao conta quem tem conta no sistema.
          $("codigo-titulo").innerHTML =
            "Se esse e-mail tiver acesso, o código chega em instantes" +
            (r && r.para ? " em <b>" + limpar(r.para) + "</b>" : "") +
            ". Confira a caixa de entrada e o spam." +
            (r && r.minutos ? " Ele vale por " + r.minutos + " minutos." : "");
          $("etapa-email").classList.add("hidden");
          $("etapa-codigo").classList.remove("hidden");
          $("cli-msg").classList.add("hidden");
          $("cli-codigo").value = "";
          $("cli-codigo").focus();
        }, function (e) {
          liberar();
          renovarCaptcha();
          console.error("pedirCodigoDeEntrada", e);
          msg("Não foi possível enviar o código agora. Tente de novo em alguns instantes.", true);
        });
      }

      $("btn-enviar-codigo").addEventListener("click", function () { pedirCodigo(this); });
      $("btn-outro-codigo").addEventListener("click", function () { pedirCodigo(this); });
      $("cli-email").addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") $("btn-enviar-codigo").click();
      });

      // ------------------------------------------------------------ 2) entrar
      function entrarComCodigo() {
        var email = emailDigitado();
        var codigo = ($("cli-codigo").value || "").replace(/[^0-9]/g, "");
        if (codigo.length < 4) { msg("Digite o código de seis dígitos que chegou no seu e-mail.", true); return; }

        var btn = $("btn-entrar-codigo");
        if (btn.disabled) return;
        btn.disabled = true;
        btn.textContent = "Entrando...";
        function liberar() { btn.disabled = false; btn.textContent = "Entrar"; }

        Auth.entrarComCodigo(email, codigo).then(function (r) {
          if (r && !r.ok) {
            liberar();
            // O motivo vem do servidor: codigo errado, expirado, ou tentado
            // cinco vezes. Cada um pede uma acao diferente de quem esta na tela.
            msg(r.motivo || "Código incorreto ou expirado. Peça um código novo.", true);
            return;
          }
          Auth.telaInicial().then(function (d) { location.replace(d); },
                                 function () { location.replace("index"); });
        }, function (e) {
          liberar();
          console.error("entrarComCodigo", e);
          msg("Não foi possível entrar agora. Tente novamente em alguns instantes.", true);
        });
      }

      $("btn-entrar-codigo").addEventListener("click", entrarComCodigo);
      $("cli-codigo").addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") entrarComCodigo();
      });
      // So numero, e entra sozinho aos seis digitos: quem recebe o codigo no
      // celular cola e nao precisa procurar o botao.
      $("cli-codigo").addEventListener("input", function () {
        var limpo = (this.value || "").replace(/[^0-9]/g, "").slice(0, 6);
        if (limpo !== this.value) this.value = limpo;
        if (limpo.length === 6) entrarComCodigo();
      });

    })();
  </script>
</body>
</html>
