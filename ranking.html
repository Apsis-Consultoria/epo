<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranking de EPOs - Auditoria de EPOs</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/app.css?v=60">
  <style>
    /* Ajustes locais da tela de ranking (linha expansível) */
    .rank-row { cursor: pointer; }
    .rank-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }
    .rank-toggle:hover { background: var(--surface-2); color: var(--text); }
    .rank-toggle i { font-size: 16px; transition: transform .18s ease; }
    tr.rank-row.is-open .rank-toggle i { transform: rotate(90deg); }

    tr.rank-detail > td {
      background: var(--surface-2);
      padding: 16px 18px 18px;
      cursor: default;
    }
    tr.rank-detail:hover { background: transparent; }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
      gap: 20px 28px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .detail-grid { grid-template-columns: 1fr; }
    }
    .detail-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .detail-title .muted { font-weight: 400; color: var(--text-muted); }

    .proc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px 18px;
    }
    .proc-cell { min-width: 0; }
    .proc-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .proc-nome {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-size: 12px;
      color: var(--text-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .proc-ponto {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .proc-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .proc-pct {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .proc-cell .score-bar { height: 8px; }

    .rev-list { display: flex; flex-direction: column; gap: 12px; }
    .rev-item { min-width: 0; }
    .rev-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--text-2);
    }
    .rev-val { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
    .rev-item .score-bar { height: 8px; }
    .rev-note { margin: 4px 0 0; font-size: 11px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <script src="assets/data.js?v=60"></script>
  <script src="assets/app.js?v=60"></script>
  <script src="assets/supabase-config.js?v=60"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js?v=60"></script>
  <script src="assets/dados-reais.js?v=60"></script>
  <script>
    // As listas desta tela vem do cadastro. Sem cadastro, ela abre vazia:
    // antes mostrava um catalogo de exemplo escrito no codigo, com
    // unidades e notas que nao existiam em lugar nenhum.
    DadosReais.entao(function () {
      "use strict";

      var acoes =
        '<a class="btn btn-primary btn-sm" href="pendentes.html">' +
          '<i class="ti ti-clipboard-list" aria-hidden="true"></i>Auditorias pendentes' +
        "</a>";

      Layout.mount("ranking", "Ranking de EPOs", acoes);

      var esc = App.escapeHtml;

      // Estado dos controles ------------------------------------------------
      var state = { tier: "todas", q: "", sort: "score", open: null };

      var FILTROS = [
        { key: "todas",  label: "Todas" },
        { key: "ouro",   label: "Ouro" },
        { key: "prata",  label: "Prata" },
        { key: "bronze", label: "Bronze" },
        { key: "critico", label: "Crítico" }
      ];

      var ORDENACAO = {
        score: function (a, b) { return b.score - a.score; },
        ciclo: function (a, b) { return a.tempoCiclo - b.tempoCiclo; },
        conformidade: function (a, b) { return b.conformidade - a.conformidade; }
      };

      // Estrutura fixa da página --------------------------------------------
      var page = document.getElementById("page");
      page.innerHTML =
        '<p class="page-intro">' +
          "Classificação das EPOs auditadas por desempenho no ciclo de vida dos equipamentos. " +
          "As melhores colocadas recebem mais equipamentos e prioridade de faturamento. " +
          "Clique em uma linha para ver o desempenho por processo e os indicadores da logística reversa." +
        "</p>" +

        '<div class="card stack-md" style="margin-bottom:16px;">' +
          '<div class="row-between wrap">' +
            '<div class="row wrap" role="group" aria-label="Filtrar por tier" id="filtros">' +
              FILTROS.map(function (f) {
                return '<button type="button" class="chip" data-tier="' + f.key + '">' +
                  esc(f.label) + "</button>";
              }).join("") +
            "</div>" +
            '<div class="row wrap">' +
              '<div class="field mb-0" style="width:240px;max-width:100%;">' +
                '<label class="visually-hidden" for="busca" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Buscar EPO</label>' +
                '<input class="input" id="busca" type="search" placeholder="Buscar EPO..." autocomplete="off">' +
              "</div>" +
              '<div class="field mb-0" style="width:220px;max-width:100%;">' +
                '<label class="visually-hidden" for="ordenar" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Ordenar por</label>' +
                '<select class="select" id="ordenar">' +
                  '<option value="score">Ordenar: Pontuação</option>' +
                  '<option value="ciclo">Ordenar: Tempo de ciclo</option>' +
                  '<option value="conformidade">Ordenar: Conformidade</option>' +
                "</select>" +
              "</div>" +
            "</div>" +
          "</div>" +
        "</div>" +

        '<div class="card mb-0">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Classificação geral</span>' +
              '<span class="subtitle" id="ranking-count"></span>' +
            "</div>" +
          "</div>" +
          '<div id="ranking-body"></div>' +
          '<hr class="divider">' +
          '<div class="row wrap" style="gap:16px;">' +
            '<span class="muted" style="font-size:12px;">Cortes de classificação:</span>' +
            '<span class="badge badge-ouro"><i class="ti ti-circle-filled" aria-hidden="true"></i>Ouro &ge; 85</span>' +
            '<span class="badge badge-prata"><i class="ti ti-circle-filled" aria-hidden="true"></i>Prata 70-84</span>' +
            '<span class="badge badge-bronze"><i class="ti ti-circle-filled" aria-hidden="true"></i>Bronze 55-69</span>' +
            '<span class="badge badge-critico"><i class="ti ti-circle-filled" aria-hidden="true"></i>Crítico &lt; 55</span>' +
          "</div>" +
        "</div>";

      // Renderização da lista -----------------------------------------------
      function getLista() {
        var lista = (window.APP.epos || []).slice();

        if (state.tier !== "todas") {
          lista = lista.filter(function (e) { return e.tier === state.tier; });
        }
        if (state.q) {
          var q = state.q.toLowerCase();
          lista = lista.filter(function (e) {
            return (e.nome + " " + e.cidade + " " + e.uf).toLowerCase().indexOf(q) !== -1;
          });
        }
        lista.sort(ORDENACAO[state.sort] || ORDENACAO.score);
        return lista;
      }

      // Cada processo tem a sua cor fixa. Bate o olho no painel e sabe que
      // faixa está falando de logística reversa e qual fala de presos em
      // assinante, sem precisar ler rótulo nenhum.
      var CORES_PROCESSO = {
        "reversa":                 ["#15806B", "#3FC2A3"],
        "baixas":                  ["#2563EB", "#6FA4FA"],
        "armazenagem":             ["#7C3AED", "#AC8CFB"],
        "recebimento-expedicao":   ["#65A30D", "#A9E635"],
        "presos":                  ["#F47920", "#FBB16A"],
        "treinamento":             ["#DB2777", "#F472B6"],
        "governanca":              ["#DC2626", "#F87171"],
        "documentacao":            ["#475569", "#8B9AAD"]
      };
      // Processo novo que apareça depois ainda ganha cor própria.
      var CORES_RESERVA = [
        ["#0E7490", "#38BDF8"], ["#9333EA", "#C084FC"], ["#CA8A04", "#FACC15"],
        ["#0F766E", "#2DD4BF"], ["#4F46E5", "#818CF8"], ["#BE185D", "#F9A8D4"]
      ];

      function gradienteProcesso(id, i) {
        var par = CORES_PROCESSO[id] || CORES_RESERVA[i % CORES_RESERVA.length];
        return "linear-gradient(90deg," + par[0] + " 0%," + par[1] + " 100%)";
      }

      function barra(pct, fundo) {
        var estilo = "width:" + pct + "%;";
        var classe = "score-fill";
        if (fundo) estilo += "background:" + fundo + ";";
        else classe += " tier-" + App.tierOf(pct);
        return '<span class="score-bar">' +
          '<span class="' + classe + '" style="' + estilo + '"></span>' +
        "</span>";
      }

      function detalheEpo(e, open) {
        var v = (e.vistorias && e.vistorias.length)
          ? e.vistorias[e.vistorias.length - 1]
          : null;
        var r = e.reversa || {};

        var procs = v
          ? v.secoes.map(function (s, i) {
              var cor = gradienteProcesso(s.processoId, i);
              return '<div class="proc-cell">' +
                '<div class="proc-head">' +
                  '<span class="proc-nome" title="' + esc(s.nome) + '">' +
                    '<span class="proc-ponto" style="background:' + cor + ';"></span>' +
                    '<span class="proc-txt">' + esc(s.nome) + "</span>" +
                  "</span>" +
                  '<span class="proc-pct">' + App.fmtPct(s.pct) + "</span>" +
                "</div>" +
                barra(s.pct, cor) +
              "</div>";
            }).join("")
          : '<p class="muted" style="font-size:12px;">Sem vistoria registrada.</p>';

        var pctVolume = r.saldoSistema
          ? Math.round((r.volumeDevolvido / r.saldoSistema) * 100)
          : null;
        var metaFontes = r.metaFontes != null ? r.metaFontes : 75;
        var metaControles = r.metaControles != null ? r.metaControles : 75;

        var rev =
          '<div class="rev-list">' +
            '<div class="rev-item">' +
              '<div class="rev-head"><span>Aderência à calendarização</span>' +
                '<span class="rev-val">' + App.fmtPct(r.aderenciaCalendario) + "</span></div>" +
              barra(r.aderenciaCalendario || 0) +
            "</div>" +
            '<div class="rev-item">' +
              '<div class="rev-head"><span>Volume devolvido vs saldo no sistema</span>' +
                '<span class="rev-val">' + App.fmtNum(r.volumeDevolvido) + " de " + App.fmtNum(r.saldoSistema) + "</span></div>" +
              barra(pctVolume || 0) +
              (pctVolume != null
                ? '<p class="rev-note">' + App.fmtPct(pctVolume) + " do saldo devolvido no período</p>"
                : "") +
            "</div>" +
            '<div class="rev-item">' +
              '<div class="rev-head"><span>Fontes devolvidas</span>' +
                '<span class="rev-val ' + (r.pctFontes >= metaFontes ? "delta-up" : "delta-down") + '">' +
                  App.fmtPct(r.pctFontes) + " · meta " + metaFontes + "%</span></div>" +
              barra(r.pctFontes || 0) +
            "</div>" +
            '<div class="rev-item">' +
              '<div class="rev-head"><span>Controles remotos devolvidos</span>' +
                '<span class="rev-val ' + (r.pctControles >= metaControles ? "delta-up" : "delta-down") + '">' +
                  App.fmtPct(r.pctControles) + " · meta " + metaControles + "%</span></div>" +
              barra(r.pctControles || 0) +
            "</div>" +
          "</div>";

        return '<tr class="rank-detail" data-detail="' + esc(e.id) + '"' + (open ? "" : " hidden") + ">" +
          '<td colspan="10">' +
            '<div class="detail-grid">' +
              "<div>" +
                '<p class="detail-title">Desempenho por processo' +
                  (v ? ' <span class="muted">· vistoria ' + esc(v.label) + "</span>" : "") +
                "</p>" +
                '<div class="proc-grid">' + procs + "</div>" +
              "</div>" +
              "<div>" +
                '<p class="detail-title">Logística reversa</p>' +
                rev +
              "</div>" +
            "</div>" +
          "</td>" +
        "</tr>";
      }

      function linhaEpo(e, pos) {
        var meta = App.tierMeta(e.tier);
        var open = state.open === e.id;
        return "" +
          '<tr class="rank-row' + (open ? " is-open" : "") + '" data-epo="' + esc(e.id) + '">' +
            '<td style="width:34px;padding-right:0;">' +
              '<button type="button" class="rank-toggle" aria-expanded="' + (open ? "true" : "false") + '" aria-label="' + (open ? "Recolher detalhes de " : "Expandir detalhes de ") + esc(e.nome) + '">' +
                '<i class="ti ti-chevron-right" aria-hidden="true"></i>' +
              "</button>" +
            "</td>" +
            '<td class="rank">' + pos + "</td>" +
            "<td>" +
              '<div class="stack" style="line-height:1.3;">' +
                '<span style="font-weight:600;">' + esc(e.nome) + "</span>" +
                '<span class="text-muted" style="font-size:12px;">' + esc(e.cidade) + " · " + esc(e.uf) + "</span>" +
              "</div>" +
            "</td>" +
            "<td>" +
              '<span class="badge ' + meta.cls + '"><i class="ti ti-circle-filled" aria-hidden="true"></i>' + esc(meta.label) + "</span>" +
            "</td>" +
            "<td style=\"min-width:160px;\">" +
              '<div class="score-row">' +
                '<span class="score-bar"><span class="score-fill tier-' + e.tier + '" style="width:' + e.score + '%;"></span></span>' +
                '<span class="score-num">' + e.score + "</span>" +
              "</div>" +
            "</td>" +
            '<td class="num">' + App.fmtDias(e.tempoCiclo) + "</td>" +
            '<td class="num">' + App.fmtPct(e.conformidade) + "</td>" +
            '<td class="num">' + App.fmtNum(e.ncs) + "</td>" +
            '<td class="num">' + App.fmtNum(e.equipamentos) + "</td>" +
            '<td class="num">' +
              '<a class="btn btn-ghost btn-sm" href="epo-detalhe.html?id=' + encodeURIComponent(e.id) + '">' +
                "Ver detalhe<i class=\"ti ti-arrow-right\" aria-hidden=\"true\"></i>" +
              "</a>" +
            "</td>" +
          "</tr>" +
          detalheEpo(e, open);
      }

      function render() {
        var lista = getLista();
        var body = document.getElementById("ranking-body");
        var count = document.getElementById("ranking-count");

        var total = (window.APP.epos || []).length;
        count.textContent = lista.length === total
          ? total + " EPOs auditadas"
          : lista.length + " de " + total + " EPOs";

        if (!lista.length) {
          body.innerHTML =
            '<div class="empty">' +
              '<i class="ti ti-search-off" aria-hidden="true"></i>' +
              "<p>Nenhuma EPO encontrada com os filtros atuais.</p>" +
            "</div>";
          return;
        }

        body.innerHTML =
          '<div class="table-wrap">' +
            '<table class="table">' +
              "<thead><tr>" +
                '<th style="width:34px;"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Expandir</span></th>' +
                '<th style="width:44px;">#</th>' +
                "<th>EPO</th>" +
                "<th>Tier</th>" +
                "<th>Pontuação</th>" +
                '<th class="num">Tempo de ciclo</th>' +
                '<th class="num">Conformidade</th>' +
                '<th class="num">NCs</th>' +
                '<th class="num">Equipamentos</th>' +
                '<th class="num"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Ação</span></th>' +
              "</tr></thead>" +
              "<tbody>" +
                lista.map(function (e, i) { return linhaEpo(e, i + 1); }).join("") +
              "</tbody>" +
            "</table>" +
          "</div>";
      }

      // Toggle da linha expansível (só uma aberta por vez) --------------------
      function toggleEpo(id) {
        state.open = state.open === id ? null : id;
        var body = document.getElementById("ranking-body");
        body.querySelectorAll("tr.rank-row").forEach(function (row) {
          var isOpen = row.getAttribute("data-epo") === state.open;
          row.classList.toggle("is-open", isOpen);
          var btn = row.querySelector(".rank-toggle");
          if (btn) {
            btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
          }
        });
        body.querySelectorAll("tr.rank-detail").forEach(function (det) {
          det.hidden = det.getAttribute("data-detail") !== state.open;
        });
      }

      document.getElementById("ranking-body").addEventListener("click", function (ev) {
        if (ev.target.closest("a")) return;            // link "Ver detalhe"
        if (ev.target.closest("tr.rank-detail")) return; // dentro do painel expandido
        var row = ev.target.closest("tr.rank-row");
        if (!row) return;
        toggleEpo(row.getAttribute("data-epo"));
      });

      // Eventos --------------------------------------------------------------
      function syncChips() {
        var chips = document.querySelectorAll("#filtros .chip");
        chips.forEach(function (c) {
          var on = c.getAttribute("data-tier") === state.tier;
          c.classList.toggle("is-active", on);
          c.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }

      document.getElementById("filtros").addEventListener("click", function (ev) {
        var chip = ev.target.closest(".chip");
        if (!chip) return;
        state.tier = chip.getAttribute("data-tier");
        syncChips();
        render();
      });

      document.getElementById("busca").addEventListener("input", function (ev) {
        state.q = ev.target.value.trim();
        render();
      });

      document.getElementById("ordenar").addEventListener("change", function (ev) {
        state.sort = ev.target.value;
        render();
      });

      // Estado inicial -------------------------------------------------------
      syncChips();
      render();
    });</script>
</body>
</html>
