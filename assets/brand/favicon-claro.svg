<!-- Favicon: o sinal da Claro, no vermelho da marca.

     O traçado e o mesmo que a tela de carregamento usa (assets/carregando.css),
     tirado da fonte de icones da propria Claro: o anel do "o" e os tres tracos
     que saem dele. Um desenho so, duas utilizacoes.

     Por que servido daqui e nao buscado no site da Claro: aquele servidor nao
     libera uso a partir de outro endereco, e depender dele deixaria a aba sem
     icone no dia em que o arquivo mudar de lugar. Em SVG o icone fica nitido em
     qualquer tamanho de aba, sem precisar de uma versao por tamanho.

     A moldura e o eixo Y invertido vem da fonte, onde o Y cresce para cima.
     O sinal ocupa de 125 a 875 nos dois eixos; a moldura de 90 a 910 deixa a
     folga que a aba precisa para nao cortar o desenho. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 90 820 820">
  <g transform="translate(0,1000) scale(1,-1)" fill="#DA291C">
