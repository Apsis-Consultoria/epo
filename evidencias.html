<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evidências enviadas - Auditoria de EPOs</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/app.css?v=93">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <script src="assets/data.js?v=93"></script>
  <script src="assets/app.js?v=93"></script>
  <script src="assets/supabase-config.js?v=93"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js?v=93"></script>
  <script>
    (function () {
      "use strict";

      var acoes =
        '<button class="btn btn-ghost btn-sm" id="btn-reenviar" type="button" style="display:none;">' +
          '<i class="ti ti-refresh" aria-hidden="true"></i><span id="btn-reenviar-txt">Reenviar documentos</span></button>' +
        '<button class="btn btn-ghost btn-sm" id="btn-exportar" type="button">' +
          '<i class="ti ti-download" aria-hidden="true"></i>Exportar</button>';

      Layout.mount("evidencias", "Evidências enviadas", acoes);

      var esc = App.escapeHtml;
      var DEMO = (window.Auth && Auth.modoDemo()) || !(window.Auth && Auth.pronto);
      var dbLeitura = (window.Auth && Auth.pronto && !DEMO) ? Auth.cliente : null;
      var BUCKET = "evidencias";

      // A tela lia duas listas do catalogo local, que estao vazias de proposito
      // desde que o sistema passou a ter cadastro de verdade: entao ela abria
      // vazia mesmo com foto anexada no questionario. Agora le o que existe.
      var evidencias = [];   // arquivos anexados durante o preenchimento
      var anexos = [];       // documentos anexados nas caixas da tela Evidencias
      var eposFiltro = [];
      var eposFiltroAnexo = [];
      var GRAVS = [
        { key: "todas", label: "Todas", n: 0 },
        { key: "alta",  label: "Alta",  n: 0 },
        { key: "media", label: "Média", n: 0 },
        { key: "baixa", label: "Baixa", n: 0 }
      ];

      var estado = { tab: "campo", epo: "todas", gravidade: "todas", epoAnexo: "todas" };

      // -------------------------------------------------------------- helpers
      function fmtData(iso) {
        if (!iso) return "-";
        var p = String(iso).split("-");
        if (p.length !== 3) return iso;
        return p[2] + "/" + p[1] + "/" + p[0];
      }

      function evById(id) {
        for (var i = 0; i < evidencias.length; i++) {
          if (evidencias[i].id === id) return evidencias[i];
        }
        return null;
      }

      function anexoById(id) {
        for (var i = 0; i < anexos.length; i++) {
          if (anexos[i].id === id) return anexos[i];
        }
        return null;
      }

      function filtradas() {
        return evidencias.filter(function (ev) {
          if (estado.epo !== "todas" && ev.epoId !== estado.epo) return false;
          if (estado.gravidade !== "todas" && ev.gravidade !== estado.gravidade) return false;
          return true;
        });
      }

      function anexosFiltrados() {
        return anexos.filter(function (ax) {
          if (estado.epoAnexo !== "todas" && ax.epoId !== estado.epoAnexo) return false;
          return true;
        });
      }


      // De qual lado o documento veio. Antes o selo dizia "link seguro" em
      // todos, o que deixou de ser verdade quando o anexo passou a ser feito na
      // propria tela de Evidencias, pelas tres caixas.
      function badgeOrigem(origem) {
        var m = App.origemMeta(origem || "epo");
        return '<span class="origem-selo ' + m.cls + '"><i class="ti ' + m.icon +
          '" aria-hidden="true"></i>' + esc(m.curto) + "</span>";
      }

      // Quem mandou, em uma linha. O rotulo do selo e curto de proposito ("Claro",
      // "APSIS", "EPO"); aqui cabe dizer por inteiro.
      var QUEM_ENVIOU = {
        claro: "Gerência Claro",
        consultor: "Equipe de campo APSIS",
        epo: "Responsável pela EPO"
      };

      // ------------------------------------------------------- markup estático
      // Os filtros nascem vazios e sao preenchidos quando os dados chegam: a
      // lista de EPOs e a contagem por gravidade saem do que existe, e nao de
      // uma lista escrita a mao.
      function htmlOpcoesEpo(lista) {
        return ['<option value="todas">Todas as EPOs</option>'].concat(
          lista.map(function (e) {
            return '<option value="' + esc(e.id) + '">' + esc(e.nome) + "</option>";
          })
        ).join("");
      }

      function htmlChips() {
        return GRAVS.map(function (g) {
          var on = g.key === estado.gravidade;
          return (
            '<button type="button" class="chip' + (on ? " is-active" : "") + '" data-grav="' + g.key + '"' +
              (on ? ' aria-pressed="true"' : ' aria-pressed="false"') + ">" +
              esc(g.label) + ' <span class="tnum">(' + g.n + ")</span>" +
            "</button>"
          );
        }).join("");
      }

      var optsEpo = htmlOpcoesEpo(eposFiltro);
      var optsEpoAnexo = htmlOpcoesEpo(eposFiltroAnexo);
      var chipsGrav = htmlChips();

      var page = document.getElementById("page");
      page.innerHTML =
        '<div class="row wrap" id="tabs" role="tablist" style="gap:8px;margin-bottom:20px;">' +
          '<button type="button" class="chip is-active" data-tab="campo" aria-pressed="true" ' +
            'style="height:34px;padding:0 14px;font-size:13px;">' +
            '<i class="ti ti-camera" aria-hidden="true"></i>Evidências de campo</button>' +
          '<button type="button" class="chip" data-tab="link" aria-pressed="false" ' +
            'style="height:34px;padding:0 14px;font-size:13px;">' +
            '<i class="ti ti-paperclip" aria-hidden="true"></i>Documentos anexados' +
            '<span class="badge badge-success tnum" id="badge-novos" ' +
              'style="height:18px;padding:0 7px;margin-left:2px;font-size:11px;display:none;">0</span></button>' +
        "</div>" +

        '<section id="tab-campo">' +
          '<div class="card" style="margin-bottom:20px;">' +
            '<div class="row-between wrap" style="gap:16px;">' +
              '<div class="field mb-0" style="min-width:220px;">' +
                '<label for="f-epo">Filtrar por EPO</label>' +
                '<select class="select" id="f-epo">' + optsEpo + "</select>" +
              "</div>" +
              '<div class="stack stack-sm" style="min-width:220px;">' +
                '<span class="kpi-label">Gravidade</span>' +
                '<div class="row wrap" id="chips-grav">' + chipsGrav + "</div>" +
              "</div>" +
            "</div>" +
          "</div>" +

          '<div class="row-between wrap" style="margin-bottom:14px;">' +
            '<div class="section-title"><span class="title">Galeria de evidências</span>' +
            '<span class="subtitle" id="contador"></span></div>' +
          "</div>" +

          '<div class="grid-3" id="galeria"></div>' +
        "</section>" +

        '<section id="tab-link" hidden>' +
          '<div class="card" style="margin-bottom:20px;">' +
            '<div class="row-between wrap" style="gap:16px;">' +
              '<div class="field mb-0" style="min-width:220px;">' +
                '<label for="f-epo-anexo">Filtrar por EPO</label>' +
                '<select class="select" id="f-epo-anexo">' + optsEpoAnexo + "</select>" +
              "</div>" +
            "</div>" +
          "</div>" +

          '<div class="row-between wrap" style="margin-bottom:14px;">' +
            '<div class="section-title"><span class="title">Anexos recebidos</span>' +
            '<span class="subtitle" id="contador-anexos"></span></div>' +
          "</div>" +

          '<div class="grid-2" id="lista-anexos"></div>' +
        "</section>";

      // ------------------------------------------------------------- tabs
      var tabsHost = document.getElementById("tabs");
      var secCampo = document.getElementById("tab-campo");
      var secLink  = document.getElementById("tab-link");
      var badgeNovos = document.getElementById("badge-novos");

      // O numero na aba conta quantos documentos existem. Antes contava os
      // "novos", estado que nunca chega a existir: o anexo nasce ligado ao item
      // do questionario, e nao numa caixa de entrada esperando triagem.
      function atualizarBadgeNovos() {
        badgeNovos.textContent = anexos.length;
        badgeNovos.style.display = anexos.length > 0 ? "" : "none";
      }

      function setTab(tab) {
        estado.tab = tab;
        secCampo.hidden = tab !== "campo";
        secLink.hidden = tab !== "link";
        Array.prototype.forEach.call(tabsHost.querySelectorAll("[data-tab]"), function (t) {
          var on = t.getAttribute("data-tab") === tab;
          t.classList.toggle("is-active", on);
          t.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }

      tabsHost.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-tab]");
        if (btn) setTab(btn.getAttribute("data-tab"));
      });

      // ------------------------------------------------------------- render grid
      var galeria = document.getElementById("galeria");
      var contador = document.getElementById("contador");

      function render() {
        var lista = filtradas();
        contador.textContent = lista.length === 1
          ? "1 evidência encontrada"
          : lista.length + " evidências encontradas";

        if (!lista.length) {
          galeria.className = "";
          galeria.innerHTML =
            '<div class="card"><div class="empty">' +
              '<i class="ti ti-camera-off" aria-hidden="true"></i>' +
              "<div>Nenhuma evidência para os filtros selecionados.</div>" +
            "</div></div>";
          return;
        }

        galeria.className = "grid-3";
        galeria.innerHTML = lista.map(function (ev) {
          var g = App.badgeGravidade(ev.gravidade);
          return (
            '<article class="evidence-card" data-id="' + esc(ev.id) + '" role="button" tabindex="0" ' +
              'aria-label="Abrir evidência: ' + esc(ev.legenda) + '">' +
              (ev.foto
                ? '<div class="photo-ph has-img"><img src="' + esc(ev.foto) + '" alt="' + esc(ev.legenda) + '" loading="lazy" ' +
                    'onerror="this.parentNode.classList.remove(\'has-img\');this.remove();"><i class="ti ti-photo" aria-hidden="true"></i></div>'
                : '<div class="photo-ph"><i class="ti ti-photo" aria-hidden="true"></i></div>') +
              '<div class="evidence-card-body">' +
                '<div class="row-between">' +
                  '<span class="badge ' + g.cls + '">' + g.label + "</span>" +
                  '<span class="text-muted tnum">' + fmtData(ev.data) + "</span>" +
                "</div>" +
                '<div class="legenda">' + esc(ev.legenda) + "</div>" +
                '<div class="row-between wrap" style="gap:8px;">' +
                  '<span class="meta">' + esc(ev.epoNome) + "</span>" +
                  '<span class="tag">' + esc(ev.processo) + "</span>" +
                "</div>" +
              "</div>" +
            "</article>"
          );
        }).join("");
      }

      render();

      // ------------------------------------------------------ render anexos
      var listaAnexos = document.getElementById("lista-anexos");
      var contadorAnexos = document.getElementById("contador-anexos");

      function renderAnexos() {
        var lista = anexosFiltrados();
        contadorAnexos.textContent = lista.length === 1
          ? "1 anexo recebido"
          : lista.length + " anexos recebidos";

        if (!lista.length) {
          listaAnexos.className = "";
          listaAnexos.innerHTML =
            '<div class="card"><div class="empty">' +
              '<i class="ti ti-file-off" aria-hidden="true"></i>' +
              "<div>Nenhum anexo recebido para os filtros selecionados.</div>" +
            "</div></div>";
          return;
        }

        listaAnexos.className = "grid-2";
        listaAnexos.innerHTML = lista.map(function (ax) {
          var icone = ax.imagem ? "ti-photo" : (ax.pdf ? "ti-file-type-pdf" : "ti-file");
          // O anexo ja nasce ligado ao item do questionario: nao ha o que
          // vincular. No lugar do botao que nao fazia nada, o que serve e abrir
          // o arquivo.
          var acao = ax.url
            ? '<a class="btn btn-ghost btn-sm" href="' + esc(ax.url) + '" target="_blank" rel="noopener" ' +
                'data-abrir-arquivo="1"><i class="ti ti-external-link" aria-hidden="true"></i>Abrir</a>'
            : '<span class="text-muted" style="font-size:12px;">arquivo indisponível agora</span>';
          return (
            '<article class="card anexo-card" data-id="' + esc(ax.id) + '" role="button" tabindex="0" ' +
              'aria-label="Abrir anexo: ' + esc(ax.arquivo) + '" ' +
              'style="cursor:pointer;display:flex;flex-direction:column;gap:12px;">' +
              '<div class="row" style="gap:12px;align-items:flex-start;">' +
                '<div style="width:44px;height:44px;flex:0 0 auto;border-radius:var(--radius-sm);' +
                  'background:var(--surface-2);border:1px solid var(--border);display:grid;' +
                  'place-items:center;font-size:22px;color:var(--text-2);">' +
                  '<i class="ti ' + icone + '" aria-hidden="true"></i>' +
                "</div>" +
                '<div class="grow">' +
                  '<div style="font-weight:600;font-size:14px;word-break:break-all;">' + esc(ax.arquivo) + "</div>" +
                  '<div class="text-muted" style="font-size:12px;">' +
                    esc(ax.epoNome) + " · " + esc(ax.processo) +
                  "</div>" +
                "</div>" +
                '<span class="text-muted tnum nowrap" style="font-size:12px;">' + fmtData(ax.data) + "</span>" +
              "</div>" +
              '<div style="font-size:13px;color:var(--text);">' + esc(ax.item) + "</div>" +
              '<div class="text-muted" style="font-size:12px;display:flex;align-items:center;gap:5px;">' +
                '<i class="ti ti-user" aria-hidden="true"></i>' + esc(ax.remetente) +
              "</div>" +
              '<div class="row-between wrap" style="gap:8px;margin-top:auto;">' +
                '<div class="row wrap" style="gap:6px;">' +
                  badgeOrigem(ax.origem) +
                  '<span class="tag">' + esc(ax.tipo) + "</span>" +
                "</div>" +
                acao +
              "</div>" +
            "</article>"
          );
        }).join("");
      }

      renderAnexos();
      atualizarBadgeNovos();

      // ------------------------------------------------------------- filtros
      document.getElementById("f-epo").addEventListener("change", function () {
        estado.epo = this.value;
        render();
      });

      document.getElementById("f-epo-anexo").addEventListener("change", function () {
        estado.epoAnexo = this.value;
        renderAnexos();
      });

      var chipsHost = document.getElementById("chips-grav");
      chipsHost.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-grav]");
        if (!btn) return;
        estado.gravidade = btn.getAttribute("data-grav");
        Array.prototype.forEach.call(chipsHost.querySelectorAll("[data-grav]"), function (c) {
          var on = c.getAttribute("data-grav") === estado.gravidade;
          c.classList.toggle("is-active", on);
          c.setAttribute("aria-pressed", on ? "true" : "false");
        });
        render();
      });

      // ------------------------------------------------------------- lightbox
      var overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.id = "lightbox";
      overlay.setAttribute("role", "dialog");
      overlay.setAttribute("aria-modal", "true");
      overlay.setAttribute("aria-labelledby", "lightbox-titulo");
      overlay.innerHTML =
        '<div class="modal" style="max-width:640px;">' +
          '<div class="modal-header">' +
            '<div class="section-title">' +
              '<span class="title" id="lightbox-titulo">Evidência</span>' +
              '<span class="subtitle" id="lightbox-sub"></span>' +
            "</div>" +
            '<button class="modal-close" type="button" id="lightbox-close" aria-label="Fechar">' +
              '<i class="ti ti-x" aria-hidden="true"></i></button>' +
          "</div>" +
          '<div class="modal-body">' +
            '<div class="photo-ph" id="lightbox-foto" style="margin-bottom:16px;"><i class="ti ti-photo" aria-hidden="true"></i></div>' +
            '<div class="row wrap" id="lightbox-badges" style="margin-bottom:14px;"></div>' +
            '<div id="lightbox-meta"></div>' +
          "</div>" +
        "</div>";
      document.body.appendChild(overlay);

      var lbTitulo = overlay.querySelector("#lightbox-titulo");
      var lbFoto   = overlay.querySelector("#lightbox-foto");
      var lbSub    = overlay.querySelector("#lightbox-sub");
      var lbBadges = overlay.querySelector("#lightbox-badges");
      var lbMeta   = overlay.querySelector("#lightbox-meta");

      function linha(rotulo, valor) {
        return (
          '<div class="row-between" style="padding:9px 0;border-bottom:1px solid var(--border);gap:16px;">' +
            '<span class="text-muted nowrap">' + esc(rotulo) + "</span>" +
            '<span style="text-align:right;font-weight:500;">' + valor + "</span>" +
          "</div>"
        );
      }

      function abrirModal() {
        overlay.classList.add("is-open");
        document.body.style.overflow = "hidden";
        var closeBtn = overlay.querySelector("#lightbox-close");
        if (closeBtn) closeBtn.focus();
      }

      function abrir(id) {
        var ev = evById(id);
        if (!ev) return;
        var g = App.badgeGravidade(ev.gravidade);

        lbTitulo.textContent = "Evidência";
        lbSub.textContent = ev.epoNome;
        if (ev.foto) {
          lbFoto.classList.add("has-img");
          lbFoto.innerHTML = '<img src="' + esc(ev.foto) + '" alt="' + esc(ev.legenda) + '" ' +
            'onerror="this.parentNode.classList.remove(\'has-img\');this.parentNode.innerHTML=\'<i class=&quot;ti ti-photo&quot;></i>\';">';
        } else {
          lbFoto.classList.remove("has-img");
          lbFoto.innerHTML = '<i class="ti ti-photo" aria-hidden="true"></i>';
        }
        lbBadges.innerHTML =
          '<span class="badge ' + g.cls + '">' + g.label + " gravidade</span>" +
          '<span class="evidence-tag"><i class="ti ti-camera" aria-hidden="true"></i>foto</span>';
        lbMeta.innerHTML =
          '<p class="legenda" style="font-size:15px;margin-bottom:12px;">' + esc(ev.legenda) + "</p>" +
          linha("EPO", esc(ev.epoNome)) +
          linha("Item avaliado", esc(ev.item)) +
          linha("Processo", esc(ev.processo)) +
          linha("Data da coleta", fmtData(ev.data));

        abrirModal();
      }

      function abrirAnexo(id) {
        var ax = anexoById(id);
        if (!ax) return;
        var icone = ax.imagem ? "ti-photo" : (ax.pdf ? "ti-file-type-pdf" : "ti-file");

        lbTitulo.textContent = "Anexo recebido";
        lbSub.textContent = ax.epoNome;
        lbFoto.classList.remove("has-img");
        lbFoto.innerHTML = '<i class="ti ti-file-text" aria-hidden="true"></i>';
        lbBadges.innerHTML =
          badgeOrigem(ax.origem) +
          '<span class="badge"><i class="ti ' + icone + '" aria-hidden="true"></i>' + esc(ax.tipo) + "</span>";
        lbMeta.innerHTML =
          '<p class="legenda" style="font-size:15px;margin-bottom:12px;word-break:break-all;">' + esc(ax.arquivo) + "</p>" +
          linha("EPO", esc(ax.epoNome)) +
          linha("Processo", esc(ax.processo)) +
          linha("Item do checklist", esc(ax.item)) +
          linha("Enviado por", esc(ax.remetente)) +
          linha("Data do envio", fmtData(ax.data));

        abrirModal();
      }

      function fechar() {
        overlay.classList.remove("is-open");
        document.body.style.overflow = "";
      }

      galeria.addEventListener("click", function (e) {
        var card = e.target.closest(".evidence-card");
        if (card) abrir(card.getAttribute("data-id"));
      });
      galeria.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" && e.key !== " ") return;
        var card = e.target.closest(".evidence-card");
        if (card) { e.preventDefault(); abrir(card.getAttribute("data-id")); }
      });

      // -------------------------------------------------- interações anexos
      listaAnexos.addEventListener("click", function (e) {
        // "Abrir" leva para o arquivo: o cartao nao deve abrir a janela de
        // detalhe por cima do clique que ja resolveu.
        if (e.target.closest("[data-abrir-arquivo]")) { e.stopPropagation(); return; }
        var card = e.target.closest(".anexo-card");
        if (card) abrirAnexo(card.getAttribute("data-id"));
      });
      listaAnexos.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" && e.key !== " ") return;
        if (e.target.closest("[data-abrir-arquivo]")) return;
        var card = e.target.closest(".anexo-card");
        if (card) { e.preventDefault(); abrirAnexo(card.getAttribute("data-id")); }
      });

      overlay.querySelector("#lightbox-close").addEventListener("click", fechar);
      overlay.addEventListener("click", function (e) {
        if (e.target === overlay) fechar();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && overlay.classList.contains("is-open")) fechar();
      });

      // ------------------------------------------------------------- exportar
      // O botao avisava "exportacao iniciada" e nao exportava nada. Agora sai a
      // planilha do que esta listado na aba aberta, com os filtros aplicados.
      function csv(linhas) {
        return linhas.map(function (l) {
          return l.map(function (c) {
            var t = c == null ? "" : String(c);
            return '"' + t.replace(/"/g, '""') + '"';
          }).join(";");
        }).join("\r\n");
      }

      function baixar(nome, texto) {
        var blob = new Blob(["\ufeff" + texto], { type: "text/csv;charset=utf-8;" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = nome;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      }

      var btnExp = document.getElementById("btn-exportar");
      if (btnExp) {
        btnExp.addEventListener("click", function () {
          var hoje = new Date();
          var stamp = hoje.getFullYear() + "-" +
            ("0" + (hoje.getMonth() + 1)).slice(-2) + "-" + ("0" + hoje.getDate()).slice(-2);
          if (estado.tab === "campo") {
            var lista = filtradas();
            if (!lista.length) { App.toast("Nada para exportar nesta aba."); return; }
            baixar("evidencias-de-campo-" + stamp + ".csv", csv(
              [["EPO", "Questionário", "Pergunta", "Resposta", "Arquivo", "Data"]].concat(
                lista.map(function (ev) {
                  return [ev.epoNome, ev.processo, ev.legenda, ev.resposta, ev.arquivo, fmtData(ev.data)];
                })
              )
            ));
          } else {
            var listaA = anexosFiltrados();
            if (!listaA.length) { App.toast("Nada para exportar nesta aba."); return; }
            baixar("documentos-anexados-" + stamp + ".csv", csv(
              [["EPO", "Questionário", "Pergunta", "Enviado por", "Arquivo", "Data"]].concat(
                listaA.map(function (ax) {
                  return [ax.epoNome, ax.processo, ax.item, ax.remetente, ax.arquivo, fmtData(ax.data)];
                })
              )
            ));
          }
          App.toast("Planilha gerada.");
        });
      }

      /* ====================================================================
         LEITURA DO QUE FOI ENVIADO
         Duas listas, de dois caminhos diferentes:
           - o arquivo anexado durante o preenchimento do questionario, que fica
             preso a resposta (aba "Evidências de campo");
           - o documento anexado nas caixas da tela de Evidências, que fica preso
             ao item do questionario e guarda de qual lado veio (aba "Documentos
             anexados").
         ==================================================================== */
      function assinar(paths) {
        var mapa = {};
        if (!dbLeitura || !paths.length) return Promise.resolve(mapa);
        var st = dbLeitura.storage.from(BUCKET);
        return Promise.all(paths.map(function (caminho) {
          return st.createSignedUrl(caminho, 3600).then(function (r) {
            mapa[caminho] = (r && r.data && r.data.signedUrl) || null;
          }, function () { mapa[caminho] = null; });
        })).then(function () { return mapa; });
      }

      function ehImagem(caminho, contentType) {
        if (contentType && contentType.indexOf("image/") === 0) return true;
        return /\.(jpe?g|png|webp|gif|heic|bmp)$/i.test(String(caminho || ""));
      }

      function ehPdf(caminho, contentType) {
        if (contentType && contentType.indexOf("pdf") >= 0) return true;
        return /\.pdf$/i.test(String(caminho || ""));
      }

      function nomeDoPath(caminho) {
        var f = String(caminho || "").split("/").pop();
        return f.replace(/^\d{10,}-/, "") || "arquivo";
      }

      var RESPOSTA_LABEL = {
        conforme: "Conforme", nao_conforme: "Não conforme", na: "Não se aplica",
        presente: "Presente", ausente: "Ausente"
      };

      function carregarEvidencias() {
        return dbLeitura.from("evidencias")
          .select("id, storage_path, tipo, origem, criado_em, " +
                  "respostas!inner(status, itens_checklist!inner(pergunta, grave), " +
                  "auditorias!inner(data_visita, epo_id, epos!inner(nome), processos!inner(nome)))")
          .order("criado_em", { ascending: false })
          .then(function (r) {
            if (r.error) throw r.error;
            return (r.data || []).map(function (x) {
              var resp = x.respostas || {};
              var it = resp.itens_checklist || {};
              var aud = resp.auditorias || {};
              var epo = aud.epos || {};
              var proc = aud.processos || {};
              return {
                id: x.id,
                epoId: aud.epo_id || "",
                epoNome: epo.nome || "EPO",
                processo: proc.nome || "Questionário",
                legenda: it.pergunta || "Item do questionário",
                item: RESPOSTA_LABEL[resp.status] || resp.status || "",
                resposta: RESPOSTA_LABEL[resp.status] || resp.status || "",
                // "Item grave" e a severidade que este sistema tem: e ela que
                // aparece nos selos, e nao uma gravidade inventada por arquivo.
                gravidade: it.grave ? "alta" : "baixa",
                data: String(x.criado_em || aud.data_visita || "").slice(0, 10),
                path: x.storage_path,
                arquivo: nomeDoPath(x.storage_path),
                imagem: ehImagem(x.storage_path, null),
                foto: null
              };
            });
          });
      }

      function carregarAnexos() {
        return dbLeitura.from("alocacao_anexos")
          .select("id, storage_path, nome_arquivo, content_type, criado_em, origem, " +
                  "itens_checklist!inner(pergunta), " +
                  "alocacoes!inner(epo_id, responsavel_email, epos!inner(nome), processos!inner(nome))")
          .order("criado_em", { ascending: false })
          .then(function (r) {
            if (r.error) throw r.error;
            return (r.data || []).map(function (x) {
              var it = x.itens_checklist || {};
              var al = x.alocacoes || {};
              var epo = al.epos || {};
              var proc = al.processos || {};
              var img = ehImagem(x.storage_path, x.content_type);
              var pdf = ehPdf(x.storage_path, x.content_type);
              return {
                id: x.id,
                epoId: al.epo_id || "",
                epoNome: epo.nome || "EPO",
                processo: proc.nome || "Questionário",
                item: it.pergunta || "Item do questionário",
                arquivo: x.nome_arquivo || nomeDoPath(x.storage_path),
                origem: x.origem || "epo",
                remetente: QUEM_ENVIOU[x.origem || "epo"] || QUEM_ENVIOU.epo,
                tipo: img ? "foto" : (pdf ? "PDF" : "arquivo"),
                imagem: img,
                pdf: pdf,
                status: "vinculado",
                data: String(x.criado_em || "").slice(0, 10),
                path: x.storage_path,
                url: null
              };
            });
          });
      }

      function listaDeEpos(itens) {
        var vistas = {};
        var out = [];
        itens.forEach(function (x) {
          if (!x.epoId || vistas[x.epoId]) return;
          vistas[x.epoId] = true;
          out.push({ id: x.epoId, nome: x.epoNome });
        });
        out.sort(function (a, b) { return a.nome.localeCompare(b.nome, "pt-BR"); });
        return out;
      }

      function atualizarFiltros() {
        eposFiltro = listaDeEpos(evidencias);
        eposFiltroAnexo = listaDeEpos(anexos);
        document.getElementById("f-epo").innerHTML = htmlOpcoesEpo(eposFiltro);
        document.getElementById("f-epo-anexo").innerHTML = htmlOpcoesEpo(eposFiltroAnexo);

        var c = { alta: 0, media: 0, baixa: 0 };
        evidencias.forEach(function (ev) { if (c[ev.gravidade] !== undefined) c[ev.gravidade] += 1; });
        GRAVS[0].n = evidencias.length;
        GRAVS[1].n = c.alta; GRAVS[2].n = c.media; GRAVS[3].n = c.baixa;
        document.getElementById("chips-grav").innerHTML = htmlChips();
      }

      if (dbLeitura) {
        contador.textContent = "carregando...";
        contadorAnexos.textContent = "carregando...";
        Promise.all([carregarEvidencias(), carregarAnexos()])
          .then(function (r) {
            evidencias = r[0];
            anexos = r[1];
            var paths = [];
            evidencias.forEach(function (ev) { if (ev.imagem) paths.push(ev.path); });
            anexos.forEach(function (ax) { paths.push(ax.path); });
            return assinar(paths);
          })
          .then(function (urls) {
            evidencias.forEach(function (ev) { ev.foto = urls[ev.path] || null; });
            anexos.forEach(function (ax) { ax.url = urls[ax.path] || null; });
            atualizarFiltros();
            render();
            renderAnexos();
            atualizarBadgeNovos();
          })
          .catch(function (e) {
            console.error("evidencias", e);
            contador.textContent = "";
            contadorAnexos.textContent = "";
            galeria.innerHTML = '<div class="card"><div class="empty">' +
              '<i class="ti ti-alert-triangle" aria-hidden="true"></i>' +
              "<div>Não foi possível carregar o que foi enviado agora.</div></div></div>";
          });
      }

      /* ====================================================================
         REENVIAR DOCUMENTOS QUE FICARAM PARA TRÁS
         Documento anexado antes de a pasta oficial estar pronta, ou que falhou
         no caminho, fica marcado como não encaminhado e ninguém tenta de novo.
         Este botão fecha essa lacuna: aparece só para admin e gestor, e só
         quando existe algo parado.
         ==================================================================== */
      (function () {
        var db = (window.Auth && Auth.pronto && !Auth.modoDemo()) ? Auth.cliente : null;
        var btn = document.getElementById("btn-reenviar");
        var rotulo = document.getElementById("btn-reenviar-txt");
        if (!db || !btn) return;

        var PARADOS = ["pendente", "erro"];

        function contar() {
          return Promise.all([
            db.from("alocacao_anexos").select("id", { count: "exact", head: true }).in("sharepoint_status", PARADOS),
            db.from("evidencias").select("id", { count: "exact", head: true }).in("sharepoint_status", PARADOS)
          ]).then(function (rs) {
            var n = 0;
            var falhou = false;
            rs.forEach(function (r) {
              if (r.error) { falhou = true; return; }
              if (r.count) n += r.count;
            });
            // Falha na contagem devolvia zero e o botao de reenvio sumia: o
            // arquivo parado continuava parado, sem ninguem saber.
            if (falhou) return -1;
            return n;
          });
        }

        function mostrar(n) {
          if (n === -1) {
            rotulo.textContent = "Tentar reenviar os documentos parados";
            btn.style.display = "";
            return;
          }
          if (!n) { btn.style.display = "none"; return; }
          rotulo.textContent = "Reenviar " + App.fmtNum(n) + (n === 1 ? " documento" : " documentos");
          btn.style.display = "";
        }

        /* ------------------------------------------------------------------
           Aviso na tela SO quando algo ficou para tras.
           Antes esta faixa contava onde os arquivos sao guardados por fora,
           com endereco da pasta e nome dos segredos lidos, atras de um "Ver
           detalhes". Isso e bastidor da APSIS: nao ajuda quem usa a tela e nao
           tem por que ficar escrito numa tela que a Claro alcanca. O detalhe
           tecnico continua indo para o registro do navegador, que e onde ele
           serve.
           ------------------------------------------------------------------ */
        function faixa(estado, texto) {
          var cores = {
            aviso:  { fundo: "var(--warning-bg)", cor: "var(--warning)", icone: "ti-alert-triangle" },
            neutro: { fundo: "var(--surface-2)",  cor: "var(--text-2)",  icone: "ti-loader-2" }
          };
          var c = cores[estado] || cores.neutro;
          var el = document.getElementById("faixa-envio");
          if (!el) {
            el = document.createElement("div");
            el.id = "faixa-envio";
            el.style.cssText = "display:flex;align-items:flex-start;gap:8px;border-radius:var(--radius-sm);" +
              "padding:10px 12px;margin-bottom:16px;font-size:13px;line-height:1.5;";
            var alvo = document.getElementById("page");
            alvo.insertBefore(el, alvo.firstChild);
          }
          el.style.background = c.fundo;
          el.style.color = c.cor;
          el.innerHTML =
            '<i class="ti ' + c.icone + '" aria-hidden="true" style="font-size:16px;flex:0 0 auto;margin-top:1px;"></i>' +
            '<span style="flex:1;">' + App.escapeHtml(texto) + "</span>";
        }

        function esconderFaixa() {
          var el = document.getElementById("faixa-envio");
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }

        function conferirEnvio(pendentes) {
          return db.functions.invoke("sincronizar-sharepoint", { body: { teste: true } })
            .then(function (r) {
              var d = (r && r.data) || {};
              if (r && r.error && !d.motivo) throw r.error;

              // Funcionando: nada na tela. A ausencia de aviso e a boa noticia,
              // e o que falta enviar ja aparece no rotulo do botao de reenviar.
              if (d.ok) { esconderFaixa(); return; }

              console.warn("envio automático:", d);
              faixa("aviso", pendentes
                ? "Os documentos estão guardados no sistema, mas ainda não foram encaminhados."
                : "O encaminhamento automático dos documentos não está funcionando agora.");
            }, function (e) {
              console.warn("envio automático:", e);
              esconderFaixa();
            });
        }

        // só admin e gestor reenviam
        Auth.sessao().then(function (s) {
          if (!s) return null;
          return db.from("perfis").select("papel").eq("user_id", s.user.id).maybeSingle();
        }).then(function (r) {
          var papel = (r && r.data && r.data.papel) || "";
          if (papel !== "admin" && papel !== "gestor") return;
          return contar().then(function (n) {
            mostrar(n);
            return conferirEnvio(n);
          });
        }).catch(function (e) { console.warn("documentos parados:", e); });

        btn.addEventListener("click", function () {
          btn.disabled = true;
          var antes = rotulo.textContent;
          rotulo.textContent = "Reenviando...";
          db.functions.invoke("sincronizar-sharepoint", { body: { tudo: true } })
            .then(function (r) {
              var d = (r && r.data) || {};
              if (r && r.error) throw r.error;
              if (d.ok === false && d.configurado === false) {
                App.toast("O encaminhamento dos documentos ainda não está liberado. Fale com a coordenação da APSIS.");
              } else if (d.enviados) {
                App.toast(
                  App.fmtNum(d.enviados) + (d.enviados === 1 ? " documento enviado." : " documentos enviados.") +
                  (d.lote_cheio ? " Ainda há documentos na fila: toque de novo." : "")
                );
              } else if (d.falhas && d.falhas.length) {
                App.toast("Não foi possível enviar " + d.falhas.length + (d.falhas.length === 1 ? " documento." : " documentos."));
                console.warn("falhas no reenvio:", d.falhas);
                faixa("aviso", "O reenvio não completou: " + d.falhas.length +
                  (d.falhas.length === 1 ? " documento recusado." : " documentos recusados."));
              } else {
                App.toast("Nenhum documento pendente.");
              }
              return contar().then(mostrar);
            })
            .catch(function (e) {
              console.error("reenvio", e);
              App.toast("Não foi possível reenviar agora. Tente novamente.");
              rotulo.textContent = antes;
            })
            .then(function () { btn.disabled = false; });
        });
      })();
    })();
  </script>
</body>
