<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Envio de evidências - Auditoria de EPOs</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/app.css?v=44">
  <style>
    /* Ajustes locais - tela do responsável da EPO */

    .demo-note {
      display: flex; align-items: center; gap: 8px;
      font-size: 12.5px; color: var(--text-2);
      background: var(--warning-bg); border: 1px dashed var(--warning);
      border-radius: var(--radius-sm); padding: 8px 12px; margin-bottom: 14px;
    }
    .demo-note i { color: var(--warning); font-size: 16px; flex: 0 0 auto; }

    .badge-info { background: #E8F0FE; color: #2563EB; }

    /* ------ Lista de alocações ------ */
    .aloc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .aloc-card {
      display: flex; flex-direction: column; gap: 12px; text-align: left;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 16px; cursor: pointer; font-family: inherit;
      transition: border-color .15s ease, box-shadow .15s ease, transform .1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .aloc-card:hover { border-color: var(--apsis-green); box-shadow: 0 4px 14px rgba(26, 71, 49, .08); }
    .aloc-card:active { transform: scale(.99); }
    .aloc-card-top { display: flex; align-items: flex-start; gap: 12px; }
    .aloc-card-icon {
      width: 42px; height: 42px; flex: 0 0 42px; border-radius: 12px;
      background: var(--primary-tint); color: var(--apsis-green);
      display: grid; place-items: center; font-size: 22px;
    }
    .aloc-card-info { flex: 1; min-width: 0; }
    .aloc-card-info b { display: block; font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .aloc-card-info span { font-size: 12.5px; color: var(--text-2); }
    .aloc-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .env-abrir {
      display: inline-flex; align-items: center; gap: 2px;
      font-size: 12.5px; font-weight: 600; color: var(--apsis-green); white-space: nowrap;
    }
    .env-abrir i { font-size: 16px; }

    /* Barra acima da lista: resumo + grade/lista */
    .env-barra {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .env-resumo { font-size: 12.5px; color: var(--text-muted); }

    /* Visão em lista: a unidade é a linha principal, os questionários vêm abaixo */
    .env-tabela tbody tr.env-linha-unidade > td { background: var(--surface-2); padding: 10px 14px; }
    .env-unidade-linha {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .env-unidade-nome {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 600; color: var(--text);
    }
    .env-unidade-nome > i { font-size: 17px; color: var(--apsis-green); }
    .env-unidade-loc { font-size: 12.5px; font-weight: 400; color: var(--text-2); }
    .env-tabela tbody tr.env-linha-q { cursor: pointer; }
    .env-tabela tbody tr.env-linha-q:hover { background: var(--primary-tint); }
    .env-q-nome { display: flex; align-items: center; gap: 9px; font-weight: 500; color: var(--text); padding-left: 26px; }
    .env-q-nome > i { font-size: 17px; color: var(--text-2); flex: 0 0 auto; }
    @media (max-width: 640px) {
      .env-tabela thead { display: none; }
      .env-q-nome { padding-left: 14px; }
    }
    .aloc-card-anexos { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-2); }
    .aloc-card-anexos i { font-size: 15px; }

    /* ------ Detalhe ------ */
    .det-head {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
    }
    .det-head .aloc-card-icon { width: 46px; height: 46px; flex-basis: 46px; }
    .det-head-info { flex: 1; min-width: 200px; }
    .det-head-info h2 { font-size: 17px; font-weight: 600; color: var(--text); margin: 0; }
    .det-head-info p { font-size: 13px; color: var(--text-2); margin: 2px 0 0; }

    .live-note {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 12.5px; color: var(--text-2); line-height: 1.5;
      background: var(--primary-tint); border-radius: var(--radius-sm);
      padding: 10px 12px; margin-bottom: 16px;
    }
    .live-note i { font-size: 16px; flex: 0 0 auto; margin-top: 1px; color: var(--apsis-green); }

    .readonly-note {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--success);
      background: var(--success-bg); border-radius: var(--radius-sm);
      padding: 10px 12px; margin-bottom: 16px; font-weight: 500;
    }
    .readonly-note i { font-size: 17px; flex: 0 0 auto; }

    /* Perguntas em duas colunas: com uma coluna a tela ficava comprida demais
       e a leitura se perdia. No celular volta para uma, que e o que cabe. */
    .perg-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }
    .perg-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .perg-num { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; color: var(--text-muted); text-transform: uppercase; }
    .perg-texto { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.45; margin: 4px 0 6px; }
    .perg-evid { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
    .perg-evid i { font-size: 15px; margin-top: 2px; color: var(--apsis-orange); flex: 0 0 auto; }
    .perg-selo {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 500; color: var(--success); margin-top: 10px;
    }
    .perg-selo i { font-size: 14px; }

    .dropzone {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      min-height: 92px; padding: 16px; width: 100%;
      border: 1.5px dashed var(--border-strong); border-radius: var(--radius);
      background: var(--surface-2); color: var(--text-2);
      font-size: 13.5px; font-weight: 500; cursor: pointer; text-align: center;
      transition: border-color .15s ease, background .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .dropzone i { font-size: 24px; color: var(--text-muted); }
    .dropzone:hover, .dropzone.is-drag { border-color: var(--apsis-green); background: var(--primary-tint); color: var(--apsis-green); }
    .dropzone.is-drag i, .dropzone:hover i { color: var(--apsis-green); }
    .dropzone.is-busy { pointer-events: none; opacity: .65; }
    .dropzone .dz-hint { font-size: 12px; color: var(--text-muted); font-weight: 400; }

    .anexo-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .anexo-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 8px 10px;
    }
    .anexo-item > i { font-size: 19px; color: var(--apsis-green); flex: 0 0 auto; }
    .anexo-info { flex: 1; min-width: 0; }
    .anexo-nome {
      display: block; font-size: 13px; font-weight: 500; color: var(--text);
      background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-family: inherit;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .anexo-nome:hover { color: var(--apsis-green); text-decoration: underline; }
    .anexo-tam { font-size: 11.5px; color: var(--text-muted); }
    .anexo-del {
      width: 30px; height: 30px; flex: 0 0 30px; border-radius: var(--radius-sm);
      border: 0; background: transparent; color: var(--text-muted);
      display: grid; place-items: center; font-size: 16px; cursor: pointer;
    }
    .anexo-del:hover { background: var(--danger-bg); color: var(--danger); }

    /* Barra fixa de envio */
    .send-bar {
      position: sticky; bottom: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 12px 16px; margin: 18px -4px 0;
      box-shadow: 0 -6px 18px rgba(15, 33, 24, .08);
    }
    .send-bar-info { font-size: 13px; color: var(--text-2); }
    .send-bar .btn:disabled { opacity: .45; cursor: not-allowed; }

    /* Tela de sucesso (padrão de conclusão) */
    .envio-done {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 56px 24px;
    }
    .envio-done-icon {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--success-bg); color: var(--success);
      display: grid; place-items: center; font-size: 52px; margin-bottom: 24px;
    }
    .envio-done h2 { font-size: 26px; font-weight: 700; color: var(--text); margin: 0 0 10px; }
    .envio-done p { font-size: 15px; color: var(--text-2); line-height: 1.6; max-width: 380px; margin: 0 0 26px; }

    @media (max-width: 900px) {
      .perg-grid { grid-template-columns: minmax(0, 1fr); }
    }

    @media (max-width: 640px) {
      .aloc-grid { grid-template-columns: 1fr; }
      .send-bar { flex-direction: column; align-items: stretch; text-align: center; margin-left: -8px; margin-right: -8px; }
      .send-bar .btn { width: 100%; justify-content: center; min-height: 46px; }
      .dropzone { min-height: 74px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <script src="assets/data.js?v=44"></script>
  <script src="assets/app.js?v=44"></script>
  <script src="assets/supabase-config.js?v=44"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js?v=44"></script>
  <script>
    (function () {
      "use strict";

      Layout.mount("envio", "Envio de evidências");

      var esc = App.escapeHtml;
      var page = document.getElementById("page");
      var DEMO = (window.Auth && Auth.modoDemo()) || !(window.Auth && Auth.pronto);
      var db = window.Auth ? Auth.cliente : null;

      // Estado
      var alocacoes = [];       // lista carregada
      var atual = null;         // alocação aberta no detalhe
      var itens = [];           // itens_checklist do processo aberto
      var anexosPorItem = {};   // itemId -> [anexo]
      var enviando = false;
      // Enviar nao e ponto final: o responsavel pode reabrir e mandar mais
      // evidencia quantas vezes precisar, antes ou durante a visita.
      var editando = false;

      // Quem esta enviando define a origem da evidencia: o gerente da Claro
      // manda como Claro, o responsavel da EPO como EPO. Sao caixas separadas
      // na tela de quem confere, e o banco nao deixa um assinar pelo outro.
      var minhaOrigem = "epo";
      function descobrirOrigem() {
        if (DEMO || !window.Auth || !Auth.perfil) return Promise.resolve(minhaOrigem);
        return Auth.perfil().then(function (p) {
          minhaOrigem = (p && p.papel === "cliente") ? "claro" : "epo";
          return minhaOrigem;
        }, function () { return minhaOrigem; });
      }

      var STATUS_META = {
        pendente:     { label: "Pendente",     cls: "badge-media" },
        em_andamento: { label: "Em andamento", cls: "badge-info" },
        enviada:      { label: "Enviada",      cls: "badge-success" }
      };

      // ------------------------------------------------------------------
      // Helpers
      // ------------------------------------------------------------------
      function statusBadge(st) {
        var m = STATUS_META[st] || STATUS_META.pendente;
        return '<span class="badge ' + m.cls + '"><i class="ti ti-circle-filled" aria-hidden="true"></i>' + m.label + "</span>";
      }

      function tamanhoHumano(bytes) {
        var n = Number(bytes) || 0;
        if (n < 1024) return n + " B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
        return (n / (1024 * 1024)).toFixed(1) + " MB";
      }

      function iconePorTipo(nome, contentType) {
        var ct = String(contentType || "").toLowerCase();
        var ext = String(nome || "").toLowerCase().split(".").pop();
        if (ct.indexOf("image/") === 0 || /^(jpg|jpeg|png|gif|webp|heic)$/.test(ext)) return "ti-photo";
        if (ct.indexOf("pdf") >= 0 || ext === "pdf") return "ti-file-type-pdf";
        if (/^(xls|xlsx|csv)$/.test(ext)) return "ti-file-spreadsheet";
        if (/^(doc|docx)$/.test(ext)) return "ti-file-type-doc";
        if (/^(zip|rar|7z)$/.test(ext)) return "ti-file-zip";
        return "ti-file";
      }

      function sanitizarNome(nome) {
        return String(nome || "arquivo")
          .toLowerCase()
          .normalize("NFD").replace(/[̀-ͯ]/g, "")
          .replace(/[^a-z0-9._-]+/g, "-")
          .replace(/^-+|-+$/g, "") || "arquivo";
      }

      // Total do que ESTE lado enviou. Contar o anexo do outro lado liberaria o
      // envio sem nenhuma evidencia propria: bastava a Claro ter anexado algo
      // para o responsavel da EPO conseguir finalizar de maos vazias.
      function totalAnexos() {
        var t = 0;
        Object.keys(anexosPorItem).forEach(function (k) {
          anexosPorItem[k].forEach(function (ax) {
            if ((ax.origem || "epo") === minhaOrigem) t += 1;
          });
        });
        return t;
      }

      // Quantos arquivos existem no item, de qualquer origem: serve para a
      // contagem exibida, que deve mostrar tudo o que chegou.
      function totalGeralAnexos() {
        var t = 0;
        Object.keys(anexosPorItem).forEach(function (k) { t += anexosPorItem[k].length; });
        return t;
      }

      function dataBr(iso) {
        if (!iso) return "";
        try { return new Date(iso).toLocaleDateString("pt-BR"); } catch (e) { return ""; }
      }

      // A tela nunca comenta o proprio estado: mostra o resultado, nada mais.
      function avisoDemo() {
        return "";
      }

      // ------------------------------------------------------------------
      // Dados - modo demonstração (mock local, nada é gravado)
      // ------------------------------------------------------------------
      var demoAnexosSeq = 0;

      function itensDoProcessoLocal(slug) {
        var p = App.processoById(slug);
        if (!p) return [];
        return p.itens.map(function (it) {
          return { id: it.id, pergunta: it.pergunta, evidencia_esperada: it.evidencia, requer_foto: !!it.requerFoto };
        });
      }

      function montarDemo() {
        var lista = window.APP.epos || [];
        function acha(id) {
          for (var i = 0; i < lista.length; i++) { if (lista[i].id === id) return lista[i]; }
          return null;
        }
        // A unidade de teste vem primeiro: é nela que o responsável anexa na
        // entrada de teste do perfil dele.
        var e1 = acha("cerrado") || lista[0] || { nome: "EPO Nordeste", cidade: "Recife", uf: "PE" };
        var e2 = lista[0] === e1 ? (lista[1] || e1) : (lista[0] || e1);
        return [
          {
            id: "demo-aloc-1",
            status: "pendente",
            enviada_em: null,
            processo_id: "recebimento-expedicao",
            epos: { nome: e1.nome, cidade: e1.cidade, uf: e1.uf },
            processos: { nome: "Recebimento & Expedição", slug: "recebimento-expedicao", icone: "ti-truck-loading" },
            nAnexos: 0,
            _anexos: {}
          },
          {
            id: "demo-aloc-2",
            status: "em_andamento",
            enviada_em: null,
            processo_id: "reversa",
            epos: { nome: e1.nome, cidade: e1.cidade, uf: e1.uf },
            processos: { nome: "Logística Reversa", slug: "reversa", icone: "ti-arrow-back-up" },
            nAnexos: 1,
            _anexos: {
              "rev-04": [{ id: "demo-ax-0", nome_arquivo: "foto-embalagem-reversa.jpg", tamanho: 482133, content_type: "image/jpeg", storage_path: null }]
            }
          },
          {
            id: "demo-aloc-3",
            status: "enviada",
            enviada_em: "2026-07-24",
            processo_id: "armazenagem",
            epos: { nome: e1.nome, cidade: e1.cidade, uf: e1.uf },
            processos: { nome: "Armazenagem & Facilities", slug: "armazenagem", icone: "ti-building-warehouse" },
            nAnexos: 2,
            _anexos: {
              "arm-01": [{ id: "demo-ax-1", nome_arquivo: "layout-do-estoque.pdf", tamanho: 210544, content_type: "application/pdf", storage_path: null }],
              "arm-02": [{ id: "demo-ax-2", nome_arquivo: "area-de-reversa.jpg", tamanho: 331902, content_type: "image/jpeg", storage_path: null }]
            }
          },
          {
            id: "demo-aloc-4",
            status: "pendente",
            enviada_em: null,
            processo_id: "governanca",
            epos: { nome: e2.nome, cidade: e2.cidade, uf: e2.uf },
            processos: { nome: "Governança & RNCs", slug: "governanca", icone: "ti-shield-check" },
            nAnexos: 0,
            _anexos: {}
          }
        ];
      }

      // ------------------------------------------------------------------
      // Dados - Supabase (RLS já filtra as alocações do responsável)
      // ------------------------------------------------------------------
      function carregarAlocacoes() {
        if (DEMO) {
          if (!alocacoes.length) alocacoes = montarDemo();
          renderLista();
          return;
        }
        renderCarregando("Carregando seus questionários...");
        db.from("alocacoes")
          .select("*, epos(nome,cidade,uf), processos(nome,slug,icone), alocacao_anexos(count)")
          .order("criado_em", { ascending: false })
          .then(function (r) {
            if (r.error) {
              console.error("carregarAlocacoes", r.error);
              App.toast("Não foi possível carregar os seus relatórios. Tente novamente.");
              alocacoes = [];
            } else {
              alocacoes = (r.data || []).map(function (a) {
                a.nAnexos = (a.alocacao_anexos && a.alocacao_anexos[0] && a.alocacao_anexos[0].count) || 0;
                return a;
              });
            }
            renderLista();
            abrirDoLink();
          });
      }

      // ?alocacao= abre direto o questionário: vem da tela de evidências recebidas.
      var alocParam = App.getParam("alocacao");
      function abrirDoLink() {
        if (!alocParam) return;
        for (var i = 0; i < alocacoes.length; i++) {
          if (String(alocacoes[i].id) === String(alocParam)) {
            alocParam = null;
            carregarDetalhe(alocacoes[i]);
            return;
          }
        }
        alocParam = null;
      }

      function carregarDetalhe(aloc) {
        atual = aloc;
        itens = [];
        anexosPorItem = {};

        if (DEMO) {
          itens = itensDoProcessoLocal(aloc.processos.slug);
          aloc._anexos = aloc._anexos || {};
          itens.forEach(function (it) {
            anexosPorItem[it.id] = (aloc._anexos[it.id] || []).slice();
          });
          renderDetalhe();
          return;
        }

        renderCarregando("Carregando perguntas do questionário...");
        Promise.all([
          db.from("itens_checklist").select("*")
            .eq("processo_id", aloc.processo_id).eq("ativo", true).order("ordem"),
          db.from("alocacao_anexos").select("*").eq("alocacao_id", aloc.id)
        ]).then(function (rs) {
          var rItens = rs[0], rAnexos = rs[1];
          if (rItens.error || rAnexos.error) {
            console.error("carregarDetalhe", rItens.error || rAnexos.error);
            App.toast("Não foi possível abrir o questionário. Tente novamente.");
            renderLista();
            return;
          }
          itens = rItens.data || [];
          itens.forEach(function (it) { anexosPorItem[it.id] = []; });
          // A pergunta pode ter sido desativada depois do envio. O arquivo dela
          // continua no historico, mas nao existe mais campo na tela para
          // mostrar: sem esta guarda ele entrava na contagem e nunca aparecia.
          (rAnexos.data || []).forEach(function (ax) {
            if (!anexosPorItem[ax.item_id]) return;
            anexosPorItem[ax.item_id].push(ax);
          });
          renderDetalhe();
        });
      }

      // ------------------------------------------------------------------
      // Upload / remoção de anexos
      // ------------------------------------------------------------------
      // Anexo novo (primeiro ou complementar) devolve o questionario para
      // "em andamento": e o que a equipe APSIS ve como movimento na EPO.
      // Recebe o id porque o upload pode terminar depois de a tela ter voltado
      // para a lista: o estado do questionario tem que mudar do mesmo jeito.
      function marcarEmAndamento(alocId) {
        var id = alocId || (atual && atual.id);
        if (!id) return Promise.resolve();
        if (atual && String(atual.id) === String(id)) {
          if (atual.status === "em_andamento") return Promise.resolve();
          atual.status = "em_andamento";
        }
        if (DEMO) return Promise.resolve();
        return db.from("alocacoes").update({ status: "em_andamento" }).eq("id", id)
          .then(function () {}, function () {});
      }

      function adicionarArquivos(itemId, files) {
        var lista = Array.prototype.slice.call(files || []);
        if (!lista.length) return;

        if (DEMO) {
          lista.forEach(function (f) {
            demoAnexosSeq += 1;
            anexosPorItem[itemId].push({
              id: "demo-ax-" + demoAnexosSeq,
              nome_arquivo: f.name,
              tamanho: f.size,
              content_type: f.type,
              storage_path: null
            });
          });
          atual._anexos[itemId] = anexosPorItem[itemId].slice();
          marcarEmAndamento();
          App.toast(lista.length + (lista.length > 1 ? " arquivos anexados com sucesso." : " arquivo anexado com sucesso."));
          renderDetalhe();
          return;
        }

        var dz = page.querySelector('.dropzone[data-item="' + itemId + '"]');
        if (dz) {
          dz.classList.add("is-busy");
          dz.innerHTML = '<i class="ti ti-loader-2" aria-hidden="true"></i><span>Enviando ' + lista.length + (lista.length > 1 ? " arquivos..." : " arquivo...") + "</span>";
        }

        var enviados = 0;
        // O id do questionario e capturado agora. Voltando para a lista no meio
        // do envio, "atual" vira null e a cadeia quebrava no arquivo seguinte.
        var alocId = atual.id;
        // A origem precisa estar resolvida antes do primeiro arquivo: se o
        // papel ainda nao chegou, o gerente da Claro enviaria como EPO e o
        // banco recusaria um a um.
        var cadeia = descobrirOrigem();
        lista.forEach(function (f) {
          cadeia = cadeia.then(function () {
            var path = "alocacoes/" + alocId + "/" + itemId + "/" + Date.now() + "-" + sanitizarNome(f.name);
            return db.storage.from("evidencias").upload(path, f).then(function (up) {
              if (up.error) throw new Error(up.error.message);
              return db.from("alocacao_anexos").insert({
                alocacao_id: alocId,
                item_id: itemId,
                origem: minhaOrigem,
                storage_path: path,
                nome_arquivo: f.name,
                content_type: f.type || null,
                tamanho: f.size
              }).select().single();
            }).then(function (ins) {
              if (ins.error) throw new Error(ins.error.message);
              // Se a tela ja saiu deste questionario, o arquivo esta gravado,
              // mas nao ha mais lista na tela para atualizar.
              if (atual && String(atual.id) === String(alocId) && anexosPorItem[itemId]) {
                anexosPorItem[itemId].push(ins.data);
              }
              enviados += 1;
            }).catch(function (err) {
              console.error("upload", f.name, err);
              App.toast("Não foi possível enviar " + f.name + ". Tente novamente.");
            });
          });
        });

        cadeia.then(function () {
          if (enviados > 0) {
            if (atual && String(atual.id) === String(alocId)) {
              atual.nAnexos = (atual.nAnexos || 0) + enviados;
            }
            return marcarEmAndamento(alocId);
          }
        }).then(function () {
          renderDetalhe();
          if (enviados > 0) encaminharArquivos(alocId);
        });
      }

      // Encaminha os arquivos recem-enviados para a pasta oficial. Roda em
      // segundo plano: nada na tela depende disso.
      var ultimoEncaminhamento = 0;

      var encaminhamentoAgendado = null;

      // Anexar e enviar disparam o encaminhamento, e duas chamadas juntas
      // disputavam o mesmo arquivo no destino. O intervalo continua, mas quem
      // chega dentro dele agora e REAGENDADO: antes era descartado, e o ultimo
      // arquivo anexado podia nunca ser encaminhado.
      function encaminharArquivos(alocId) {
        if (DEMO || !db || !db.functions) return;
        var id = alocId || (atual && atual.id);
        if (!id) return;

        var agora = Date.now();
        var espera = 15000 - (agora - ultimoEncaminhamento);
        if (espera > 0) {
          if (encaminhamentoAgendado) clearTimeout(encaminhamentoAgendado);
          encaminhamentoAgendado = setTimeout(function () {
            encaminhamentoAgendado = null;
            encaminharArquivos(id);
          }, espera + 200);
          return;
        }

        ultimoEncaminhamento = agora;
        db.functions.invoke("sincronizar-sharepoint", { body: { alocacao_id: id } })
          .then(function (r) {
            if (r && r.error) console.warn("encaminhamento:", r.error.message || r.error);
            else if (r && r.data && r.data.falhas && r.data.falhas.length) console.warn("encaminhamento:", r.data.falhas);
          }, function (e) { console.warn("encaminhamento:", e); });
      }

      function removerAnexo(itemId, anexoId) {
        var lista = anexosPorItem[itemId] || [];
        var ax = null;
        for (var i = 0; i < lista.length; i++) {
          if (String(lista[i].id) === String(anexoId)) { ax = lista[i]; break; }
        }
        if (!ax) return;

        function tirarDoEstado() {
          anexosPorItem[itemId] = lista.filter(function (a) { return String(a.id) !== String(anexoId); });
          if (atual.nAnexos > 0) atual.nAnexos -= 1;
          renderDetalhe();
        }

        if (DEMO) {
          tirarDoEstado();
          atual._anexos[itemId] = anexosPorItem[itemId].slice();
          App.toast("Anexo removido.");
          return;
        }

        // A linha do banco sai primeiro, com prova de que saiu. Na ordem
        // inversa, uma exclusao negada pelo banco deixava o registro vivo
        // apontando para um arquivo ja apagado.
        db.from("alocacao_anexos").delete().eq("id", ax.id).select("id").then(function (r) {
          if (r && r.error) throw new Error(r.error.message);
          if (!r || !r.data || !r.data.length) {
            App.toast("Este anexo não é seu para remover.");
            return null;
          }
          return db.storage.from("evidencias").remove([ax.storage_path]).then(function () {
            tirarDoEstado();
            App.toast("Anexo removido.");
          });
        }).catch(function (err) {
          console.error("removerAnexo", err);
          App.toast("Não foi possível remover o anexo. Tente novamente.");
        });
      }

      function abrirAnexo(itemId, anexoId) {
        var lista = anexosPorItem[itemId] || [];
        for (var i = 0; i < lista.length; i++) {
          if (String(lista[i].id) === String(anexoId)) {
            var ax = lista[i];
            if (!ax.storage_path) { App.abrirDocumento(ax.nome_arquivo); return; }
            db.storage.from("evidencias").createSignedUrl(ax.storage_path, 3600).then(function (r) {
              if (r.error || !r.data) { App.toast("Não foi possível abrir o anexo."); return; }
              window.open(r.data.signedUrl, "_blank", "noopener");
            });
            return;
          }
        }
      }

      // ------------------------------------------------------------------
      // Envio final
      // ------------------------------------------------------------------
      function enviarComprovacoes() {
        if (enviando || !atual || totalAnexos() < 1) return;
        enviando = true;
        var btn = document.getElementById("btn-enviar");
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2" aria-hidden="true"></i>Enviando...'; }

        var agora = new Date().toISOString();

        function concluir() {
          atual.status = "enviada";
          atual.enviada_em = agora;
          enviando = false;
          editando = false;
          renderSucesso();
          // ultima rede de protecao: o que nao foi encaminhado na hora de
          // anexar vai agora. Roda em segundo plano.
          encaminharArquivos();
        }

        if (DEMO) { concluir(); return; }

        // .select() para saber se a linha existe e mudou: sem ele, um
        // questionario apagado ou refeito pelo gestor devolvia sucesso vazio e
        // a tela dizia "enviado" com o banco intacto.
        db.from("alocacoes").update({ status: "enviada", enviada_em: agora }).eq("id", atual.id).select("id")
          .then(function (r) {
            if (r.error) throw new Error(r.error.message);
            if (!r.data || !r.data.length) {
              throw new Error("este questionário não está mais disponível para envio");
            }
            concluir();
          })
          .catch(function (err) {
            enviando = false;
            if (btn) {
              btn.disabled = false;
              btn.innerHTML = '<i class="ti ti-send" aria-hidden="true"></i>' +
                (atual.enviada_em ? "Enviar de novo" : "Enviar evidências");
            }
            console.error("enviarComprovacoes", err);
            App.toast(err && /não está mais disponível/.test(err.message)
              ? "Este questionário não está mais disponível para envio. Atualize a lista."
              : "Não foi possível concluir o envio. Tente novamente.");
          });
      }

      // ------------------------------------------------------------------
      // Renderização
      // ------------------------------------------------------------------
      function renderCarregando(msg) {
        page.innerHTML =
          avisoDemo() +
          '<div class="empty"><i class="ti ti-loader-2" aria-hidden="true"></i>' + esc(msg) + "</div>";
      }

      // ------------------------------------------------------------------
      // Lista de questionários
      //
      // Um cartão por questionário virava um monte de cartão solto repetindo o
      // nome da unidade. Agora a unidade é o título e os questionários dela
      // vêm abaixo - tanto em grade quanto em lista.
      // ------------------------------------------------------------------
      var VISAO_CHAVE = "epoEnvioVisao";

      function visaoAtual() {
        try {
          return localStorage.getItem(VISAO_CHAVE) === "lista" ? "lista" : "grade";
        } catch (e) { return "grade"; }
      }

      function definirVisao(v) {
        try { localStorage.setItem(VISAO_CHAVE, v); } catch (e) {}
        renderLista();
      }

      function local(epo) {
        return (epo.cidade || "") + (epo.uf ? "/" + epo.uf : "");
      }

      function pendente(a) { return a.status !== "enviada"; }

      // Agrupa por unidade. Dentro de cada uma, o que falta enviar vem primeiro.
      function porUnidade() {
        var mapa = {};
        var lista = [];
        alocacoes.forEach(function (a) {
          var epo = a.epos || {};
          var chave = String(a.epo_id || epo.nome || "sem-epo");
          var g = mapa[chave];
          if (!g) {
            g = mapa[chave] = {
              nome: epo.nome || "EPO",
              local: local(epo),
              itens: [],
              pendentes: 0,
              enviados: 0,
              anexos: 0
            };
            lista.push(g);
          }
          g.itens.push(a);
          g.anexos += a.nAnexos || 0;
          if (pendente(a)) g.pendentes += 1;
          else g.enviados += 1;
        });

        lista.forEach(function (g) {
          g.itens.sort(function (x, y) {
            if (pendente(x) !== pendente(y)) return pendente(x) ? -1 : 1;
            var nx = (x.processos && x.processos.nome) || "";
            var ny = (y.processos && y.processos.nome) || "";
            return nx.localeCompare(ny, "pt-BR");
          });
        });
        lista.sort(function (a, b) {
          if (b.pendentes !== a.pendentes) return b.pendentes - a.pendentes;
          return a.nome.localeCompare(b.nome, "pt-BR");
        });
        return lista;
      }

      function textoAnexos(n) {
        return n ? n + (n === 1 ? " anexo" : " anexos") : "sem anexos";
      }

      function tagsDaUnidade(g) {
        var t = "";
        if (g.pendentes) {
          t += '<span class="badge badge-media"><i class="ti ti-clipboard-list" aria-hidden="true"></i>' +
            g.pendentes + " a enviar</span>";
        }
        if (g.enviados) {
          t += '<span class="badge badge-success"><i class="ti ti-check" aria-hidden="true"></i>' +
            g.enviados + (g.enviados === 1 ? " enviado" : " enviados") + "</span>";
        }
        t += '<span class="aloc-card-anexos"><i class="ti ti-paperclip" aria-hidden="true"></i>' +
          esc(textoAnexos(g.anexos)) + "</span>";
        return t;
      }

      function cabecalhoDaUnidade(g) {
        return (
          '<div class="grupo-unidade-head">' +
            '<span class="grupo-unidade-ico"><i class="ti ti-building-warehouse" aria-hidden="true"></i></span>' +
            '<span class="grupo-unidade-info">' +
              '<span class="nm">' + esc(g.nome) + "</span>" +
              (g.local ? '<span class="loc">' + esc(g.local) + "</span>" : "") +
            "</span>" +
            '<span class="grupo-unidade-tags">' + tagsDaUnidade(g) + "</span>" +
          "</div>"
        );
      }

      // Em grade o cartão não repete o nome da unidade: ele já está no título
      // do grupo. Sobra espaço para o que interessa, o questionário.
      function cartaoQuestionario(a) {
        var proc = a.processos || {};
        var n = a.nAnexos || 0;
        return (
          '<button class="aloc-card" type="button" data-aloc="' + esc(a.id) + '">' +
            '<div class="aloc-card-top">' +
              '<span class="aloc-card-icon"><i class="ti ' + esc(proc.icone || "ti-clipboard-list") + '" aria-hidden="true"></i></span>' +
              '<div class="aloc-card-info">' +
                "<b>" + esc(proc.nome || "Questionário") + "</b>" +
                "<span>" + esc(textoAnexos(n)) + "</span>" +
              "</div>" +
            "</div>" +
            '<div class="aloc-card-foot">' +
              statusBadge(a.status) +
              '<span class="env-abrir">' +
                (pendente(a) ? "Anexar" : "Ver anexos") +
                '<i class="ti ti-chevron-right" aria-hidden="true"></i>' +
              "</span>" +
            "</div>" +
          "</button>"
        );
      }

      function renderGrade(grupos) {
        return grupos.map(function (g) {
          return '<section class="grupo-unidade">' +
            cabecalhoDaUnidade(g) +
            '<div class="aloc-grid">' + g.itens.map(cartaoQuestionario).join("") + "</div>" +
          "</section>";
        }).join("");
      }

      function renderTabela(grupos) {
        var linhas = grupos.map(function (g) {
          var cabecalho =
            '<tr class="env-linha-unidade">' +
              '<td colspan="4">' +
                '<div class="env-unidade-linha">' +
                  '<span class="env-unidade-nome">' +
                    '<i class="ti ti-building-warehouse" aria-hidden="true"></i>' + esc(g.nome) +
                    (g.local ? '<span class="env-unidade-loc">' + esc(g.local) + "</span>" : "") +
                  "</span>" +
                  '<span class="grupo-unidade-tags">' + tagsDaUnidade(g) + "</span>" +
                "</div>" +
              "</td>" +
            "</tr>";

          var itens = g.itens.map(function (a) {
            var proc = a.processos || {};
            var n = a.nAnexos || 0;
            return (
              '<tr class="env-linha-q" data-aloc="' + esc(a.id) + '">' +
                '<td class="env-q-nome">' +
                  '<i class="ti ' + esc(proc.icone || "ti-clipboard-list") + '" aria-hidden="true"></i>' +
                  esc(proc.nome || "Questionário") +
                "</td>" +
                "<td>" + statusBadge(a.status) + "</td>" +
                '<td class="tnum">' +
                  '<span class="aloc-card-anexos"><i class="ti ti-paperclip" aria-hidden="true"></i>' + n + "</span>" +
                "</td>" +
                '<td class="num">' +
                  '<span class="env-abrir">' +
                    (pendente(a) ? "Anexar" : "Ver anexos") +
                    '<i class="ti ti-chevron-right" aria-hidden="true"></i>' +
                  "</span>" +
                "</td>" +
              "</tr>"
            );
          }).join("");

          return cabecalho + itens;
        }).join("");

        return (
          '<div class="table-wrap"><table class="table env-tabela">' +
            "<thead><tr>" +
              "<th>Questionário</th><th>Situação</th><th>Anexos</th><th></th>" +
            "</tr></thead>" +
            "<tbody>" + linhas + "</tbody>" +
          "</table></div>"
        );
      }

      function htmlAlternador() {
        var atualV = visaoAtual();
        return (
          '<div class="visao-switch" role="group" aria-label="Forma de visualização">' +
            '<button type="button" data-visao="grade"' + (atualV === "grade" ? ' class="is-on"' : "") + ">" +
              '<i class="ti ti-layout-grid" aria-hidden="true"></i>Grade' +
            "</button>" +
            '<button type="button" data-visao="lista"' + (atualV === "lista" ? ' class="is-on"' : "") + ">" +
              '<i class="ti ti-list" aria-hidden="true"></i>Lista' +
            "</button>" +
          "</div>"
        );
      }

      function renderLista() {
        atual = null;

        var grupos = porUnidade();
        var nQ = alocacoes.length;

        var corpo;
        if (!nQ) {
          corpo =
            '<div class="empty">' +
              '<i class="ti ti-inbox" aria-hidden="true"></i>' +
              "Nenhum questionário alocado para você ainda.<br>" +
              '<span class="text-muted" style="font-size:12.5px;">Quando o gestor alocar um questionário para o seu e-mail, ele aparece aqui.</span>' +
            "</div>";
        } else {
          corpo = visaoAtual() === "lista" ? renderTabela(grupos) : renderGrade(grupos);
        }

        page.innerHTML =
          avisoDemo() +
          '<p class="page-intro">' +
            "Relatórios pedidos para a sua EPO. Abra cada um, anexe as evidências de cada pergunta " +
            "e finalize com o botão de envio. Você pode fazer isso de duas formas: <b>antes da visita</b> " +
            "(prévia, para adiantar o trabalho) ou <b>durante a visita</b> do colaborador APSIS - neste caso " +
            "cada arquivo aparece na tela dele na hora." +
          "</p>" +
          (nQ
            ? '<div class="env-barra">' +
                '<span class="env-resumo">' +
                  grupos.length + (grupos.length === 1 ? " unidade" : " unidades") + " · " +
                  nQ + (nQ === 1 ? " questionário" : " questionários") +
                "</span>" +
                htmlAlternador() +
              "</div>"
            : "") +
          corpo;

        function abrir(id) {
          for (var i = 0; i < alocacoes.length; i++) {
            if (String(alocacoes[i].id) === String(id)) { carregarDetalhe(alocacoes[i]); return; }
          }
        }

        page.querySelectorAll("[data-aloc]").forEach(function (el) {
          el.addEventListener("click", function () {
            abrir(el.getAttribute("data-aloc"));
          });
        });

        page.querySelectorAll("[data-visao]").forEach(function (b) {
          b.addEventListener("click", function () {
            definirVisao(b.getAttribute("data-visao"));
          });
        });
      }

      function htmlAnexos(itemId, readonly) {
        var lista = anexosPorItem[itemId] || [];
        if (!lista.length) return "";
        return (
          '<ul class="anexo-list">' +
          lista.map(function (ax) {
            // Cada lado so remove o proprio anexo. O anexo do outro lado
            // aparece com o selo de quem enviou e sem o botao de apagar -
            // o banco negaria de qualquer jeito, e um botao que nao pode
            // funcionar so engana.
            var origemDele = ax.origem || "epo";
            var meu = origemDele === minhaOrigem;
            var selo = meu ? "" :
              '<span class="origem-selo ' + App.origemMeta(origemDele).cls + '">' +
                esc(App.origemMeta(origemDele).curto) + "</span>";
            return (
              '<li class="anexo-item">' +
                '<i class="ti ' + iconePorTipo(ax.nome_arquivo, ax.content_type) + '" aria-hidden="true"></i>' +
                '<div class="anexo-info">' +
                  '<button class="anexo-nome" type="button" data-abrir="' + esc(ax.id) + '" data-item="' + esc(itemId) + '" title="Abrir anexo">' + esc(ax.nome_arquivo) + "</button>" +
                  '<span class="anexo-tam">' + tamanhoHumano(ax.tamanho) + "</span>" +
                "</div>" +
                selo +
                (readonly || !meu ? "" :
                  '<button class="anexo-del" type="button" data-remover="' + esc(ax.id) + '" data-item="' + esc(itemId) + '" aria-label="Remover anexo ' + esc(ax.nome_arquivo) + '">' +
                    '<i class="ti ti-trash" aria-hidden="true"></i>' +
                  "</button>") +
              "</li>"
            );
          }).join("") +
          "</ul>"
        );
      }

      function renderDetalhe() {
        if (!atual) { renderLista(); return; }
        var readonly = atual.status === "enviada" && !editando;
        var epo = atual.epos || {};
        var proc = atual.processos || {};

        var htmlPerguntas = itens.map(function (it, i) {
          var dz = readonly ? "" :
            '<div class="dropzone" data-item="' + esc(it.id) + '" role="button" tabindex="0" aria-label="Anexar arquivos para a pergunta ' + (i + 1) + '">' +
              '<i class="ti ti-cloud-upload" aria-hidden="true"></i>' +
              "<span>Arraste arquivos aqui ou clique para selecionar</span>" +
              '<span class="dz-hint">Fotos, PDFs, planilhas e documentos</span>' +
            "</div>" +
            '<input type="file" multiple hidden data-input="' + esc(it.id) + '">';

          return (
            '<div class="perg-card">' +
              '<span class="perg-num">Pergunta ' + (i + 1) + " de " + itens.length + "</span>" +
              '<p class="perg-texto">' + esc(it.pergunta) + "</p>" +
              (it.evidencia_esperada
                ? '<div class="perg-evid"><i class="ti ti-bulb" aria-hidden="true"></i><span><b>Evidência esperada:</b> ' + esc(it.evidencia_esperada) + "</span></div>"
                : "") +
              dz +
              htmlAnexos(it.id, readonly) +
              ((anexosPorItem[it.id] || []).length
                ? '<div class="perg-selo"><i class="ti ti-check" aria-hidden="true"></i>visível para o auditor</div>'
                : "") +
            "</div>"
          );
        }).join("");

        var n = totalAnexos();
        var jaEnviou = !!atual.enviada_em;
        var htmlBarra = readonly ? "" :
          '<div class="send-bar">' +
            '<span class="send-bar-info" id="send-bar-info">' +
              (n ? n + (n === 1 ? " anexo adicionado" : " anexos adicionados") : "Anexe pelo menos 1 arquivo para enviar") +
            "</span>" +
            '<button class="btn btn-primary" id="btn-enviar" type="button"' + (n < 1 ? " disabled" : "") + ">" +
              '<i class="ti ti-send" aria-hidden="true"></i>' +
              (jaEnviou ? "Enviar de novo" : "Enviar evidências") +
            "</button>" +
          "</div>";

        page.innerHTML =
          avisoDemo() +
          '<button class="btn btn-ghost btn-sm" id="btn-voltar" type="button" style="margin-bottom:14px;">' +
            '<i class="ti ti-arrow-left" aria-hidden="true"></i>Meus questionários' +
          "</button>" +
          '<div class="det-head">' +
            '<span class="aloc-card-icon"><i class="ti ' + esc(proc.icone || "ti-clipboard-list") + '" aria-hidden="true"></i></span>' +
            '<div class="det-head-info">' +
              "<h2>" + esc(proc.nome || "Questionário") + "</h2>" +
              "<p>" + esc(epo.nome || "EPO") + " - " + esc((epo.cidade || "") + (epo.uf ? "/" + epo.uf : "")) + "</p>" +
            "</div>" +
            statusBadge(atual.status) +
          "</div>" +
          '<div class="live-note">' +
            '<i class="ti ti-eye" aria-hidden="true"></i>' +
            "<span>O auditor da APSIS vê estes anexos em tempo real durante a vistoria.</span>" +
          "</div>" +
          (readonly
            ? '<div class="readonly-note">' +
                '<i class="ti ti-circle-check" aria-hidden="true"></i>' +
                '<span style="flex:1;">Evidências enviadas' +
                  (atual.enviada_em ? " em " + esc(dataBr(atual.enviada_em)) : "") +
                ". Precisa complementar? Você pode adicionar mais a qualquer momento.</span>" +
                '<button class="btn btn-sm" id="btn-reabrir" type="button" ' +
                  'style="flex:0 0 auto;background:var(--surface);color:var(--apsis-green);">' +
                  '<i class="ti ti-plus" aria-hidden="true"></i>Adicionar mais' +
                "</button>" +
              "</div>"
            : (jaEnviou
              ? '<div class="live-note"><i class="ti ti-pencil" aria-hidden="true"></i>' +
                "<span>Você está complementando um envio já feito. Ao terminar, use <b>Enviar de novo</b> " +
                "para avisar a equipe APSIS.</span></div>"
              : "")) +
          '<div class="perg-grid">' + htmlPerguntas + "</div>" +
          htmlBarra;

        wireDetalhe(readonly);
      }

      function wireDetalhe(readonly) {
        document.getElementById("btn-voltar").addEventListener("click", function () {
          editando = false;
          carregarAlocacoes();
        });

        var btnReabrir = document.getElementById("btn-reabrir");
        if (btnReabrir) {
          btnReabrir.addEventListener("click", function () {
            editando = true;
            renderDetalhe();
            var primeira = page.querySelector(".dropzone");
            if (primeira && primeira.scrollIntoView) primeira.scrollIntoView({ block: "center" });
          });
        }

        // Abrir anexo (signed URL) - também no modo leitura
        page.querySelectorAll(".anexo-nome").forEach(function (b) {
          b.addEventListener("click", function () {
            abrirAnexo(b.getAttribute("data-item"), b.getAttribute("data-abrir"));
          });
        });

        if (readonly) return;

        // Dropzones
        page.querySelectorAll(".dropzone").forEach(function (dz) {
          var itemId = dz.getAttribute("data-item");
          var input = page.querySelector('input[data-input="' + itemId + '"]');

          dz.addEventListener("click", function () { input.click(); });
          dz.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); input.click(); }
          });
          input.addEventListener("change", function () {
            if (input.files && input.files.length) adicionarArquivos(itemId, input.files);
            input.value = "";
          });

          ["dragenter", "dragover"].forEach(function (evn) {
            dz.addEventListener(evn, function (ev) {
              ev.preventDefault();
              ev.stopPropagation();
              dz.classList.add("is-drag");
            });
          });
          ["dragleave", "dragend"].forEach(function (evn) {
            dz.addEventListener(evn, function (ev) {
              ev.preventDefault();
              dz.classList.remove("is-drag");
            });
          });
          dz.addEventListener("drop", function (ev) {
            ev.preventDefault();
            ev.stopPropagation();
            dz.classList.remove("is-drag");
            if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) {
              adicionarArquivos(itemId, ev.dataTransfer.files);
            }
          });
        });

        // Remover anexos
        page.querySelectorAll(".anexo-del").forEach(function (b) {
          b.addEventListener("click", function () {
            removerAnexo(b.getAttribute("data-item"), b.getAttribute("data-remover"));
          });
        });

        // Enviar
        var btn = document.getElementById("btn-enviar");
        if (btn) btn.addEventListener("click", enviarComprovacoes);
      }

      function renderSucesso() {
        var proc = atual && atual.processos ? atual.processos : {};
        var epo = atual && atual.epos ? atual.epos : {};
        page.innerHTML =
          avisoDemo() +
          '<div class="card mb-0"><div class="envio-done">' +
            '<span class="envio-done-icon"><i class="ti ti-circle-check" aria-hidden="true"></i></span>' +
            "<h2>Evidências enviadas!</h2>" +
            "<p><b>" + esc(proc.nome || "Questionário") + "</b> da " + esc(epo.nome || "EPO") +
              " foi enviado com " + totalAnexos() + (totalAnexos() === 1 ? " anexo" : " anexos") +
              ". A equipe APSIS vai comparar as evidências com a vistoria feita em campo." +
              " Se aparecer mais algum documento, você pode complementar este envio quando quiser." +
            "</p>" +
            '<div class="row wrap" style="gap:10px;justify-content:center;">' +
              '<button class="btn btn-primary" id="btn-voltar-lista" type="button">' +
                '<i class="ti ti-arrow-left" aria-hidden="true"></i>Voltar aos meus questionários' +
              "</button>" +
              '<button class="btn btn-ghost" id="btn-complementar" type="button">' +
                '<i class="ti ti-plus" aria-hidden="true"></i>Adicionar mais evidências' +
              "</button>" +
            "</div>" +
          "</div></div>";

        document.getElementById("btn-voltar-lista").addEventListener("click", function () {
          carregarAlocacoes();
        });
        document.getElementById("btn-complementar").addEventListener("click", function () {
          editando = true;
          renderDetalhe();
        });
      }

      // ------------------------------------------------------------------
      // Início
      // ------------------------------------------------------------------
      descobrirOrigem();
      carregarAlocacoes();
    })();
  </script>
</body>
</html>
