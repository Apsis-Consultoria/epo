<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurações de pontuação - Auditoria de EPOs</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/app.css?v=27">

  <style>
    /* Ajustes locais desta tela (componentes não previstos no design system). */
    .range-input {
      width: 100%;
      height: 22px;
      accent-color: var(--primary);
      cursor: pointer;
      background: transparent;
    }
    .num-input { width: 76px; text-align: center; }

    /* Faixa visual dos tiers (0-100) */
    .tier-band {
      display: flex;
      height: 48px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .tier-band-seg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-width: 0;
      padding: 0 8px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      font-size: 12px;
      font-weight: 600;
      transition: flex-grow .3s ease;
    }
    .tier-band-seg small { font-size: 11px; font-weight: 500; opacity: .85; }
    .tier-band-seg.critico { background: var(--critico-bg); color: var(--critico-text); }
    .tier-band-seg.bronze { background: var(--bronze-bg); color: var(--bronze-text); }
    .tier-band-seg.prata  { background: var(--prata-bg);  color: var(--prata-text); }
    .tier-band-seg.ouro   { background: var(--ouro-bg);   color: var(--ouro-text); }

    .tier-scale {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      margin-top: 6px;
    }

    /* Linhas de peso dos blocos */
    .weight-row {
      display: grid;
      grid-template-columns: 240px 1fr 56px;
      align-items: center;
      gap: 18px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .weight-row:last-of-type { border-bottom: 0; }
    .weight-label { font-size: 14px; font-weight: 500; color: var(--text); }
    .weight-label small { display: block; font-size: 12px; color: var(--text-muted); font-weight: 400; }
    .weight-val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; }

    @media (max-width: 720px) {
      .weight-row { grid-template-columns: 1fr 56px; }
      .weight-row .range-input { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <script src="assets/data.js?v=27"></script>
  <script src="assets/app.js?v=27"></script>
  <script src="assets/supabase-config.js?v=27"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js?v=27"></script>
  <script>
    (function () {
      "use strict";

      var actions =
        '<button class="btn btn-ghost btn-sm" id="btn-reset" type="button">' +
          '<i class="ti ti-rotate" aria-hidden="true"></i>Restaurar padrão' +
        '</button>' +
        '<button class="btn btn-primary btn-sm" id="btn-save" type="button">' +
          '<i class="ti ti-device-floppy" aria-hidden="true"></i>Salvar configuração' +
        '</button>';

      Layout.mount("config", "Configurações de pontuação", actions);

      var CHECKLIST = window.APP.checklist || [];
      var EPOS = (window.APP.epos || []).slice().sort(function (a, b) { return b.score - a.score; });

      // Padrões de origem (para "Restaurar padrão").
      var DEFAULT_OURO = window.APP.tierRules.ouroMin;
      var DEFAULT_PRATA = window.APP.tierRules.prataMin;
      var DEFAULT_BRONZE = window.APP.tierRules.bronzeMin != null ? window.APP.tierRules.bronzeMin : 55;
      var DEFAULT_PESOS = CHECKLIST.map(function (b) { return b.peso; });

      // Estado reativo (nada é persistido - protótipo).
      var state = {
        ouroMin: DEFAULT_OURO,
        prataMin: DEFAULT_PRATA,
        bronzeMin: DEFAULT_BRONZE,
        pesos: DEFAULT_PESOS.slice()
      };

      // ------------------------------------------------------------- Markup
      var page = document.getElementById("page");

      page.innerHTML =
        '<p class="page-intro">Defina como as EPOs são pontuadas e classificadas. Ajuste os cortes dos tiers e o ' +
        'peso de cada processo; a prévia recalcula a classificação em tempo real.</p>' +

        // Seção 1 - Cortes dos tiers
        '<section class="card stack-lg" style="margin-bottom:20px">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Cortes dos tiers</span>' +
              '<span class="subtitle">Nota mínima para cada classificação (escala de 0 a 100).</span>' +
            '</div>' +
            '<span class="badge"><i class="ti ti-adjustments" aria-hidden="true"></i>Escala 0-100</span>' +
          '</div>' +

          '<div class="grid-3">' +
            '<div class="field mb-0">' +
              '<label for="ouro-num">Ouro - nota mínima</label>' +
              '<div class="row">' +
                '<input type="range" class="range-input grow" id="ouro-range" min="50" max="99" step="1" aria-label="Nota mínima do tier Ouro">' +
                '<input type="number" class="input num-input" id="ouro-num" min="50" max="99" step="1" inputmode="numeric" aria-label="Nota mínima do tier Ouro">' +
              '</div>' +
              '<span class="hint">Nota igual ou superior entra no tier Ouro.</span>' +
            '</div>' +
            '<div class="field mb-0">' +
              '<label for="prata-num">Prata - nota mínima</label>' +
              '<div class="row">' +
                '<input type="range" class="range-input grow" id="prata-range" min="40" max="90" step="1" aria-label="Nota mínima do tier Prata">' +
                '<input type="number" class="input num-input" id="prata-num" min="40" max="90" step="1" inputmode="numeric" aria-label="Nota mínima do tier Prata">' +
              '</div>' +
              '<span class="hint">Abaixo da Prata, a EPO fica em Bronze.</span>' +
            '</div>' +
            '<div class="field mb-0">' +
              '<label for="bronze-num">Bronze - nota mínima</label>' +
              '<div class="row">' +
                '<input type="range" class="range-input grow" id="bronze-range" min="1" max="80" step="1" aria-label="Nota mínima do tier Bronze">' +
                '<input type="number" class="input num-input" id="bronze-num" min="1" max="80" step="1" inputmode="numeric" aria-label="Nota mínima do tier Bronze">' +
              '</div>' +
              '<span class="hint">Abaixo do Bronze, a EPO fica em Crítico.</span>' +
            '</div>' +
          '</div>' +

          '<div>' +
            '<div class="tier-band" id="tier-band" role="img" aria-label="Faixas de classificação por nota"></div>' +
            '<div class="tier-scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>' +
          '</div>' +
        '</section>' +

        // Seção 2 - Pesos dos blocos
        '<section class="card" style="margin-bottom:20px">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Pesos por processo</span>' +
              '<span class="subtitle">Quanto cada processo contribui para a nota final. O total precisa somar 100.</span>' +
            '</div>' +
            '<span class="badge" id="peso-sum-badge"><i class="ti ti-sum" aria-hidden="true"></i><span id="peso-sum-text"></span></span>' +
          '</div>' +
          '<div id="weights"></div>' +
          '<p class="hint" id="peso-warn" style="margin-top:12px;display:none;color:var(--danger)">' +
            '<i class="ti ti-alert-triangle" aria-hidden="true"></i> A soma dos pesos precisa ser exatamente 100 para salvar.' +
          '</p>' +
        '</section>' +

        // Seção 3 - Prévia da classificação
        '<section class="card">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Prévia da classificação</span>' +
              '<span class="subtitle">Como as EPOs seriam classificadas com os cortes atuais.</span>' +
            '</div>' +
            '<div class="card-header-action row wrap" id="dist-chips"></div>' +
          '</div>' +
          '<div class="table-wrap">' +
            '<table class="table">' +
              '<thead><tr>' +
                '<th style="width:44px">#</th>' +
                '<th>EPO</th>' +
                '<th>Localização</th>' +
                '<th style="width:210px">Nota</th>' +
                '<th>Tier</th>' +
              '</tr></thead>' +
              '<tbody id="preview-body"></tbody>' +
            '</table>' +
          '</div>' +
        '</section>';

      // ------------------------------------------------------- Referências
      var ouroRange = document.getElementById("ouro-range");
      var ouroNum = document.getElementById("ouro-num");
      var prataRange = document.getElementById("prata-range");
      var prataNum = document.getElementById("prata-num");
      var bronzeRange = document.getElementById("bronze-range");
      var bronzeNum = document.getElementById("bronze-num");
      var band = document.getElementById("tier-band");
      var weights = document.getElementById("weights");
      var sumBadge = document.getElementById("peso-sum-badge");
      var sumText = document.getElementById("peso-sum-text");
      var pesoWarn = document.getElementById("peso-warn");
      var distChips = document.getElementById("dist-chips");
      var previewBody = document.getElementById("preview-body");
      var btnSave = document.getElementById("btn-save");
      var btnReset = document.getElementById("btn-reset");

      // ------------------------------------------------------------ Lógica
      function tierOfLocal(score) {
        if (score >= state.ouroMin) return "ouro";
        if (score >= state.prataMin) return "prata";
        if (score >= state.bronzeMin) return "bronze";
        return "critico";
      }

      function somaPesos() {
        return state.pesos.reduce(function (a, b) { return a + b; }, 0);
      }

      function renderBand() {
        var criticoW = state.bronzeMin;                 // 0 .. bronzeMin
        var bronzeW = state.prataMin - state.bronzeMin;  // bronzeMin .. prataMin
        var prataW = state.ouroMin - state.prataMin;     // prataMin .. ouroMin
        var ouroW = 100 - state.ouroMin;                 // ouroMin .. 100
        band.innerHTML =
          '<div class="tier-band-seg critico" style="flex-grow:' + criticoW + '">Crítico' +
            '<small>0-' + (state.bronzeMin - 1) + '</small></div>' +
          '<div class="tier-band-seg bronze" style="flex-grow:' + bronzeW + '">Bronze' +
            '<small>' + state.bronzeMin + '-' + (state.prataMin - 1) + '</small></div>' +
          '<div class="tier-band-seg prata" style="flex-grow:' + prataW + '">Prata' +
            '<small>' + state.prataMin + '-' + (state.ouroMin - 1) + '</small></div>' +
          '<div class="tier-band-seg ouro" style="flex-grow:' + ouroW + '">Ouro' +
            '<small>' + state.ouroMin + '-100</small></div>';
      }

      function renderTierInputs() {
        ouroRange.value = state.ouroMin;
        ouroNum.value = state.ouroMin;
        prataRange.value = state.prataMin;
        prataNum.value = state.prataMin;
        bronzeRange.value = state.bronzeMin;
        bronzeNum.value = state.bronzeMin;
      }

      function renderPreview() {
        var dist = { ouro: 0, prata: 0, bronze: 0, critico: 0 };
        var rows = EPOS.map(function (e, i) {
          var tier = tierOfLocal(e.score);
          dist[tier] += 1;
          var meta = App.tierMeta(tier);
          return '<tr>' +
            '<td class="rank">' + (i + 1) + '</td>' +
            '<td>' + App.escapeHtml(e.nome) + '</td>' +
            '<td class="muted">' + App.escapeHtml(e.cidade) + ' · ' + App.escapeHtml(e.uf) + '</td>' +
            '<td>' +
              '<div class="score-row">' +
                '<div class="score-bar"><div class="score-fill tier-' + tier + '" style="width:' + e.score + '%"></div></div>' +
                '<span class="score-num">' + e.score + '</span>' +
              '</div>' +
            '</td>' +
            '<td><span class="badge ' + meta.cls + '">' + meta.label + '</span></td>' +
          '</tr>';
        }).join("");
        previewBody.innerHTML = rows;

        distChips.innerHTML =
          '<span class="badge badge-ouro">Ouro · ' + dist.ouro + '</span>' +
          '<span class="badge badge-prata">Prata · ' + dist.prata + '</span>' +
          '<span class="badge badge-bronze">Bronze · ' + dist.bronze + '</span>' +
          '<span class="badge badge-critico">Crítico · ' + dist.critico + '</span>';
      }

      function renderSum() {
        var soma = somaPesos();
        var ok = soma === 100;
        sumText.textContent = "Soma " + soma + " / 100";
        sumBadge.classList.toggle("badge-success", ok);
        sumBadge.classList.toggle("badge-danger", !ok);
        pesoWarn.style.display = ok ? "none" : "block";
      }

      function renderWeights() {
        weights.innerHTML = CHECKLIST.map(function (b, i) {
          return '<div class="weight-row">' +
            '<span class="weight-label">' + App.escapeHtml(b.nome) +
              '<small>' + b.itens.length + ' ' + (b.itens.length === 1 ? "item" : "itens") + '</small></span>' +
            '<input type="range" class="range-input" data-idx="' + i + '" min="0" max="40" step="1" ' +
              'value="' + state.pesos[i] + '" aria-label="Peso do processo ' + App.escapeHtml(b.nome) + '">' +
            '<span class="weight-val" id="wv-' + i + '">' + state.pesos[i] + '</span>' +
          '</div>';
        }).join("");

        Array.prototype.forEach.call(weights.querySelectorAll(".range-input"), function (input) {
          input.addEventListener("input", function () {
            var idx = parseInt(input.getAttribute("data-idx"), 10);
            state.pesos[idx] = parseInt(input.value, 10);
            document.getElementById("wv-" + idx).textContent = state.pesos[idx];
            renderSum();
          });
        });
      }

      // Sincronização dos cortes (garante prataMin < ouroMin).
      function setTiers(source) {
        if (state.prataMin <= state.bronzeMin) {
          if (source === "bronze") state.prataMin = state.bronzeMin + 1;
          else state.bronzeMin = state.prataMin - 1;
        }
        if (state.ouroMin <= state.prataMin) {
          if (source === "ouro") state.prataMin = state.ouroMin - 1;
          else state.ouroMin = state.prataMin + 1;
        }
        if (state.prataMin <= state.bronzeMin) state.bronzeMin = state.prataMin - 1;
        renderTierInputs();
        renderBand();
        renderPreview();
      }

      function clampInt(v, min, max, fallback) {
        v = parseInt(v, 10);
        if (isNaN(v)) return fallback;
        return Math.max(min, Math.min(max, v));
      }

      ouroRange.addEventListener("input", function () {
        state.ouroMin = clampInt(ouroRange.value, 50, 99, state.ouroMin);
        setTiers("ouro");
      });
      ouroNum.addEventListener("input", function () {
        state.ouroMin = clampInt(ouroNum.value, 50, 99, state.ouroMin);
        setTiers("ouro");
      });
      prataRange.addEventListener("input", function () {
        state.prataMin = clampInt(prataRange.value, 40, 90, state.prataMin);
        setTiers("prata");
      });
      prataNum.addEventListener("input", function () {
        state.prataMin = clampInt(prataNum.value, 40, 90, state.prataMin);
        setTiers("prata");
      });
      bronzeRange.addEventListener("input", function () {
        state.bronzeMin = clampInt(bronzeRange.value, 1, 80, state.bronzeMin);
        setTiers("bronze");
      });
      bronzeNum.addEventListener("input", function () {
        state.bronzeMin = clampInt(bronzeNum.value, 1, 80, state.bronzeMin);
        setTiers("bronze");
      });

      btnSave.addEventListener("click", function () {
        if (somaPesos() !== 100) {
          App.toast("Ajuste os pesos para somar 100 antes de salvar.");
          return;
        }
        App.toast("Configuração de pontuação salva.");
      });

      btnReset.addEventListener("click", function () {
        state.ouroMin = DEFAULT_OURO;
        state.prataMin = DEFAULT_PRATA;
        state.bronzeMin = DEFAULT_BRONZE;
        state.pesos = DEFAULT_PESOS.slice();
        renderTierInputs();
        renderBand();
        renderPreview();
        renderWeights();
        renderSum();
        App.toast("Valores padrão restaurados.");
      });

      // Primeira renderização
      renderTierInputs();
      renderBand();
      renderWeights();
      renderSum();
      renderPreview();
    })();
  </script>
</body>
</html>
