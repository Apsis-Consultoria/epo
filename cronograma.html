        var ativas = (listaEpos || []).filter(function (e) {
          return e.ativo !== false || String(e.id) === String(selecionada);
        });
        sel.innerHTML =
          '<option value="">Selecione a unidade...</option>' +
          ativas.map(function (e) {
            var loc = [e.cidade, e.uf].filter(Boolean).join("/");
            return '<option value="' + esc(e.id) + '"' +
              (String(e.id) === String(selecionada) ? " selected" : "") + ">" +
              esc(e.nome) + (loc ? " - " + esc(loc) : "") +
              (e.ativo === false ? " (inativa)" : "") + "</option>";
          }).join("");
      }

      // Unidade escolhida: o formulario se preenche com o cadastro dela, e a
      // linha do cronograma dela, se existir, traz a data que ja esta marcada.
      function carregarEscolhida(id) {
        epoEscolhida = id || null;
        var epo = null;
        (listaEpos || []).forEach(function (e) {
          if (String(e.id) === String(id)) epo = e;
        });
        var doCron = null;
        itens.forEach(function (it) {
          if (epo && String(it.epoId) === String(epo.id)) doCron = it;
        });
        FormEpo.preencher(epo ? {
          id: epo.id, cod: epo.cod_fornecedor, base: epo.base, nome: epo.nome,
          ativo: epo.ativo, endereco: epo.endereco, cidade: epo.cidade,
          uf: epo.uf, cep: epo.cep,
          responsavel_nome: epo.responsavel_nome, responsavel_email: epo.responsavel_email
        } : null, { item: doCron });
      }

      function abrirNova(cronograma) {
        modoCron = !!cronograma;
        epoEscolhida = null;
        FormEpo.preparar({ processos: [], pedidos: [] });
        FormEpo.limpar();
        mostrarEscolha(modoCron);
        $("nova-titulo").textContent = modoCron ? "Novo cronograma" : "Nova EPO";
        $("nova-salvar").disabled = false;
        $("nova-salvar").textContent = textoDoBotao();
        $("nova-modal").classList.add("is-open");

        carregarListasDoForm().then(function (l) {
          FormEpo.atualizarListas(l);
          FormEpo.renderProcs(null);
        });

        if (modoCron) {
          carregarEpos().then(function () {
            pintarEscolha("");
            var sel = $("f-escolha");
            if (sel) sel.focus();
          });
        } else {
          setTimeout(function () { var c = $("f-cod"); if (c) c.focus(); }, 60);
        }
      }

      function fecharNova() { $("nova-modal").classList.remove("is-open"); }

      function salvarNova() {
        if (modoCron && !epoEscolhida) {
          App.toast("Escolha a unidade que entra no cronograma.");
          var sel = $("f-escolha");
          if (sel) sel.focus();
          return;
        }

        var d = FormEpo.ler();
        // No cadastro novo o codigo do fornecedor e sempre exigido: e a chave que
        // a planilha usa para nao duplicar unidade no reenvio. No modo cronograma
        // a unidade ja existe com o codigo dela.
        var erro = FormEpo.validar(d, epoEscolhida, !modoCron);
        if (erro) { App.toast(erro); return; }

        var btn = $("nova-salvar");
        btn.disabled = true;
        btn.textContent = modoCron ? "Salvando..." : "Cadastrando...";
        function encerrar(msg) {
          btn.disabled = false;
          btn.textContent = textoDoBotao();
          if (msg) App.toast(msg);
        }

        if (DEMO) { encerrar("Sem conexao com os dados agora: nada foi gravado."); return; }

        // Salvo de dentro do cronograma: a unidade entra na lista mesmo sem
        // data, porque e essa a lista de quem ainda precisa de data.
        FormEpo.salvarTudo({ db: Auth.cliente, dados: d, epoId: epoEscolhida, ciclo: CICLO,
                             incluirNoCronograma: true })
          .then(function (r) {
            formListas = null;          // o pedido novo tem de aparecer na proxima abertura
            listaEpos = null;           // o cadastro pode ter mudado aqui
            encerrar(null);
            var frase = FormEpo.resumo(r, d);
            App.toast(d.nome + (modoCron ? " no cronograma." : " cadastrada.") +
                      (frase ? " " + frase + "." : ""));
            fecharNova();
            return carregar().then(render);
          })
          .catch(function (e) {
            encerrar((e && e.message) ? e.message
                                      : (modoCron ? "Nao foi possivel salvar agora."
                                                  : "Nao foi possivel cadastrar agora."));
          });
      }

      $("btn-nova").addEventListener("click", function () { abrirNova(false); });
      $("btn-novo-cron").addEventListener("click", function () { abrirNova(true); });
      (function () {
        var sel = $("f-escolha");
        if (sel) sel.addEventListener("change", function () { carregarEscolhida(this.value); });
      })();

      // ------------------------------------------------------------------
      // Imprimir
      //
      // A tela inteira em papel: o ciclo, os numeros, as caixas e a tabela com
      // todas as unidades. Antes so dava para imprimir a pagina como ela esta na
      // tela, com menu, barra de cima e a tabela cortada na largura.
      //
      // A folha de impressao (assets/app.css, @media print) tira o menu e a
      // barra, solta a tabela e evita quebrar linha no meio. Aqui a tabela e
      // aberta por inteiro antes de chamar a impressao: paginacao ou filtro
      // deixariam de fora justamente o que se quer no papel.
      // ------------------------------------------------------------------
      $("btn-imprimir").addEventListener("click", function () {
        var antes = { busca: filtro.busca, uf: filtro.uf, situacao: filtro.situacao };
        filtro.busca = ""; filtro.uf = ""; filtro.situacao = "";
        if ($("f-busca")) $("f-busca").value = "";
        if ($("f-uf")) $("f-uf").value = "";
        if ($("f-situacao")) $("f-situacao").value = "";
        render();

        var titulo = document.title;
        document.title = "Cronograma " + CICLO + " - Auditoria de EPOs";
        document.body.classList.add("imprimindo");

        var voltar = function () {
          document.body.classList.remove("imprimindo");
          document.title = titulo;
          filtro.busca = antes.busca;
          filtro.uf = antes.uf;
          filtro.situacao = antes.situacao;
          if ($("f-busca")) $("f-busca").value = antes.busca;
          if ($("f-uf")) $("f-uf").value = antes.uf;
          if ($("f-situacao")) $("f-situacao").value = antes.situacao;
          render();
        };

        // Depois de imprimir (ou cancelar), a tela volta ao filtro de antes.
        if (window.matchMedia) {
          var mm = window.matchMedia("print");
          var ouvir = function (ev) {
            if (ev.matches) return;
            voltar();
            if (mm.removeEventListener) mm.removeEventListener("change", ouvir);
          };
          if (mm.addEventListener) mm.addEventListener("change", ouvir);
        }
        window.addEventListener("afterprint", function uma() {
          voltar();
          window.removeEventListener("afterprint", uma);
        });

        window.print();
      });
      $("nova-fechar").addEventListener("click", fecharNova);
      $("nova-cancelar").addEventListener("click", fecharNova);
      $("nova-salvar").addEventListener("click", salvarNova);
      $("nova-modal").addEventListener("click", function (ev) {
        if (ev.target === this) fecharNova();
      });

      // ================================================================
      // Planilha
      // ================================================================
      function baixarModelo(botaoEl) {
        botaoEl.disabled = true;
        PlanilhaCronograma.baixarModelo(itens, CICLO, "cronograma")
          .then(function () { botaoEl.disabled = false; })
          .catch(function (e) {
            botaoEl.disabled = false;
            App.toast(e && e.message ? e.message : "Nao foi possivel gerar o modelo agora.");
          });
      }

      function abrirImportacao() {
        previa = null;
        $("imp-corpo").innerHTML =
          '<div class="imp-alvo" id="imp-alvo" role="button" tabindex="0">' +
            '<i class="ti ti-file-spreadsheet" aria-hidden="true"></i>' +
            "<b>Escolha a planilha ou arraste o arquivo aqui</b>" +
            "<small>Uma aba so, chamada Cronograma. Baixe o modelo se ainda nao tiver.</small>" +
          "</div>" +
          '<p class="muted" style="margin-top:12px;font-size:12.5px;">' +
            "Nada e gravado antes de voce conferir a previa.</p>";
        $("imp-rodape").innerHTML =
          '<button class="btn btn-ghost" type="button" id="imp-cancelar">Fechar</button>';
        $("imp-cancelar").addEventListener("click", fecharImportacao);
        ligarAlvo();
        $("imp-modal").classList.add("is-open");
      }

      function fecharImportacao() {
        $("imp-modal").classList.remove("is-open");
        previa = null;
      }

      function ligarAlvo() {
        var alvo = $("imp-alvo");
        if (!alvo) return;
        alvo.addEventListener("click", function () { $("imp-arquivo").click(); });
        alvo.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); $("imp-arquivo").click(); }
        });
        ["dragenter", "dragover"].forEach(function (n) {
          alvo.addEventListener(n, function (ev) {
            ev.preventDefault(); alvo.classList.add("is-sobre");
          });
        });
        ["dragleave", "drop"].forEach(function (n) {
          alvo.addEventListener(n, function (ev) {
            ev.preventDefault(); alvo.classList.remove("is-sobre");
          });
        });
        alvo.addEventListener("drop", function (ev) {
          var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
          if (f) lerArquivo(f);
        });
      }

      function lerArquivo(arquivo) {
        $("imp-corpo").innerHTML = '<p class="muted">Lendo a planilha...</p>';
        $("imp-rodape").innerHTML =
          '<button class="btn btn-ghost" type="button" id="imp-cancelar">Fechar</button>';
        $("imp-cancelar").addEventListener("click", fecharImportacao);

        PlanilhaCronograma.ler(arquivo, "cronograma").then(function (lido) {
          previa = compararComCadastro(lido, arquivo.name);
          mostrarPrevia();
        }).catch(function (e) {
          $("imp-corpo").innerHTML =
            '<div class="empty"><i class="ti ti-file-alert" aria-hidden="true"></i><p>' +
            esc(e && e.message ? e.message : "Nao foi possivel ler a planilha.") + "</p></div>";
        });
      }

      // A previa e uma estimativa feita aqui. O numero que vale e o que o
      // servidor devolve depois de gravar.
      function compararComCadastro(lido, nomeArquivo) {
        var porCodigo = {};
        itens.forEach(function (it) {
          if (it.cod) porCodigo[it.cod + "|" + (it.base || "")] = it;
        });

        var novas = [], mudam = [], iguais = [], aprovadas = [], reabrem = [];
        var vistos = {};

        lido.linhas.forEach(function (l) {
          var chave = l.cod + "|" + (l.base || "");
          vistos[chave] = true;
          var atual = porCodigo[chave];

          if (!atual) {
            if (!l.nome || !l.cidade || !l.uf) {
              lido.erros.push({ linha: l.linha, motivo: "unidade nova sem nome, cidade ou UF" });
              l.invalida = true;
              return;
            }
            novas.push(l);
            return;
          }

          var difs = [];
          if (l.nome && l.nome !== atual.nome) difs.push("nome");
          if (l.cidade && l.cidade !== atual.cidade) difs.push("cidade");
          if (l.uf && l.uf !== atual.uf) difs.push("UF");
          if (l.endereco) difs.push("endereco");
          if (l.cep) difs.push("CEP");

          var jaAprovada = atual.situacao === "confirmada" ||
                           atual.situacao === "realizada" ||
                           atual.situacao === "nao_realizada";
          var mudaData = l.data && l.data !== atual.prevIniIso;

          if (mudaData && jaAprovada) {
            aprovadas.push({ linha: l, atual: atual });
          } else if (mudaData) {
            difs.push("data");
            if (atual.situacao === "aguardando_claro" || atual.situacao === "aguardando_apsis") {
              reabrem.push({ linha: l, atual: atual });
            }
          }

          if (difs.length) mudam.push({ linha: l, atual: atual, campos: difs });
          else iguais.push({ linha: l, atual: atual });
        });

        var ausentes = itens.filter(function (it) {
          if (!it.cod) return false;
          return !vistos[it.cod + "|" + (it.base || "")];
        });

        return {
          arquivo: nomeArquivo, aba: lido.aba, abaEsperada: lido.abaEsperada,
          total: lido.total, erros: lido.erros, avisos: lido.avisos,
          linhas: lido.linhas.filter(function (l) { return !l.invalida; }),
          novas: novas, mudam: mudam, iguais: iguais,
          aprovadas: aprovadas, reabrem: reabrem, ausentes: ausentes,
          desativar: {}
        };
      }

      function bloco(titulo, aberto, corpo) {
        return '<details class="imp-bloco"' + (aberto ? " open" : "") + ">" +
          "<summary>" + esc(titulo) + "</summary><div>" + corpo + "</div></details>";
      }

      function mostrarPrevia() {
        var p = previa;
        var chips = [];
        if (p.novas.length)     chips.push(p.novas.length + (p.novas.length === 1 ? " unidade nova" : " unidades novas"));
        if (p.mudam.length)     chips.push(p.mudam.length + (p.mudam.length === 1 ? " atualizacao" : " atualizacoes"));
        if (p.iguais.length)    chips.push(p.iguais.length + " sem mudanca");
        if (p.aprovadas.length) chips.push(p.aprovadas.length + " com data ja aprovada, mantidas");
        if (p.erros.length)     chips.push(p.erros.length + (p.erros.length === 1 ? " linha com problema" : " linhas com problema"));

        var html =
          '<div class="tk-aviso" style="margin-bottom:14px;">' +
            '<i class="ti ti-eye-check tk-ico" aria-hidden="true"></i>' +
            '<div class="tk-aviso-corpo"><b>Nada foi gravado ainda</b>' +
            "<p>Confira abaixo antes de continuar.</p></div></div>" +
          '<p style="font-size:13px;margin:0 0 10px;">' + esc(p.arquivo) +
            ", aba <b>" + esc(p.aba) + "</b>, " + p.total +
            (p.total === 1 ? " linha lida" : " linhas lidas") + ".</p>" +
          (p.abaEsperada ? "" :
            '<p class="muted" style="font-size:12.5px;margin:0 0 10px;">Nao achei uma aba chamada ' +
            "Cronograma, entao li a aba " + esc(p.aba) + ".</p>") +
          '<div class="imp-chips" style="margin-bottom:14px;">' +
            chips.map(function (c) { return '<span class="chip">' + esc(c) + "</span>"; }).join("") +
          "</div>";

        if (p.reabrem.length) {
          html += '<div class="tk-aviso" style="margin-bottom:14px;">' +
            '<i class="ti ti-alert-triangle tk-ico" aria-hidden="true"></i>' +
            '<div class="tk-aviso-corpo"><b>' + p.reabrem.length +
            (p.reabrem.length === 1 ? " unidade volta" : " unidades voltam") +
            " para sem data</b><p>A data mudou e o pedido que estava com a Claro deixa de valer. " +
            "Vai ser preciso enviar de novo para aprovacao.</p></div></div>";
        }

        if (p.novas.length) {
          html += bloco("Vao entrar como novas (" + p.novas.length + ")", true,
            "<ul>" + p.novas.map(function (l) {
              return "<li>" + esc(l.nome) + " - " + esc(l.cidade) + "/" + esc(l.uf) +
                     ", cod. " + esc(l.cod) +
                     (l.data ? ", " + esc(PlanilhaCronograma.paraBrasil(l.data)) : "") + "</li>";
            }).join("") + "</ul>");
        }

        if (p.mudam.length) {
          html += bloco("Vao ser atualizadas (" + p.mudam.length + ")", true,
            "<ul>" + p.mudam.map(function (m) {
              return "<li><b>" + esc(m.atual.nome) + "</b>: " + esc(m.campos.join(", ")) +
                (m.campos.indexOf("nome") >= 0
                  ? '<br><span class="imp-atencao">o nome muda para ' + esc(m.linha.nome) + "</span>"
                  : "") + "</li>";
            }).join("") + "</ul>");
        }

        if (p.aprovadas.length) {
          html += bloco("Datas ja aprovadas, mantidas (" + p.aprovadas.length + ")", false,
            '<p class="imp-atencao">A planilha nao altera data que a Claro ja aprovou nem visita ' +
            "ja registrada. So o texto de semana e observacao e atualizado.</p><ul>" +
            p.aprovadas.map(function (a) {
              return "<li>" + esc(a.atual.nome) + " - continua em " +
                     esc(periodo(a.atual.prevIni, a.atual.prevFim)) + "</li>";
            }).join("") + "</ul>");
        }

        if (p.iguais.length) {
          html += bloco("Sem mudanca (" + p.iguais.length + ")", false,
            "<p>" + esc(p.iguais.map(function (i) { return i.atual.nome; }).join(", ")) + "</p>");
        }

        if (p.ausentes.length) {
          html += bloco("Nao vieram nesta planilha (" + p.ausentes.length + ")", true,
            "<p>A planilha nunca exclui unidade. No maximo desativa, e so o que voce marcar.</p>" +
            p.ausentes.map(function (a) {
              return '<label class="imp-desativar">' +
                '<input type="checkbox" class="checkbox" data-desativar="' + esc(a.cod) + '">' +
                "<span><b>" + esc(a.nome) + "</b>" +
                "<em>Nao veio nesta planilha. Desativar tira a unidade da operacao " +
                "e mantem tudo que ja foi registrado.</em></span></label>";
            }).join(""));
        }

        if (p.erros.length) {
          html += bloco("Linhas que nao vao entrar (" + p.erros.length + ")", true,
            '<ul class="imp-erro">' + p.erros.map(function (e) {
              return "<li>" + (e.linha ? "Linha " + e.linha + ": " : "") + esc(e.motivo) + ".</li>";
            }).join("") + "</ul>");
        }

        if (p.avisos.length) {
          html += bloco("Observacoes (" + p.avisos.length + ")", false,
            "<ul>" + p.avisos.map(function (a) {
              return "<li>" + esc(a.motivo) + ".</li>";
            }).join("") + "</ul>");
        }

        $("imp-corpo").innerHTML = html;

        Array.prototype.forEach.call(
          $("imp-corpo").querySelectorAll("[data-desativar]"), function (c) {
            c.addEventListener("change", function () {
              previa.desativar[c.getAttribute("data-desativar")] = c.checked;
            });
          });

        var quantas = p.linhas.length;
        var rotulo = quantas
          ? "Gravar " + quantas + (quantas === 1 ? " unidade" : " unidades") +
            (p.erros.length ? " (" + p.erros.length +
              (p.erros.length === 1 ? " linha fica" : " linhas ficam") + " de fora)" : "")
          : "Nada para gravar";

        $("imp-rodape").innerHTML =
          '<button class="btn btn-ghost" type="button" id="imp-cancelar">Descartar</button>' +
          '<button class="btn btn-primary" type="button" id="imp-gravar"' +
            (quantas ? "" : " disabled") + ">" + esc(rotulo) + "</button>";
        $("imp-cancelar").addEventListener("click", fecharImportacao);
        if (quantas) $("imp-gravar").addEventListener("click", gravarPlanilha);
      }

      function gravarPlanilha() {
        var p = previa;
        var codigos = Object.keys(p.desativar).filter(function (c) { return p.desativar[c]; });

        function seguir() {
          if (DEMO) {
            App.toast("Sem conexao com os dados agora: a planilha nao foi gravada.");
            fecharImportacao();
            return;
          }
          var botaoEl = $("imp-gravar");
          if (botaoEl) botaoEl.disabled = true;

          Auth.cliente.rpc("cronograma_importar", {
            p_arquivo: p.arquivo, p_linhas: p.linhas,
            p_desativar: codigos, p_ciclo: CICLO
          }).then(function (r) {
            if (!r || r.error) throw new Error((r && r.error && r.error.message) || "");
            var d = r.data || {};
            var msg = (d.criadas || 0) + " novas e " + (d.atualizadas || 0) + " atualizadas.";
            if (d.desativadas) msg += " " + d.desativadas + " desativadas.";
            if (d.criadas !== p.novas.length || d.atualizadas !== p.mudam.length) {
              msg = "O cadastro mudou enquanto voce conferia. Gravamos " + msg;
            } else {
              msg += " As novas ja aparecem na tela de EPOs.";
            }
            App.toast(msg);
            fecharImportacao();
            return carregar().then(carregarUltimaImportacao).then(render);
          }).catch(function (e) {
            if (botaoEl) botaoEl.disabled = false;
            App.toast(e && e.message ? e.message
                                     : "Nao foi possivel gravar a planilha agora. Tente novamente.");
          });
        }

        if (!codigos.length) { seguir(); return; }

        var nomes = p.ausentes
          .filter(function (a) { return p.desativar[a.cod]; })
          .map(function (a) { return a.nome; });

        App.confirmar({
          titulo: "Confirmar o envio",
          texto: p.linhas.length + (p.linhas.length === 1 ? " unidade vai" : " unidades vao") +
                 " ser gravadas e " + codigos.length +
                 (codigos.length === 1 ? " vai ser desativada: " : " vao ser desativadas: ") +
                 nomes.join(", ") +
                 ".\n\nDesativar tira a unidade da operacao e mantem tudo que ja foi auditado.",
          confirmar: "Gravar e desativar", cancelar: "Voltar para a previa", perigo: true
        }).then(function (ok) { if (ok) seguir(); });
      }

      // ================================================================
      // Ligacoes
      // ================================================================
      $("btn-modelo").addEventListener("click", function () { baixarModelo(this); });
      $("btn-planilha").addEventListener("click", abrirImportacao);
      $("btn-enviar").addEventListener("click", enviarLote);
      $("tk-fechar").addEventListener("click", fecharTicket);
      $("imp-fechar").addEventListener("click", fecharImportacao);

      $("imp-arquivo").addEventListener("change", function () {
        var f = this.files && this.files[0];
        this.value = "";                 // permite reenviar o mesmo arquivo
        if (f) lerArquivo(f);
      });

      $("tk-modal").addEventListener("click", function (ev) {
        if (ev.target === this) fecharTicket();
      });
      $("imp-modal").addEventListener("click", function (ev) {
        if (ev.target === this) fecharImportacao();
      });
      document.addEventListener("keydown", function (ev) {
        if (ev.key !== "Escape") return;
        if ($("tk-modal").classList.contains("is-open")) fecharTicket();
        else if ($("nova-modal").classList.contains("is-open")) fecharNova();
        else if ($("imp-modal").classList.contains("is-open")) fecharImportacao();
        else if (editando) { editando = null; renderTrabalho(); }
      });

      var buscaTimer = null;
      $("f-busca").addEventListener("input", function () {
        var v = this.value;
        if (buscaTimer) clearTimeout(buscaTimer);
        buscaTimer = setTimeout(function () {
          filtro.busca = v.trim();
          renderTabela();
        }, 180);
      });
      $("f-uf").addEventListener("change", function () {
        filtro.uf = this.value; renderTabela();
      });
      $("f-situacao").addEventListener("change", function () {
        filtro.situacao = this.value; renderTabela();
      });

      // ---------------------------------------------- cliques nas caixas
      $("duplo").addEventListener("click", function (ev) {
        if (!ev.target.closest) return;
        var b = ev.target.closest("[data-cx]");
        if (!b) return;
        var acao = b.getAttribute("data-cx");
        var id = b.getAttribute("data-id");

        if (acao === "cancelar") { editando = null; renderTrabalho(); return; }
        if (acao === "desaprovar") {
          editando = { id: id, modo: "sugerir", onde: "caixa" };
          renderTrabalho();
          var c = $("cx-ini"); if (c) c.focus();
          return;
        }
        if (acao === "enviar-sugestao") {
          var ini = valor("cx-ini");
          if (!ini) { App.toast("Informe a data que serve melhor."); return; }
          var fim = valor("cx-fim");
          if (fim && fim < ini) {
            App.toast("A data final nao pode ser anterior a inicial."); return;
          }
          rodar("cronograma_propor_data", {
            p_item: id, p_inicio: ini, p_fim: fim, p_motivo: valor("cx-msg")
          }, b).then(function (ok) {
            if (ok) App.toast("Sugestao enviada para a APSIS.");
          });
          return;
        }
        if (acao === "aprovar") { tratarAcao("aprovar", id, b); return; }
        if (acao === "aceitar") { tratarAcao("aceitar", id, b); return; }
        if (acao === "manter")  { tratarAcao("reenviar", id, b); return; }
      });

      $("chips-escala").addEventListener("click", function (ev) {
        var b = ev.target.closest ? ev.target.closest("[data-escala]") : null;
        if (!b) return;
        escala = b.getAttribute("data-escala");
        Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) {
          x.classList.toggle("is-active", x === b);
        });
        // Trocar a escala e so trocar a classe: as barras estao em
        // porcentagem do intervalo, e o intervalo nao mudou.
        var gan = $("gan");
        if (gan) gan.className = "gan " + (escala === "mes" ? "esc-mes" : "esc-semana");
      });

      $("roadmap").addEventListener("click", function (ev) {
        if (!ev.target.closest) return;
        var g = ev.target.closest("[data-grupo]");
        if (g) {
          var reg = g.getAttribute("data-grupo");
          grupoFechado[reg] = !grupoFechado[reg];
          g.setAttribute("aria-expanded", grupoFechado[reg] ? "false" : "true");
          var bl = $("roadmap").querySelector('[data-bloco="' + reg + '"]');
          if (bl) bl.style.display = grupoFechado[reg] ? "none" : "";
          return;
        }
        var alvo = ev.target.closest("[data-item]");
        if (alvo) abrirTicket(alvo.getAttribute("data-item"));
      });

      $("tabela").addEventListener("click", function (ev) {
        if (!ev.target.closest) return;
        var b = ev.target.closest("[data-acao]");
        if (!b) return;
        tratarAcao(b.getAttribute("data-acao"), b.getAttribute("data-id"), b);
      });

      // Mudou a data na linha: o botao de guardar aparece ali mesmo, para
      // ninguem sair da tela achando que ja salvou.
      $("tabela").addEventListener("change", function (ev) {
        var alvo = ev.target;
        if (!alvo || !alvo.getAttribute || !alvo.getAttribute("data-campo")) return;
        var id = alvo.getAttribute("data-id");
        var it = porId(id);
        if (!it) return;
        var linha = document.querySelector('[data-linha="' + id + '"]');
        if (!linha) return;
        var ini = linha.querySelector('[data-campo="ini"]');
        var fim = linha.querySelector('[data-campo="fim"]');
        var mudou = (ini.value || "") !== (it.prevIniIso || "") ||
                    (fim.value || "") !== (it.prevFimIso || "");
        var cel = linha.querySelector(".cel-acoes");
        var jaTem = linha.querySelector('[data-acao="guardar"]');
        if (mudou && !jaTem && cel) {
          // Data que ainda nao foi para a Claro so precisa ser guardada.
          // Data que ja esta com ela, ou ja aprovada, tem que voltar para
          // aprovacao: guardar em silencio deixaria as duas pontas achando
          // que combinaram dias diferentes.
          cel.insertAdjacentHTML("afterbegin", it.situacao === "sem_data"
            ? botao("guardar", id, "Guardar data", "btn-primary", "ti-device-floppy")
            : botao("guardar", id, "Trocar data e reenviar", "btn-primary", "ti-send"));
        } else if (!mudou && jaTem) {
          jaTem.parentNode.removeChild(jaTem);
        }
      });

      // ================================================================
      // Partida
      // ================================================================
      render();

      descobrirPapel()
        .then(carregar)
        .then(carregarUltimaImportacao)
        .then(render)
        .catch(function () {
          carregando = false;
          // A mensagem crua da consulta nao vai para a tela: fala de bastidor
          // e nao ajuda quem esta olhando.
          falha = "Nao foi possivel carregar o cronograma agora. " +
                  "Atualize a pagina em alguns instantes.";
          render();
        });
    })();
  </script>
</body>
</html>
