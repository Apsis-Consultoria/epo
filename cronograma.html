  <script>
    (function () {
      "use strict";

      var esc = App.escapeHtml;
      var DEMO = (window.Auth && Auth.modoDemo()) || !(window.Auth && Auth.pronto);
      var CICLO = (window.APP && APP.ciclo) || "2026";

      var ROTULO = {
        sem_data:         "Sem data definida",
        aguardando_claro: "Aguardando a Claro",
        aguardando_apsis: "Nova data sugerida",
        confirmada:       "Data aprovada",
        realizada:        "Realizada",
        nao_realizada:    "Nao aconteceu",
        cancelada:        "Fora deste ciclo"
      };
      var ACAO_TEXTO = {
        incluida:                 "entrou no cronograma",
        importada:                "veio pela planilha",
        data_definida:            "definiu a data",
        data_enviada:             "enviou a data para aprovacao",
        aprovada:                 "aprovou a data",
        nova_data_proposta:       "nao aprovou e sugeriu outra data",
        proposta_aceita:          "aceitou a data sugerida",
        realizada:                "registrou que a auditoria aconteceu",
        nao_realizada:            "registrou que a auditoria nao aconteceu",
        cancelada:                "tirou do ciclo",
        reaberta:                 "reabriu",
        desativada_pela_planilha: "saiu pela planilha"
      };
      var PAPEL_TEXTO = {
        admin: "APSIS", gestor: "APSIS", auditor: "consultor APSIS",
        cliente: "gerente da Claro", responsavel: "responsavel da unidade"
      };

      var MS = 86400000;
      var MESES = ["jan", "fev", "mar", "abr", "mai", "jun",
                   "jul", "ago", "set", "out", "nov", "dez"];

      // ------------------------------------------------------------------
      // Datas. Tudo em UTC: com fuso local, "2026-08-12" lido por new Date()
      // volta como 11/08 no Brasil e a barra inteira anda um dia.
      // ------------------------------------------------------------------
      function dn(iso) {
        if (!iso) return null;
        var p = String(iso).slice(0, 10).split("-");
        if (p.length !== 3) return null;
        var t = Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        return isNaN(t) ? null : Math.floor(t / MS);
      }
      function pad(n) { return (n < 10 ? "0" : "") + n; }
      function hojeN() {
        var h = new Date();
        return Math.floor(Date.UTC(h.getFullYear(), h.getMonth(), h.getDate()) / MS);
      }
      function paraIso(n) {
        if (n == null) return "";
        var d = new Date(n * MS);
        return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
      }
      // Primeira data que da para marcar: hoje mais tres dias.
      //
      // A visita nao pode ser marcada de um dia para o outro: e preciso avisar o
      // responsavel da EPO, ele juntar o que foi pedido e a equipe se deslocar.
      // Marcando numa quinta, o primeiro dia livre e o domingo - quinta, sexta e
      // sabado ficam fora. O campo de data ja recusa o que esta antes disso,
      // e o servidor recusa tambem: campo de tela se contorna.
      var DIAS_DE_ANTECEDENCIA = 3;
      function minMarcacao() {
        return paraIso(hojeN() + DIAS_DE_ANTECEDENCIA);
      }

      // 1970-01-01 caiu numa quinta: por isso o mais quatro.
      function segunda(n) { var dow = (n + 4) % 7; return n - ((dow + 6) % 7); }

      function fmtDia(n) {
        if (n == null) return "";
        var d = new Date(n * MS);
        return pad(d.getUTCDate()) + "/" + pad(d.getUTCMonth() + 1) + "/" + d.getUTCFullYear();
      }
      function fmtCurto(n) {
        if (n == null) return "";
        var d = new Date(n * MS);
        return pad(d.getUTCDate()) + "/" + pad(d.getUTCMonth() + 1);
      }
      function periodo(a, b) {
        if (a == null) return "";
        if (b == null || b === a) return fmtDia(a);
        return fmtCurto(a) + " a " + fmtDia(b);
      }
      function fmtDataHora(iso) {
        if (!iso) return "";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() +
               " as " + pad(d.getHours()) + "h" + pad(d.getMinutes());
      }

      // ------------------------------------------------------------------
      // Estado
      // ------------------------------------------------------------------
      var itens = [];
      var papel = "";
      var podeMontar = false;         // admin e gestor: datas, planilha, envio
      var podeAprovar = false;        // gerente da Claro
      var podeRegistrar = false;      // quem marca o que aconteceu
      var escala = "semana";
      var filtro = { busca: "", uf: "", situacao: "" };
      var grupoFechado = {};
      // { id, modo: "sugerir" | "registrar", onde: "caixa" | "tabela" }
      // O "onde" evita que o mesmo formulario apareca duas vezes, na caixa
      // e na linha da tabela, com os mesmos campos repetidos na pagina.
      var editando = null;
      var itemAberto = null;
      var previa = null;
      var ultimaImportacao = null;
      var carregando = true;
      var falha = "";

      // ------------------------------------------------------------------
      // Estrutura: o roadmap em cima e a tabela de trabalho logo abaixo, na
      // mesma tela. O grafico mostra o desenho do ciclo; e na tabela que a
      // data e combinada, aprovada e corrigida.
      // ------------------------------------------------------------------
      var acoes =
        // Entra uma unidade JA CADASTRADA no cronograma: escolhe-se na lista, os
        // dados dela aparecem preenchidos e o que se preenche e a data. Antes a
        // unidade caia no cronograma so por ter sido cadastrada, sem data, e a
        // lista enchia de linha que ninguem tinha agendado.
        // Abre a janela AQUI. Antes este botao levava para a tela de EPOs, e
        // quem estava olhando o cronograma perdia o cronograma de vista para
        // marcar uma data que e do cronograma.
        '<button class="btn btn-primary btn-sm is-hidden" id="btn-novo-cron" type="button">' +
          '<i class="ti ti-calendar-plus" aria-hidden="true"></i>Novo cronograma</button>' +
        '<button class="btn btn-ghost btn-sm is-hidden" id="btn-nova" type="button">' +
          '<i class="ti ti-plus" aria-hidden="true"></i>Nova EPO</button>' +
        '<button class="btn btn-ghost btn-sm is-hidden" id="btn-imprimir" type="button">' +
          '<i class="ti ti-printer" aria-hidden="true"></i>Imprimir</button>' +
        '<button class="btn btn-ghost btn-sm is-hidden" id="btn-modelo" type="button">' +
          '<i class="ti ti-download" aria-hidden="true"></i>Baixar modelo</button>' +
        '<button class="btn btn-ghost btn-sm is-hidden" id="btn-planilha" type="button">' +
          '<i class="ti ti-table-import" aria-hidden="true"></i>Enviar planilha</button>' +
        '<button class="btn btn-ghost btn-sm is-hidden" id="btn-enviar" type="button">' +
          '<i class="ti ti-send" aria-hidden="true"></i><span id="btn-enviar-txt">Enviar datas</span></button>';

      Layout.mount("cronograma", "Cronograma", acoes);

      document.getElementById("page").innerHTML =
        '<p class="page-intro">Planejamento das visitas do ciclo ' + CICLO +
          ', com a data combinada com a Claro e o que aconteceu de fato.</p>' +
        '<div id="aviso"></div>' +
        '<div class="kpi-grid" id="kpis"></div>' +

        '<div class="card">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Roadmap do ciclo</span>' +
              '<span class="subtitle">A barra de cima e a data planejada. A de baixo aparece quando a visita acontece.</span>' +
            "</div>" +
            '<span id="chips-escala">' +
              '<button type="button" class="chip is-active" data-escala="semana">Semana</button> ' +
              '<button type="button" class="chip" data-escala="mes">Mes</button>' +
            "</span>" +
          "</div>" +
          '<div id="roadmap"></div>' +
          '<div class="gan-legenda" id="legenda"></div>' +
        "</div>" +

        '<div class="cron-duplo" id="duplo"></div>' +

        '<div class="card mb-0">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Todas as unidades</span>' +
              '<span class="subtitle" id="sub-tabela"></span>' +
            "</div>" +
          "</div>" +
          '<div class="cron-toolbar">' +
            '<div class="cron-busca">' +
              '<i class="ti ti-search" aria-hidden="true"></i>' +
              '<input class="input" id="f-busca" type="search" autocomplete="off"' +
                ' placeholder="Filtrar por unidade, codigo ou cidade"' +
                ' aria-label="Filtrar por unidade, codigo ou cidade">' +
            "</div>" +
            '<select class="select" id="f-uf" aria-label="Estado" style="max-width:200px;"></select>' +
            '<select class="select" id="f-situacao" aria-label="Situacao" style="max-width:240px;">' +
              '<option value="">Todas as situacoes</option>' +
              '<option value="sem_data">Sem data definida</option>' +
              '<option value="aguardando_claro">Aguardando a Claro</option>' +
              '<option value="aguardando_apsis">Nao aprovadas pela Claro</option>' +
              '<option value="confirmada">Data aprovada</option>' +
              '<option value="realizada">Realizadas</option>' +
              '<option value="nao_realizada">Nao aconteceram</option>' +
              '<option value="cancelada">Fora deste ciclo</option>' +
            "</select>" +
          "</div>" +
          '<div id="tabela"></div>' +
          '<div class="cron-rodape" id="rodape"></div>' +
        "</div>" +

        '<div class="modal-overlay" id="tk-modal" role="dialog" aria-modal="true" aria-labelledby="tk-titulo">' +
          '<div class="modal modal-largo">' +
            '<div class="modal-header">' +
              '<h2 class="modal-title" id="tk-titulo">Unidade</h2>' +
              '<button class="modal-close" id="tk-fechar" type="button" aria-label="Fechar">' +
                '<i class="ti ti-x" aria-hidden="true"></i></button>' +
            "</div>" +
            '<div class="modal-body" id="tk-corpo"></div>' +
            '<div class="modal-footer" id="tk-rodape"></div>' +
          "</div>" +
        "</div>" +

        '<div class="modal-overlay" id="imp-modal" role="dialog" aria-modal="true" aria-labelledby="imp-titulo">' +
          '<div class="modal modal-largo">' +
            '<div class="modal-header">' +
              '<h2 class="modal-title" id="imp-titulo">Enviar planilha do cronograma</h2>' +
              '<button class="modal-close" id="imp-fechar" type="button" aria-label="Fechar">' +
                '<i class="ti ti-x" aria-hidden="true"></i></button>' +
            "</div>" +
            '<div class="modal-body" id="imp-corpo"></div>' +
            '<div class="modal-footer" id="imp-rodape"></div>' +
          "</div>" +
        "</div>" +
        '<div class="modal-overlay" id="nova-modal" role="dialog" aria-modal="true" aria-labelledby="nova-titulo">' +
          '<div class="modal modal-xl">' +
            '<div class="modal-header">' +
              '<h2 class="modal-title" id="nova-titulo">Nova EPO</h2>' +
              '<button class="modal-close" id="nova-fechar" type="button" aria-label="Fechar">' +
                '<i class="ti ti-x" aria-hidden="true"></i></button>' +
            "</div>" +
            // As perguntas vem de assets/form-epo.js: sao as mesmas que a tela
            // de EPOs faz. Antes cada tela tinha o seu formulario, e a unidade
            // cadastrada la nao entrava no cronograma.
            '<div class="modal-body">' + FormEpo.colunas({ escolha: false }) + "</div>" +
            '<div class="modal-footer">' +
              '<button class="btn btn-ghost" type="button" id="nova-cancelar">Cancelar</button>' +
              '<button class="btn btn-primary" type="button" id="nova-salvar">Cadastrar unidade</button>' +
            "</div>" +
          "</div>" +
        "</div>" +
        '<input type="file" id="imp-arquivo" accept=".xlsx,.xls,.csv" style="display:none;">';

      var $ = function (id) { return document.getElementById(id); };

      // ------------------------------------------------------------------
      // Sem conexao, a tela abre com um cadastro curto e inventado, so para
      // nao ficar em branco. Nenhuma unidade nasce com resposta da Claro:
      // mostrar uma sugestao que ninguem fez faz a tela mentir.
      // ------------------------------------------------------------------
      // Sem conexao a tela abre vazia. Antes havia aqui seis unidades
      // inventadas: numero em tela que nao existe no cadastro engana quem
      // esta conferindo, e foi exatamente o que aconteceu.
      function catalogoSemConexao() { return []; }

      function normalizar(linha) {
        var epo = linha.epos || linha;
        var o = {
          id: linha.id,
          situacao: linha.situacao || "sem_data",
          epoId: epo.id || linha.epoId || linha.id,
          nome: epo.nome || linha.nome || "",
          cod: epo.cod_fornecedor || linha.cod || "",
          base: epo.base || linha.base || "",
          cidade: epo.cidade || linha.cidade || "",
          uf: epo.uf || linha.uf || "",
          // Vao para o modelo da planilha: sem eles, baixar o modelo devolvia as
          // colunas de endereco e de responsavel em branco, e quem preenchesse
          // por cima acabava mandando de volta o que ja estava cadastrado.
          endereco: epo.endereco || linha.endereco || "",
          cep: epo.cep || linha.cep || "",
          responsavelNome: epo.responsavel_nome || "",
          responsavelEmails: epo.responsavel_email || "",
          semana: linha.semana_referencia || linha.semana || "",
          observacao: linha.observacao || "",
          motivo: linha.motivo || "",
          auditoriaId: linha.auditoria_id || null,
          confirmadaEm: linha.confirmada_em || linha.confirmadaEm || null,
          prevIniIso: linha.data_prevista_inicio || linha.prevIniIso || "",
          prevFimIso: linha.data_prevista_fim || linha.prevFimIso || "",
          propIniIso: linha.data_proposta_inicio || linha.propIniIso || "",
          propFimIso: linha.data_proposta_fim || linha.propFimIso || "",
          realIniIso: linha.data_realizada_inicio || linha.realIniIso || "",
          realFimIso: linha.data_realizada_fim || linha.realFimIso || ""
        };
        o.prevIni = dn(o.prevIniIso); o.prevFim = dn(o.prevFimIso);
        o.propIni = dn(o.propIniIso); o.propFim = dn(o.propFimIso);
        o.realIni = dn(o.realIniIso); o.realFim = dn(o.realFimIso);
        return o;
      }

      function atrasada(it) {
        if (it.situacao === "realizada" || it.situacao === "nao_realizada" ||
            it.situacao === "cancelada" || it.situacao === "sem_data") return false;
        var f = it.prevFim != null ? it.prevFim : it.prevIni;
        return f != null && f < hojeN();
      }

      function porId(id) {
        var achado = null;
        itens.forEach(function (x) { if (x.id === id) achado = x; });
        return achado;
      }

      // ------------------------------------------------------------------
      // Papel e leitura
      // ------------------------------------------------------------------
      function aplicarPapel(p) {
        papel = p || "";
        podeMontar = papel === "admin" || papel === "gestor";
        podeAprovar = podeMontar || papel === "cliente";
        podeRegistrar = podeMontar || papel === "auditor";
      }

      function descobrirPapel() {
        if (DEMO) {
          aplicarPapel((window.Auth && Auth.papelDemo && Auth.papelDemo()) || "admin");
          return Promise.resolve();
        }
        if (!(window.Auth && Auth.perfil)) { aplicarPapel(""); return Promise.resolve(); }
        return Auth.perfil().then(function (p) {
          var real = (p && p.papel) || "";
          // "Ver como" existe para a coordenacao conferir a tela pelo angulo
          // de outro perfil. Aqui isso muda os botoes tambem: botao que
          // aparece na conferencia e some no uso real nao serve de nada.
          var comoSe = (Auth.verComo && Auth.verComo()) || "";
          var podeSimular = real === "admin" || real === "gestor";
          aplicarPapel(comoSe && podeSimular ? comoSe : real);
        }).catch(function () { aplicarPapel(""); });
      }

      function carregar() {
        carregando = true; falha = "";
        if (DEMO) {
          itens = catalogoSemConexao();
          carregando = false;
          return Promise.resolve();
        }
        return Auth.cliente.from("cronograma_itens")
          .select("id, ciclo, situacao, data_prevista_inicio, data_prevista_fim, " +
                  "semana_referencia, data_proposta_inicio, data_proposta_fim, " +
                  "data_realizada_inicio, data_realizada_fim, auditoria_id, motivo, " +
                  "observacao, confirmada_em, " +
                  "epos!inner(id, nome, cidade, uf, endereco, cep, cod_fornecedor, base, ativo, " +
                  "responsavel_nome, responsavel_email)")
          .eq("ciclo", CICLO)
          .then(function (r) {
            if (!r || r.error) {
              throw new Error((r && r.error && r.error.message) ||
                              "nao foi possivel ler o cronograma");
            }
            itens = (r.data || []).map(normalizar);
            ordenar();
            carregando = false;
          });
      }

      function ordenar() {
        itens.sort(function (a, b) {
          if (a.uf !== b.uf) return a.uf < b.uf ? -1 : 1;
          if (a.prevIni != null && b.prevIni != null && a.prevIni !== b.prevIni) {
            return a.prevIni - b.prevIni;
          }
          if (a.prevIni == null && b.prevIni != null) return 1;
          if (a.prevIni != null && b.prevIni == null) return -1;
          return a.nome.localeCompare(b.nome, "pt-BR");
        });
      }

      function carregarUltimaImportacao() {
        if (DEMO || !podeMontar) return Promise.resolve();
        return Auth.cliente.from("cronograma_importacoes")
          .select("arquivo, criadas, atualizadas, desativadas, autor_nome, criado_em")
          .order("criado_em", { ascending: false })
          .limit(1)
          .then(function (r) {
            if (!r || r.error) return;      // e so um rodape: nao derruba a tela
            ultimaImportacao = (r.data && r.data[0]) || null;
          })
          .catch(function () {});
      }

      // ------------------------------------------------------------------
      // Filtro
      // ------------------------------------------------------------------
      function visiveis() {
        var busca = filtro.busca.toLowerCase();
        return itens.filter(function (it) {
          if (filtro.uf && it.uf !== filtro.uf) return false;
          if (filtro.situacao && it.situacao !== filtro.situacao) return false;
          if (!busca) return true;
          return (it.nome + " " + it.cod + " " + it.cidade + " " + it.uf)
            .toLowerCase().indexOf(busca) >= 0;
        });
      }

      // A pendencia depende de quem esta olhando: o gerente da Claro responde
      // o que a APSIS mandou, e a APSIS responde o que a Claro sugeriu.
      function ehPendencia(it) {
        if (papel === "cliente") return it.situacao === "aguardando_claro";
        if (papel === "auditor") {
          return it.situacao === "confirmada" && it.prevIni != null && it.prevIni < hojeN();
        }
        return it.situacao === "aguardando_apsis";
      }

      function contarPendencias() {
        var n = 0;
        itens.forEach(function (it) { if (ehPendencia(it)) n += 1; });
        return n;
      }

      // ------------------------------------------------------------------
      // Desenho
      // ------------------------------------------------------------------
      function render() {
        renderAviso();
        renderKpis();
        renderFiltrosSelect();
        renderRoadmap();
        renderLegenda();
        renderTrabalho();
        renderRodape();
        renderBotoes();
      }

      // As duas caixas e a tabela mostram o mesmo dado por angulos diferentes:
      // redesenham sempre juntas, senao uma fica dizendo o contrario da outra.
      function renderTrabalho() {
        renderDuplo();
        renderTabela();
      }

      // ================================================================
      // As duas caixas: a esquerda espera a Claro, a direita voltou dela
      // ================================================================
      function caixaItem(it, botoes) {
        var fim = it.prevFim != null ? it.prevFim : it.prevIni;
        return '<div class="cx-item">' +
          '<div class="cx-corpo">' +
            "<b>" + esc(it.nome) + "</b>" +
            "<span>" + (it.cod ? "Cod. " + esc(it.cod) + " - " : "") +
              esc(it.cidade) + (it.uf ? "/" + esc(it.uf) : "") + "</span>" +
            '<span class="cx-data"><i class="ti ti-calendar-event" aria-hidden="true"></i>' +
              esc(periodo(it.prevIni, fim)) + "</span>" +
            (it.situacao === "aguardando_apsis" && it.propIni != null
              ? '<span class="cx-data cx-sugerida">' +
                '<i class="ti ti-calendar-repeat" aria-hidden="true"></i>Claro sugeriu ' +
                esc(periodo(it.propIni, it.propFim != null ? it.propFim : it.propIni)) + "</span>"
              : "") +
            (it.observacao ? '<span style="margin-top:4px;">' + esc(it.observacao) + "</span>" : "") +
          "</div>" +
          (botoes ? '<div class="cx-acoes">' + botoes + "</div>" : "") +
        "</div>";
      }

      function formaNaCaixa(it) {
        var hoje = paraIso(hojeN());
        var minMarcar = minMarcacao();
        return '<div class="cx-forma">' +
          "<label>Que data serve melhor para " + esc(it.nome) + "?</label>" +
          '<input class="input" type="date" id="cx-ini" value="' + esc(it.prevIniIso) +
            '" min="' + minMarcar + '" max="2035-12-31">' +
          '<input class="input" type="date" id="cx-fim" value="" min="' + minMarcar +
            '" max="2035-12-31" title="Ate (opcional)">' +
          '<input class="input" id="cx-msg" type="text" placeholder="Motivo (opcional)">' +
          '<div class="cx-forma-btn">' +
            '<button class="btn btn-sm btn-ghost" type="button" data-cx="cancelar">Cancelar</button>' +
            '<button class="btn btn-sm btn-primary" type="button" data-cx="enviar-sugestao"' +
              ' data-id="' + esc(it.id) + '">Enviar sugestao</button>' +
          "</div>" +
        "</div>";
      }

      function renderDuplo() {
        var alvo = $("duplo");
        if (carregando || falha || !itens.length) { alvo.innerHTML = ""; return; }

        var esperando = itens.filter(function (it) { return it.situacao === "aguardando_claro"; });
        var recusadas = itens.filter(function (it) { return it.situacao === "aguardando_apsis"; });

        // Nenhuma das duas pontas tem pendencia: as caixas nao aparecem, para
        // nao ocupar a tela com dois quadros vazios.
        if (!esperando.length && !recusadas.length) { alvo.innerHTML = ""; return; }

        var editaCaixa = editando && editando.onde === "caixa" ? editando.id : null;

        var corpoEsq = esperando.length
          ? esperando.map(function (it) {
              if (editaCaixa === it.id) return formaNaCaixa(it);
              var b = "";
              if (papel === "cliente") {
                b = '<button class="btn btn-sm btn-primary" type="button" data-cx="aprovar"' +
                    ' data-id="' + esc(it.id) + '">' +
                    '<i class="ti ti-check" aria-hidden="true"></i>Aprovar</button>' +
                    '<button class="btn btn-sm btn-ghost" type="button" data-cx="desaprovar"' +
                    ' data-id="' + esc(it.id) + '">' +
                    '<i class="ti ti-calendar-x" aria-hidden="true"></i>Desaprovar</button>';
              }
              return caixaItem(it, b);
            }).join("")
          : '<div class="empty" style="padding:22px 14px;"><p>Nada aqui.</p></div>';

        var corpoDir = recusadas.length
          ? recusadas.map(function (it) {
              var b = "";
              if (podeMontar) {
                b = '<button class="btn btn-sm btn-primary" type="button" data-cx="aceitar"' +
                    ' data-id="' + esc(it.id) + '">' +
                    '<i class="ti ti-check" aria-hidden="true"></i>Aceitar</button>' +
                    '<button class="btn btn-sm btn-ghost" type="button" data-cx="manter"' +
                    ' data-id="' + esc(it.id) + '">' +
                    '<i class="ti ti-send" aria-hidden="true"></i>Manter a data</button>';
              }
              return caixaItem(it, b);
            }).join("")
          : '<div class="empty" style="padding:22px 14px;"><p>Nada aqui.</p></div>';

        alvo.innerHTML =
          '<div class="card">' +
            '<div class="card-header"><div class="section-title">' +
              '<span class="title">Esperando para aprovação</span>' +
            "</div>" +
            '<span class="acc-count cx-conta">' + esperando.length + "</span></div>" +
            '<div class="cx-lista">' + corpoEsq + "</div>" +
          "</div>" +
          '<div class="card">' +
            // Cabecalho destacado: e a caixa que pede acao da APSIS, e a cor
            // da marca chama a atencao para o que esta parado aqui.
            '<div class="card-header cx-recusadas"><div class="section-title">' +
              '<span class="title">Não aprovados pela Claro</span>' +
            "</div>" +
            '<span class="acc-count cx-conta">' + recusadas.length + "</span></div>" +
            '<div class="cx-lista">' + corpoDir + "</div>" +
          "</div>";
      }

      function renderAviso() {
        var alvo = $("aviso");
        if (carregando || falha) { alvo.innerHTML = ""; return; }
        var n = contarPendencias();
        if (!n) { alvo.innerHTML = ""; return; }

        var titulo, texto;
        if (papel === "cliente") {
          titulo = n === 1 ? "1 data esperando sua aprovacao"
                           : n + " datas esperando sua aprovacao";
          texto = n === 1
            ? "A APSIS propos uma data. Na tabela abaixo voce aprova ou sugere outra."
            : "A APSIS propos data para estas unidades. Na tabela abaixo voce aprova " +
              "ou sugere outra em cada uma.";
        } else if (papel === "auditor") {
          titulo = n === 1 ? "1 visita para registrar" : n + " visitas para registrar";
          texto = "A data ja passou e ainda nao ha registro do que aconteceu.";
        } else {
          titulo = n === 1 ? "A Claro nao aprovou 1 data"
                           : "A Claro nao aprovou " + n + " datas";
          texto = "A sugestao dela aparece na coluna Aprovacao Claro. Voce pode aceitar " +
                  "a data sugerida ou manter a sua e reenviar.";
        }

        alvo.innerHTML =
          '<div class="tk-aviso" style="margin-bottom:16px;">' +
            '<i class="ti ti-bell-ringing tk-ico" aria-hidden="true"></i>' +
            '<div class="tk-aviso-corpo">' +
              "<b>" + esc(titulo) + "</b><p>" + esc(texto) + "</p>" +
            "</div>" +
            '<button class="btn btn-sm btn-primary" type="button" id="aviso-ir">' +
              (n === 1 ? "Ver" : "Ver as " + n) + "</button>" +
          "</div>";

        $("aviso-ir").addEventListener("click", function () {
          filtro.situacao = papel === "cliente" ? "aguardando_claro"
                          : papel === "auditor" ? "confirmada" : "aguardando_apsis";
          $("f-situacao").value = filtro.situacao;
          renderTabela();
          var t = $("tabela");
          if (t && t.scrollIntoView) t.scrollIntoView({ behavior: "smooth", block: "center" });
        });
      }

      function renderKpis() {
        if (carregando || falha) { $("kpis").innerHTML = ""; return; }
        var c = { total: 0, confirmada: 0, claro: 0, apsis: 0, realizada: 0, atraso: 0 };
        itens.forEach(function (it) {
          if (it.situacao === "cancelada") return;
          c.total += 1;
          if (it.situacao === "confirmada") c.confirmada += 1;
          if (it.situacao === "aguardando_claro") c.claro += 1;
          if (it.situacao === "aguardando_apsis") c.apsis += 1;
          if (it.situacao === "realizada") c.realizada += 1;
          if (atrasada(it)) c.atraso += 1;
        });

        var cartoes = [
          { f: "", ico: "ti-building-warehouse", rot: "Unidades no ciclo", v: c.total, extra: "" },
          { f: "confirmada", ico: "ti-calendar-check", rot: "Datas aprovadas", v: c.confirmada,
            extra: c.atraso ? '<span class="kpi-delta delta-down">' +
              '<i class="ti ti-alert-triangle" aria-hidden="true"></i>' +
              c.atraso + " fora do prazo</span>" : "" },
          { f: "aguardando_claro", ico: "ti-clock-hour-4", rot: "Aguardando a Claro", v: c.claro, extra: "" },
          { f: "aguardando_apsis", ico: "ti-arrow-back-up", rot: "Nao aprovadas", v: c.apsis, extra: "" },
          { f: "realizada", ico: "ti-circle-check", rot: "Realizadas", v: c.realizada, extra: "" }
        ];

        $("kpis").innerHTML = cartoes.map(function (k) {
          return '<button class="kpi" type="button" data-filtro="' + k.f + '" ' +
                 'style="text-align:left;font-family:inherit;cursor:pointer;">' +
            '<div class="kpi-top">' +
              '<span class="kpi-icon"><i class="ti ' + k.ico + '" aria-hidden="true"></i></span>' +
              '<span class="kpi-label">' + esc(k.rot) + "</span>" +
            "</div>" +
            '<div class="kpi-value tnum">' + k.v + "</div>" + k.extra +
          "</button>";
        }).join("");

        Array.prototype.forEach.call($("kpis").querySelectorAll("[data-filtro]"), function (b) {
          b.addEventListener("click", function () {
            filtro.situacao = b.getAttribute("data-filtro");
            $("f-situacao").value = filtro.situacao;
            renderTabela();
          });
        });
      }

      function renderFiltrosSelect() {
        var sel = $("f-uf");
        if (sel.getAttribute("data-pronto") === "1") return;
        var conta = {};
        itens.forEach(function (it) {
          var r = it.uf || "Sem estado";
          conta[r] = (conta[r] || 0) + 1;
        });
        var chaves = Object.keys(conta).sort();
        sel.innerHTML = '<option value="">Todas as regionais</option>' +
          chaves.map(function (r) {
            return '<option value="' + esc(r) + '">' + esc(r) + " (" + conta[r] + ")</option>";
          }).join("");
        sel.setAttribute("data-pronto", "1");
      }

      function agruparPorRegional(lista) {
        var ordem = [], mapa = {};
        lista.forEach(function (it) {
          var r = it.uf || "Sem estado";
          if (!mapa[r]) { mapa[r] = { reg: r, itens: [], realizadas: 0 }; ordem.push(r); }
          mapa[r].itens.push(it);
          if (it.situacao === "realizada") mapa[r].realizadas += 1;
        });
        ordem.sort();
        return ordem.map(function (r) { return mapa[r]; });
      }

      // ================================================================
      // ROADMAP
      // ================================================================
      // O intervalo cobre todas as datas, sempre inclui hoje, comeca numa
      // segunda e termina num domingo: o total de dias e multiplo de sete e
      // a grade de semanas fecha sem sobra.
      function dominio(lista) {
        var campos = ["prevIni", "prevFim", "propIni", "propFim", "realIni", "realFim"];
        var min = null, max = null, i, k, v;
        for (i = 0; i < lista.length; i++) {
          for (k = 0; k < campos.length; k++) {
            v = lista[i][campos[k]];
            if (v == null) continue;
            if (min === null || v < min) min = v;
            if (max === null || v > max) max = v;
          }
        }
        var h = hojeN();
        if (min === null) { min = h; max = h; }
        if (h < min) min = h;
        if (h > max) max = h;
        var ini = segunda(min) - 7;
        var fim = segunda(max) + 13;
        var semanas = Math.round((fim - ini + 1) / 7);
        if (semanas < 8) { semanas = 8; fim = ini + semanas * 7 - 1; }
        return { ini: ini, fim: fim, dias: fim - ini + 1, semanas: semanas };
      }

      function pctEsq(d, n)     { return (n - d.ini) / d.dias * 100; }
      function pctLarg(d, a, b) { return (b - a + 1) / d.dias * 100; }

      function htmlGrade(d) {
        var out = "", n;
        for (n = d.ini; n <= d.fim; n += 7) {
          out += '<span class="gan-col" style="left:' + pctEsq(d, n).toFixed(4) + '%"></span>';
        }
        var h = hojeN();
        if (h >= d.ini && h <= d.fim) {
          out += '<span class="gan-hoje" style="left:' + pctEsq(d, h).toFixed(4) + '%"></span>';
        }
        return '<div class="gan-grade" aria-hidden="true">' + out + "</div>";
      }

      function htmlCabecalho(d) {
        var out = "", n = d.ini, dt, ano, mes, ultimo, f;
        while (n <= d.fim) {
          dt = new Date(n * MS);
          ano = dt.getUTCFullYear(); mes = dt.getUTCMonth();
          ultimo = Math.floor(Date.UTC(ano, mes + 1, 0) / MS);
          f = ultimo < d.fim ? ultimo : d.fim;
          out += '<span class="gan-mes" style="left:' + pctEsq(d, n).toFixed(4) +
                 "%;width:" + pctLarg(d, n, f).toFixed(4) + '%">' +
                 MESES[mes] + " " + ano + "</span>";
          n = f + 1;
        }
        for (n = d.ini; n <= d.fim; n += 7) {
          dt = new Date(n * MS);
          out += '<span class="gan-sem-cel" style="left:' + pctEsq(d, n).toFixed(4) + '%">' +
                 dt.getUTCDate() + "/" + (dt.getUTCMonth() + 1) + "</span>";
        }
        return '<div class="gan-cab">' +
                 '<div class="gan-rot">Unidade</div>' +
                 '<div class="gan-cab-faixa">' + out + "</div>" +
               "</div>";
      }

      // Uma visita de um ou dois dias, desenhada dia a dia num ciclo de meses,
      // sai com quatro pixels: viraria um ponto, nao um bloco. Por isso cada
      // bloco cobre a SEMANA inteira da visita, encaixado na grade. Fica um
      // retangulo cheio, na cor da legenda, e o dia exato continua na tabela
      // logo abaixo e no texto que aparece ao passar o mouse.
      function blocoDaSemana(d, ini, fim) {
        var a = segunda(ini);
        var b = segunda(fim != null ? fim : ini) + 6;
        if (a < d.ini) a = d.ini;
        if (b > d.fim) b = d.fim;
        return { esq: pctEsq(d, a), larg: pctLarg(d, a, b) };
      }

      function htmlBarras(d, it) {
        var h = "", fim, tarde, fora, bl, txt;

        if (it.prevIni != null) {
          fim = it.prevFim != null ? it.prevFim : it.prevIni;
          tarde = atrasada(it);
          bl = blocoDaSemana(d, it.prevIni, fim);
          txt = it.nome + ", " + ROTULO[it.situacao] + ", " + periodo(it.prevIni, fim) +
                (tarde ? ", fora do prazo" : "");
          h += '<button type="button" class="gan-barra gan-prev s-' + esc(it.situacao) +
               (tarde ? " is-atrasada" : "") + '" data-item="' + esc(it.id) + '"' +
               ' style="left:' + bl.esq.toFixed(4) + "%;width:" + bl.larg.toFixed(4) + '%"' +
               ' title="' + esc(txt) + '" aria-label="' + esc(txt) + '">' +
               (tarde ? '<i class="ti ti-alert-triangle" aria-hidden="true"></i>' : "") +
               "</button>";
        }

        if (it.situacao === "aguardando_apsis" && it.propIni != null) {
          fim = it.propFim != null ? it.propFim : it.propIni;
          bl = blocoDaSemana(d, it.propIni, fim);
          txt = "Claro sugeriu " + periodo(it.propIni, fim);
          h += '<button type="button" class="gan-barra gan-prop" data-item="' + esc(it.id) + '"' +
               ' style="left:' + bl.esq.toFixed(4) + "%;width:" + bl.larg.toFixed(4) + '%"' +
               ' title="' + esc(txt) + '" aria-label="' + esc(txt) + '"></button>';
        }

        if (it.realIni != null) {
          fim = it.realFim != null ? it.realFim : it.realIni;
          fora = it.prevIni != null &&
            (it.realIni < it.prevIni ||
             it.realIni > (it.prevFim != null ? it.prevFim : it.prevIni));
          bl = blocoDaSemana(d, it.realIni, fim);
          txt = "Realizada em " + periodo(it.realIni, fim) +
                (fora ? ", fora da data combinada" : "");
          h += '<button type="button" class="gan-barra gan-real' + (fora ? " fora-da-data" : "") +
               '" data-item="' + esc(it.id) + '"' +
               ' style="left:' + bl.esq.toFixed(4) + "%;width:" + bl.larg.toFixed(4) + '%"' +
               ' title="' + esc(txt) + '" aria-label="' + esc(txt) + '">' +
               '<i class="ti ti-check" aria-hidden="true"></i></button>';
        }

        if (!h) {
          h = '<span class="gan-semdata">' +
              esc(it.semana ? it.semana + ", data a combinar" : "data a combinar") + "</span>";
        }
        return h;
      }

      function rotuloDaLinha(it) {
        if (it.realIni != null) {
          return "feita " + periodo(it.realIni, it.realFim != null ? it.realFim : it.realIni);
        }
        if (it.situacao === "nao_realizada") return "nao aconteceu";
        var base = periodo(it.prevIni, it.prevFim != null ? it.prevFim : it.prevIni);
        if (it.situacao === "aguardando_apsis" && it.propIni != null) {
          return base + ", Claro sugeriu " +
            periodo(it.propIni, it.propFim != null ? it.propFim : it.propIni);
        }
        if (it.situacao === "aguardando_claro") return base + ", aguardando a Claro";
        return base;
      }

      function htmlLinha(d, it) {
        return '<div class="gan-linha" data-item="' + esc(it.id) + '">' +
          '<div class="gan-rot" title="' + esc(it.nome) + '">' +
            "<b>" + esc(it.nome) + "</b>" +
            "<span>" + (it.cod ? "Cod. " + esc(it.cod) + ", " : "") + esc(it.cidade) +
            (atrasada(it) ? ' <span class="atraso">fora do prazo</span>' : "") +
            "</span>" +
          "</div>" +
          '<div class="gan-faixa">' + htmlBarras(d, it) + "</div>" +
        "</div>";
      }

      function renderRoadmap() {
        var alvo = $("roadmap");

        if (carregando) {
          alvo.innerHTML = '<div class="empty"><p>Carregando o cronograma...</p></div>';
          return;
        }
        if (falha) {
          alvo.innerHTML = '<div class="empty">' +
            '<i class="ti ti-alert-circle" aria-hidden="true"></i>' +
            "<p>" + esc(falha) + "</p></div>";
          return;
        }
        if (!itens.length) {
          alvo.innerHTML = '<div class="empty">' +
            '<i class="ti ti-calendar-off" aria-hidden="true"></i>' +
            "<p>Nenhuma unidade no cronograma ainda." +
            (podeMontar ? " Baixe o modelo, preencha e envie a planilha." : "") + "</p></div>";
          return;
        }

        // O roadmap mostra o ciclo inteiro, sem o filtro da tabela: e o
        // desenho geral. Quem quer recortar usa a tabela logo abaixo.
        var lista = itens.filter(function (it) { return it.situacao !== "cancelada"; });
        var d = dominio(lista);
        var corpo = "";

        agruparPorRegional(lista).forEach(function (g) {
          var aberto = !grupoFechado[g.reg];
          corpo +=
            '<div class="gan-grupo"><div class="gan-rot">' +
              '<button type="button" class="gan-grupo-btn" data-grupo="' + esc(g.reg) + '"' +
                ' aria-expanded="' + (aberto ? "true" : "false") + '">' +
                '<i class="ti ti-chevron-down" aria-hidden="true"></i>' + esc(g.reg) +
                ", " + g.itens.length + (g.itens.length === 1 ? " unidade" : " unidades") +
                ", " + g.realizadas + " realizadas</button>" +
            "</div>" +
            '<div class="gan-faixa"></div></div>' +
            '<div data-bloco="' + esc(g.reg) + '"' + (aberto ? "" : ' style="display:none;"') + '>' +
              g.itens.map(function (it) { return htmlLinha(d, it); }).join("") +
            "</div>";
        });

        alvo.innerHTML =
          '<div class="gan ' + (escala === "mes" ? "esc-mes" : "esc-semana") + '" id="gan">' +
            '<div class="gan-scroll" id="gan-scroll" tabindex="0" role="region"' +
              ' aria-label="Roadmap do ciclo, planejado e realizado">' +
              '<div class="gan-canvas" style="--gan-sems:' + d.semanas + '">' +
                htmlCabecalho(d) +
                '<div class="gan-corpo">' + htmlGrade(d) + corpo + "</div>" +
              "</div>" +
            "</div>" +
          "</div>";

        var sc = $("gan-scroll");
        var rot = sc.querySelector(".gan-rot");
        var largRot = rot ? rot.offsetWidth : 236;
        var alvoX = (pctEsq(d, hojeN() - 10) / 100) * (sc.scrollWidth - largRot);
        sc.scrollLeft = alvoX > 0 ? alvoX : 0;
      }

      function renderLegenda() {
        if (carregando || falha || !itens.length) { $("legenda").innerHTML = ""; return; }
        var lista = [
          { c: "aguardando", t: "Aguardando a Claro" },
          { c: "sugerida",   t: "Data sugerida pela Claro" },
          { c: "confirmada", t: "Data aprovada" },
          { c: "realizada",  t: "Realizada" },
          { c: "fora",       t: "Realizada fora da data" },
          { c: "atrasada",   t: "Fora do prazo" }
        ];
        $("legenda").innerHTML = lista.map(function (l) {
          return '<span><i class="gan-amostra ' + l.c + '" aria-hidden="true"></i>' +
                 esc(l.t) + "</span>";
        }).join("") +
        '<span><i class="ti ti-line-dashed" aria-hidden="true" style="color:var(--warning);"></i>' +
        "A linha laranja marca hoje</span>" +
        '<span class="gan-nota">Cada bloco cobre a semana da visita. A data exata ' +
        "esta na tabela abaixo e aparece ao passar o mouse.</span>";
      }

      // ================================================================
      // TABELA: e aqui que a data e combinada, aprovada e corrigida
      // ================================================================
      function renderTabela() {
        var alvo = $("tabela");

        if (carregando) {
          alvo.innerHTML = '<div class="empty"><p>Carregando...</p></div>';
          $("sub-tabela").textContent = "";
          return;
        }
        if (falha || !itens.length) { alvo.innerHTML = ""; return; }

        $("sub-tabela").textContent = podeMontar
          ? "Ajuste a data direto na linha. A Claro aprova ou sugere outra por aqui."
          : (papel === "cliente"
              ? "Aprove a data ou sugira outra em cada unidade."
              : "Datas combinadas com a Claro e o que ja foi registrado.");

        var lista = visiveis();
        if (!lista.length) {
          alvo.innerHTML = '<div class="empty">' +
            '<i class="ti ti-filter-off" aria-hidden="true"></i>' +
            "<p>Nenhuma unidade com esses filtros.</p></div>";
          return;
        }

        alvo.innerHTML =
          '<div class="table-wrap"><table class="table cron-tabela">' +
            "<thead><tr>" +
              "<th>Unidade</th>" +
              "<th>Cidade / UF</th>" +
              "<th>Data prevista</th>" +
              "<th>Aprovacao Claro</th>" +
              "<th>Realizado</th>" +
              '<th class="num">Acoes</th>' +
            "</tr></thead><tbody>" +
            lista.map(linhaTabela).join("") +
          "</tbody></table></div>";

        if (editando && editando.modo === "registrar") ligarRadioRegistro();
      }

      function linhaTabela(it) {
        return '<tr data-linha="' + esc(it.id) + '">' +
          '<td><div class="epo-nome-cel"><b>' + esc(it.nome) + "</b>" +
            (it.cod ? "<span>Cod. " + esc(it.cod) +
              (it.base ? " / " + esc(it.base) : "") + "</span>" : "") + "</div></td>" +
          "<td>" + esc(it.cidade) + (it.uf ? " / " + esc(it.uf) : "") +
"</td>" +
          "<td>" + celulaPrevista(it) + "</td>" +
          "<td>" + celulaAprovacao(it) + "</td>" +
          "<td>" + celulaRealizado(it) + "</td>" +
          '<td class="num">' + celulaAcoes(it) + "</td>" +
        "</tr>";
      }

      // A coordenacao muda a data direto na linha: e o movimento mais comum
      // do ciclo e nao vale abrir modal para cada ajuste.
      function celulaPrevista(it) {
        var editavel = podeMontar && it.situacao !== "realizada" &&
                       it.situacao !== "nao_realizada" && it.situacao !== "cancelada";
        if (!editavel) {
          if (it.prevIni == null) {
            return '<span class="muted">' + esc(it.semana || "a combinar") + "</span>";
          }
          return esc(periodo(it.prevIni, it.prevFim != null ? it.prevFim : it.prevIni)) +
            (atrasada(it) ? '<br><span class="tag" style="color:var(--danger);">fora do prazo</span>' : "");
        }
        return '<div class="cel-data">' +
          '<input class="input input-data" type="date" data-campo="ini" data-id="' + esc(it.id) + '"' +
            ' value="' + esc(it.prevIniIso) + '" min="' + minMarcacao() + '" max="2035-12-31"' +
            ' aria-label="Data prevista de ' + esc(it.nome) + '">' +
          '<input class="input input-data" type="date" data-campo="fim" data-id="' + esc(it.id) + '"' +
            ' value="' + esc(it.prevFimIso) + '" min="' + minMarcacao() + '" max="2035-12-31"' +
            ' aria-label="Data final prevista de ' + esc(it.nome) + '" title="Ate (opcional)">' +
          "<small>ate (opcional)</small>" +
          "</div>" +
          (atrasada(it) ? '<span class="tag" style="color:var(--danger);">fora do prazo</span>' : "") +
          (it.semana && it.prevIni == null
            ? '<span class="muted" style="font-size:11.5px;">' + esc(it.semana) + "</span>" : "");
      }

      // A coluna que o gerente da Claro olha primeiro. Quando ele nao aprova,
      // a data que ele sugeriu fica escrita aqui, e todo mundo ve a mesma.
      function celulaAprovacao(it) {
        if (it.situacao === "cancelada") {
          return '<span class="badge badge-baixa">Fora deste ciclo</span>';
        }
        if (it.prevIni == null) return '<span class="muted">sem data para aprovar</span>';

        if (it.situacao === "aguardando_claro") {
          return '<span class="badge badge-media">Aguardando</span>';
        }
        if (it.situacao === "aguardando_apsis") {
          return '<span class="badge badge-alta">Nao aprovada</span>' +
            '<div class="cel-sugerida"><i class="ti ti-calendar-repeat" aria-hidden="true"></i>' +
            "Claro sugeriu <b>" +
            esc(periodo(it.propIni, it.propFim != null ? it.propFim : it.propIni)) +
            "</b></div>" +
            (it.observacao ? '<span class="muted" style="font-size:11.5px;">' +
              esc(it.observacao) + "</span>" : "");
        }
        if (it.situacao === "confirmada" || it.situacao === "realizada" ||
            it.situacao === "nao_realizada") {
          return '<span class="badge badge-success">Aprovada</span>' +
            (it.confirmadaEm ? '<span class="muted" style="font-size:11.5px;display:block;">' +
              esc(fmtDataHora(it.confirmadaEm)) + "</span>" : "");
        }
        return '<span class="muted">nao enviada</span>';
      }

      function celulaRealizado(it) {
        if (it.realIni != null) {
          return '<span style="color:var(--success);font-weight:600;">' +
            esc(periodo(it.realIni, it.realFim != null ? it.realFim : it.realIni)) + "</span>";
        }
        if (it.situacao === "nao_realizada") {
          return '<span style="color:var(--danger);">nao aconteceu</span>' +
                 (it.motivo ? '<span class="muted" style="font-size:11.5px;display:block;">' +
                   esc(it.motivo) + "</span>" : "");
        }
        return '<span class="muted">-</span>';
      }

      function botao(acao, id, rotulo, classe, icone, titulo) {
        // Botao so com icone precisa de nome mesmo assim: quem usa leitor de
        // tela ouviria "botao" e nada mais.
        var nome = rotulo || titulo || "";
        return '<button class="btn btn-sm ' + classe + '" type="button" data-acao="' + acao +
          '" data-id="' + esc(id) + '"' +
          (rotulo ? "" : ' aria-label="' + esc(nome) + '" title="' + esc(nome) + '"') + ">" +
          (icone ? '<i class="ti ' + icone + '" aria-hidden="true"></i>' : "") +
          esc(rotulo) + "</button>";
      }

      function celulaAcoes(it) {
        if (editando && editando.id === it.id && editando.onde !== "caixa") {
          return formularioNaLinha(it);
        }

        var b = [];

        // ---- gerente da Claro: aprova ou nao aprova, na propria linha
        if (papel === "cliente") {
          if (it.situacao === "aguardando_claro") {
            b.push(botao("aprovar", it.id, "Aprovar", "btn-primary", "ti-check"));
            b.push(botao("sugerir", it.id, "Desaprovar", "btn-ghost", "ti-calendar-x"));
          } else if (it.situacao === "confirmada") {
            b.push(botao("sugerir", it.id, "Pedir outra data", "btn-ghost", "ti-calendar-repeat"));
          }
        }

        // ---- coordenacao APSIS
        if (podeMontar) {
          if (it.situacao === "sem_data" && it.prevIni != null) {
            b.push(botao("enviar1", it.id, "Enviar", "btn-primary", "ti-send"));
          }
          if (it.situacao === "aguardando_apsis") {
            b.push(botao("aceitar", it.id, "Aceitar", "btn-primary", "ti-check"));
            b.push(botao("reenviar", it.id, "Manter a data", "btn-ghost", "ti-send"));
          }
          if (it.situacao === "aguardando_claro") {
            b.push(botao("aprovar", it.id, "Aprovar", "btn-ghost", "ti-check"));
          }
        }

        // ---- registro do que aconteceu
        if (podeRegistrar &&
            (it.situacao === "confirmada" || it.situacao === "realizada" ||
             it.situacao === "nao_realizada")) {
          b.push(botao("registrar", it.id,
            it.situacao === "confirmada" ? "Registrar" : "Corrigir",
            it.situacao === "confirmada" ? "btn-primary" : "btn-ghost", "ti-clipboard-check"));
        }

        b.push(botao("detalhe", it.id, "", "btn-ghost btn-icon", "ti-history", "Ver o historico desta unidade"));
        return '<span class="cel-acoes">' + b.join("") + "</span>";
      }

      // Desaprovar pede a data nova ali mesmo: mandar o gerente para um modal
      // so para digitar um dia atrapalha quem tem 25 linhas para responder.
      function formularioNaLinha(it) {
        var hoje = paraIso(hojeN());
        var minMarcar = minMarcacao();
        if (editando.modo === "sugerir") {
          return '<div class="cel-form">' +
            "<label>Que data serve melhor?</label>" +
            '<input class="input input-data" type="date" id="ed-ini" value="' +
              esc(it.prevIniIso) + '" min="' + minMarcar + '" max="2035-12-31">' +
            '<input class="input input-data" type="date" id="ed-fim" value=""' +
              ' min="' + minMarcar + '" max="2035-12-31" title="Ate (opcional)">' +
            '<input class="input" id="ed-msg" type="text" placeholder="Motivo (opcional)">' +
            '<div class="cel-form-btn">' +
              '<button class="btn btn-sm btn-ghost" type="button" data-acao="cancelar-edicao"' +
                ' data-id="' + esc(it.id) + '">Cancelar</button>' +
              '<button class="btn btn-sm btn-primary" type="button" data-acao="confirmar-sugestao"' +
                ' data-id="' + esc(it.id) + '">Enviar sugestao</button>' +
            "</div>" +
          "</div>";
        }
        if (editando.modo === "registrar") {
          return '<div class="cel-form">' +
            '<div class="radio-group" role="radiogroup" aria-label="O que aconteceu">' +
              '<input type="radio" name="ed-oq" id="ed-sim" value="sim"' +
                (it.situacao !== "nao_realizada" ? " checked" : "") + ">" +
              '<label for="ed-sim">Aconteceu</label>' +
              '<input type="radio" name="ed-oq" id="ed-nao" value="nao"' +
                (it.situacao === "nao_realizada" ? " checked" : "") + ">" +
              '<label for="ed-nao">Nao aconteceu</label>' +
            "</div>" +
            '<div id="ed-bloco-sim">' +
              '<input class="input input-data" type="date" id="ed-rini" value="' +
                esc(it.realIniIso || it.prevIniIso) + '" min="2020-01-01" max="' + hoje +
                '" aria-label="Data em que aconteceu">' +
              '<input class="input input-data" type="date" id="ed-rfim" value="' +
                esc(it.realFimIso) + '" min="2020-01-01" max="' + hoje +
                '" title="Ate (opcional)">' +
            "</div>" +
            '<div id="ed-bloco-nao" style="display:none;">' +
              '<input class="input" id="ed-motivo" type="text" placeholder="Por que nao aconteceu"' +
                ' value="' + esc(it.motivo || "") + '">' +
            "</div>" +
            '<div class="cel-form-btn">' +
              '<button class="btn btn-sm btn-ghost" type="button" data-acao="cancelar-edicao"' +
                ' data-id="' + esc(it.id) + '">Cancelar</button>' +
              '<button class="btn btn-sm btn-primary" type="button" data-acao="confirmar-registro"' +
                ' data-id="' + esc(it.id) + '">Salvar</button>' +
            "</div>" +
          "</div>";
        }
        return "";
      }

      function renderRodape() {
        if (carregando || falha) { $("rodape").innerHTML = ""; return; }
        var ativos = itens.filter(function (it) { return it.situacao !== "cancelada"; });
        var feitas = ativos.filter(function (it) { return it.situacao === "realizada"; });
        var noPrazo = feitas.filter(function (it) {
          if (it.prevIni == null || it.realIni == null) return false;
          return it.realIni >= it.prevIni &&
                 it.realIni <= (it.prevFim != null ? it.prevFim : it.prevIni);
        });
        var txt = ativos.length + (ativos.length === 1 ? " unidade" : " unidades") +
                  " no ciclo " + CICLO + ", " + feitas.length + " realizadas";
        if (feitas.length) {
          txt += ", " + Math.round(noPrazo.length / feitas.length * 100) +
                 "% dentro da data combinada";
        }
        txt += ".";
        if (ultimaImportacao) {
          txt += " Ultima planilha enviada em " + fmtDataHora(ultimaImportacao.criado_em) +
                 (ultimaImportacao.autor_nome ? " por " + ultimaImportacao.autor_nome : "") +
                 ": " + ultimaImportacao.criadas + " novas, " +
                 ultimaImportacao.atualizadas + " atualizadas.";
        }
        $("rodape").textContent = txt;
      }

      function renderBotoes() {
        $("btn-nova").classList.toggle("is-hidden", !podeMontar);
        $("btn-novo-cron").classList.toggle("is-hidden", !podeMontar);
        // Imprimir e leitura: quem ve a tela pode levar o cronograma no papel.
        $("btn-imprimir").classList.remove("is-hidden");
        $("btn-modelo").classList.toggle("is-hidden", !podeMontar);
        $("btn-planilha").classList.toggle("is-hidden", !podeMontar);

        var prontas = itens.filter(function (it) {
          return it.situacao === "sem_data" && it.prevIni != null;
        });
        var mostra = podeMontar && prontas.length > 0;
        $("btn-enviar").classList.toggle("is-hidden", !mostra);
        if (mostra) {
          $("btn-enviar-txt").textContent = "Enviar " + prontas.length +
            (prontas.length === 1 ? " data para aprovacao" : " datas para aprovacao");
        }
      }

      // ================================================================
      // Acoes. Toda escrita passa por funcao no servidor: a tela nao tem
      // permissao de gravar direto, e uma tentativa voltaria vazia sem erro.
      // ================================================================
      function rodar(funcao, args, botaoEl) {
        if (DEMO) {
          App.toast("Sem conexao com os dados agora: nada foi gravado.");
          return Promise.resolve(false);
        }
        if (botaoEl) botaoEl.disabled = true;
        return Auth.cliente.rpc(funcao, args).then(function (r) {
          if (!r || r.error) {
            // A mensagem do servidor ja vem em portugues e sem termo de
            // bastidor: e ela que a pessoa precisa ler.
            throw new Error((r && r.error && r.error.message) || "");
          }
          var linha = r.data;
          if (linha && linha.id) {
            var antigo = porId(linha.id);
            if (antigo) {
              var novo = normalizar(juntarEpo(linha, antigo));
              for (var i = 0; i < itens.length; i++) {
                if (itens[i].id === novo.id) { itens[i] = novo; break; }
              }
            }
          }
          editando = null;
          render();
          return true;
        }).catch(function (e) {
          if (botaoEl) botaoEl.disabled = false;
          App.toast(e && e.message ? e.message
                                   : "Nao foi possivel salvar agora. Tente novamente.");
          return false;
        });
      }

      // A funcao devolve so a linha do cronograma; os dados da unidade
      // continuam sendo os que a tela ja tinha.
      function juntarEpo(linha, antigo) {
        var copia = {};
        Object.keys(linha).forEach(function (k) { copia[k] = linha[k]; });
        copia.epos = {
          id: antigo.epoId, nome: antigo.nome, cidade: antigo.cidade, uf: antigo.uf,
          cod_fornecedor: antigo.cod, base: antigo.base
        };
        return copia;
      }

      function valor(id) {
        var el = $(id);
        return el && el.value.trim() ? el.value.trim() : null;
      }

      function salvarData(id, enviar, botaoEl) {
        var linha = document.querySelector('[data-linha="' + id + '"]');
        if (!linha) return;
        var ini = linha.querySelector('[data-campo="ini"]');
        var fim = linha.querySelector('[data-campo="fim"]');
        if (!ini || !ini.value) { App.toast("Informe a data prevista."); return; }
        if (fim && fim.value && fim.value < ini.value) {
          App.toast("A data final nao pode ser anterior a inicial.");
          return;
        }
        rodar("cronograma_definir_data", {
          p_item: id, p_inicio: ini.value, p_fim: (fim && fim.value) || null,
          p_semana: null, p_observacao: null, p_enviar: !!enviar
        }, botaoEl).then(function (ok) {
          if (!ok) return;
          if (!enviar) { App.toast("Data guardada."); return; }
          App.toast("Data enviada para a Claro.");
          avisarGerencia();
        });
      }

      // O e-mail para a gerencia da Claro: ha data esperando aprovacao.
      //
      // Sai daqui para chegar na hora - a tarefa diaria tambem manda, mas
      // esperar a madrugada e um dia inteiro de cronograma parado.
      //
      // Nao leva id nenhum: quem decide o que avisar e o banco, que ja sabe o
      // que esta esperando e o que ja foi avisado. Por isso chamar duas vezes
      // nao manda o e-mail duas vezes.
      //
      // Falha em silencio de proposito. A data FOI enviada; se o e-mail nao
      // saiu, dizer "nao deu certo" faria a pessoa mandar de novo achando que
      // nao valeu. A tarefa diaria pega o que ficou.
      var avisandoGerencia = false;
      function avisarGerencia() {
        if (DEMO || avisandoGerencia) return;
        var cli = window.Auth ? Auth.cliente : null;
        if (!cli || !cli.functions || !cli.functions.invoke) return;

        // Uma chamada so quando varias datas saem em seguida: cada uma dispara
        // este aviso, e o e-mail junta tudo que estiver esperando.
        avisandoGerencia = true;
        setTimeout(function () {
          avisandoGerencia = false;
          cli.functions.invoke("avisar-aprovacao", { body: {} }).then(function () {}, function () {});
        }, 1500);
      }

      function tratarAcao(acao, id, botaoEl) {
        var it = porId(id);

        if (acao === "cancelar-edicao") { editando = null; renderTrabalho(); return; }

        if (acao === "sugerir") {
          editando = { id: id, modo: "sugerir", onde: "tabela" };
          renderTrabalho();
          var c = $("ed-ini"); if (c) c.focus();
          return;
        }

        if (acao === "registrar") {
          editando = { id: id, modo: "registrar", onde: "tabela" };
          renderTrabalho();
          return;
        }

        if (acao === "confirmar-sugestao") {
          var novaIni = valor("ed-ini");
          if (!novaIni) { App.toast("Informe a data que serve melhor."); return; }
          var novaFim = valor("ed-fim");
          if (novaFim && novaFim < novaIni) {
            App.toast("A data final nao pode ser anterior a inicial."); return;
          }
          rodar("cronograma_propor_data", {
            p_item: id, p_inicio: novaIni, p_fim: novaFim, p_motivo: valor("ed-msg")
          }, botaoEl).then(function (ok) {
            if (ok) App.toast("Sugestao enviada para a APSIS.");
          });
          return;
        }

        if (acao === "confirmar-registro") {
          var aconteceu = $("ed-sim") && $("ed-sim").checked;
          if (aconteceu) {
            var ri = valor("ed-rini");
            if (!ri) { App.toast("Informe a data em que a auditoria aconteceu."); return; }
            var rf = valor("ed-rfim");
            if (rf && rf < ri) { App.toast("A data final nao pode ser anterior a inicial."); return; }
            rodar("cronograma_registrar_realizacao", {
              p_item: id, p_aconteceu: true, p_inicio: ri, p_fim: rf,
              p_motivo: null, p_auditoria: null
            }, botaoEl).then(function (ok) { if (ok) App.toast("Visita registrada."); });
          } else {
            var mot = valor("ed-motivo");
            if (!mot) { App.toast("Descreva por que a auditoria nao aconteceu."); return; }
            rodar("cronograma_registrar_realizacao", {
              p_item: id, p_aconteceu: false, p_inicio: null, p_fim: null,
              p_motivo: mot, p_auditoria: null
            }, botaoEl).then(function (ok) { if (ok) App.toast("Registro salvo."); });
          }
          return;
        }

        if (acao === "aprovar") {
          rodar("cronograma_aprovar", { p_item: id, p_mensagem: null }, botaoEl)
            .then(function (ok) { if (ok) App.toast("Data aprovada."); });
          return;
        }

        if (acao === "aceitar") {
          rodar("cronograma_aceitar_proposta", { p_item: id, p_mensagem: null }, botaoEl)
            .then(function (ok) { if (ok) App.toast("Data sugerida aceita e combinada."); });
          return;
        }

        if (acao === "guardar") {
          if (!it) return;
          if (it.situacao === "sem_data") { salvarData(id, false, botaoEl); return; }
          var jaAprovada = it.situacao === "confirmada";
          App.confirmar({
            titulo: jaAprovada ? "Esta data ja foi aprovada" : "Trocar a data",
            texto: (jaAprovada
              ? "Trocar a data desfaz a aprovacao da Claro: a unidade volta a esperar resposta."
              : "A data muda e volta para a Claro aprovar.") +
              "\n\nA data anterior fica registrada no historico.",
            confirmar: "Trocar e reenviar", cancelar: "Voltar", perigo: jaAprovada
          }).then(function (ok) {
            if (ok) salvarData(id, true, botaoEl);
            else renderTrabalho();
          });
          return;
        }
        if (acao === "enviar1")  { salvarData(id, true, botaoEl); return; }

        if (acao === "reenviar") {
          if (!it) return;
          App.confirmar({
            titulo: "Manter a data da APSIS",
            texto: "A data " +
              periodo(it.prevIni, it.prevFim != null ? it.prevFim : it.prevIni) +
              " volta para a Claro aprovar, e a sugestao dela deixa de valer.",
            confirmar: "Reenviar", cancelar: "Voltar"
          }).then(function (ok) {
            if (ok) salvarData(id, true, botaoEl);
          });
          return;
        }

        if (acao === "detalhe") { abrirTicket(id); return; }
      }

      function ligarRadioRegistro() {
        var sim = $("ed-sim"), nao = $("ed-nao");
        if (!sim || !nao) return;
        function trocar() {
          $("ed-bloco-sim").style.display = sim.checked ? "" : "none";
          $("ed-bloco-nao").style.display = sim.checked ? "none" : "";
        }
        sim.addEventListener("change", trocar);
        nao.addEventListener("change", trocar);
        trocar();
      }

      function enviarLote() {
        var prontas = itens.filter(function (it) {
          return it.situacao === "sem_data" && it.prevIni != null;
        });
        if (!prontas.length) return;

        App.confirmar({
          titulo: "Enviar para aprovacao",
          texto: prontas.length + (prontas.length === 1 ? " data vai" : " datas vao") +
                 " para os gerentes da Claro aprovarem.\n\n" +
                 "Eles podem aprovar ou sugerir outra data, e a resposta volta nesta tela.",
          confirmar: "Enviar", cancelar: "Voltar"
        }).then(function (ok) {
          if (!ok) return;
          if (DEMO) { App.toast("Sem conexao com os dados agora: nada foi enviado."); return; }
          var ids = prontas.map(function (it) { return it.id; });
          Auth.cliente.rpc("cronograma_enviar_aprovacao", { p_itens: ids, p_mensagem: null })
            .then(function (r) {
              if (!r || r.error) throw new Error((r && r.error && r.error.message) || "");
              var n = (r.data && r.data.enviados) || 0;
              App.toast(n + (n === 1 ? " data enviada." : " datas enviadas."));
              return carregar().then(render);
            })
            .catch(function (e) {
              App.toast(e && e.message ? e.message
                                       : "Nao foi possivel enviar agora. Tente novamente.");
            });
        });
      }

      // ================================================================
      // Modal de historico e acoes menos frequentes
      // ================================================================
      function abrirTicket(id) {
        var it = porId(id);
        if (!it) return;
        itemAberto = it;

        $("tk-titulo").textContent = it.nome;
        $("tk-corpo").innerHTML =
          '<div class="cron-cols">' +
            "<div>" +
              '<p class="col-titulo"><i class="ti ti-calendar-event" aria-hidden="true"></i>' +
                "Situacao agora</p>" +
              '<div class="tk-destaque"><b>' +
                esc(it.prevIni != null
                  ? periodo(it.prevIni, it.prevFim != null ? it.prevFim : it.prevIni)
                  : (it.semana || "ainda sem data")) + "</b>" +
                "<span>" + esc(textoDoEstado(it)) + "</span></div>" +
              '<p class="muted" style="margin:10px 0 0;font-size:12.5px;">' +
                (it.cod ? "Cod. " + esc(it.cod) + ", " : "") + esc(it.cidade) +
                (it.uf ? "/" + esc(it.uf) : "") +
"</p>" +
              '<p class="muted" style="margin-top:14px;font-size:12px;">' +
                "A Claro ve esta mesma tela e responde por aqui.</p>" +
            "</div>" +
            '<div><p class="col-titulo"><i class="ti ti-history" aria-hidden="true"></i>' +
              'O que ja aconteceu</p><div id="tk-fio">Carregando...</div></div>' +
          "</div>";

        var rodape = '<button class="btn btn-ghost" type="button" id="tk-cancelar">Fechar</button>';
        if (podeMontar && it.situacao !== "cancelada" && it.situacao !== "realizada") {
          rodape = '<button class="btn btn-ghost" type="button" data-tk="cancelar"' +
                   ' style="margin-right:auto;">Tirar do ciclo</button>' + rodape;
        } else if (podeMontar && it.situacao === "cancelada") {
          rodape = '<button class="btn btn-ghost" type="button" data-tk="reabrir"' +
                   ' style="margin-right:auto;">Trazer de volta</button>' + rodape;
        }

        // Apagar fica ao lado de "Tirar do ciclo", e nao no lugar dele: um tira
        // do ciclo e da para voltar, o outro nao volta. Visita ja registrada nao
        // mostra o botao - o servidor tambem recusa, mas botao que aparece e
        // recusa e botao que ensina errado.
        if (podeMontar && it.situacao !== "realizada") {
          rodape = '<button class="btn btn-ghost tk-apagar" type="button" data-tk="apagar">' +
                   '<i class="ti ti-trash" aria-hidden="true"></i>Apagar</button>' + rodape;
        }
        $("tk-rodape").innerHTML = rodape;
        $("tk-cancelar").addEventListener("click", fecharTicket);
        Array.prototype.forEach.call($("tk-rodape").querySelectorAll("[data-tk]"), function (b) {
          b.addEventListener("click", function () { acaoDoTicket(b.getAttribute("data-tk"), b); });
        });

        $("tk-modal").classList.add("is-open");
        carregarFio(it);
      }

      function textoDoEstado(it) {
        if (it.situacao === "aguardando_claro") return "Enviada para a Claro. Aguardando resposta.";
        if (it.situacao === "aguardando_apsis") {
          return "A Claro nao aprovou e sugeriu " +
            periodo(it.propIni, it.propFim != null ? it.propFim : it.propIni) + ".";
        }
        if (it.situacao === "confirmada") {
          return "Aprovada pela Claro" +
            (it.confirmadaEm ? " em " + fmtDataHora(it.confirmadaEm) : "") + ".";
        }
        if (it.situacao === "realizada") {
          return "Auditoria realizada em " +
            periodo(it.realIni, it.realFim != null ? it.realFim : it.realIni) + ".";
        }
        if (it.situacao === "nao_realizada") {
          return "Nao aconteceu: " + (it.motivo || "sem motivo registrado") + ".";
        }
        if (it.situacao === "cancelada") return "Esta unidade esta fora do ciclo " + CICLO + ".";
        return "Ainda nao foi combinada nenhuma data.";
      }

      function acaoDoTicket(acao, botaoEl) {
        var it = itemAberto;
        if (!it) return;
        if (acao === "cancelar") {
          App.confirmar({
            titulo: "Tirar do ciclo",
            texto: "A unidade " + it.nome + " sai do cronograma de " + CICLO +
                   ".\n\nO historico fica guardado e ela pode ser trazida de volta depois.",
            confirmar: "Tirar do ciclo", cancelar: "Voltar", perigo: true
          }).then(function (ok) {
            if (!ok) return;
            rodar("cronograma_cancelar", { p_item: it.id, p_motivo: null }, botaoEl)
              .then(function (deu) { if (deu) fecharTicket(); });
          });
          return;
        }
        if (acao === "apagar") {
          App.confirmar({
            titulo: "Apagar do cronograma",
            texto: "A unidade " + it.nome + " sai do cronograma de " + CICLO +
                   " e nao volta.\n\n" +
                   "Nao e o mesmo que tirar do ciclo: aqui a linha e o historico " +
                   "dela deixam de existir, e nao ha como trazer de volta. As datas " +
                   "combinadas, as aprovacoes e o que foi conversado somem junto.\n\n" +
                   "Se a unidade so nao entra neste ciclo, use Tirar do ciclo.",
            confirmar: "Apagar de vez", cancelar: "Voltar", perigo: true
          }).then(function (ok) {
            if (!ok) return;
            apagarItem(it, botaoEl);
          });
          return;
        }
        if (acao === "reabrir") {
          rodar("cronograma_reabrir", { p_item: it.id, p_mensagem: null }, botaoEl)
            .then(function (deu) { if (deu) fecharTicket(); });
        }
      }

      // Nao passa por rodar(): rodar espera a linha alterada de volta para
      // trocar na lista, e aqui nao ha linha nenhuma para voltar - ela foi
      // apagada. O que acontece e o contrario: sai da lista.
      function apagarItem(it, botaoEl) {
        if (DEMO) {
          App.toast("Sem conexao com os dados agora: nada foi apagado.");
          return;
        }
        if (botaoEl) botaoEl.disabled = true;
        Auth.cliente.rpc("cronograma_apagar", { p_item: it.id }).then(function (r) {
          if (!r || r.error) {
            throw new Error((r && r.error && r.error.message) || "");
          }
          itens = itens.filter(function (x) { return x.id !== it.id; });
          editando = null;
          fecharTicket();
          render();
          App.toast("Apagado do cronograma.");
        }).catch(function (e) {
          if (botaoEl) botaoEl.disabled = false;
          App.toast(e && e.message ? e.message
                                   : "Nao foi possivel apagar agora. Tente novamente.");
        });
      }

      function fecharTicket() {
        $("tk-modal").classList.remove("is-open");
        itemAberto = null;
      }

      function carregarFio(it) {
        if (DEMO) {
          $("tk-fio").innerHTML =
            '<p class="muted">O historico aparece aqui conforme as datas vao sendo combinadas.</p>';
          return;
        }
        Auth.cliente.from("cronograma_eventos")
          .select("acao, data_inicio, data_fim, comentario, autor_nome, autor_papel, " +
                  "criado_em, ordem")
          .eq("item_id", it.id)
          .order("criado_em", { ascending: false })
          .order("ordem", { ascending: false })
          .then(function (r) {
            var alvo = $("tk-fio");
            if (!alvo) return;
            if (!r || r.error) {
              alvo.innerHTML = '<p class="muted">Nao foi possivel carregar o historico agora.</p>';
              return;
            }
            var evs = r.data || [];
            if (!evs.length) {
              alvo.innerHTML = '<p class="muted">Nada registrado ainda.</p>';
              return;
            }
            alvo.innerHTML = '<ul class="tk-hist">' + evs.map(function (e, i) {
              var quem = (e.autor_nome || "Alguem") +
                (e.autor_papel ? " (" + (PAPEL_TEXTO[e.autor_papel] || e.autor_papel) + ")" : "");
              var datas = e.data_inicio
                ? " para " + periodo(dn(e.data_inicio), e.data_fim ? dn(e.data_fim) : null)
                : "";
              return "<li" + (i === 0 ? ' class="is-ultimo"' : "") + ">" +
                "<b>" + esc(quem) + "</b>" +
                "<span>" + esc(fmtDataHora(e.criado_em) + " - " +
                  (ACAO_TEXTO[e.acao] || e.acao) + datas) + "</span>" +
                (e.comentario ? "<q>" + esc(e.comentario) + "</q>" : "") +
              "</li>";
            }).join("") + "</ul>";
          })
          .catch(function () {
            var alvo = $("tk-fio");
            if (alvo) alvo.innerHTML =
              '<p class="muted">Nao foi possivel carregar o historico agora.</p>';
          });
      }

      // ================================================================
      // Nova EPO, uma por uma.
      //
      // As perguntas e o gravar sao os mesmos da tela de EPOs (FormEpo): a
      // unidade nasce no cadastro, entra no ciclo do cronograma e ja pode sair
      // com os questionarios pedidos ao responsavel.
      // ================================================================
      var formListas = null;      // { processos, pedidos }, lidas na primeira vez

      // Questionario e pedido existente entram so quando o formulario abre: o
      // roadmap nao precisa deles para desenhar, e carregar sempre atrasaria a
      // tela inteira por causa de uma janela que talvez ninguem abra.
      function carregarListasDoForm() {
        if (formListas) return Promise.resolve(formListas);
        if (DEMO) { formListas = { processos: [], pedidos: [] }; return Promise.resolve(formListas); }

        var db = Auth.cliente;
        var candidatos = [];
        return db.from("processos").select("id, nome, icone, ordem, tipo")
          .eq("ativo", true).order("ordem")
          .then(function (r) {
            if (r.error) throw r.error;
            candidatos = (r.data || []).filter(function (p) { return p.tipo !== "arquivado"; });
            // So entra o questionario que da para preencher, ou seja, o que tem
            // pergunta ativa.
            return db.from("itens_checklist").select("processo_id, ativo");
          })
          .then(function (r) {
            if (r.error) throw r.error;
            var comPergunta = {};
            (r.data || []).forEach(function (it) {
              if (it.ativo !== false) comPergunta[it.processo_id] = true;
            });
            var procs = candidatos.filter(function (p) { return comPergunta[p.id]; });
            return db.from("alocacoes")
              .select("id, epo_id, processo_id, responsavel_email, status, visita_prevista, observacao, criado_em")
              .order("criado_em", { ascending: false })
              .then(function (ra) {
                var peds = (ra && !ra.error ? (ra.data || []) : []).map(function (a) {
                  return {
                    id: a.id, epoId: a.epo_id, procId: a.processo_id,
                    email: a.responsavel_email, status: a.status,
                    visita: a.visita_prevista || "", obs: a.observacao || "",
                    criadoEm: a.criado_em || ""
                  };
                });
                formListas = { processos: procs, pedidos: peds };
                return formListas;
              });
          })
          .catch(function (e) {
            // Sem a lista o cadastro continua possivel, so sem marcar
            // questionario. Travar a janela por isso seria pior.
            if (window.console && console.warn) console.warn("listasDoForm", e);
            formListas = { processos: [], pedidos: [] };
            return formListas;
          });
      }

      // Duas janelas, um formulario so:
      //   modoCron = false -> unidade nova, que ja nasce no ciclo
      //   modoCron = true  -> "Novo cronograma": a unidade JA existe, vem de uma
      //                       lista suspensa, e o que se preenche aqui e a data
      var modoCron = false;
      var epoEscolhida = null;   // id da unidade, no modo cronograma
      var listaEpos = null;      // cadastro completo, lido na primeira abertura

      function textoDoBotao() {
        return modoCron ? "Salvar data" : "Cadastrar unidade";
      }

      function mostrarEscolha(ligado) {
        var wrap = $("f-escolha-wrap");
        if (wrap) wrap.classList.toggle("is-hidden", !ligado);
      }

      // O cronograma so conhece as unidades que JA tem linha. Para escolher
      // qualquer unidade cadastrada, o cadastro e lido aqui - e so quando esta
      // janela abre, para nao atrasar o roadmap por causa dela.
      function carregarEpos() {
        if (listaEpos) return Promise.resolve(listaEpos);
        if (DEMO) { listaEpos = []; return Promise.resolve(listaEpos); }
        return Auth.cliente.from("epos")
          .select("id, nome, cidade, uf, endereco, cep, ativo, cod_fornecedor, base, " +
                  "responsavel_nome, responsavel_email")
          .order("nome")
          .then(function (r) {
            listaEpos = (r && !r.error && r.data) ? r.data : [];
            return listaEpos;
          }, function () { listaEpos = []; return listaEpos; });
      }

      function pintarEscolha(selecionada) {
        var sel = $("f-escolha");
        if (!sel) return;
