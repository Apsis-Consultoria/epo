<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPOs - Auditoria de EPOs</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">

  <link rel="stylesheet" href="assets/app.css?v=43">

  <style>
    /* Ajustes locais só desta tela. */
    .epo-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; flex-wrap: wrap;
      padding: 12px 18px; border-bottom: 1px solid var(--border);
    }
    .epo-busca { position: relative; flex: 1 1 320px; max-width: 460px; }
    .epo-busca i {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 17px; pointer-events: none;
    }
    .epo-busca .input { padding-left: 36px; }
    .epo-toolbar .dica { font-size: 12.5px; color: var(--text-muted); }

    .epo-nome-cel b { display: block; font-size: 14px; font-weight: 600; color: var(--text); }
    .epo-nome-cel span { font-size: 12px; color: var(--text-muted); }

    .pin-tag {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px;
    }
    .pin-exato { background: var(--success-bg); color: var(--success); }
    .pin-aprox { background: var(--warning-bg); color: var(--warning); }
    .pin-fora  { background: var(--danger-bg);  color: var(--danger); }

    .epo-loading { padding: 30px 14px; text-align: center; color: var(--text-muted); font-size: 13.5px; }

    /* ---------------- Modal em duas colunas ---------------- */
    .modal.modal-largo { max-width: 940px; }
    .modal-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .modal-col + .modal-col {
      border-left: 1px solid var(--border);
      padding-left: 22px;
    }
    .col-titulo {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 14px;
    }
    .col-titulo i { font-size: 15px; color: var(--apsis-green); }
    @media (max-width: 820px) {
      .modal-cols { grid-template-columns: 1fr; gap: 4px; }
      .modal-col + .modal-col {
        border-left: 0; padding-left: 0;
        border-top: 1px solid var(--border); padding-top: 18px; margin-top: 4px;
      }
    }

    .field-row { display: flex; gap: 12px; }
    .field-row .field { flex: 1 1 0; min-width: 0; }
    .field-row .field.uf { flex: 0 0 96px; }
    .field-row .field.cep { flex: 0 0 132px; }
    @media (max-width: 640px) {
      .field-row { flex-wrap: wrap; }
      .field-row .field.uf, .field-row .field.cep { flex: 1 1 auto; }
    }

    /* Lista de questionários */
    .procs-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .procs-head .procs-rotulo { font-size: 13px; font-weight: 500; color: var(--text); }
    .procs-head .procs-count { font-size: 12px; color: var(--text-muted); }
    .link-mini {
      border: 0; background: transparent; padding: 0;
      font-family: inherit; font-size: 12.5px; font-weight: 500;
      color: var(--apsis-green); cursor: pointer; text-decoration: underline;
    }
    .link-mini:hover { color: var(--apsis-orange); }
    .procs-box {
      display: flex; flex-direction: column; gap: 2px;
      max-height: 232px; overflow: auto;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      padding: 6px;
    }
    .proc-opt { width: 100%; padding: 6px 8px; border-radius: var(--radius-sm); }
    .proc-opt:hover { background: var(--surface-2); }
    .proc-opt i { font-size: 16px; color: var(--text-2); flex: none; }
    .proc-opt .nm { font-size: 13.5px; flex: 1; min-width: 0; }
    .proc-opt.ja-pedido { opacity: .8; }
    .proc-opt .tag-pedido {
      font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
      background: var(--primary-tint); color: var(--apsis-green); flex: none;
    }
    .procs-vazio { font-size: 13px; color: var(--text-muted); padding: 10px 8px; }

    .nota-modal {
      display: flex; gap: 8px; align-items: flex-start;
      font-size: 12.5px; color: var(--text-2); line-height: 1.5;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 11px; margin-top: 4px;
    }
    .nota-modal i { font-size: 15px; margin-top: 1px; color: var(--apsis-green); flex: none; }

    .is-hidden { display: none !important; }
    .acoes-cel { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
    .btn-apagar { color: var(--danger); }
    .btn-apagar:hover { background: var(--danger-bg); }

    .pend-cel { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
    .pend-cel b { color: var(--text); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <script src="assets/data.js?v=43"></script>
  <script src="assets/app.js?v=43"></script>
  <script src="assets/geo-br.js?v=43"></script>
  <script src="assets/supabase-config.js?v=43"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js?v=43"></script>
  <script>
    (function () {
      "use strict";

      var acoes =
        '<button class="btn btn-primary btn-sm" id="btn-nova-epo" type="button">' +
          '<i class="ti ti-building-plus" aria-hidden="true"></i>Nova Unidade' +
        "</button>";

      Layout.mount("epos", "EPOs", acoes);

      var esc = App.escapeHtml;
      var DEMO = (window.Auth && Auth.modoDemo()) || !(window.Auth && Auth.pronto);

      var UFS = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];
      var htmlOpcoesUf = UFS.map(function (u) {
        return '<option value="' + u + '"' + (u === "SP" ? " selected" : "") + ">" + u + "</option>";
      }).join("");

      var epos = [];          // cadastro completo
      var processos = [];     // questionários pedíveis
      // Excluir EPO é da coordenação. Quem não tem esse alcance não vê o botão,
      // em vez de clicar e nada acontecer.
      var podeApagar = DEMO;
      var pedidos = [];       // relatórios já pedidos { epoId, procId, email, status }
      var editandoId = null;  // null = criando
      // Aberto por "Nova auditoria": a EPO vem de lista suspensa e o objetivo
      // e marcar questionario, nao cadastrar unidade.
      var modoAuditoria = false;
      var demoSeq = 0;

      // ------------------------------------------------------------------
      // Estrutura da página
      // ------------------------------------------------------------------
      var htmlTabela =
        '<div class="card mb-0">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">EPOs cadastradas</span>' +
              '<span class="subtitle">O endereço posiciona a EPO no mapa; os questionários marcados viram os relatórios pedidos ao responsável</span>' +
            "</div>" +
            '<span id="epo-count" style="font-size:13px;color:var(--text-2);"></span>' +
          "</div>" +
          '<div class="epo-toolbar">' +
            '<div class="epo-busca">' +
              '<i class="ti ti-search" aria-hidden="true"></i>' +
              '<input class="input" id="epo-filtro" type="search" placeholder="Filtrar por nome, cidade ou endereço" aria-label="Filtrar por nome, cidade ou endereço" autocomplete="off">' +
            "</div>" +
            '<span class="dica">Ordenado por nome</span>' +
          "</div>" +
          '<div class="table-wrap">' +
            '<table class="table">' +
              "<thead><tr>" +
                "<th>EPO</th>" +
                "<th>Cidade / UF</th>" +
                "<th>Endereço</th>" +
                "<th>No mapa</th>" +
                "<th>Questionários</th>" +
                "<th>Situação</th>" +
                '<th class="num"></th>' +
              "</tr></thead>" +
              '<tbody id="epo-body"><tr><td class="epo-loading" colspan="7">Carregando EPOs...</td></tr></tbody>' +
            "</table>" +
          "</div>" +
        "</div>";

      var htmlModal =
        '<div class="modal-overlay" id="epo-modal" role="dialog" aria-modal="true" aria-labelledby="epo-modal-title">' +
          '<div class="modal modal-largo">' +
            '<div class="modal-header">' +
              '<h2 class="modal-title" id="epo-modal-title">Nova unidade</h2>' +
              '<button class="modal-close" id="epo-modal-close" type="button" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>' +
            "</div>" +
            '<div class="modal-body">' +
              '<div class="modal-cols">' +

                // ---------------- coluna 1: cadastro ----------------
                '<div class="modal-col">' +
                  '<p class="col-titulo"><i class="ti ti-building-warehouse" aria-hidden="true"></i>Dados da EPO</p>' +
                  // Aberto por "Nova auditoria": a EPO vem de uma lista, e os
                  // dados dela preenchem o formulário ao escolher.
                  '<div class="field is-hidden" id="f-escolha-wrap">' +
                    '<label for="f-escolha">EPO</label>' +
                    '<select class="select" id="f-escolha"></select>' +
                    '<span class="hint">Escolha a unidade para ver os dados e marcar os questionários.</span>' +
                  "</div>" +
                  '<div class="field">' +
                    '<label for="f-nome">Nome da EPO</label>' +
                    '<input class="input" id="f-nome" type="text" placeholder="Ex.: EPO Horizonte" autocomplete="off">' +
                  "</div>" +
                  '<div class="field">' +
                    '<label for="f-endereco">Endereço</label>' +
                    '<input class="input" id="f-endereco" type="text" placeholder="Rua, número, complemento" autocomplete="off">' +
                  "</div>" +
                  '<div class="field-row">' +
                    '<div class="field">' +
                      '<label for="f-cidade">Cidade</label>' +
                      '<input class="input" id="f-cidade" type="text" placeholder="Ex.: Campinas" autocomplete="off">' +
                    "</div>" +
                    '<div class="field uf">' +
                      '<label for="f-uf">UF</label>' +
                      '<select class="select" id="f-uf">' + htmlOpcoesUf + "</select>" +
                    "</div>" +
                    '<div class="field cep">' +
                      '<label for="f-cep">CEP</label>' +
                      '<input class="input" id="f-cep" type="text" inputmode="numeric" placeholder="00000-000" autocomplete="off" maxlength="9">' +
                    "</div>" +
                  "</div>" +
                  '<div class="field">' +
                    '<label for="f-ativo">Situação</label>' +
                    '<select class="select" id="f-ativo">' +
                      '<option value="1" selected>Ativa</option>' +
                      '<option value="0">Inativa</option>' +
                    "</select>" +
                    '<span class="hint">EPO inativa sai do mapa e das listas, mas o histórico dela fica guardado.</span>' +
                  "</div>" +
                  '<div class="nota-modal">' +
                    '<i class="ti ti-map-pin" aria-hidden="true"></i>' +
                    "<span>Com o endereço preenchido a EPO cai no ponto exato do mapa. Só com cidade e UF ela aparece em posição aproximada.</span>" +
                  "</div>" +
                "</div>" +

                // ---------------- coluna 2: questionários ----------------
                '<div class="modal-col">' +
                  '<p class="col-titulo"><i class="ti ti-clipboard-list" aria-hidden="true"></i>Questionários e responsável</p>' +
                  '<div class="field">' +
                    '<label for="f-email">E-mail do responsável da EPO</label>' +
                    '<input class="input" id="f-email" type="email" placeholder="nome@empresa.com.br" autocomplete="off">' +
                    '<span class="hint">Ele recebe um e-mail para definir a própria senha e passa a entrar com esse e-mail.</span>' +
                  "</div>" +
                  '<div class="field">' +
                    '<div class="procs-head">' +
                      '<span class="procs-rotulo">Questionários desta EPO</span>' +
                      '<span class="procs-count" id="f-procs-count"></span>' +
                    "</div>" +
                    '<div class="procs-box" id="f-procs"></div>' +
                    '<button class="link-mini" id="f-procs-toggle" type="button" style="align-self:flex-start;">Marcar todos</button>' +
                  "</div>" +
                  '<div class="field-row">' +
                    '<div class="field">' +
                      '<label for="f-visita">Visita prevista (opcional)</label>' +
                      '<input class="input" id="f-visita" type="date">' +
                    "</div>" +
                  "</div>" +
                  '<div class="field" style="margin-bottom:4px;">' +
                    '<label for="f-obs">Observação (opcional)</label>' +
                    '<textarea class="textarea" id="f-obs" rows="2" style="min-height:62px;" placeholder="Ex.: priorizar notas fiscais dos últimos 30 dias"></textarea>' +
                  "</div>" +
                  '<div class="nota-modal">' +
                    '<i class="ti ti-send" aria-hidden="true"></i>' +
                    "<span>Ao salvar, cada questionário marcado fica pendente para o responsável e ele recebe um e-mail para definir a senha de acesso. Questionário já pedido continua pendente e não é duplicado.</span>" +
                  "</div>" +
                "</div>" +

              "</div>" +
            "</div>" +
            '<div class="modal-footer">' +
              '<button class="btn btn-ghost btn-sm" id="epo-modal-cancel" type="button">Cancelar</button>' +
              '<button class="btn btn-primary btn-sm" id="epo-modal-save" type="button"><i class="ti ti-check" aria-hidden="true"></i>Salvar EPO</button>' +
            "</div>" +
          "</div>" +
        "</div>";

      document.getElementById("page").innerHTML = htmlTabela + htmlModal;

      // ------------------------------------------------------------------
      // Questionários (coluna 2)
      // ------------------------------------------------------------------
      function procById(id) {
        for (var i = 0; i < processos.length; i++) {
          if (String(processos[i].id) === String(id)) return processos[i];
        }
        return null;
      }
      function nomeProc(id) {
        var p = procById(id);
        return p ? p.nome : "questionário";
      }

      // Questionários já pedidos para a EPO, para o que está pendente continuar
      // pendente e não virar pedido repetido.
      function jaPedidos(epoId) {
        var mapa = {};
        if (!epoId) return mapa;
        pedidos.forEach(function (a) {
          if (String(a.epoId) === String(epoId)) mapa[String(a.procId)] = a;
        });
        return mapa;
      }

      function htmlProcs(epoId) {
        if (!processos.length) return '<div class="procs-vazio">Nenhum questionário disponível.</div>';
        var pedidosDaEpo = jaPedidos(epoId);
        return processos.map(function (p, i) {
          var id = "f-proc-" + i;
          var pedido = pedidosDaEpo[String(p.id)];
          return (
            '<label class="checkbox proc-opt' + (pedido ? " ja-pedido" : "") + '" for="' + id + '">' +
              '<input type="checkbox" id="' + id + '" value="' + esc(p.id) + '"' +
                (pedido ? " checked disabled" : "") + ">" +
              '<i class="ti ' + esc(p.icone || "ti-clipboard-list") + '" aria-hidden="true"></i>' +
              '<span class="nm">' + esc(p.nome) + "</span>" +
              (pedido ? '<span class="tag-pedido">' + esc(rotuloStatus(pedido.status)) + "</span>" : "") +
            "</label>"
          );
        }).join("");
      }

      function rotuloStatus(s) {
        if (s === "enviada") return "enviado";
        if (s === "em_andamento") return "em andamento";
        return "pendente";
      }

      function caixas() {
        var box = document.getElementById("f-procs");
        if (!box) return [];
        return Array.prototype.slice.call(box.querySelectorAll('input[type="checkbox"]'));
      }
      function marcados() {
        var out = [];
        caixas().forEach(function (c) { if (c.checked && !c.disabled) out.push(c.value); });
        return out;
      }
      function atualizarResumo() {
        var livres = caixas().filter(function (c) { return !c.disabled; });
        var n = marcados().length;
        var jaN = caixas().length - livres.length;
        var alvo = document.getElementById("f-procs-count");
        var toggle = document.getElementById("f-procs-toggle");
        var partes = [];
        if (jaN) partes.push(jaN + (jaN === 1 ? " já pedido" : " já pedidos"));
        partes.push(n ? n + (n === 1 ? " novo marcado" : " novos marcados") : "nenhum novo marcado");
        if (alvo) alvo.textContent = partes.join(" · ");
        if (toggle) {
          toggle.style.display = livres.length ? "" : "none";
          toggle.textContent = (livres.length && n === livres.length) ? "Desmarcar todos" : "Marcar todos";
        }
      }

      function renderProcs(epoId) {
        var box = document.getElementById("f-procs");
        if (box) box.innerHTML = htmlProcs(epoId);
        atualizarResumo();
      }

      document.getElementById("f-procs").addEventListener("change", atualizarResumo);
      document.getElementById("f-procs-toggle").addEventListener("click", function () {
        var livres = caixas().filter(function (c) { return !c.disabled; });
        var marcarTodos = marcados().length !== livres.length;
        livres.forEach(function (c) { c.checked = marcarTodos; });
        atualizarResumo();
      });

      // ------------------------------------------------------------------
      // Modal
      // ------------------------------------------------------------------
      var overlay = document.getElementById("epo-modal");
      function fecharModal() { overlay.classList.remove("is-open"); }
      function abrirModal() { overlay.classList.add("is-open"); }
      ["epo-modal-close", "epo-modal-cancel"].forEach(function (id) {
        document.getElementById(id).addEventListener("click", fecharModal);
      });
      overlay.addEventListener("click", function (ev) { if (ev.target === overlay) fecharModal(); });
      document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") fecharModal(); });

      function preencherForm(epo) {
        document.getElementById("f-nome").value = (epo && epo.nome) || "";
        document.getElementById("f-endereco").value = (epo && epo.endereco) || "";
        document.getElementById("f-cidade").value = (epo && epo.cidade) || "";
        document.getElementById("f-uf").value = (epo && epo.uf) || "SP";
        document.getElementById("f-cep").value = (epo && epo.cep) || "";
        document.getElementById("f-ativo").value = (epo && epo.ativo === false) ? "0" : "1";
        document.getElementById("epo-modal-title").textContent = modoAuditoria
          ? "Nova auditoria"
          : (epo ? "Editar unidade" : "Nova unidade");
        var btnSalvar = document.getElementById("epo-modal-save");
        if (btnSalvar) {
          btnSalvar.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i>' +
            (modoAuditoria ? "Pedir questionários" : "Salvar EPO");
        }

        // O que ja foi pedido para esta EPO volta preenchido: e-mail do
        // responsavel, visita prevista e observacao. Antes so o endereco vinha,
        // e quem abria para incluir um questionario tinha que redigitar o resto.
        // Campo a campo, os valores vinham de pedidos diferentes: dava para
        // ver o e-mail de um com a visita de outro. Agora o pedido mais recente
        // manda, e os anteriores so preenchem o que ele deixou vazio.
        var emailAtual = "";
        var visitaAtual = "";
        var obsAtual = "";
        if (epo) {
          var meus = pedidos.filter(function (a) {
            return String(a.epoId) === String(epo.id);
          }).sort(function (x, y) {
            return String(y.criadoEm || "").localeCompare(String(x.criadoEm || ""));
          });
          if (meus.length) {
            var recente = meus[0];
            emailAtual = recente.email || "";
            visitaAtual = recente.visita ? String(recente.visita).slice(0, 10) : "";
            obsAtual = recente.obs || "";
            meus.forEach(function (a) {
              if (!emailAtual && a.email) emailAtual = a.email;
              if (!visitaAtual && a.visita) visitaAtual = String(a.visita).slice(0, 10);
              if (!obsAtual && a.obs) obsAtual = a.obs;
            });
          }
        }
        document.getElementById("f-email").value = emailAtual;
        document.getElementById("f-visita").value = visitaAtual;
        document.getElementById("f-obs").value = obsAtual;
        renderProcs(epo ? epo.id : null);
      }

      document.getElementById("btn-nova-epo").addEventListener("click", function () {
        editandoId = null;
        mostrarEscolha(false);
        preencherForm(null);
        abrirModal();
        document.getElementById("f-nome").focus();
      });

      // CEP com máscara, só para a leitura ficar limpa
      document.getElementById("f-cep").addEventListener("input", function () {
        var d = this.value.replace(/\D/g, "").slice(0, 8);
        this.value = d.length > 5 ? d.slice(0, 5) + "-" + d.slice(5) : d;
      });

      // ------------------------------------------------------------------
      // Lista
      // ------------------------------------------------------------------
      function marcaDoPonto(epo) {
        var pos = GeoBR.pontoDaEpo(epo);
        if (pos.precisao === "endereco") {
          return '<span class="pin-tag pin-exato"><i class="ti ti-map-pin-check" aria-hidden="true"></i>Exato</span>';
        }
        if (pos.precisao === "cidade") {
          return '<span class="pin-tag pin-aprox"><i class="ti ti-map-pin" aria-hidden="true"></i>Pela cidade</span>';
        }
        if (pos.precisao === "uf") {
          return '<span class="pin-tag pin-aprox"><i class="ti ti-map-pin" aria-hidden="true"></i>Pelo estado</span>';
        }
        return '<span class="pin-tag pin-fora"><i class="ti ti-map-pin-off" aria-hidden="true"></i>Fora do mapa</span>';
      }

      // Um pedido dessa EPO que tenha e-mail, para reenviar o acesso por ele.
      function pedidoComEmail(epoId) {
        for (var i = 0; i < pedidos.length; i++) {
          if (String(pedidos[i].epoId) === String(epoId) && pedidos[i].email) return pedidos[i];
        }
        return null;
      }

      function celulaQuestionarios(epo) {
        var meus = pedidos.filter(function (a) { return String(a.epoId) === String(epo.id); });
        if (!meus.length) return '<span class="pend-cel" style="color:var(--text-muted)">nenhum pedido</span>';
        var pend = meus.filter(function (a) { return a.status !== "enviada"; }).length;
        return '<span class="pend-cel"><i class="ti ti-clipboard-list" aria-hidden="true"></i>' +
          "<b>" + meus.length + "</b> pedidos" +
          (pend ? " · <b>" + pend + "</b> pendentes" : " · todos enviados") + "</span>";
      }

      function renderLista() {
        var termo = (document.getElementById("epo-filtro").value || "").trim().toLowerCase();
        var lista = epos.filter(function (e) {
          if (!termo) return true;
          return [e.nome, e.cidade, e.uf, e.endereco, e.cep].join(" ").toLowerCase().indexOf(termo) >= 0;
        });

        var tbody = document.getElementById("epo-body");
        document.getElementById("epo-count").textContent =
          epos.length ? lista.length + " de " + epos.length : "";

        if (!epos.length) {
          tbody.innerHTML =
            '<tr><td colspan="7"><div class="empty">' +
            '<i class="ti ti-building-warehouse" aria-hidden="true"></i>' +
            "<p>Nenhuma EPO cadastrada ainda. Comece em <b>Nova Unidade</b>.</p>" +
            "</div></td></tr>";
          return;
        }
        if (!lista.length) {
          tbody.innerHTML =
            '<tr><td colspan="7"><div class="empty">' +
            '<i class="ti ti-search-off" aria-hidden="true"></i>' +
            "<p>Nenhuma EPO com esse filtro.</p>" +
            "</div></td></tr>";
          return;
        }

        tbody.innerHTML = lista.map(function (e) {
          return "<tr>" +
            '<td class="epo-nome-cel"><b>' + esc(e.nome) + "</b>" +
              (e.cep ? "<span>CEP " + esc(e.cep) + "</span>" : "") + "</td>" +
            "<td>" + esc([e.cidade, e.uf].filter(Boolean).join(" · ") || "-") + "</td>" +
            "<td>" + esc(e.endereco || "-") + "</td>" +
            "<td>" + marcaDoPonto(e) + "</td>" +
            "<td>" + celulaQuestionarios(e) + "</td>" +
            '<td><span class="badge ' + (e.ativo === false ? "badge-baixa" : "badge-success") + '">' +
              (e.ativo === false ? "Inativa" : "Ativa") + "</span></td>" +
            '<td class="num">' +
              '<span class="acoes-cel">' +
                (pedidoComEmail(e.id)
                  ? '<button class="btn btn-ghost btn-sm" type="button" data-acesso="' + esc(e.id) + '" ' +
                    'title="Reenviar o link de acesso para o responsável">' +
                    '<i class="ti ti-mail-forward" aria-hidden="true"></i>Reenviar acesso</button>'
                  : "") +
                '<button class="btn btn-ghost btn-sm" type="button" data-editar="' + esc(e.id) + '">' +
                '<i class="ti ti-pencil" aria-hidden="true"></i>Editar</button>' +
                (podeApagar
                  ? '<button class="btn btn-ghost btn-sm btn-apagar" type="button" data-apagar="' + esc(e.id) + '" ' +
                    'title="Excluir a EPO"><i class="ti ti-trash" aria-hidden="true"></i>Excluir</button>'
                  : "") +
              "</span>" +
            "</td>" +
          "</tr>";
        }).join("");
      }

      // Dois jeitos de cair na edicao por link:
      //   ?editar=<id>   -> abre aquela EPO, como se tivesse clicado em Editar
      //   ?auditoria=1   -> abre no modo "nova auditoria": a EPO vem de uma
      //                     lista suspensa e o formulario se preenche ao
      //                     escolher, para marcar os questionarios ali mesmo.
      var editarParam = App.getParam("editar");
      var auditoriaParam = App.getParam("auditoria") === "1";
      var epoParam = App.getParam("epo");
      var escolhaWrap = document.getElementById("f-escolha-wrap");
      var escolhaSel = document.getElementById("f-escolha");

      function mostrarEscolha(ligado) {
        modoAuditoria = !!ligado;
        if (!escolhaWrap) return;
        if (ligado) escolhaWrap.classList.remove("is-hidden");
        else escolhaWrap.classList.add("is-hidden");
      }

      function pintarEscolha(selecionada) {
        if (!escolhaSel) return;
        // A EPO escolhida entra na lista mesmo inativa: senao o seletor mostra
        // "Selecione a EPO..." enquanto o formulario ja esta preenchido com ela,
        // e o pedido acaba indo para uma unidade que a tela nem exibe.
        var ativas = epos.filter(function (e) {
          return e.ativo !== false || String(e.id) === String(selecionada);
        });
        escolhaSel.innerHTML =
          '<option value="">Selecione a EPO...</option>' +
          ativas.map(function (e) {
            var loc = [e.cidade, e.uf].filter(Boolean).join("/");
            return '<option value="' + esc(e.id) + '"' +
              (String(e.id) === String(selecionada) ? " selected" : "") + ">" +
              esc(e.nome) + (loc ? " - " + esc(loc) : "") +
              (e.ativo === false ? " (inativa)" : "") + "</option>";
          }).join("");
      }

      function carregarNoForm(id) {
        var epo = epoPorId(id);
        editandoId = epo ? epo.id : null;
        preencherForm(epo);
        mostrarEscolha(true);
        pintarEscolha(editandoId);
      }

      if (escolhaSel) {
        escolhaSel.addEventListener("change", function () {
          carregarNoForm(this.value);
        });
      }

      function abrirEdicaoDoLink() {
        if (auditoriaParam) {
          auditoriaParam = false;
          modoAuditoria = true;
          carregarNoForm(epoParam && epoPorId(epoParam) ? epoParam : "");
          abrirModal();
          escolhaSel.focus();
          return;
        }
        if (!editarParam) return;
        var epo = epoPorId(editarParam);
        editarParam = null;
        if (!epo) return;
        mostrarEscolha(false);
        editandoId = epo.id;
        preencherForm(epo);
        abrirModal();
        var campo = document.getElementById("f-email");
        if (campo) campo.focus();
      }

      document.getElementById("epo-filtro").addEventListener("input", renderLista);

      document.getElementById("epo-body").addEventListener("click", function (ev) {
        // Reenviar o link de acesso do responsável
        var re = ev.target.closest("[data-acesso]");
        if (re) {
          var pedido = pedidoComEmail(re.getAttribute("data-acesso"));
          if (!pedido) return;
          if (DEMO) { App.toast("Acesso reenviado para " + pedido.email + "."); return; }
          re.disabled = true;
          var textoRe = re.innerHTML;
          re.innerHTML = '<i class="ti ti-loader-2" aria-hidden="true"></i>Enviando...';
          enviarConvite(pedido.id).then(function (ok) {
            re.disabled = false;
            re.innerHTML = textoRe;
            if (ok) App.toast("Link de acesso enviado para " + pedido.email + ".");
            else avisarConviteManual();
          });
          return;
        }

        // Excluir a EPO
        var del = ev.target.closest("[data-apagar]");
        if (del) {
          apagarEpo(del.getAttribute("data-apagar"), del);
          return;
        }

        var b = ev.target.closest("[data-editar]");
        if (!b) return;
        var id = b.getAttribute("data-editar");
        var epo = null;
        for (var i = 0; i < epos.length; i++) {
          if (String(epos[i].id) === String(id)) { epo = epos[i]; break; }
        }
        if (!epo) return;
        editandoId = epo.id;
        mostrarEscolha(false);
        preencherForm(epo);
        abrirModal();
        document.getElementById("f-nome").focus();
      });

      // ------------------------------------------------------------------
      // Excluir
      //
      // EPO recém-cadastrada sai da lista de vez. EPO que já tem auditoria
      // registrada não: a nota dela sustenta ranking, mapa e comparativo, e
      // apagar isso não tem volta. Nesse caso a saída é desativar, que tira a
      // EPO da operação sem apagar o que foi auditado.
      // ------------------------------------------------------------------
      // O nome cadastrado quase sempre ja comeca com "EPO": sem isso a tela
      // escreve "EPO EPO Aurora".
      function rotuloEpo(nome) {
        var n = String(nome == null ? "" : nome).trim();
        return /^epo\b/i.test(n) ? n : "EPO " + n;
      }

      function epoPorId(id) {
        for (var i = 0; i < epos.length; i++) {
          if (String(epos[i].id) === String(id)) return epos[i];
        }
        return null;
      }

      function vinculosDaEpo(epoId) {
        if (DEMO) {
          var meus = pedidos.filter(function (a) { return String(a.epoId) === String(epoId); });
          return Promise.resolve({ pedidos: meus.length, auditorias: 0, contagens: 0, incerto: false });
        }
        var db = Auth.cliente;
        // Erro de contagem virando zero e o pior caso possivel aqui: a tela
        // concluiria que a EPO nao tem historico e ofereceria exclusao
        // definitiva. Em duvida, para.
        function quantos(tabela) {
          return db.from(tabela).select("id", { count: "exact", head: true }).eq("epo_id", epoId)
            .then(function (r) {
              if (r && r.error) return { erro: true, n: 0 };
              return { erro: false, n: (r && r.count) || 0 };
            }, function () { return { erro: true, n: 0 }; });
        }
        return Promise.all([
          quantos("alocacoes"), quantos("auditorias"),
          quantos("contagens_giro"), quantos("indicadores_reversa")
        ]).then(function (n) {
          return {
            pedidos: n[0].n, auditorias: n[1].n,
            contagens: n[2].n + n[3].n,
            incerto: n[0].erro || n[1].erro || n[2].erro || n[3].erro
          };
        });
      }

      function desativarEpo(epo, btn) {
        if (DEMO) {
          epo.ativo = false;
          renderLista();
          App.toast(rotuloEpo(epo.nome) + " desativada.");
          return Promise.resolve();
        }
        return Auth.cliente.from("epos").update({ ativo: false }).eq("id", epo.id)
          .then(function (r) {
            if (r.error) throw r.error;
            App.toast(rotuloEpo(epo.nome) + " desativada.");
            return carregar();
          })
          .catch(function (e) {
            console.error("desativarEpo", e);
            App.toast("Não foi possível desativar a EPO agora. Tente novamente.");
          })
          .then(function () { if (btn) btn.disabled = false; });
      }

      function apagarEpo(id, btn) {
        var epo = epoPorId(id);
        if (!epo) return;
        btn.disabled = true;

        vinculosDaEpo(epo.id).then(function (v) {
          if (v.incerto) {
            btn.disabled = false;
            App.toast("Não foi possível conferir o histórico desta unidade agora. Tente de novo em alguns instantes.");
            return;
          }
          if (v.auditorias || v.contagens) {
            var trava = "A " + rotuloEpo(epo.nome) + " já tem histórico registrado" +
              (v.auditorias ? " (" + v.auditorias + (v.auditorias === 1 ? " auditoria" : " auditorias") + ")" : "") +
              (v.contagens ? (v.auditorias ? " e" : "") + " " + v.contagens + (v.contagens === 1 ? " contagem de estoque" : " contagens de estoque") : "") +
              ". Excluir apagaria a nota dela do ranking, do mapa e do comparativo, e isso não tem volta.\n\n" +
              "Desativar tira a unidade da operação e mantém o histórico.";
            return App.confirmar({
              titulo: "Esta unidade tem histórico",
              texto: trava,
              confirmar: "Desativar unidade",
              cancelar: "Deixar como está"
            }).then(function (ok) {
              if (!ok) { btn.disabled = false; return; }
              return desativarEpo(epo, btn);
            });
          }

          var aviso = "";
          if (v.pedidos) {
            aviso += v.pedidos + (v.pedidos === 1 ? " questionário pedido" : " questionários pedidos") +
              " e os documentos anexados nele" + (v.pedidos === 1 ? "" : "s") + " também saem da lista.\n\n";
          }
          aviso += "Essa ação não tem volta.";

          return App.confirmar({
            titulo: "Excluir " + rotuloEpo(epo.nome) + "?",
            texto: aviso,
            confirmar: "Excluir",
            cancelar: "Cancelar",
            perigo: true
          }).then(function (ok) {
            if (!ok) { btn.disabled = false; return; }
            return seguirComExclusao();
          });
        });

        function seguirComExclusao() {
          if (DEMO) {
            epos = epos.filter(function (e) { return String(e.id) !== String(epo.id); });
            pedidos = pedidos.filter(function (a) { return String(a.epoId) !== String(epo.id); });
            renderLista();
            App.toast(rotuloEpo(epo.nome) + " excluída.");
            return;
          }

          var db = Auth.cliente;
          // O banco nao deixa apagar a EPO enquanto houver pedido apontando
          // para ela, entao os pedidos tem que sair antes. So que apagar os
          // pedidos e descobrir depois que a EPO nao pode ser apagada destroi
          // o historico de envio sem volta. Por isso, primeiro uma escrita
          // inofensiva na propria EPO prova que o acesso alcanca alterar ela.
          return db.from("epos").update({ nome: epo.nome }).eq("id", epo.id).select("id")
            .then(function (rr) {
              if (rr.error) throw rr.error;
              if (!rr.data || !rr.data.length) {
                btn.disabled = false;
                App.toast("Seu acesso não permite excluir EPOs. Fale com a coordenação da APSIS.");
                return null;
              }
              return db.from("alocacoes").delete().eq("epo_id", epo.id).select("id")
                .then(function (ra) {
                  if (ra.error) throw ra.error;
                  return db.from("epos").delete().eq("id", epo.id).select("id");
                });
            })
            .then(function (r) {
              if (!r) return null;   // ja avisado: sem alcance para excluir
              if (r.error) throw r.error;
              // Sem linha devolvida, a EPO continua lá: o acesso de quem clicou
              // não alcança exclusão. Dizer "excluída" aqui seria mentira.
              if (!r.data || !r.data.length) {
                btn.disabled = false;
                App.toast("Seu acesso não permite excluir EPOs. Fale com a coordenação da APSIS.");
                return carregar();
              }
              App.toast(rotuloEpo(epo.nome) + " excluída.");
              return carregar();
            })
            .catch(function (e) {
              console.error("apagarEpo", e);
              btn.disabled = false;
              App.toast("Não foi possível excluir a EPO agora. Tente novamente.");
            });
        }
      }

      // ------------------------------------------------------------------
      // Convite do responsável
      // ------------------------------------------------------------------
      function enviarConvite(alocacaoId) {
        if (DEMO || !alocacaoId) return Promise.resolve(false);
        var cli = window.Auth ? Auth.cliente : null;
        if (!cli || !cli.functions || !cli.functions.invoke) return Promise.resolve(false);
        try {
          return cli.functions.invoke("convidar-responsavel", { body: { alocacao_id: alocacaoId } })
            .then(function (r) { return !(r && r.error); }, function () { return false; });
        } catch (e) {
          return Promise.resolve(false);
        }
      }

      // Sem e-mail entregue nao existe atalho: o link de definir senha e uma
      // credencial e nao pode aparecer na tela de quem cadastrou.
      function avisarConviteManual() {
        App.toast("Nao foi possivel enviar o e-mail de acesso agora. Tente reenviar em alguns instantes.");
        return Promise.resolve();
      }

      // Convite: uma chamada por e-mail, nunca por questionário
      function convidarSeNecessario(res, email) {
        if (!email || !res.criados) return Promise.resolve();
        return enviarConvite(res.ids[0]).then(function (ok) {
          if (ok) { App.toast("Link de acesso enviado para " + email + "."); return; }
          return avisarConviteManual();
        });
      }

      // ------------------------------------------------------------------
      // Pedidos de relatório
      // ------------------------------------------------------------------
      function criarPedidosDemo(epo, procIds, email, visita, obs) {
        var res = { criados: 0, dups: [], erros: [], ids: [] };
        procIds.forEach(function (pid) {
          var dup = pedidos.some(function (a) {
            return String(a.epoId) === String(epo.id) && String(a.procId) === String(pid) && a.email === email;
          });
          if (dup) { res.dups.push(nomeProc(pid)); return; }
          demoSeq += 1;
          pedidos.push({
            id: "demo-aloc-" + demoSeq,
            epoId: epo.id, procId: pid, email: email, status: "pendente"
          });
          res.criados += 1;
          res.ids.push("demo-aloc-" + demoSeq);
        });
        return res;
      }

      // Uma linha por questionário, para tratar duplicidade isolada
      function criarPedidos(epoId, procIds, email, visita, obs) {
        var res = { criados: 0, dups: [], erros: [], ids: [] };
        if (!procIds.length) return Promise.resolve(res);

        return Auth.sessao().then(function (s) {
          var criadoPor = s ? s.user.id : null;
          var cadeia = Promise.resolve();
          procIds.forEach(function (pid) {
            cadeia = cadeia.then(function () {
              return Auth.cliente.from("alocacoes").insert({
                epo_id: epoId,
                processo_id: pid,
                responsavel_email: email,
                status: "pendente",
                criado_por: criadoPor,
                visita_prevista: visita || null,
                observacao: obs || null
              }).select("id").then(
                function (r) {
                  if (r.error) {
                    var msg = r.error.message || "";
                    if (r.error.code === "23505" || /duplicate|unique/i.test(msg)) {
                      res.dups.push(nomeProc(pid));
                    } else {
                      res.erros.push(nomeProc(pid) + " (" + msg + ")");
                    }
                    return;
                  }
                  res.criados += 1;
                  if (r.data && r.data[0]) res.ids.push(r.data[0].id);
                },
                function (err) {
                  res.erros.push(nomeProc(pid) + " (" + (err && err.message ? err.message : "erro inesperado") + ")");
                }
              );
            });
          });
          return cadeia.then(function () { return res; });
        });
      }

      function resumoPedido(res, email) {
        var partes = [];
        if (res.criados) {
          partes.push(res.criados + (res.criados === 1 ? " questionário pedido" : " questionários pedidos") + (email ? " para " + email : ""));
        }
        if (res.dups.length) partes.push("já existiam: " + res.dups.join(", "));
        if (res.erros.length) partes.push("falharam: " + res.erros.join("; "));
        return partes.join(". ");
      }

      // ------------------------------------------------------------------
      // Salvar
      // ------------------------------------------------------------------
      function lerForm() {
        return {
          nome: document.getElementById("f-nome").value.trim(),
          endereco: document.getElementById("f-endereco").value.trim(),
          cidade: document.getElementById("f-cidade").value.trim(),
          uf: document.getElementById("f-uf").value,
          cep: document.getElementById("f-cep").value.trim(),
          ativo: document.getElementById("f-ativo").value === "1",
          email: document.getElementById("f-email").value.trim().toLowerCase(),
          visita: document.getElementById("f-visita").value,
          obs: document.getElementById("f-obs").value.trim(),
          procIds: marcados()
        };
      }

      // Endereço novo pede coordenada nova. Se o serviço não responder, salva sem
      // ela: o mapa aproxima pela cidade e a tela mostra que está aproximado.
      function coordenadaPara(dados, anterior) {
        var mudou = !anterior ||
          (anterior.endereco || "") !== dados.endereco ||
          (anterior.cidade || "") !== dados.cidade ||
          (anterior.uf || "") !== dados.uf;
        if (!dados.endereco) return Promise.resolve({ lat: null, lng: null });
        if (!mudou && anterior && anterior.lat != null) {
          return Promise.resolve({ lat: anterior.lat, lng: anterior.lng });
        }
        return GeoBR.geocodificar(dados.endereco, dados.cidade, dados.uf).then(function (p) {
          return p || { lat: null, lng: null };
        });
      }

      document.getElementById("epo-modal-save").addEventListener("click", function () {
        var dados = lerForm();
        if (!dados.nome) { App.toast("Informe o nome da EPO."); return; }
        if (!dados.cidade) { App.toast("Informe a cidade da EPO."); return; }
        if (dados.email && !/^\S+@\S+\.\S+$/.test(dados.email)) {
          App.toast("Informe um e-mail válido para o responsável."); return;
        }
        if (dados.procIds.length && !dados.email) {
          App.toast("Informe o e-mail de quem vai enviar os documentos desses questionários."); return;
        }
        if (dados.email && !dados.procIds.length && !editandoId) {
          App.toast("Marque pelo menos um questionário para pedir ao responsável."); return;
        }

        var anterior = null;
        if (editandoId) {
          for (var i = 0; i < epos.length; i++) {
            if (String(epos[i].id) === String(editandoId)) { anterior = epos[i]; break; }
          }
        }

        var btn = this;
        var textoOriginal = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="ti ti-loader-2" aria-hidden="true"></i>Salvando...';
        function terminar() { btn.disabled = false; btn.innerHTML = textoOriginal; }

        coordenadaPara(dados, anterior).then(function (coord) {
          var linha = {
            nome: dados.nome,
            endereco: dados.endereco || null,
            cidade: dados.cidade,
            uf: dados.uf,
            cep: dados.cep || null,
            ativo: dados.ativo,
            lat: coord.lat,
            lng: coord.lng
          };

          if (DEMO) {
            var epoDemo = anterior;
            if (epoDemo) {
              Object.keys(linha).forEach(function (k) { epoDemo[k] = linha[k]; });
            } else {
              demoSeq += 1;
              epoDemo = JSON.parse(JSON.stringify(linha));
              epoDemo.id = "demo-epo-" + demoSeq;
              epos.push(epoDemo);
            }
            var resDemo = criarPedidosDemo(epoDemo, dados.procIds, dados.email, dados.visita, dados.obs);
            ordenar();
            renderLista();
            fecharModal();
            terminar();
            var rDemo = resumoPedido(resDemo, dados.email);
            App.toast(rotuloEpo(dados.nome) + (anterior ? " atualizada" : " cadastrada") + (rDemo ? " - " + rDemo : "") + ".");
            return;
          }

          // Os campos voltam preenchidos e sao editaveis, mas nada os gravava:
          // corrigir o e-mail do responsavel ou remarcar a visita de um pedido
          // que ja existe nao tinha efeito nenhum.
          function atualizarPedidosExistentes(epoId) {
            if (!editandoId) return Promise.resolve(null);
            var mudanca = {};
            if (dados.email) mudanca.responsavel_email = dados.email;
            if (dados.visita) mudanca.visita_prevista = dados.visita;
            if (dados.obs) mudanca.observacao = dados.obs;
            if (!Object.keys(mudanca).length) return Promise.resolve(null);
            var jaTem = pedidos.some(function (a) {
              return String(a.epoId) === String(epoId);
            });
            if (!jaTem) return Promise.resolve(null);
            return Auth.cliente.from("alocacoes").update(mudanca).eq("epo_id", epoId).select("id")
              .then(function (r) {
                if (r.error) throw r.error;
                return r.data || [];
              });
          }

          function depoisDaEpo(epoId) {
            if (!dados.procIds.length) {
              return atualizarPedidosExistentes(epoId).then(function (mudados) {
                fecharModal();
                var quantos = mudados && mudados.length;
                App.toast(rotuloEpo(dados.nome) + (editandoId ? " atualizada" : " cadastrada") +
                  (quantos ? " - " + quantos + (quantos === 1 ? " questionário atualizado" : " questionários atualizados") : "") + ".");
                return carregar();
              }, function (e) {
                console.error("atualizarPedidos", e);
                fecharModal();
                App.toast("A unidade foi salva, mas não foi possível atualizar os questionários já pedidos.");
                return carregar();
              });
            }
            return atualizarPedidosExistentes(epoId)
              .catch(function (e) { console.error("atualizarPedidos", e); return null; })
              .then(function () {
                return criarPedidos(epoId, dados.procIds, dados.email, dados.visita, dados.obs);
              })
              .then(function (res) {
                fecharModal();
                var resumo = resumoPedido(res, dados.email);
                App.toast(rotuloEpo(dados.nome) + (editandoId ? " atualizada" : " cadastrada") + (resumo ? " - " + resumo : "") + ".");
                return convidarSeNecessario(res, dados.email).then(carregar);
              });
          }

          if (editandoId) {
            return Auth.cliente.from("epos").update(linha).eq("id", editandoId)
              .then(function (r) {
                if (r.error) throw r.error;
                return depoisDaEpo(editandoId);
              })
              .then(terminar, function (e) {
                console.error("salvarEpo", e);
                terminar();
                App.toast("Não foi possível salvar a EPO. Confira os dados e tente novamente.");
              });
          }

          // Sem ordem, o "primeiro cliente" e o que o banco devolver: no dia em
          // que existir um segundo, a EPO nasce sob o cliente errado.
          return Auth.cliente.from("clientes").select("id").order("id").limit(1)
            .then(function (r) {
              if (r.error || !r.data || !r.data.length) {
                throw new Error((r.error && r.error.message) || "Cliente não encontrado.");
              }
              linha.cliente_id = r.data[0].id;
              return Auth.cliente.from("epos").insert(linha).select("id");
            })
            .then(function (r) {
              if (r.error) throw r.error;
              var novoId = r.data && r.data[0] ? r.data[0].id : null;
              if (!novoId) throw new Error("EPO criada sem identificador.");
              return depoisDaEpo(novoId);
            })
            .then(terminar, function (e) {
              console.error("salvarEpo", e);
              terminar();
              App.toast("Não foi possível salvar a EPO. Confira os dados e tente novamente.");
            });
        }, function (e) {
          console.error("coordenada", e);
          terminar();
          App.toast("Não foi possível salvar a EPO agora. Tente novamente.");
        });
      });

      // ------------------------------------------------------------------
      // Carga
      // ------------------------------------------------------------------
      function ordenar() {
        epos.sort(function (a, b) {
          return String(a.nome).localeCompare(String(b.nome), "pt-BR");
        });
      }

      function carregarDemo() {
        epos = (window.APP.epos || []).map(function (e) {
          return {
            id: e.id, nome: e.nome, cidade: e.cidade, uf: e.uf,
            endereco: e.endereco || "", cep: e.cep || "",
            lat: e.lat == null ? null : e.lat, lng: e.lng == null ? null : e.lng,
            ativo: true
          };
        });
        processos = (window.APP.processos || []).map(function (p) {
          return { id: p.id, nome: p.nome, icone: p.icone, ordem: p.peso || 0 };
        });
        // Sem nenhum pedido a tela nao mostra o que acontece quando a EPO ja
        // tem questionario pedido - e era justamente isso que ficava sem teste.
        var e1 = epos[0], e2 = epos[1];
        pedidos = [];
        if (e1 && processos[0]) {
          pedidos.push({
            id: "demo-aloc-1", epoId: e1.id, procId: processos[0].id,
            email: "responsavel@" + slugSimples(e1.nome) + ".com.br", status: "pendente",
            visita: "2026-08-12", obs: "Priorizar as notas dos ultimos 30 dias."
          });
        }
        if (e1 && processos[1]) {
          pedidos.push({
            id: "demo-aloc-2", epoId: e1.id, procId: processos[1].id,
            email: "responsavel@" + slugSimples(e1.nome) + ".com.br", status: "enviada",
            visita: "2026-08-12", obs: ""
          });
        }
        if (e2 && processos[0]) {
          pedidos.push({
            id: "demo-aloc-3", epoId: e2.id, procId: processos[0].id,
            email: "responsavel@" + slugSimples(e2.nome) + ".com.br", status: "em_andamento",
            visita: "", obs: ""
          });
        }
        ordenar();
        renderLista();
        abrirEdicaoDoLink();
        return Promise.resolve();
      }

      function slugSimples(nome) {
        return String(nome || "epo").toLowerCase()
          .normalize("NFD").replace(/[̀-ͯ]/g, "")
          .replace(/[^a-z0-9]+/g, "")
          .slice(0, 14) || "epo";
      }

      function carregar() {
        if (DEMO) return carregarDemo();

        if (window.Auth && Auth.perfil) {
          Auth.perfil().then(function (p) {
            var pode = !!p && (p.papel === "admin" || p.papel === "gestor");
            if (pode !== podeApagar) { podeApagar = pode; renderLista(); }
          });
        }

        var db = Auth.cliente;
        var candidatos = [];
        return db.from("processos").select("id, slug, nome, icone, ordem, tipo").eq("ativo", true).order("ordem")
          .then(function (r) {
            if (r.error) { console.error("carregarProcessos", r.error); processos = []; return null; }
            // O tipo no banco e 'processo' ou 'itens_obrigatorios'; nao existe
            // "questionario". O filtro antigo procurava esse valor e por isso
            // devolvia lista vazia, sem questionario nenhum para pedir.
            candidatos = (r.data || []).filter(function (p) { return p.tipo !== "arquivado"; });
            // Só entra na lista o questionário que dá para preencher, ou seja,
            // o que tem pergunta ativa em Configurações > Questionários.
            return db.from("itens_checklist").select("processo_id, ativo");
          })
          .then(function (r) {
            if (!candidatos.length) return;
            // Falhar aqui zerava a lista inteira de questionarios, inclusive os
            // ja pedidos, que sumiam sem tique e sem explicacao.
            if (r && r.error) {
              throw new Error(r.error.message || "falha ao ler as perguntas dos questionários");
            }
            var comPergunta = {};
            (r && r.data ? r.data : []).forEach(function (it) {
              if (it.ativo !== false) comPergunta[it.processo_id] = true;
            });
            processos = candidatos.filter(function (p) { return comPergunta[p.id]; });
          })
          .then(function () {
            return db.from("alocacoes")
              .select("id, epo_id, processo_id, responsavel_email, status, visita_prevista, observacao, criado_em")
              .order("criado_em", { ascending: false });
          })
          .then(function (r) {
            // Sem os pedidos, a tela mente: a EPO aparece sem questionario
            // nenhum, o formulario volta em branco e quem abrir vai pedir tudo
            // de novo. Falhar aqui tem que parar e avisar.
            if (!r || r.error) {
              throw new Error((r && r.error && r.error.message) || "falha ao ler os questionários já pedidos");
            }
            pedidos = (r.data || []).map(function (a) {
              return {
                id: a.id, epoId: a.epo_id, procId: a.processo_id,
                email: a.responsavel_email, status: a.status,
                visita: a.visita_prevista || "", obs: a.observacao || "",
                criadoEm: a.criado_em || ""
              };
            });
            return db.from("epos").select("id, nome, cidade, uf, endereco, cep, lat, lng, ativo").order("nome");
          })
          .then(function (r) {
            if (r.error) throw new Error(r.error.message);
            epos = r.data || [];
            renderLista();
            abrirEdicaoDoLink();
          })
          .catch(function (e) {
            console.error("carregarEpos", e);
            document.getElementById("epo-body").innerHTML =
              '<tr><td colspan="7"><div class="empty">' +
              '<i class="ti ti-alert-triangle" aria-hidden="true"></i>' +
              "<p>Não foi possível carregar as EPOs agora. Atualize a página em alguns instantes.</p>" +
              "</div></td></tr>";
          });
      }

      carregar();
    })();
  </script>
</body>
</html>
