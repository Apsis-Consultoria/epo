              "<span>dias</span>" +
            "</div>" +
            '<button class="wiz-stepper-btn" type="button" data-step="1" aria-label="Aumentar">+</button>' +
          "</div>"
        );
      }

      function renderContagem(step) {
        var def = step.def;
        var val = state.contagens[def.key];
        return (
          '<p class="wiz-eyebrow">' + esc(CONTAGEM.nome) + "</p>" +
          '<p class="wiz-subeyebrow">Contagem ' + step.pos + " de " + step.total + "</p>" +
          '<h1 class="wiz-question">' + esc(def.label) + "</h1>" +
          '<div class="wiz-evidence"><i class="ti ' + esc(def.icon) + '" aria-hidden="true"></i><span>' + esc(def.hint) + "</span></div>" +
          '<div class="wiz-tempo-stepper">' +
            '<button class="wiz-stepper-btn" type="button" data-step="-1" aria-label="Diminuir">-</button>' +
            '<div class="wiz-tempo-input-wrap">' +
              '<input type="number" inputmode="numeric" min="0" step="1" id="f-contagem" value="' + (val == null ? "" : val) + '" placeholder="0">' +
              "<span>" + esc(def.unidade) + "</span>" +
            "</div>" +
            '<button class="wiz-stepper-btn" type="button" data-step="1" aria-label="Aumentar">+</button>' +
          "</div>"
        );
      }

      function renderResultado() {
        var c = state.contagens;
        var r = calcReversa();

        function bloco(rotulo, icone, pct, baseTxt) {
          var cls = (pct != null && pct >= r.meta) ? "is-ok" : "is-bad";
          return (
            '<div class="rev-metric">' +
              '<div class="rev-metric-top"><b><i class="ti ' + icone + '" aria-hidden="true"></i>' + esc(rotulo) + "</b>" +
                '<span class="rev-metric-pct tnum ' + cls + '">' + fmtPctRev(pct) + "</span></div>" +
              barraMetaRev(pct, r.meta) +
              '<p class="rev-metric-frase ' + cls + '">' + esc(fraseMeta(rotulo, pct, r.meta)) + "</p>" +
              '<p class="rev-metric-base">' + esc(baseTxt) + "</p>" +
            "</div>"
          );
        }

        return (
          '<p class="wiz-eyebrow">' + esc(CONTAGEM.nome) + " · Resultado</p>" +
          '<h1 class="wiz-question">Percentual de retorno dos acessórios</h1>' +
          '<div class="wiz-evidence"><i class="ti ti-target-arrow" aria-hidden="true"></i><span>Meta de retorno: <b>' + r.meta + "%</b> para fontes e controles. A linha vertical na barra marca a meta.</span></div>" +
          bloco("Retorno de fontes", "ti-plug", r.pctFontes,
            App.fmtNum(c.fontes || 0) + " fontes / " + App.fmtNum(c.equipamentos || 0) + " equipamentos recebidos") +
          bloco("Retorno de controles", "ti-device-remote", r.pctControles,
            App.fmtNum(c.controles || 0) + " controles / " + App.fmtNum(c.equipControle || 0) + " equipamentos que usam controle")
        );
      }

      function renderChecagem(step) {
        var it = step.item;
        var r = respostaDe(it.id);
        var opts = [
          { val: "conforme", icon: "ti-check", label: "Sim" },
          { val: "nao", icon: "ti-x", label: "Não" }
        ];
        return (
          '<p class="wiz-eyebrow">' + esc(CONTAGEM.nome) + " · Checagem dos acessórios</p>" +
          '<p class="wiz-subeyebrow">Checagem ' + step.pos + " de " + step.total + "</p>" +
          '<h1 class="wiz-question">' + esc(it.pergunta) + "</h1>" +
          '<div class="wiz-evidence"><i class="ti ti-checklist" aria-hidden="true"></i><span>Confirmação operacional feita no ato do recebimento - <b>não exige evidência anexada</b>.</span></div>' +
          '<div class="wiz-options" id="wiz-options">' +
            opts.map(function (o) {
              var sel = r.status === o.val ? " is-selected" : "";
              return '<button type="button" class="wiz-opt' + sel + '" data-val="' + o.val + '"><i class="ti ' + o.icon + '" aria-hidden="true"></i>' + o.label + "</button>";
            }).join("") +
          "</div>" +
          '<div class="wiz-field"><label for="f-obs">Observações</label><textarea id="f-obs" placeholder="Divergências, quantidades, contexto (opcional)">' + esc(r.obs) + "</textarea></div>"
        );
      }

      function renderResumoContagem() {
        var c = state.contagens;
        var r = calcReversa();
        var okF = r.pctFontes != null && r.pctFontes >= r.meta;
        var okC = r.pctControles != null && r.pctControles >= r.meta;

        var statsHtml =
          '<div class="wiz-summary-stat"><b>' + (c.equipamentos == null ? "-" : App.fmtNum(c.equipamentos)) + "</b><span>Equipamentos recebidos</span></div>" +
          '<div class="wiz-summary-stat"><b>' + (c.fontes == null ? "-" : App.fmtNum(c.fontes)) + "</b><span>Fontes recebidas</span></div>" +
          '<div class="wiz-summary-stat"><b>' + (c.controles == null ? "-" : App.fmtNum(c.controles)) + "</b><span>Controles recebidos</span></div>" +
          '<div class="wiz-summary-stat"><b>' + (c.equipControle == null ? "-" : App.fmtNum(c.equipControle)) + "</b><span>Equip. que usam controle</span></div>";

        var checksHtml = CONTAGEM.checagens.map(function (it) {
          var resp = state.respostas[it.id];
          var sim = !!(resp && resp.status === "conforme");
          var cor = sim ? "var(--success)" : "var(--danger)";
          return (
            "<li>" +
              '<i class="ti ' + (sim ? "ti-circle-check" : "ti-circle-x") + '" style="color:' + cor + ';" aria-hidden="true"></i>' +
              "<span>" + esc(it.pergunta) + ' - <b style="color:' + cor + ';">' + (sim ? "Sim" : "Não") + "</b></span>" +
            "</li>"
          );
        }).join("");

        return (
          '<p class="wiz-eyebrow">' + esc(CONTAGEM.nome) + " · Resumo</p>" +
          '<h1 class="wiz-question">Contagem pronta para envio</h1>' +
          '<div class="wiz-summary-card">' +
            '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">' +
              '<span class="badge ' + (okF ? "badge-success" : "badge-danger") + '">Fontes ' + fmtPctRev(r.pctFontes) + "</span>" +
              '<span class="badge ' + (okC ? "badge-success" : "badge-danger") + '">Controles ' + fmtPctRev(r.pctControles) + "</span>" +
            "</div>" +
            '<div style="margin-top:16px;text-align:left;">' +
              '<p style="margin:0 0 6px;font-size:12px;font-weight:600;color:var(--text-2);">Retorno de fontes · meta ' + r.meta + "%</p>" +
              barraMetaRev(r.pctFontes, r.meta) +
              '<p style="margin:14px 0 6px;font-size:12px;font-weight:600;color:var(--text-2);">Retorno de controles · meta ' + r.meta + "%</p>" +
              barraMetaRev(r.pctControles, r.meta) +
            "</div>" +
            '<div class="wiz-summary-grid">' + statsHtml + "</div>" +
          "</div>" +
          '<h2 style="font-size:15px;font-weight:700;margin:0 0 10px;">Checagem dos acessórios</h2>' +
          '<ul class="rev-check-list">' + checksHtml + "</ul>" +

          '<button type="button" class="wiz-btn wiz-btn-back" style="width:100%;flex:1 1 auto;margin-bottom:8px;" id="btn-rascunho"><i class="ti ti-device-floppy" aria-hidden="true"></i>Salvar rascunho</button>'
        );
      }

      // Chips dos arquivos anexados em memória (nome + botão remover)
      function chipsHtml(r) {
        if (!temAnexo(r)) return "";
        return '<div class="wiz-chips" id="wiz-chips">' +
          r.arquivos.map(function (f, i) {
            var ico = (f.type || "").indexOf("image") === 0 ? "ti-photo" : "ti-paperclip";
            return (
              '<span class="wiz-chip">' +
                '<i class="ti ' + ico + '" aria-hidden="true"></i>' +
                '<span class="nome">' + esc(f.name) + "</span>" +
                '<button type="button" data-rm="' + i + '" aria-label="Remover ' + esc(f.name) + '"><i class="ti ti-x" aria-hidden="true"></i></button>' +
              "</span>"
            );
          }).join("") +
        "</div>";
      }

      // Botões "Tirar foto" (câmera no celular) e "Anexar arquivo" + inputs ocultos
      function anexoHtml(r) {
        return (
          '<div class="wiz-attach-row">' +
            '<button type="button" class="wiz-attach" id="btn-foto"><i class="ti ti-camera-plus" aria-hidden="true"></i>Tirar foto</button>' +
            '<button type="button" class="wiz-attach" id="btn-arquivo"><i class="ti ti-paperclip" aria-hidden="true"></i>Anexar arquivo</button>' +
          "</div>" +
          '<input type="file" id="inp-foto" accept="image/*" capture="environment" style="display:none;">' +
          '<input type="file" id="inp-arquivo" multiple style="display:none;">' +
          chipsHtml(r)
        );
      }

      // Liga botões/inputs/chips do bloco de anexos ao estado do item
      function wireAnexos(r) {
        var inpFoto = document.getElementById("inp-foto");
        var inpArq = document.getElementById("inp-arquivo");
        if (!inpFoto || !inpArq) return; // passo sem bloco de anexos (ex.: Presente)
        function addTodos(lista) {
          Array.prototype.forEach.call(lista, function (f) { r.arquivos.push(f); });
          renderStep();
        }
        document.getElementById("btn-foto").addEventListener("click", function () { inpFoto.click(); });
        document.getElementById("btn-arquivo").addEventListener("click", function () { inpArq.click(); });
        inpFoto.addEventListener("change", function () {
          if (inpFoto.files && inpFoto.files.length) addTodos(inpFoto.files);
        });
        inpArq.addEventListener("change", function () {
          if (inpArq.files && inpArq.files.length) addTodos(inpArq.files);
        });
        var chips = document.getElementById("wiz-chips");
        if (chips) {
          chips.addEventListener("click", function (ev) {
            var btn = ev.target.closest("button[data-rm]");
            if (!btn) return;
            r.arquivos.splice(parseInt(btn.getAttribute("data-rm"), 10), 1);
            renderStep();
          });
        }
      }

      /* ====================================================================
         COMPROVAÇÕES ENVIADAS PELA EPO (tempo real)
         O acesso do responsável da EPO sai antes da visita: ele anexa a
         comprovação de cada pergunta em alocacao_anexos. Aqui o auditor vê,
         no mesmo item, o que já chegou - via vw_comprovacoes_epo (que já
         resolve alocação -> epo/processo). Atualização por Realtime, com
         polling de 20s e recarga no foco da janela como rede de segurança.
         ==================================================================== */
      var comprovDemo = !(window.Auth && Auth.pronto && !Auth.modoDemo());

      var comprov = {
        idsPromise: null,   // { procId, itens: [uuid por índice], set: {uuid:true} }
        eposPromise: null,  // lista de EPOs ativas do banco
        canal: null,        // canal Realtime
        timer: null,        // polling do passo aberto
        seq: 0,             // invalida respostas de passos já trocados
        itemAtual: null,    // uuid do item na tela
        pendentes: 0,       // anexos novos vistos em OUTROS itens
        avisoStep: "",      // aviso desses outros itens, exibido no passo atual
        cache: null         // { idx, conteudo, n } do passo atual
      };

      function comprovTamanho(bytes) {
        var n = Number(bytes) || 0;
        if (!n) return "";
        if (n < 1024) return n + " B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
        return (n / (1024 * 1024)).toFixed(1) + " MB";
      }

      function comprovHora(iso) {
        if (!iso) return "";
        try {
          return new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
        } catch (e) { return ""; }
      }

      function comprovIcone(nome, contentType) {
        var ct = String(contentType || "").toLowerCase();
        var ext = String(nome || "").toLowerCase().split(".").pop();
        if (ct.indexOf("image/") === 0 || /^(jpg|jpeg|png|gif|webp|heic)$/.test(ext)) return "ti-photo";
        if (ct.indexOf("pdf") >= 0 || ext === "pdf") return "ti-file-typography";
        return "ti-file";
      }

      // Resolve UMA vez: processo (por slug) e itens_checklist na ordem oficial.
      function comprovIds() {
        if (comprov.idsPromise) return comprov.idsPromise;
        var db = Auth.cliente;
        comprov.idsPromise = db.from("processos").select("id")
          .eq("slug", processo.id).eq("ativo", true).maybeSingle()
          .then(function (r) {
            if (r.error) throw r.error;
            if (!r.data) throw new Error("processo fora do catálogo do banco: " + processo.id);
            var procId = r.data.id;
            return db.from("itens_checklist").select("id")
              .eq("processo_id", procId).eq("ativo", true).order("ordem")
              .then(function (ri) {
                if (ri.error) throw ri.error;
                var lista = (ri.data || []).map(function (x) { return x.id; });
                var set = {};
                lista.forEach(function (id) { set[id] = true; });
                comprov.itensSet = set;
                return { procId: procId, itens: lista, set: set };
              });
          });
        return comprov.idsPromise;
      }

      // uuid da EPO da tela. Depois de carregarContexto() o select já guarda o
      // uuid do banco; a busca por nome fica só como rede de segurança para o
      // caso de a lista real não ter carregado.
      function comprovEpoId() {
        return contexto().then(function () {
          if (eposDb) return state.epoId || null;
          var alvo = App.epoById(state.epoId);
          return Auth.cliente.from("epos").select("id, nome").eq("ativo", true)
            .then(function (r) {
              if (r.error) throw r.error;
              var lista = r.data || [];
              for (var i = 0; i < lista.length; i++) {
                if (alvo && lista[i].nome === alvo.nome) return lista[i].id;
              }
              return null;
            });
        });
      }

      function comprovCabecalho(n) {
        return (
          '<div class="wiz-comprov-head">' +
            '<i class="ti ti-inbox" aria-hidden="true"></i>' +
            "<span>Comprovações enviadas pela EPO</span>" +
            (n ? '<span class="wiz-comprov-count tnum">' + n + "</span>" : "") +
          "</div>"
        );
      }

      function comprovPintar(conteudo, n, cachear) {
        if (cachear) comprov.cache = { idx: comprov.cacheIdx, conteudo: conteudo, n: n };
        var el = document.getElementById("wiz-comprov");
        if (!el) return;
        el.innerHTML =
          comprovCabecalho(n) +
          comprov.avisoStep +
          conteudo;
      }

      var COMPROV_VAZIO = '<p class="wiz-comprov-msg">A EPO ainda não enviou comprovação para este item.</p>';

      function comprovListaHtml(rows) {
        return '<ul class="wiz-comprov-list">' + rows.map(function (a) {
          var ct = String(a.content_type || "");
          var nome = esc(a.nome_arquivo || "arquivo");
          var visual = (ct.indexOf("image/") === 0 && a.url)
            ? '<img class="wiz-comprov-thumb" src="' + esc(a.url) + '" alt="' + nome + '" loading="lazy">'
            : '<i class="ti ' + comprovIcone(a.nome_arquivo, ct) + '" aria-hidden="true"></i>';
          var partes = [];
          var tam = comprovTamanho(a.tamanho);
          if (tam) partes.push(tam);
          var hora = comprovHora(a.criado_em);
          if (hora) partes.push("enviado " + hora);
          if (a.responsavel_email) partes.push(esc(a.responsavel_email));
          var nomeHtml = a.url
            ? '<a class="wiz-comprov-nome" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + nome + "</a>"
            : '<span class="wiz-comprov-nome">' + nome + "</span>";
          var abrir = a.url
            ? '<a class="wiz-comprov-open" href="' + esc(a.url) + '" target="_blank" rel="noopener" aria-label="Abrir ' + nome + '"><i class="ti ti-external-link" aria-hidden="true"></i></a>'
            : "";
          return (
            '<li class="wiz-comprov-item">' + visual +
              '<div class="wiz-comprov-info">' + nomeHtml +
                '<span class="wiz-comprov-meta">' + partes.join(" · ") + "</span>" +
              "</div>" + abrir +
            "</li>"
          );
        }).join("") + "</ul>";
      }

      // Modo demo/offline: 1 anexo fictício no primeiro item, sem rede.
      function comprovDemoRows() {
        var d = new Date();
        d.setHours(9, 12, 0, 0);
        return [{
          nome_arquivo: "nf-espelho-4821.pdf",
          content_type: "application/pdf",
          tamanho: 184320,
          criado_em: d.toISOString(),
          responsavel_email: "responsável da EPO",
          url: App.documentoDe("nf-espelho-4821.pdf")
        }];
      }

      // silencioso: recarga de fundo (Realtime, polling, foco) - não pisca o
      // estado de "carregando", mantém o conteúdo atual até chegar o novo.
      function comprovCarregar(step, silencioso) {
        var idx = step.pos - 1;
        comprov.cacheIdx = idx;
        var pedido = ++comprov.seq;

        if (comprovDemo) {
          if (idx === 0) {
            comprovPintar(
              comprovListaHtml(comprovDemoRows()), 1, true
            );
          } else {
            comprovPintar(
              COMPROV_VAZIO,
              0, true
            );
          }
          return;
        }

        if (!silencioso) comprovPintar('<p class="wiz-comprov-msg">Carregando comprovações da EPO…</p>', 0, false);

        Promise.all([comprovIds(), comprovEpoId()]).then(function (rs) {
          var ids = rs[0], epoId = rs[1];
          if (ids.itens.length !== processo.itens.length) {
            throw new Error("o checklist do banco tem " + ids.itens.length +
              " itens e esta tela tem " + processo.itens.length + " - atualize o catálogo");
          }
          var itemId = ids.itens[idx];
          if (!itemId) throw new Error("item sem correspondente no banco");
          if (pedido === comprov.seq) comprov.itemAtual = itemId;

          // Com o relatorio pedido em mãos, lemos direto os anexos daquela
          // alocação: é o caminho mais direto e não depende de casar a EPO.
          if (aloc) {
            return Auth.cliente.from("alocacao_anexos")
              .select("id, storage_path, nome_arquivo, content_type, tamanho, criado_em")
              .eq("alocacao_id", aloc.id).eq("item_id", itemId)
              .order("criado_em")
              .then(function (r) {
                if (r.error) throw r.error;
                return (r.data || []).map(function (a) {
                  a.responsavel_email = aloc.responsavel_email;
                  return a;
                });
              });
          }

          if (!epoId) throw new Error("EPO não encontrada no banco");
          return Auth.cliente.from("vw_comprovacoes_epo").select("*")
            .eq("epo_id", epoId).eq("processo_id", ids.procId).eq("item_id", itemId)
            .order("criado_em")
            .then(function (r) {
              if (r.error) throw r.error;
              return r.data || [];
            });
        }).then(function (rows) {
          if (pedido !== comprov.seq) return null;
          if (!rows.length) { comprovPintar(COMPROV_VAZIO, 0, true); return null; }
          return Promise.all(rows.map(function (a) {
            if (!a.storage_path) { a.url = null; return a; }
            return Auth.cliente.storage.from("evidencias").createSignedUrl(a.storage_path, 3600)
              .then(function (u) { a.url = (u.data && u.data.signedUrl) || null; return a; },
                    function () { a.url = null; return a; });
          })).then(function (lista) {
            if (pedido !== comprov.seq) return;
            comprovPintar(comprovListaHtml(lista), lista.length, true);
          });
        }).catch(function (err) {
          if (pedido !== comprov.seq) return;
          console.warn("Comprovações da EPO indisponíveis:", (err && err.message) || err);
          comprovPintar('<p class="wiz-comprov-msg">Não foi possível carregar as comprovações da EPO agora.</p>', 0, true);
        });
      }

      // Realtime: uma assinatura por auditoria. O payload de alocacao_anexos
      // não traz epo_id/processo_id, então filtramos pelo item_id conhecido e
      // recarregamos pela view (que aplica o filtro de EPO e processo).
      function comprovAssinar() {
        if (comprovDemo || comprov.canal || !Auth.cliente) return;
        comprov.canal = Auth.cliente.channel("comprov-epo")
          .on("postgres_changes", { event: "*", schema: "public", table: "alocacao_anexos" }, function (payload) {
            var row = payload.new || payload.old || {};
            var itemId = row.item_id;
            if (!itemId || !comprov.itensSet || !comprov.itensSet[itemId]) return;
            // com relatorio pedido, ignora anexo de outra alocacao
            if (aloc && row.alocacao_id && row.alocacao_id !== aloc.id) return;
            var step = steps[cur];
            if (itemId === comprov.itemAtual && step && step.type === "item") {
              comprovCarregar(step, true);
            } else {
              comprov.pendentes += 1;
            }
          })
          .subscribe();
      }

      function comprovParar() {
        if (comprov.timer) { clearInterval(comprov.timer); comprov.timer = null; }
        comprov.itemAtual = null;
        comprov.seq += 1; // descarta respostas em voo do passo anterior
      }

      // Chamado no wire de cada passo de item
      function comprovIniciarPasso(step) {
        var idx = step.pos - 1;
        var mesmoPasso = !!(comprov.cache && comprov.cache.idx === idx);

        if (!mesmoPasso) {
          comprov.avisoStep = comprov.pendentes > 0
            ? '<p class="wiz-comprov-novo"><i class="ti ti-bell-ringing" aria-hidden="true"></i><span>' +
                comprov.pendentes + (comprov.pendentes > 1 ? " novas comprovações chegaram" : " nova comprovação chegou") +
                " em outros itens deste questionário.</span></p>"
            : "";
          comprov.pendentes = 0;
          comprov.cache = null;
        }

        if (mesmoPasso) {
          // re-render do mesmo item (troca de resposta, anexo): repinta do cache
          comprov.cacheIdx = idx;
          comprovPintar(comprov.cache.conteudo, comprov.cache.n, false);
        } else {
          comprovCarregar(step);
        }

        if (comprovDemo) return;
        comprovAssinar();
        if (comprov.timer) clearInterval(comprov.timer);
        comprov.timer = setInterval(function () {
          var s = steps[cur];
          if (s && s.type === "item") comprovCarregar(s, true);
          else comprovParar();
        }, 20000);
      }

      // Fallback: volta do app da câmera / troca de aba recarrega o painel
      window.addEventListener("focus", function () {
        var s = steps[cur];
        if (!comprovDemo && s && s.type === "item" && document.getElementById("wiz-comprov")) comprovCarregar(s, true);
      });

      window.addEventListener("pagehide", function () {
        comprovParar();
        if (comprov.canal && Auth.cliente) {
          Auth.cliente.removeChannel(comprov.canal);
          comprov.canal = null;
        }
      });

      function renderItem(step) {
        var it = step.item;
        var r = respostaDe(it.id);
        var precisaAgora = !!it.evidencia && (r.status === "conforme" || r.status === "nao");
        var evOk = temAnexo(r) || justOk(r);

        var tags = "";
        if (it.requerFoto) tags += ' <span class="evidence-tag"><i class="ti ti-camera" aria-hidden="true"></i>foto obrigatória</span>';
        if (it.grave) tags += ' <span class="evidence-tag tag-grave"><i class="ti ti-alert-triangle" aria-hidden="true"></i>NC grave</span>';

        var opts = [
          { val: "conforme", icon: "ti-check", label: "Conforme" },
          { val: "nao", icon: "ti-x", label: "Não conforme" },
          { val: "na", icon: "ti-minus", label: "Não se aplica" }
        ];

        return (
          '<p class="wiz-eyebrow">' + esc(processo.nome) + "</p>" +
          '<p class="wiz-subeyebrow">Item ' + step.pos + " de " + step.total + " deste processo</p>" +
          '<h1 class="wiz-question">' + esc(it.pergunta) + "</h1>" +
          '<div class="wiz-evidence"><i class="ti ti-file-check" aria-hidden="true"></i><span><b>Evidência esperada:</b> ' + esc(it.evidencia || "-") + tags + "</span></div>" +
          '<div class="wiz-comprov" id="wiz-comprov"></div>' +
          '<div class="wiz-options" id="wiz-options">' +
            opts.map(function (o) {
              var sel = r.status === o.val ? " is-selected" : "";
              return '<button type="button" class="wiz-opt' + sel + '" data-val="' + o.val + '"><i class="ti ' + o.icon + '" aria-hidden="true"></i>' + o.label + "</button>";
            }).join("") +
          "</div>" +
          '<div class="wiz-warn" id="wiz-warn" style="display:' + (precisaAgora && !evOk ? "flex" : "none") + ';">' +
            '<i class="ti ti-alert-triangle" aria-hidden="true"></i><span>Evidência obrigatória - anexe ou justifique.</span>' +
          "</div>" +
          anexoHtml(r) +
          '<div class="wiz-field" id="just-wrap" style="display:' + (precisaAgora && !temAnexo(r) ? "block" : "none") + ';">' +
            '<label for="f-just">Justificativa da ausência de evidência</label>' +
            '<textarea id="f-just" placeholder="Explique por que a evidência não pôde ser anexada">' + esc(r.just) + "</textarea>" +
          "</div>" +
          '<div class="wiz-field"><label for="f-obs">Observações</label><textarea id="f-obs" placeholder="Detalhes, divergências, contexto…">' + esc(r.obs) + "</textarea></div>"
        );
      }

      function renderItemCarregador(step) {
        var it = step.item;
        var r = respostaDe(it.id);
        var isAusente = r.status === "ausente";
        var tags = "";

        var opts = [
          { val: "presente", icon: "ti-check", label: "Presente" },
          { val: "ausente", icon: "ti-x", label: "Ausente" }
        ];

        var blocoAusente = "";
        if (isAusente) {
          blocoAusente =
            '<div class="wiz-warn" id="wiz-warn" style="display:' + (justOk(r) ? "none" : "flex") + ';">' +
              '<i class="ti ti-alert-triangle" aria-hidden="true"></i><span>Item ausente - justificativa e evidência são obrigatórias.</span>' +
            "</div>" +
            '<div class="wiz-field">' +
              '<label for="f-just">Justificativa da ausência (obrigatória)</label>' +
              '<textarea id="f-just" placeholder="Explique por que o item não retornou com o equipamento">' + esc(r.just) + "</textarea>" +
            "</div>" +
            anexoHtml(r);
        }

        return (
          '<p class="wiz-eyebrow">' + esc(carregadores.nome) + "</p>" +
          '<p class="wiz-subeyebrow">Item ' + step.pos + " de " + step.total + "</p>" +
          '<h1 class="wiz-question">' + esc(it.item) + "</h1>" +
          '<div class="wiz-evidence"><i class="ti ti-plug" aria-hidden="true"></i><span>O item obrigatório retornou junto com o equipamento na retirada do assinante?' + tags + "</span></div>" +
          '<div class="wiz-comprov" id="wiz-comprov"></div>' +
          '<div class="wiz-options" id="wiz-options">' +
            opts.map(function (o) {
              var sel = r.status === o.val ? " is-selected" : "";
              return '<button type="button" class="wiz-opt' + sel + '" data-val="' + o.val + '"><i class="ti ' + o.icon + '" aria-hidden="true"></i>' + o.label + "</button>";
            }).join("") +
          "</div>" +
          blocoAusente
        );
      }

      function renderAssinaturas() {
        return (
          '<p class="wiz-eyebrow">' + esc(processo.nome) + " · Finalização</p>" +
          '<h1 class="wiz-question">Classificação e assinaturas</h1>' +
          '<div class="wiz-field"><label for="f-resp-epo">Responsável pela EPO</label><input class="input" id="f-resp-epo" value="' + esc(state.assin.respEpo) + '" placeholder="Nome"></div>' +
          '<div class="wiz-field"><label for="f-resp-claro">Responsável Claro / auditor</label><input class="input" id="f-resp-claro" value="' + esc(state.assin.respClaro) + '" placeholder="Nome"></div>' +
          '<div class="wiz-field"><label for="f-assin-data">Data</label><input class="input" id="f-assin-data" type="date" value="' + esc(state.assin.data) + '"></div>'
        );
      }

      function renderResumo() {
        var r = computeScore();
        var tier = r.answered > 0 ? App.tierOf(r.pts) : null;
        var meta = tier ? App.tierMeta(tier) : null;
        var totalItens = processo.itens.length;

        var statsHtml, extra = "";
        if (isCarregadores) {
          statsHtml =
            '<div class="wiz-summary-stat"><b>' + r.counts.presente + "</b><span>Presente</span></div>" +
            '<div class="wiz-summary-stat"><b>' + r.counts.ausente + "</b><span>Ausente</span></div>" +
            '<div class="wiz-summary-stat"><b>' + r.counts.semResposta + "</b><span>Não respondidos</span></div>";
          var ausencias = processo.itens.filter(function (it) {
            var resp = state.respostas[it.id];
            return resp && resp.status === "ausente";
          });
          if (ausencias.length) {
            extra =
              '<h2 style="font-size:15px;font-weight:700;margin:0 0 10px;">Ausências registradas</h2>' +
              '<ul class="wiz-abs-list">' +
                ausencias.map(function (it) {
                  var resp = state.respostas[it.id];
                  return "<li><b>" + esc(it.item) + "</b>" + esc(resp.just || "Sem justificativa registrada.") + "</li>";
                }).join("") +
              "</ul>";
          }
        } else {
          statsHtml =
            '<div class="wiz-summary-stat"><b>' + r.counts.conforme + "</b><span>Conforme</span></div>" +
            '<div class="wiz-summary-stat"><b>' + r.counts.nao + "</b><span>Não conforme</span></div>" +
            '<div class="wiz-summary-stat"><b>' + r.counts.na + "</b><span>Não se aplica</span></div>" +
            '<div class="wiz-summary-stat"><b>' + r.counts.semResposta + "</b><span>Não respondidos</span></div>";
          var graves = processo.itens.filter(function (it) {
            var resp = state.respostas[it.id];
            return it.grave && resp && resp.status === "nao";
          });
          if (graves.length) {
            extra =
              '<h2 style="font-size:15px;font-weight:700;margin:0 0 10px;">Não conformidades graves</h2>' +
              '<ul class="wiz-abs-list">' +
                graves.map(function (it) {
                  return '<li><b><i class="ti ti-alert-triangle" aria-hidden="true"></i> NC grave</b>' + esc(it.pergunta) + "</li>";
                }).join("") +
              "</ul>";
          }
        }

        return (
          '<p class="wiz-eyebrow">' + esc(processo.nome) + " · Resumo</p>" +
          '<h1 class="wiz-question">Auditoria pronta para envio</h1>' +
          '<div class="wiz-summary-card">' +
            '<div class="wiz-summary-score tnum">' + fmtScore01(r.score01) + "</div>" +
            '<div class="wiz-summary-tier">' + (meta ? '<span class="badge ' + meta.cls + '">' + meta.label + "</span>" : '<span class="badge">Sem avaliação</span>') + "</div>" +
            '<div class="wiz-summary-grid">' + statsHtml + "</div>" +
          "</div>" +
          extra +
          '<p class="hint-static" style="text-align:center;margin-bottom:16px;">' + r.answered + " de " + totalItens + " itens deste processo avaliados. " +
            "Ao enviar, as respostas e os anexos seguem para a dupla checagem da equipe APSIS." + "</p>" +
          '<button type="button" class="wiz-btn wiz-btn-back" style="width:100%;flex:1 1 auto;margin-bottom:8px;" id="btn-rascunho"><i class="ti ti-device-floppy" aria-hidden="true"></i>Salvar rascunho</button>'
        );
      }

      // ------------------------------------------------------------- Render
      function stepAnswered(index) {
        var step = steps[index];
        if (step.type === "contagem") {
          var v = state.contagens[step.def.key];
          return v != null && !isNaN(v);
        }
        if (step.type === "checagem") {
          var rc = state.respostas[step.item.id];
          return !!(rc && rc.status);
        }
        if (step.type !== "item") return true;
        var it = step.item;
        var r = state.respostas[it.id];
        if (!r || !r.status) return false;
        if (isCarregadores) {
          if (r.status === "ausente") return justOk(r);
          return true;
        }
        return evidenciaOk(it, r);
      }

      function renderStep() {
        var step = steps[cur];
        comprovParar(); // encerra polling/consultas do passo anterior
        var html;
        if (step.type === "intro") html = renderIntro();
        else if (step.type === "identificacao") html = renderIdentificacao();
        else if (step.type === "tempo") html = renderTempo(step.def);
        else if (step.type === "contagem") html = renderContagem(step);
        else if (step.type === "resultado") html = renderResultado();
        else if (step.type === "checagem") html = renderChecagem(step);
        else if (step.type === "item") html = isCarregadores ? renderItemCarregador(step) : renderItem(step);
        else if (step.type === "assinaturas") html = renderAssinaturas();
        else html = isContagem ? renderResumoContagem() : renderResumo();

        main.innerHTML = html;
        main.scrollTop = 0;
        wireStep(step);
        updateChrome();
      }

      function wireStep(step) {
        if (step.type === "intro") {
          // a contagem da reversa não vem de auditoria pedida: não tem o botão
          var voltar = document.getElementById("btn-trocar-proc");
          if (voltar) {
            voltar.addEventListener("click", function () {
              window.location.href = urlSeletor();
            });
          }
        } else if (step.type === "identificacao") {
          var epoSel = document.getElementById("f-epo");
          epoSel.addEventListener("change", function () {
            state.epoId = epoSel.value;
            var e = epoAtual();
            if (e) {
              state.cidade = e.cidade || ""; state.uf = e.uf || "";
              document.getElementById("f-epo-local").textContent = state.cidade + " · " + state.uf;
            }
            comprov.eposPromise = null; // trocou de EPO: refaz a busca de anexos
            comprov.cache = null;
          });
          document.getElementById("f-data").addEventListener("input", function (ev) { state.data = ev.target.value; });
          document.getElementById("f-auditor").addEventListener("input", function (ev) { state.auditor = ev.target.value; });
        } else if (step.type === "tempo") {
          var input = document.getElementById("f-tempo");
          var setVal = function (v) {
            v = Math.max(0, Math.round(v * 10) / 10);
            input.value = v;
            state.tempos[step.def.key] = v;
          };
          input.addEventListener("input", function () {
            var v = parseFloat(input.value);
            state.tempos[step.def.key] = isNaN(v) ? null : v;
          });
          Array.prototype.forEach.call(document.querySelectorAll(".wiz-stepper-btn"), function (btn) {
            btn.addEventListener("click", function () {
              var cur0 = parseFloat(input.value) || 0;
              setVal(cur0 + parseFloat(btn.getAttribute("data-step")) * 0.5);
            });
          });
        } else if (step.type === "contagem") {
          var inputC = document.getElementById("f-contagem");
          var setValC = function (v) {
            v = Math.max(0, Math.round(v));
            inputC.value = v;
            state.contagens[step.def.key] = v;
            updateChrome();
          };
          inputC.addEventListener("input", function () {
            var v = parseInt(inputC.value, 10);
            state.contagens[step.def.key] = isNaN(v) ? null : Math.max(0, v);
            updateChrome();
          });
          Array.prototype.forEach.call(document.querySelectorAll(".wiz-stepper-btn"), function (btn) {
            btn.addEventListener("click", function () {
              var cur0 = parseInt(inputC.value, 10) || 0;
              setValC(cur0 + parseInt(btn.getAttribute("data-step"), 10));
            });
          });
        } else if (step.type === "checagem") {
          var itC = step.item;
          var rC = respostaDe(itC.id);
          Array.prototype.forEach.call(document.querySelectorAll(".wiz-opt"), function (btn) {
            btn.addEventListener("click", function () {
              rC.status = btn.getAttribute("data-val");
              renderStep();
            });
          });
          var obsC = document.getElementById("f-obs");
          if (obsC) {
            obsC.addEventListener("input", function (ev) { rC.obs = ev.target.value; });
          }
        } else if (step.type === "item") {
          var it = step.item;
          var r = respostaDe(it.id);

          comprovIniciarPasso(step); // painel de comprovações da EPO (tempo real)

          Array.prototype.forEach.call(document.querySelectorAll(".wiz-opt"), function (btn) {
            btn.addEventListener("click", function () {
              r.status = btn.getAttribute("data-val");
              renderStep(); // re-render: aviso/justificativa dependem da resposta
            });
          });

          wireAnexos(r);

          var just = document.getElementById("f-just");
          if (just) {
            just.addEventListener("input", function (ev) {
              r.just = ev.target.value;
              var warn = document.getElementById("wiz-warn");
              if (warn) {
                var pendente = isCarregadores
                  ? (r.status === "ausente" && !justOk(r))
                  : (!!it.evidencia && (r.status === "conforme" || r.status === "nao") && !temAnexo(r) && !justOk(r));
                warn.style.display = pendente ? "flex" : "none";
              }
              updateChrome();
            });
          }

          var obs = document.getElementById("f-obs");
          if (obs) {
            obs.addEventListener("input", function (ev) { r.obs = ev.target.value; });
          }
        } else if (step.type === "assinaturas") {
          document.getElementById("f-resp-epo").addEventListener("input", function (ev) { state.assin.respEpo = ev.target.value; });
          document.getElementById("f-resp-claro").addEventListener("input", function (ev) { state.assin.respClaro = ev.target.value; });
          document.getElementById("f-assin-data").addEventListener("input", function (ev) { state.assin.data = ev.target.value; });
        } else if (step.type === "resumo") {
          document.getElementById("btn-rascunho").addEventListener("click", function () {
            App.toast("Rascunho salvo.");
          });
        }
      }

      function updateChrome() {
        var step = steps[cur];
        var isIntro = step.type === "intro";
        var isLast = cur === steps.length - 1;

        headerEl.classList.toggle("is-intro", isIntro);

        // Progresso/contador ignoram a capa (passo 0)
        var qTotal = steps.length - 1;
        var pct = (cur / qTotal) * 100;
        progressFill.style.width = pct + "%";
        counterEl.textContent = cur + "/" + qTotal;

        backBtn.style.display = isIntro ? "none" : "";
        backBtn.disabled = cur === 0;

        nextBtn.classList.toggle("is-submit", isLast);
        if (isIntro) {
          nextBtn.innerHTML = (isContagem ? "Iniciar contagem" : "Iniciar auditoria") +
            '<i class="ti ti-arrow-right" aria-hidden="true"></i>';
        } else if (isLast) {
          nextBtn.innerHTML = (isContagem ? "Enviar contagem" : "Enviar auditoria") +
            '<i class="ti ti-send" aria-hidden="true"></i>';
        } else {
          nextBtn.innerHTML = 'Próxima<i class="ti ti-chevron-right" aria-hidden="true"></i>';
        }
        nextBtn.disabled = !stepAnswered(cur);
      }

      function showDone(gravadaNoBanco) {
        headerEl.style.display = "none";
        footer.style.display = "none";

        if (isContagem) {
          var rr = calcReversa();
          var okF = rr.pctFontes != null && rr.pctFontes >= rr.meta;
          var okC = rr.pctControles != null && rr.pctControles >= rr.meta;
          main.innerHTML =
            '<div class="wiz-done">' +
              '<div class="wiz-done-icon"><i class="ti ti-circle-check" aria-hidden="true"></i></div>' +
              '<h1 class="wiz-done-title">Contagem enviada</h1>' +
              '<p class="wiz-done-sub"><b>' + esc(CONTAGEM.nome) + "</b> registrada com sucesso.</p>" +
              '<div class="wiz-done-score">' +
                '<span class="badge ' + (okF ? "badge-success" : "badge-danger") + '">Fontes ' + fmtPctRev(rr.pctFontes) + "</span>" +
                '<span class="badge ' + (okC ? "badge-success" : "badge-danger") + '">Controles ' + fmtPctRev(rr.pctControles) + "</span>" +
              "</div>" +
              '<div class="wiz-done-actions">' +
                '<a class="wiz-btn wiz-btn-next" href="' + urlSeletor() + '"><i class="ti ti-clipboard-list" aria-hidden="true"></i>Outras auditorias pendentes</a>' +
                '<a class="wiz-btn wiz-btn-back" href="index.html"><i class="ti ti-home" aria-hidden="true"></i>Voltar à página inicial</a>' +
              "</div>" +
            "</div>";
          main.scrollTop = 0;
          return;
        }

        var r = computeScore();
        var tier = r.answered > 0 ? App.tierOf(r.pts) : null;
        var meta = tier ? App.tierMeta(tier) : null;

        main.innerHTML =
          '<div class="wiz-done">' +
            '<div class="wiz-done-icon"><i class="ti ti-circle-check" aria-hidden="true"></i></div>' +
            '<h1 class="wiz-done-title">Auditoria enviada</h1>' +
            '<p class="wiz-done-sub">Checklist de <b>' + esc(processo.nome) + "</b> concluído com sucesso. " +
              "Enviada para dupla checagem: a equipe APSIS vai comparar suas respostas e evidências com as do responsável da EPO." + "</p>" +
            '<div class="wiz-done-score">' +
              (meta ? '<span class="badge ' + meta.cls + '">' + meta.label + "</span>" : "") +
              '<strong class="tnum">' + fmtScore01(r.score01) + " / 1,00</strong>" +
            "</div>" +
            '<div class="wiz-done-actions">' +
              '<a class="wiz-btn wiz-btn-next" href="' + urlSeletor() + '"><i class="ti ti-clipboard-list" aria-hidden="true"></i>Outras auditorias pendentes</a>' +
              '<a class="wiz-btn wiz-btn-back" href="index.html"><i class="ti ti-home" aria-hidden="true"></i>Voltar à página inicial</a>' +
            "</div>" +
          "</div>";
        main.scrollTop = 0;
      }

      // ------------------------------------------------- Envio real (Supabase)
      // Só quando há Supabase configurado, fora do modo demo e com sessão ativa.
      // Contagem da reversa não existe no catálogo do banco: segue local.
      function sanitizarNome(nome) {
        var s = String(nome || "arquivo").toLowerCase().replace(/[^a-z0-9._-]/g, "_");
        return s.length > 80 ? s.slice(-80) : s;
      }

      var sendingEl = null;
      function mostrarEnvio(on) {
        if (on) {
          if (!sendingEl) {
            sendingEl = document.createElement("div");
            sendingEl.className = "wiz-sending";
            sendingEl.innerHTML = '<div class="wiz-sending-spin" aria-hidden="true"></div><p>Enviando auditoria…</p>';
            document.body.appendChild(sendingEl);
          }
        } else if (sendingEl) {
          sendingEl.remove();
          sendingEl = null;
        }
        nextBtn.disabled = on;
      }

      var MAPA_STATUS_DB = { conforme: "conforme", nao: "nao_conforme", na: "na", presente: "presente", ausente: "ausente" };

      function enviarReal(sess) {
        mostrarEnvio(true);
        var db = Auth.cliente;
        var epoMock = App.epoById(state.epoId);
        var procDb = null, itensDb = [], audId = null;

        db.from("processos").select("id").eq("slug", processo.id).eq("ativo", true).single()
          .then(function (r) {
            if (r.error || !r.data) throw new Error("Processo não encontrado no banco: " + processo.id);
            procDb = r.data;
            return db.from("itens_checklist").select("id")
              .eq("processo_id", procDb.id).eq("ativo", true).order("ordem");
          })
          .then(function (r) {
            if (r.error) throw r.error;
            itensDb = r.data || [];
            return db.from("epos").select("id, nome").eq("ativo", true);
          })
          .then(function (r) {
            if (r.error) throw r.error;
            var lista = r.data || [];
            var epoDb = null;
            var i;
            // 1) id do banco (select já carregado por carregarContexto)
            for (i = 0; i < lista.length; i++) {
              if (lista[i].id === state.epoId) { epoDb = lista[i]; break; }
            }
            // 2) rede de segurança: casa pelo nome do catálogo local
            if (!epoDb) {
              for (i = 0; i < lista.length; i++) {
                if (epoMock && lista[i].nome === epoMock.nome) { epoDb = lista[i]; break; }
              }
            }
            if (!epoDb) {
              epoDb = lista[0];
              console.warn("EPO \"" + (epoMock ? epoMock.nome : state.epoId) + "\" não encontrada no banco; usando a primeira EPO cadastrada.");
            }
            if (!epoDb) throw new Error("Nenhuma EPO cadastrada no banco.");
            var sc = computeScore();
            return db.from("auditorias").insert({
              epo_id: epoDb.id,
              processo_id: procDb.id,
              alocacao_id: aloc ? aloc.id : null,
              auditor_id: sess.user.id,
              data_visita: state.data || new Date().toISOString().slice(0, 10),
              status: "enviada",
              score: Math.round(sc.pts * 100) / 100,
              tier: sc.answered > 0 ? App.tierOf(sc.pts) : null,
              resp_epo: (state.assin.respEpo || "").trim() || null,
              resp_claro: (state.assin.respClaro || "").trim() || null,
              enviada_em: new Date().toISOString()
            }).select("id").single();
          })
          .then(function (r) {
            if (r.error) throw r.error;
            audId = r.data.id;
            // Respostas: item do wizard -> item do banco PELO ÍNDICE (mesma ordem)
            var rows = [];
            processo.itens.forEach(function (it, idx) {
              var resp = state.respostas[it.id];
              var itemDb = itensDb[idx];
              if (!resp || !resp.status || !itemDb) return;
              rows.push({
                auditoria_id: audId,
                item_id: itemDb.id,
                status: MAPA_STATUS_DB[resp.status] || resp.status,
                observacao: (resp.obs || "").trim() || null,
                justificativa: (resp.just || "").trim() || null
              });
            });
            if (!rows.length) return { data: [] };
            return db.from("respostas").insert(rows).select("id, item_id");
          })
          .then(function (r) {
            if (r.error) throw r.error;
            var respIdPorItemDb = {};
            (r.data || []).forEach(function (x) { respIdPorItemDb[x.item_id] = x.id; });
            // Fila de uploads: um a um, para não estourar conexões no celular
            var fila = [];
            processo.itens.forEach(function (it, idx) {
              var resp = state.respostas[it.id];
              var itemDb = itensDb[idx];
              if (!resp || !itemDb || !temAnexo(resp)) return;
              var respostaId = respIdPorItemDb[itemDb.id];
              if (!respostaId) return;
              resp.arquivos.forEach(function (file) {
                fila.push({ file: file, itemDbId: itemDb.id, respostaId: respostaId });
              });
            });
            var p = Promise.resolve();
            fila.forEach(function (job) {
              p = p.then(function () {
                var path = "auditorias/" + audId + "/" + job.itemDbId + "/" + Date.now() + "-" + sanitizarNome(job.file.name);
                return db.storage.from("evidencias").upload(path, job.file).then(function (up) {
                  if (up.error) throw up.error;
                  return db.from("evidencias").insert({
                    resposta_id: job.respostaId,
                    storage_path: path,
                    tipo: (job.file.type || "").indexOf("image") === 0 ? "foto" : "arquivo",
                    origem: "consultor"
                  }).then(function (ins) { if (ins.error) throw ins.error; });
                });
              });
            });
            return p;
          })
          .then(function () {
            // encaminha as evidencias para a pasta oficial, em segundo plano
            if (audId && db.functions) {
              db.functions.invoke("sincronizar-sharepoint", { body: { auditoria_id: audId } })
                .then(function (r) {
                  if (r && r.error) console.warn("encaminhamento:", r.error.message || r.error);
                }, function (e) { console.warn("encaminhamento:", e); });
            }
            mostrarEnvio(false);
            showDone(true);
          })
          .catch(function (err) {
            mostrarEnvio(false);
            console.error("Falha ao enviar auditoria:", err);
            App.toast("Não foi possível enviar a auditoria. Confira a conexão e tente novamente.");
            updateChrome(); // reabilita o botão conforme o passo atual
          });
      }

      backBtn.addEventListener("click", function () {
        if (cur > 0) {
          cur -= 1;
          comprov.cache = null; // trocou de passo: recarrega do banco
          renderStep();
        }
      });

      nextBtn.addEventListener("click", function () {
        if (nextBtn.disabled) return;
        if (cur === steps.length - 1) {
          if (envioReal) {
            nextBtn.disabled = true; // evita duplo envio enquanto busca a sessão
            Auth.sessao().then(function (s) {
              if (s) enviarReal(s);
              else showDone(false); // sem sessão (ex.: expirada): não grava
            });
          } else {
            showDone(false);
          }
          return;
        }
        cur += 1;
        comprov.cache = null; // trocou de passo: recarrega do banco
        renderStep();
      });

      renderStep();

      // Contexto do banco (EPOs reais + relatorio pedido): a capa e a
      // identificacao sao repintadas quando os dados chegam.
      contexto().then(function () {
        var s0 = steps[cur];
        if (s0 && (s0.type === "intro" || s0.type === "identificacao")) renderStep();
      });
    })();
  </script>
