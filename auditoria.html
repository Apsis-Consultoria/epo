<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Do que a pagina pode carregar. Sem isto qualquer endereco servia: script de
       fora, imagem de fora, chamada para fora. A lista abaixo e o que o sistema
       usa de verdade - a biblioteca do banco, o grafico, o mapa, as fontes, o
       captcha e o proprio projeto. O resto o navegador recusa.
       'unsafe-inline' segue necessario: as telas tem script e estilo escritos
       dentro do HTML. Tirar isso e reescrever as 21 telas, e fica para depois.
       frame-ancestors nao entra aqui: em <meta> o navegador ignora essa regra,
       ela so vale em cabecalho, e o servidor de paginas nao deixa mandar um. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://challenges.cloudflare.com;
    style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;
    img-src 'self' data: blob: https://vpkxoyfbxgnizymaurek.supabase.co https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://server.arcgisonline.com;
    connect-src 'self' https://vpkxoyfbxgnizymaurek.supabase.co https://challenges.cloudflare.com https://viacep.com.br https://nominatim.openstreetmap.org;
    frame-src https://challenges.cloudflare.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests;
  ">
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon-claro.svg?v=138">
  <!-- Reserva: o Safari nao usa favicon em SVG. -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png?v=138">
  <link rel="apple-touch-icon" href="assets/brand/favicon-180.png?v=138">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <title>Auditoria de EPOs</title>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/fonts/tabler-icons.woff2?v3.11.0">
  <link rel="stylesheet" href="assets/icones.css?v=138">
  <link rel="stylesheet" href="assets/carregando.css?v=138">
  <link rel="stylesheet" href="assets/app.css?v=138">
  <style>
    /* ==========================================================================
       Assistente de auditoria - mobile-first, uma pergunta por tela.
       Um checklist independente POR PROCESSO (?processo=ID).
       Pensado para ser aberto no navegador do celular em campo.
       ========================================================================== */
    html, body { height: 100%; }
    body.wiz-body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-base); }

    .wiz-shell {
      min-height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 560px;
      margin: 0 auto;
      background: var(--surface);
      position: relative;
    }

    .wiz-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: max(12px, env(safe-area-inset-top)) 16px 10px;
      flex: 0 0 auto;
    }
    .wiz-icon-btn {
      width: 36px; height: 36px; flex: 0 0 36px;
      border-radius: 50%;
      border: 0;
      background: var(--surface-2);
      color: var(--text-2);
      display: grid; place-items: center;
      font-size: 18px;
      text-decoration: none;
    }
    .wiz-progress-track { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
    .wiz-progress-fill { height: 100%; background: var(--primary); border-radius: 99px; width: 0%; transition: width .25s ease; }
    .wiz-counter { flex: 0 0 auto; min-width: 42px; text-align: right; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }

    .wiz-main { flex: 1; overflow-y: auto; padding: 10px 20px 28px; -webkit-overflow-scrolling: touch; }
    .wiz-eyebrow { font-size: 12px; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; }
    .wiz-subeyebrow { font-size: 12px; color: var(--text-muted); margin: -4px 0 14px; }
    .wiz-question { font-size: 21px; font-weight: 700; line-height: 1.32; color: var(--text); margin: 0 0 14px; }

    .wiz-evidence { display: flex; gap: 8px; align-items: flex-start; background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; color: var(--text-2); margin-bottom: 20px; line-height: 1.5; }
    .wiz-evidence i { font-size: 16px; flex: 0 0 auto; margin-top: 2px; color: var(--text-2); }
    .wiz-evidence b { color: var(--text); font-weight: 600; }
    .wiz-evidence .evidence-tag { margin-top: 6px; }
    .evidence-tag.tag-grave { background: var(--danger-bg); color: var(--danger); }

    /* Evidências recebidas da Claro e da EPO (anexadas antes ou durante a visita).
       Painel compacto, lista vertical, miniatura 44px, toque >= 44px. */
    .wiz-comprov {
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); padding: 11px 12px; margin: -8px 0 20px;
    }
    .wiz-comprov-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text); }
    .wiz-comprov-head > i { font-size: 16px; color: var(--primary); flex: 0 0 auto; }
    .wiz-comprov-count {
      margin-left: auto; flex: 0 0 auto;
      background: var(--primary); color: #fff;
      border-radius: 99px; min-width: 20px; padding: 1px 7px;
      font-size: 11px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums;
    }
    .wiz-comprov-msg { margin: 8px 0 0; font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
    .wiz-comprov-novo {
      display: flex; gap: 6px; align-items: flex-start;
      background: var(--warning-bg); color: var(--warning);
      border-radius: var(--radius-sm); padding: 8px 10px; margin: 9px 0 0;
      font-size: 12px; font-weight: 600; line-height: 1.45;
    }
    .wiz-comprov-novo i { font-size: 15px; flex: 0 0 auto; margin-top: 1px; }
    .wiz-comprov-list { list-style: none; margin: 9px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .wiz-comprov-item {
      display: flex; align-items: center; gap: 10px; min-height: 44px;
      background: var(--surface-2); border-radius: var(--radius-sm); padding: 6px 8px;
    }
    .wiz-comprov-item > i { font-size: 19px; color: var(--primary); flex: 0 0 32px; text-align: center; }
    .wiz-comprov-thumb {
      width: 44px; height: 44px; flex: 0 0 44px; border-radius: 8px;
      object-fit: cover; background: var(--surface); display: block;
    }
    .wiz-comprov-info { flex: 1; min-width: 0; }
    .wiz-comprov-nome {
      display: block; font-size: 13px; font-weight: 600; color: var(--text);
      text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 100%; text-align: left; background: none; border: 0; padding: 0;
      font-family: inherit; cursor: pointer;
    }
    button.wiz-comprov-nome:active, button.wiz-comprov-nome:hover { color: var(--primary); text-decoration: underline; }
    .wiz-comprov-meta { display: block; font-size: 11.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wiz-comprov-open {
      width: 44px; height: 44px; flex: 0 0 44px; border-radius: 10px;
      display: grid; place-items: center; color: var(--text-2); text-decoration: none; font-size: 17px;
      -webkit-tap-highlight-color: transparent;
    }
    .wiz-comprov-open:active { background: var(--surface); }
    .wiz-comprov-sp { display: flex; gap: 6px; align-items: flex-start; margin: 10px 0 0; font-size: 11.5px; color: var(--text-muted); line-height: 1.45; }
    .wiz-comprov-sp i { font-size: 14px; flex: 0 0 auto; margin-top: 1px; }

    /* Aviso âmbar - evidência obrigatória */
    .wiz-warn {
      display: flex; gap: 8px; align-items: flex-start;
      background: var(--warning-bg); color: var(--warning);
      border-radius: var(--radius-sm); padding: 11px 13px;
      font-size: 13px; font-weight: 600; margin-bottom: 14px; line-height: 1.45;
    }
    .wiz-warn i { font-size: 16px; flex: 0 0 auto; margin-top: 1px; }

    .wiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .wiz-opt {
      display: flex; align-items: center; gap: 12px; width: 100%;
      min-height: 56px; padding: 14px 16px;
      border-radius: var(--radius); border: 1.5px solid var(--border);
      background: var(--surface); font-size: 15px; font-weight: 600; color: var(--text);
      cursor: pointer; transition: border-color .15s ease, background .15s ease, color .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .wiz-opt i { font-size: 20px; flex: 0 0 auto; color: var(--text-muted); }
    .wiz-opt[data-val="conforme"].is-selected,
    .wiz-opt[data-val="presente"].is-selected { border-color: var(--success); background: var(--success-bg); color: var(--success); }
    .wiz-opt[data-val="conforme"].is-selected i,
    .wiz-opt[data-val="presente"].is-selected i { color: var(--success); }
    .wiz-opt[data-val="nao"].is-selected,
    .wiz-opt[data-val="ausente"].is-selected { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
    .wiz-opt[data-val="nao"].is-selected i,
    .wiz-opt[data-val="ausente"].is-selected i { color: var(--danger); }
    .wiz-opt[data-val="na"].is-selected { border-color: var(--text-muted); background: var(--surface-2); color: var(--text); }
    .wiz-opt[data-val="na"].is-selected i { color: var(--text-2); }

    .wiz-field { margin-bottom: 18px; }
    .wiz-field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
    .wiz-field input, .wiz-field select, .wiz-field textarea {
      width: 100%; padding: 13px 14px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: var(--surface);
      font-size: 16px; color: var(--text); font-family: inherit;
    }
    .wiz-field textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
    .wiz-field .hint-static { font-size: 13px; color: var(--text-muted); margin-top: 6px; }

    .wiz-attach {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      min-height: 52px; padding: 14px; border-radius: var(--radius);
      border: 1.5px dashed var(--border-strong); background: var(--surface-2);
      color: var(--text-2); font-size: 14px; font-weight: 600; margin-bottom: 12px; cursor: pointer;
    }
    .wiz-attach.is-attached { border-style: solid; border-color: var(--success); color: var(--success); background: var(--success-bg); }
    .wiz-attach i { font-size: 18px; }

    /* Dois botões lado a lado: tirar foto (câmera) + anexar arquivo */
    .wiz-attach-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .wiz-attach-row .wiz-attach { flex: 1; margin-bottom: 0; padding: 12px 8px; font-size: 13px; }

    /* Chips dos arquivos anexados em memória (nome + remover) */
    .wiz-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
    .wiz-chip {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      background: var(--success-bg); color: var(--success);
      border-radius: 99px; padding: 6px 6px 6px 11px; font-size: 12px; font-weight: 600;
    }
    .wiz-chip .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
    .wiz-chip button {
      border: 0; background: none; color: inherit; cursor: pointer;
      display: grid; place-items: center; font-size: 15px; padding: 2px; line-height: 1;
    }

    /* Overlay exibido enquanto a auditoria esta sendo enviada */
    .wiz-sending {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(255, 255, 255, .88);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    .wiz-sending-spin {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid var(--surface-2); border-top-color: var(--primary);
      animation: wizspin .8s linear infinite;
    }
    .wiz-sending p { margin: 0; font-size: 15px; font-weight: 600; color: var(--text); }
    @keyframes wizspin { to { transform: rotate(360deg); } }


    .wiz-tempo-stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 28px 0 8px; }
    .wiz-stepper-btn {
      width: 48px; height: 48px; border-radius: 50%; flex: 0 0 48px;
      border: 1.5px solid var(--border-strong); background: var(--surface);
      color: var(--text); font-size: 22px; font-weight: 600; display: grid; place-items: center; cursor: pointer;
    }
    .wiz-stepper-btn:active { background: var(--surface-2); }
    .wiz-tempo-input-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 120px; }
    .wiz-tempo-input-wrap input {
      width: 120px; text-align: center; font-size: 38px; font-weight: 700;
      border: 0; border-bottom: 2px solid var(--border-strong); background: transparent; color: var(--text);
      padding: 4px 0;
    }
    .wiz-tempo-input-wrap input:focus { outline: none; border-color: var(--primary); }
    .wiz-tempo-input-wrap span { font-size: 13px; color: var(--text-muted); }

    .wiz-summary-card { background: var(--surface-2); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; text-align: center; }
    .wiz-summary-score { font-size: 42px; font-weight: 700; line-height: 1; }
    .wiz-summary-tier { margin-top: 8px; }
    .wiz-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .wiz-summary-stat { background: var(--surface); border-radius: var(--radius-sm); padding: 12px; }
    .wiz-summary-stat b { display: block; font-size: 20px; line-height: 1.2; }
    .wiz-summary-stat span { font-size: 12px; color: var(--text-2); }

    /* Lista de ausências (checklist de itens obrigatórios) */
    .wiz-abs-list { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; }
    .wiz-abs-list li { background: var(--danger-bg); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; color: var(--text); line-height: 1.5; }
    .wiz-abs-list li b { display: block; color: var(--danger); }

    .wiz-skip { display: block; width: 100%; text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 2px; text-decoration: underline; background: none; border: 0; cursor: pointer; padding: 10px; }

    /* Tela de capa - exibida antes do questionário e ao concluir o envio */
    .wiz-header.is-intro .wiz-progress-track,
    .wiz-header.is-intro .wiz-counter { display: none; }

    .wiz-intro { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 4px 8px; }
    .wiz-intro-icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--primary-tint); color: var(--primary);
      display: grid; place-items: center; font-size: 34px; margin-bottom: 20px;
    }
    .wiz-intro-title { font-size: 26px; font-weight: 700; color: var(--text); margin: 0 0 10px; }
    .wiz-intro-sub { font-size: 15px; color: var(--text-2); line-height: 1.6; max-width: 360px; margin: 0 0 24px; }
    .wiz-intro-stats { display: flex; gap: 10px; width: 100%; margin-bottom: 24px; }
    .wiz-intro-stat { flex: 1; background: var(--surface-2); border-radius: var(--radius-sm); padding: 14px 8px; }
    .wiz-intro-stat b { display: block; font-size: 20px; font-weight: 700; color: var(--text); }
    .wiz-intro-stat span { font-size: 11px; color: var(--text-2); }
    .wiz-intro-list { list-style: none; margin: 0; padding: 0; width: 100%; text-align: left; display: flex; flex-direction: column; gap: 12px; }
    .wiz-intro-list li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-2); }
    .wiz-intro-list li i { font-size: 18px; color: var(--success); flex: 0 0 auto; }

    /* Seletor de processo (capa sem ?processo=) */
    .proc-grid { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
    .proc-card {
      display: flex; align-items: center; gap: 14px; width: 100%;
      min-height: 64px; padding: 12px 14px; text-align: left;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      background: var(--surface); cursor: pointer; font-family: inherit;
      transition: border-color .15s ease, background .15s ease, transform .1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .proc-card:active { background: var(--surface-2); transform: scale(.99); }
    .proc-card-icon {
      width: 42px; height: 42px; flex: 0 0 42px; border-radius: 12px;
      background: var(--primary-tint); color: var(--primary);
      display: grid; place-items: center; font-size: 22px;
    }
    .proc-card-info { flex: 1; min-width: 0; }
    .proc-card-info b { display: block; font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .proc-card-info span { font-size: 12px; color: var(--text-2); }
    .proc-card-caret { color: var(--text-muted); font-size: 18px; flex: 0 0 auto; }
    .proc-card.is-destaque { border-color: var(--primary); }
    .proc-card.is-destaque .proc-card-icon { background: var(--primary-tint); color: var(--primary); }

    /* Tela cheia de confirmação (após enviar) */
    .wiz-done {
      min-height: 100dvh; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      padding: 32px 24px max(28px, env(safe-area-inset-bottom));
    }
    .wiz-done-icon {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--success-bg); color: var(--success);
      display: grid; place-items: center; font-size: 52px; margin-bottom: 24px;
    }
    .wiz-done-title { font-size: 27px; font-weight: 700; color: var(--text); margin: 0 0 10px; }
    .wiz-done-sub { font-size: 15px; color: var(--text-2); line-height: 1.6; max-width: 340px; margin: 0 0 22px; }
    .wiz-done-score { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 30px; }
    .wiz-done-score strong { font-size: 22px; font-weight: 700; }
    .wiz-done-actions { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px; }
    .wiz-done-actions .wiz-btn { width: 100%; flex: 0 0 auto; text-decoration: none; }

    .wiz-footer {
      display: flex; gap: 10px; flex: 0 0 auto;
      padding: 12px 16px max(14px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border); background: var(--surface);
      position: sticky; bottom: 0;
    }
    .wiz-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      height: 50px; border-radius: var(--radius); font-size: 15px; font-weight: 600;
      border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .wiz-btn i { font-size: 18px; }
    .wiz-btn-back { flex: 0 0 100px; background: var(--surface-2); color: var(--text-2); }
    .wiz-btn-back:disabled { visibility: hidden; }
    .wiz-btn-next { flex: 1; background: var(--primary); color: #fff; }
    .wiz-btn-next:disabled { opacity: .4; cursor: not-allowed; }
    /* O envio e o mesmo vermelho da marca, um tom mais escuro: fecha o
       questionario e precisa se distinguir do "Proxima". */
    .wiz-btn-next.is-submit { background: var(--primary-600); }

    /* Contagem da reversa - resultado ao vivo (% de retorno vs meta) */
    .rev-metric { background: var(--surface-2); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
    .rev-metric-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .rev-metric-top b { font-size: 14px; font-weight: 600; color: var(--text); }
    .rev-metric-top b i { margin-right: 4px; color: var(--text-2); }
    .rev-metric-pct { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .rev-metric-pct.is-ok, .rev-metric-frase.is-ok { color: var(--success); }
    .rev-metric-pct.is-bad, .rev-metric-frase.is-bad { color: var(--danger); }
    .rev-metric-frase { margin: 12px 0 0; font-size: 13px; font-weight: 600; line-height: 1.5; }
    .rev-metric-base { margin: 4px 0 0; font-size: 12px; color: var(--text-muted); }

    /* Checagens no resumo da contagem */
    .rev-check-list { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .rev-check-list li { display: flex; gap: 8px; align-items: flex-start; background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; color: var(--text-2); line-height: 1.5; }
    .rev-check-list li i { font-size: 16px; margin-top: 2px; flex: 0 0 auto; }

    @media (min-width: 640px) {
      body.wiz-body { background: var(--surface-2); }
      .wiz-shell { margin: 28px auto; min-height: calc(100vh - 56px); border-radius: 20px; box-shadow: var(--shadow-md); overflow: hidden; }
    }
  </style>
</head>
<body class="wiz-body">
  <div class="tela-carregando" id="tela-carregando" role="status" aria-label="Carregando">
    <span class="claro-loader" aria-hidden="true"></span>
  </div>
  <div class="wiz-shell">
    <header class="wiz-header" id="wiz-header">
      <a class="wiz-icon-btn" id="wiz-sair" href="pendentes" aria-label="Voltar"><i class="ti ti-arrow-left" aria-hidden="true"></i></a>
      <div class="wiz-progress-track"><div class="wiz-progress-fill" id="wiz-progress"></div></div>
      <span class="wiz-counter" id="wiz-counter">1/1</span>
    </header>
    <main class="wiz-main" id="wiz-main"></main>
    <footer class="wiz-footer" id="wiz-footer">
      <button class="wiz-btn wiz-btn-back" id="wiz-back" type="button"><i class="ti ti-chevron-left" aria-hidden="true"></i>Voltar</button>
      <button class="wiz-btn wiz-btn-next" id="wiz-next" type="button">Próxima<i class="ti ti-chevron-right" aria-hidden="true"></i></button>
    </footer>
  </div>

  <script src="assets/data.js?v=138"></script>
  <script src="assets/app.js?v=138"></script>
  <script src="assets/supabase-config.js?v=138"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
          integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/auth.js?v=138"></script>
  <script>
    (function () {
      var esc = App.escapeHtml;
      var epos = window.APP.epos || [];
      var processos = window.APP.processos || [];
      var carregadores = window.APP.checklistCarregadores || null;

      // Contagem da reversa - questionário operacional preenchido na hora em
      // que o técnico recebe a devolução. Não existe em APP.processos
      // (App.processoById retorna null para este id), então o bloco de dados
      // vive aqui, junto do wizard que o consome.
      var CONTAGEM = {
        id: "contagem-reversa",
        nome: "Contagem Logística Reversa",
        icone: "ti-clipboard-list",
        descricao: "Recebimento da devolução - contagem de equipamentos e acessórios",
        meta: 75, // % mínimo de retorno de fontes e controles (metaFontes/metaControles)
        contagens: [
          { key: "equipamentos", label: "Quantos equipamentos foram recebidos nesta devolução?", unidade: "equipamentos", icon: "ti-device-tv", hint: "Conte todos os equipamentos que chegaram do campo nesta leva (decoders, modems, ONTs)." },
          { key: "fontes", label: "Quantas fontes retornaram junto com os equipamentos?", unidade: "fontes", icon: "ti-plug", hint: "Base do % de retorno de fontes: fontes recebidas dividido pelos equipamentos recebidos." },
          { key: "controles", label: "Quantos controles remotos retornaram?", unidade: "controles", icon: "ti-device-remote", hint: "Conte apenas controles em condição de reaproveitamento." },
          { key: "equipControle", label: "Quantos dos equipamentos recebidos usam controle remoto?", unidade: "equipamentos", icon: "ti-device-tv-old", hint: "Base do % de retorno de controles: nem todo equipamento usa controle (ex.: modems)." }
        ],
        checagens: [
          { id: "cr-01", pergunta: "Fontes conferidas e testadas por amostragem" },
          { id: "cr-02", pergunta: "Controles conferidos" },
          { id: "cr-03", pergunta: "Cabos/acessórios segregados por tipo" },
          { id: "cr-04", pergunta: "Divergências registradas com RNC" }
        ]
      };

      var main = document.getElementById("wiz-main");
      var footer = document.getElementById("wiz-footer");
      var headerEl = document.getElementById("wiz-header");
      var backBtn = document.getElementById("wiz-back");
      var nextBtn = document.getElementById("wiz-next");
      var progressFill = document.getElementById("wiz-progress");
      var counterEl = document.getElementById("wiz-counter");

      // ------------------------------------------------------------ Contexto
      var epoParam = App.getParam("epo");
      // ?alocacao= : a auditoria nasce de um relatorio pedido na criacao da EPO
      // (tela "Relatorios pendentes"). Com ele sabemos a EPO, o responsavel e
      // onde estao os anexos que ele ja enviou.
      var alocParam = App.getParam("alocacao");
      var epoIdInicial = (epoParam && App.epoById(epoParam)) ? epoParam : (epos[0] && epos[0].id);
      var procParam = App.getParam("processo");
      var isContagem = procParam === CONTAGEM.id;

      // O questionário de verdade é o que está cadastrado em Configurações >
      // Questionários. O catálogo local serve de reserva: sustenta a
      // demonstração sem login e a capa enquanto o cadastro é lido.
      var processoLocal = isContagem ? CONTAGEM : (procParam ? App.processoById(procParam) : null);
      var processo = processoLocal || (procParam
        ? { id: procParam, nome: "Questionário", icone: "ti-clipboard-list", descricao: "", peso: null, itens: [] }
        : null);
      var isCarregadores = !!(processoLocal && carregadores && processoLocal.id === carregadores.id);

      // Quando a auditoria veio de um relatorio pedido, "voltar" é a lista de
      // relatorios pendentes; senao, é o seletor de processo desta tela.
      function urlSeletor() {
        return "pendentes";
      }
      function rotuloSeletor() {
        return "Voltar às auditorias pendentes";
      }

      // A seta do topo volta para a lista de onde a auditoria foi aberta, e não
      // para a página inicial: de lá se escolhe outra EPO ou outro questionário.
      (function () {
        var sair = document.getElementById("wiz-sair");
        if (!sair) return;
        sair.setAttribute("href", urlSeletor());
        sair.setAttribute("aria-label", rotuloSeletor());
        sair.setAttribute("title", rotuloSeletor());
      })();

      /* ====================================================================
         SEM ?processo= : nao existe mais abrir auditoria por conta propria.
         A auditoria sempre nasce de um pedido feito na criacao da EPO, e o
         caminho e a tela de auditorias pendentes.
         ==================================================================== */
      if (!processo) {
        window.location.replace("pendentes");
        return;
      }

      /* ====================================================================
         MODO 2 - WIZARD DO PROCESSO ESCOLHIDO (?processo=ID)
         ==================================================================== */
      document.title = processo.nome + " - Auditoria de EPOs";

      // Tempos do ciclo: só nos processos onde a etapa acontece de fato.
      // Fluxo: chegada -> armazenagem -> distribuição -> retorno de campo -> devolução.
      var TEMPOS_POR_PROCESSO = {
        "recebimento-expedicao": [
          { key: "chegada", label: "Tempo de chegada: quantos dias entre a saída do material da Claro e a entrada na EPO?", icon: "ti-truck-delivery" },
          { key: "armazenagem", label: "Tempo de armazenagem: quantos dias o material permanece em estoque até ser distribuído?", icon: "ti-building-warehouse" }
        ],
        "reversa": [
          { key: "distribuicao", label: "Tempo de distribuição: quantos dias até o material chegar ao técnico?", icon: "ti-package-export" },
          { key: "retornoCampo", label: "Tempo de retorno de campo: quantos dias até o material retirado voltar do campo à EPO?", icon: "ti-arrow-back-up" },
          { key: "devolucao", label: "Tempo de devolução: quantos dias entre o retorno de campo e o despacho para a Claro?", icon: "ti-truck-return" }
        ]
      };
      var temposDefs = isContagem ? [] : (TEMPOS_POR_PROCESSO[processo.id] || []);

      // Envio real: Supabase configurado, fora do modo demo e processo do
      // catálogo do banco (contagem-reversa é operacional/local).
      var envioReal = !isContagem && window.Auth && Auth.pronto && !Auth.modoDemo();

      // Os passos são remontados quando as perguntas chegam do cadastro: a
      // pergunta incluída, editada ou desativada lá vale aqui na hora seguinte.
      var steps = [];
      function montarPassos() {
        steps = [];
        steps.push({ type: "intro" });
        steps.push({ type: "identificacao" });
        if (isContagem) {
          // Contagem da reversa: contagens -> resultado ao vivo -> checagem dos
          // acessórios -> resumo. Sem tempos e sem assinaturas: a contagem é
          // operacional, feita no ato do recebimento.
          CONTAGEM.contagens.forEach(function (def, ii) {
            steps.push({ type: "contagem", def: def, pos: ii + 1, total: CONTAGEM.contagens.length });
          });
          steps.push({ type: "resultado" });
          CONTAGEM.checagens.forEach(function (item, ii) {
            steps.push({ type: "checagem", item: item, pos: ii + 1, total: CONTAGEM.checagens.length });
          });
        } else {
          temposDefs.forEach(function (def) { steps.push({ type: "tempo", def: def }); });
          processo.itens.forEach(function (item, ii) {
            steps.push({ type: "item", item: item, pos: ii + 1, total: processo.itens.length });
          });
          steps.push({ type: "assinaturas" });
        }
        steps.push({ type: "resumo" });
      }
      montarPassos();

      // ---------------------------------------------------------------- Estado
      var state = {
        epoId: epoIdInicial,
        cidade: "", uf: "", data: "", auditor: "",
        tempos: { chegada: null, armazenagem: null, distribuicao: null, retornoCampo: null, devolucao: null },
        contagens: { equipamentos: null, fontes: null, controles: null, equipControle: null },
        respostas: {}, // id -> { status, obs, just, arquivos: File[] }
        assin: { respEpo: "" }
      };
      (function initEpo() {
        var e = App.epoById(state.epoId);
        if (e) { state.cidade = e.cidade; state.uf = e.uf; }
      })();

      var cur = 0;

      /* ====================================================================
         CONTEXTO REAL (banco)
         Fora do modo demo a lista de EPOs vem do banco - o select passa a
         guardar o uuid, e nao mais o id ficticio de data.js. Quando a
         auditoria nasce de um relatorio pedido (?alocacao=), a EPO, o
         responsavel e a visita prevista ja vem definidos e a EPO fica travada.
         ==================================================================== */
      var eposDb = null;   // [{ id, nome, cidade, uf }] do banco
      var aloc = null;     // linha de alocacoes (relatorio pedido)
      var alocFalhou = false;   // pedido informado na URL que nao pode ser lido
      var contextoPromise = null;

      function eposDisponiveis() { return eposDb || epos; }

      function epoAtual() {
        var lista = eposDisponiveis();
        for (var i = 0; i < lista.length; i++) {
          if (lista[i].id === state.epoId) return lista[i];
        }
        return null;
      }

      function carregarContexto() {
        if (!envioReal) return Promise.resolve(null);
        return Auth.cliente.from("epos").select("id, nome, cidade, uf")
          .eq("ativo", true).order("nome")
          .then(function (r) {
            if (r.error) throw r.error;
            eposDb = r.data || [];
            var achou = null;
            for (var i = 0; i < eposDb.length; i++) {
              if (eposDb[i].id === epoParam) achou = eposDb[i];
            }
            var alvo = achou || eposDb[0];
            if (alvo) {
              state.epoId = alvo.id;
              state.cidade = alvo.cidade || "";
              state.uf = alvo.uf || "";
            }
            if (!alocParam) return null;
            return Auth.cliente.from("alocacoes")
              .select("id, epo_id, processo_id, responsavel_email, status, visita_prevista, epos(nome, cidade, uf)")
              .eq("id", alocParam).maybeSingle()
              .then(function (ra) {
                if (ra.error || !ra.data) {
                  // Seguir sem o pedido grava a auditoria solta: a pendencia
                  // continua aberta na lista e ninguem entende por que.
                  console.warn("Relatorio pedido nao encontrado:", alocParam);
                  alocFalhou = true;
                  return null;
                }
                aloc = ra.data;
                state.epoId = aloc.epo_id;
                var e = aloc.epos || {};
                state.cidade = e.cidade || "";
                state.uf = e.uf || "";
                if (aloc.visita_prevista && !state.data) state.data = aloc.visita_prevista;
                return aloc;
              });
          })
          .catch(function (err) {
            console.warn("Contexto do banco indisponivel:", (err && err.message) || err);
            return null;
          });
      }

      function contexto() {
        if (!contextoPromise) contextoPromise = carregarContexto();
        return contextoPromise;
      }

      /* ====================================================================
         PERGUNTAS DO CADASTRO (Configurações > Questionários)
         O que vale em campo é o que está cadastrado: pergunta incluída,
         texto alterado, evidência ajustada, ordem trocada ou pergunta
         desativada aparece aqui na abertura seguinte da auditoria. O catálogo
         local fica como reserva para a demonstração sem login.
         ==================================================================== */
      var procDbId = null;          // id do tópico no cadastro
      var catalogoPromise = null;
      // Sem banco (demonstração) o catálogo local já vale e nada fica travado.
      var catalogoPronto = !envioReal;
      // Quando o catalogo falha, a tela vira um aviso. Sem esta marca, o
      // contexto do banco chegava depois e repintava a capa por cima do aviso,
      // deixando o auditor numa capa sem barra e sem botao de iniciar.
      var catalogoFalhou = false;

      function carregarCatalogo() {
        return Auth.cliente.from("processos")
          .select("id, nome, descricao, icone, peso")
          .eq("slug", processo.id).eq("ativo", true).maybeSingle()
          .then(function (r) {
            if (r.error) throw r.error;
            if (!r.data) throw new Error("Este questionário não está mais disponível.");
            procDbId = r.data.id;
            processo.nome = r.data.nome || processo.nome;
            processo.descricao = r.data.descricao || processo.descricao || "";
            processo.icone = r.data.icone || processo.icone;
            if (r.data.peso !== null && r.data.peso !== undefined) processo.peso = Number(r.data.peso);
            return Auth.cliente.from("itens_checklist")
              .select("id, pergunta, evidencia_esperada, requer_foto, grave, ordem, peso")
              .eq("processo_id", procDbId).eq("ativo", true).order("ordem");
          })
          .then(function (r) {
            if (r.error) throw r.error;
            var lista = r.data || [];
            if (!lista.length) throw new Error("Este questionário ainda não tem pergunta cadastrada.");
            processo.itens = lista.map(function (it) {
              return {
                id: it.id,
                pergunta: it.pergunta,
                // o checklist de itens obrigatórios mostra o rótulo por "item"
                item: it.pergunta,
                evidencia: it.evidencia_esperada || "",
                requerFoto: !!it.requer_foto,
                grave: !!it.grave,
                // Quanto a pergunta pesa na nota. Sem valor, 1: com todos os
                // pesos iguais a media ponderada da o mesmo que a simples.
                peso: (it.peso === null || it.peso === undefined) ? 1 : Number(it.peso)
              };
            });
            return processo.itens;
          });
      }

      function catalogo() {
        if (!catalogoPromise) catalogoPromise = carregarCatalogo();
        return catalogoPromise;
      }

      // Sem as perguntas não existe auditoria: em vez de seguir com um
      // questionário defasado, a tela explica e volta para a lista.
      function falhaDoCatalogo(msg) {
        catalogoFalhou = true;
        headerEl.style.display = "none";
        footer.style.display = "none";
        main.innerHTML =
          '<div class="wiz-intro">' +
            '<div class="wiz-intro-icon"><i class="ti ti-clipboard-off" aria-hidden="true"></i></div>' +
            '<h1 class="wiz-intro-title">Não foi possível abrir o questionário</h1>' +
            '<p class="wiz-intro-sub">' + esc(msg) + "</p>" +
            '<a class="wiz-btn wiz-btn-next" href="' + urlSeletor() + '" style="margin-top:18px;">' +
              '<i class="ti ti-arrow-left" aria-hidden="true"></i>' + esc(rotuloSeletor()) +
            "</a>" +
          "</div>";
      }

      // ------------------------------------------------------------- Helpers
      // (declaração de função: içada, também visível para o handler do modal)
      function respostaDe(id) {
        if (!state.respostas[id]) {
          // arquivos: File[] em memória (câmera ou arquivo), enviados só no fim
          state.respostas[id] = { status: null, obs: "", just: "", arquivos: [] };
        }
        return state.respostas[id];
      }

      function justOk(r) { return !!(r && r.just && r.just.trim()); }

      function temAnexo(r) { return !!(r && r.arquivos && r.arquivos.length); }

      function evidenciaOk(item, r) {
        // N.A. dispensa evidência; sem "evidencia" definida, nada é exigido.
        if (!item.evidencia) return true;
        if (!r || !r.status || r.status === "na") return true;
        return temAnexo(r) || justOk(r);
      }

      // Peso da pergunta, com 1 como padrao.
      function pesoDe(it) {
        var p = it && it.peso;
        p = (p === null || p === undefined) ? 1 : Number(p);
        return (isNaN(p) || p <= 0) ? 1 : p;
      }

      function computeScore() {
        var itens = processo.itens;
        // A nota e media PONDERADA pelo peso de cada pergunta. Com todos os pesos
        // em 1 (o padrao) o resultado e identico a media simples de antes: nenhuma
        // nota ja calculada muda por causa disto. So muda quando alguem decide
        // que uma pergunta pesa mais.
        if (isCarregadores) {
          var c = { presente: 0, ausente: 0, semResposta: 0 };
          var pPres = 0, pAus = 0;
          itens.forEach(function (it) {
            var r = state.respostas[it.id];
            if (!r || !r.status) { c.semResposta++; return; }
            if (r.status === "presente") { c.presente++; pPres += pesoDe(it); }
            else { c.ausente++; pAus += pesoDe(it); }
          });
          var answered = c.presente + c.ausente;
          var somaP = pPres + pAus;
          var s01 = somaP > 0 ? pPres / somaP : 0;
          return { score01: s01, pts: s01 * 100, counts: c, answered: answered };
        }
        var counts = { conforme: 0, nao: 0, na: 0, semResposta: 0 };
        var pOk = 0, pNao = 0;
        itens.forEach(function (it) {
          var r = state.respostas[it.id];
          if (!r || !r.status) { counts.semResposta++; return; }
          if (r.status === "na") { counts.na++; return; }
          if (r.status === "conforme") { counts.conforme++; pOk += pesoDe(it); }
          else { counts.nao++; pNao += pesoDe(it); }
        });
        var ans = counts.conforme + counts.nao;
        var somaPesos = pOk + pNao;
        var score01 = somaPesos > 0 ? pOk / somaPesos : 0;
        return {
          score01: score01,
          pts: score01 * 100,
          counts: counts,
          answered: counts.conforme + counts.nao + counts.na,
          // Item "nao se aplica" nao entra na nota. Se TODOS forem assim, nao
          // ha o que avaliar: nota nenhuma. Antes a nota saia 0 e o selo,
          // Critico, e uma visita sem nada avaliavel puxava a media da unidade
          // para baixo como se tivesse ido mal.
          avaliaveis: ans
        };
      }

      // A nota do sistema vai de 0 a 100, e e assim que ela aparece no ranking,
      // na tela das EPOs e nos cortes de selo. Aqui ela era escrita como fracao
      // com duas casas ("0,33"), na mesma tela em que o selo dizia Critico por
      // comparar 33 com o corte 55: dois numeros diferentes para a mesma coisa.
      function fmtNota(pts) {
        return String(Math.round(Number(pts) || 0));
      }

      // ------------------------------------ Contagem da reversa (percentuais)
      function calcReversa() {
        var c = state.contagens;
        return {
          meta: CONTAGEM.meta,
          pctFontes: (c.equipamentos > 0 && c.fontes != null) ? (c.fontes / c.equipamentos) * 100 : null,
          pctControles: (c.equipControle > 0 && c.controles != null) ? (c.controles / c.equipControle) * 100 : null
        };
      }

      function fmtPctRev(pct) {
        return pct == null ? "-" : Math.round(pct) + "%";
      }

      function fraseMeta(rotulo, pct, meta) {
        if (pct == null) return rotulo + ": sem base para cálculo (informe as contagens).";
        var p = Math.round(pct);
        if (pct >= meta) return rotulo + " em " + p + "% - dentro da meta de " + meta + "%.";
        if (pct < meta - 20) return rotulo + " em " + p + "% - muito abaixo da meta.";
        return rotulo + " em " + p + "% - abaixo da meta de " + meta + "%.";
      }

      function barraMetaRev(pct, meta) {
        var largura = pct == null ? 0 : Math.min(100, pct);
        var cor = (pct != null && pct >= meta) ? "var(--success)" : "var(--danger)";
        return (
          '<div class="score-bar" style="height:10px;">' +
            '<div class="score-fill" style="width:' + largura + "%;background:" + cor + ';"></div>' +
            '<span class="meta-line" style="left:' + meta + '%;" title="Meta ' + meta + '%"></span>' +
          "</div>"
        );
      }

      // -------------------------------------------------------- Renderizações
      function renderIntro() {
        var epo = epoAtual();

        if (isContagem) {
          return (
            '<div class="wiz-intro">' +
              '<div class="wiz-intro-icon"><i class="ti ' + esc(CONTAGEM.icone) + '" aria-hidden="true"></i></div>' +
              '<p class="wiz-eyebrow">Recebimento da devolução' + (epo ? " · " + esc(epo.nome) : "") + "</p>" +
              '<h1 class="wiz-intro-title">' + esc(CONTAGEM.nome) + "</h1>" +
              '<p class="wiz-intro-sub">Preencha na hora em que a devolução chega do campo: conte o que retornou e confira os acessórios. O sistema calcula o % de retorno na tela.</p>' +
              '<div class="wiz-intro-stats">' +
                '<div class="wiz-intro-stat"><b>' + CONTAGEM.contagens.length + "</b><span>contagens</span></div>" +
                '<div class="wiz-intro-stat"><b>' + CONTAGEM.meta + "%</b><span>meta de retorno</span></div>" +
                '<div class="wiz-intro-stat"><b>' + CONTAGEM.checagens.length + "</b><span>checagens</span></div>" +
              "</div>" +
              '<ul class="wiz-intro-list">' +
                '<li><i class="ti ti-device-tv" aria-hidden="true"></i>Equipamentos recebidos na devolução</li>' +
                '<li><i class="ti ti-plug" aria-hidden="true"></i>Fontes recebidas - % de retorno vs meta de ' + CONTAGEM.meta + "%</li>" +
                '<li><i class="ti ti-device-remote" aria-hidden="true"></i>Controles remotos recebidos - % de retorno vs meta</li>' +
                '<li><i class="ti ti-checklist" aria-hidden="true"></i>Checagem dos acessórios (Sim/Não, sem evidência)</li>' +
              "</ul>" +
            "</div>"
          );
        }

        var nItens = processo.itens.length;
        var stats, bullets;

        if (isCarregadores) {
          stats =
            '<div class="wiz-intro-stat"><b>' + nItens + "</b><span>itens</span></div>" +
            '<div class="wiz-intro-stat"><b>P / A</b><span>Presente ou Ausente</span></div>';
          bullets =
            '<li><i class="ti ti-circle-check" aria-hidden="true"></i>Responda cada item como Presente ou Ausente</li>' +
            '<li><i class="ti ti-circle-check" aria-hidden="true"></i>Item ausente exige justificativa e evidência</li>' +
            '<li><i class="ti ti-circle-check" aria-hidden="true"></i>Ao final, veja o resumo das ausências</li>';
        } else {
          var nFotos = processo.itens.filter(function (it) { return it.requerFoto; }).length;
          // Questionario criado no cadastro pode nao ter peso definido; sem a
          // checagem a capa escrevia "null%".
          var temPeso = processo.peso !== null && processo.peso !== undefined && processo.peso !== "";
          stats =
            '<div class="wiz-intro-stat"><b>' + nItens + "</b><span>itens</span></div>" +
            (temPeso
              ? '<div class="wiz-intro-stat"><b>' + App.fmtPct(processo.peso) + "</b><span>peso no selo</span></div>"
              : "") +
            '<div class="wiz-intro-stat"><b>' + nFotos + "</b><span>exigem foto</span></div>";
          bullets =
            '<li><i class="ti ti-circle-check" aria-hidden="true"></i>Responda cada item como Conforme, Não conforme ou N.A.</li>' +
            '<li><i class="ti ti-circle-check" aria-hidden="true"></i>Evidência obrigatória: anexe ou registre justificativa</li>' +
            '<li><i class="ti ti-circle-check" aria-hidden="true"></i>Ao final, veja o score do processo e o selo estimado</li>';
        }

        return (
          '<div class="wiz-intro">' +
            '<div class="wiz-intro-icon"><i class="ti ' + esc(processo.icone) + '" aria-hidden="true"></i></div>' +
            '<p class="wiz-eyebrow">Auditoria' + (epo ? " · " + esc(epo.nome) : "") + "</p>" +
            '<h1 class="wiz-intro-title">' + esc(processo.nome) + "</h1>" +
            '<p class="wiz-intro-sub">' + esc(processo.descricao) + ".</p>" +
            '<div class="wiz-intro-stats">' + stats + "</div>" +
            '<ul class="wiz-intro-list">' + bullets + "</ul>" +
            '<button type="button" class="wiz-skip" id="btn-trocar-proc">' + esc(rotuloSeletor()) + '</button>' +
          "</div>"
        );
      }

      function renderIdentificacao() {
        var epoOpts = eposDisponiveis().map(function (e) {
          return '<option value="' + esc(e.id) + '"' + (e.id === state.epoId ? " selected" : "") + ">" + esc(e.nome) + "</option>";
        }).join("");
        // Relatorio pedido: a EPO ja foi definida por quem cadastrou a EPO
        var travado = !!aloc;
        var notaAloc = travado
          ? '<div class="wiz-evidence"><i class="ti ti-clipboard-list" aria-hidden="true"></i><span>' +
              "Relatório pedido para <b>" + esc(aloc.responsavel_email) + "</b>. " +
              "O que a Claro e a EPO enviarem aparece em cada pergunta." +
            "</span></div>"
          : "";
        return (
          '<p class="wiz-eyebrow">' + esc(processo.nome) + " · Identificação</p>" +
          '<h1 class="wiz-question">Vamos começar a auditoria</h1>' +
          notaAloc +
          '<div class="wiz-field">' +
            '<label for="f-epo">EPO auditada</label>' +
            '<select class="input" id="f-epo"' + (travado ? " disabled" : "") + ">" + epoOpts + "</select>" +
            '<p class="hint-static" id="f-epo-local">' + esc(state.cidade) + " · " + esc(state.uf) + "</p>" +
          "</div>" +
          '<div class="wiz-field"><label for="f-data">Data da visita</label><input class="input" id="f-data" type="date" value="' + esc(state.data) + '"></div>' +
          '<div class="wiz-field"><label for="f-auditor">Auditor</label>' +
            '<input class="input" id="f-auditor" value="' + esc(state.auditor) + '" readonly>' +
            '<span class="hint">Quem está preenchendo, pela conta usada para entrar.</span>' +
          "</div>"
        );
      }

      function renderTempo(def) {
        var val = state.tempos[def.key];
        return (
          '<p class="wiz-eyebrow">Tempos do ciclo · ' + esc(processo.nome) + "</p>" +
          '<h1 class="wiz-question">' + esc(def.label) + "</h1>" +
          '<div class="wiz-evidence"><i class="ti ' + def.icon + '" aria-hidden="true"></i><span>Registre em <b>dias</b>. Estes tempos compõem o ciclo do material na EPO: chegada, armazenagem, distribuição, retorno de campo e devolução.</span></div>' +
          '<div class="wiz-tempo-stepper">' +
            '<button class="wiz-stepper-btn" type="button" data-step="-1" aria-label="Diminuir">-</button>' +
            '<div class="wiz-tempo-input-wrap">' +
              '<input type="number" inputmode="decimal" min="0" step="0.1" id="f-tempo" value="' + (val == null ? "" : val) + '" placeholder="0">' +
              "<span>dias</span>" +
            "</div>" +
            '<button class="wiz-stepper-btn" type="button" data-step="1" aria-label="Aumentar">+</button>' +
          "</div>"
        );
      }

      function renderContagem(step) {
        var def = step.def;
        var val = state.contagens[def.key];
        return (
          '<p class="wiz-eyebrow">' + esc(CONTAGEM.nome) + "</p>" +
          '<p class="wiz-subeyebrow">Contagem ' + step.pos + " de " + step.total + "</p>" +
          '<h1 class="wiz-question">' + esc(def.label) + "</h1>" +
          '<div class="wiz-evidence"><i class="ti ' + esc(def.icon) + '" aria-hidden="true"></i><span>' + esc(def.hint) + "</span></div>" +
          '<div class="wiz-tempo-stepper">' +
            '<button class="wiz-stepper-btn" type="button" data-step="-1" aria-label="Diminuir">-</button>' +
            '<div class="wiz-tempo-input-wrap">' +
              '<input type="number" inputmode="numeric" min="0" step="1" id="f-contagem" value="' + (val == null ? "" : val) + '" placeholder="0">' +
              "<span>" + esc(def.unidade) + "</span>" +
            "</div>" +
            '<button class="wiz-stepper-btn" type="button" data-step="1" aria-label="Aumentar">+</button>' +
          "</div>"
        );
      }

      function renderResultado() {
        var c = state.contagens;
        var r = calcReversa();

        function bloco(rotulo, icone, pct, baseTxt) {
          var cls = (pct != null && pct >= r.meta) ? "is-ok" : "is-bad";
          return (
            '<div class="rev-metric">' +
              '<div class="rev-metric-top"><b><i class="ti ' + icone + '" aria-hidden="true"></i>' + esc(rotulo) + "</b>" +
                '<span class="rev-metric-pct tnum ' + cls + '">' + fmtPctRev(pct) + "</span></div>" +
              barraMetaRev(pct, r.meta) +
              '<p class="rev-metric-frase ' + cls + '">' + esc(fraseMeta(rotulo, pct, r.meta)) + "</p>" +
              '<p class="rev-metric-base">' + esc(baseTxt) + "</p>" +
            "</div>"
          );
        }

        return (
          '<p class="wiz-eyebrow">' + esc(CONTAGEM.nome) + " · Resultado</p>" +
          '<h1 class="wiz-question">Percentual de retorno dos acessórios</h1>' +
          '<div class="wiz-evidence"><i class="ti ti-target-arrow" aria-hidden="true"></i><span>Meta de retorno: <b>' + r.meta + "%</b> para fontes e controles. A linha vertical na barra marca a meta.</span></div>" +
          bloco("Retorno de fontes", "ti-plug", r.pctFontes,
            App.fmtNum(c.fontes || 0) + " fontes / " + App.fmtNum(c.equipamentos || 0) + " equipamentos recebidos") +
          bloco("Retorno de controles", "ti-device-remote", r.pctControles,
            App.fmtNum(c.controles || 0) + " controles / " + App.fmtNum(c.equipControle || 0) + " equipamentos que usam controle")
        );
      }

      function renderChecagem(step) {
        var it = step.item;
        var r = respostaDe(it.id);
        var opts = [
          { val: "conforme", icon: "ti-check", label: "Sim" },
          { val: "nao", icon: "ti-x", label: "Não" }
        ];
        return (
          '<p class="wiz-eyebrow">' + esc(CONTAGEM.nome) + " · Checagem dos acessórios</p>" +
          '<p class="wiz-subeyebrow">Checagem ' + step.pos + " de " + step.total + "</p>" +
          '<h1 class="wiz-question">' + esc(it.pergunta) + "</h1>" +
          '<div class="wiz-evidence"><i class="ti ti-checklist" aria-hidden="true"></i><span>Confirmação operacional feita no ato do recebimento - <b>não exige evidência anexada</b>.</span></div>' +
          '<div class="wiz-options" id="wiz-options">' +
            opts.map(function (o) {
              var sel = r.status === o.val ? " is-selected" : "";
              return '<button type="button" class="wiz-opt' + sel + '" data-val="' + o.val + '"><i class="ti ' + o.icon + '" aria-hidden="true"></i>' + o.label + "</button>";
            }).join("") +
          "</div>" +
          '<div class="wiz-field"><label for="f-obs">Observações</label><textarea id="f-obs" placeholder="Divergências, quantidades, contexto (opcional)">' + esc(r.obs) + "</textarea></div>"
        );
      }

      function renderResumoContagem() {
        var c = state.contagens;
        var r = calcReversa();
        var okF = r.pctFontes != null && r.pctFontes >= r.meta;
        var okC = r.pctControles != null && r.pctControles >= r.meta;

        var statsHtml =
          '<div class="wiz-summary-stat"><b>' + (c.equipamentos == null ? "-" : App.fmtNum(c.equipamentos)) + "</b><span>Equipamentos recebidos</span></div>" +
          '<div class="wiz-summary-stat"><b>' + (c.fontes == null ? "-" : App.fmtNum(c.fontes)) + "</b><span>Fontes recebidas</span></div>" +
          '<div class="wiz-summary-stat"><b>' + (c.controles == null ? "-" : App.fmtNum(c.controles)) + "</b><span>Controles recebidos</span></div>" +
          '<div class="wiz-summary-stat"><b>' + (c.equipControle == null ? "-" : App.fmtNum(c.equipControle)) + "</b><span>Equip. que usam controle</span></div>";

        var checksHtml = CONTAGEM.checagens.map(function (it) {
          var resp = state.respostas[it.id];
          var sim = !!(resp && resp.status === "conforme");
          var cor = sim ? "var(--success)" : "var(--danger)";
          return (
            "<li>" +
              '<i class="ti ' + (sim ? "ti-circle-check" : "ti-circle-x") + '" style="color:' + cor + ';" aria-hidden="true"></i>' +
              "<span>" + esc(it.pergunta) + ' - <b style="color:' + cor + ';">' + (sim ? "Sim" : "Não") + "</b></span>" +
            "</li>"
          );
        }).join("");

        return (
          '<p class="wiz-eyebrow">' + esc(CONTAGEM.nome) + " · Resumo</p>" +
          '<h1 class="wiz-question">Contagem pronta para envio</h1>' +
          '<div class="wiz-summary-card">' +
            '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">' +
              '<span class="badge ' + (okF ? "badge-success" : "badge-danger") + '">Fontes ' + fmtPctRev(r.pctFontes) + "</span>" +
              '<span class="badge ' + (okC ? "badge-success" : "badge-danger") + '">Controles ' + fmtPctRev(r.pctControles) + "</span>" +
            "</div>" +
            '<div style="margin-top:16px;text-align:left;">' +
              '<p style="margin:0 0 6px;font-size:12px;font-weight:600;color:var(--text-2);">Retorno de fontes · meta ' + r.meta + "%</p>" +
              barraMetaRev(r.pctFontes, r.meta) +
              '<p style="margin:14px 0 6px;font-size:12px;font-weight:600;color:var(--text-2);">Retorno de controles · meta ' + r.meta + "%</p>" +
              barraMetaRev(r.pctControles, r.meta) +
            "</div>" +
            '<div class="wiz-summary-grid">' + statsHtml + "</div>" +
          "</div>" +
          '<h2 style="font-size:15px;font-weight:700;margin:0 0 10px;">Checagem dos acessórios</h2>' +
          '<ul class="rev-check-list">' + checksHtml + "</ul>" +

          '<button type="button" class="wiz-btn wiz-btn-back" style="width:100%;flex:1 1 auto;margin-bottom:8px;" id="btn-rascunho"><i class="ti ti-device-floppy" aria-hidden="true"></i>Salvar rascunho</button>'
        );
      }

      // Chips dos arquivos anexados em memória (nome + botão remover)
      function chipsHtml(r) {
        if (!temAnexo(r)) return "";
        return '<div class="wiz-chips" id="wiz-chips">' +
          r.arquivos.map(function (f, i) {
            var ico = (f.type || "").indexOf("image") === 0 ? "ti-photo" : "ti-paperclip";
            return (
              '<span class="wiz-chip">' +
                '<i class="ti ' + ico + '" aria-hidden="true"></i>' +
                '<span class="nome">' + esc(f.name) + "</span>" +
                '<button type="button" data-rm="' + i + '" aria-label="Remover ' + esc(f.name) + '"><i class="ti ti-x" aria-hidden="true"></i></button>' +
              "</span>"
            );
          }).join("") +
        "</div>";
      }

      // Botões "Tirar foto" (câmera no celular) e "Anexar arquivo" + inputs ocultos
      function anexoHtml(r) {
        return (
          '<div class="wiz-attach-row">' +
            '<button type="button" class="wiz-attach" id="btn-foto"><i class="ti ti-camera-plus" aria-hidden="true"></i>Tirar foto</button>' +
            '<button type="button" class="wiz-attach" id="btn-arquivo"><i class="ti ti-paperclip" aria-hidden="true"></i>Anexar arquivo</button>' +
          "</div>" +
          '<input type="file" id="inp-foto" accept="image/*" capture="environment" style="display:none;">' +
          '<input type="file" id="inp-arquivo" multiple style="display:none;">' +
          chipsHtml(r)
        );
      }

      // Liga botões/inputs/chips do bloco de anexos ao estado do item
      function wireAnexos(r) {
        var inpFoto = document.getElementById("inp-foto");
        var inpArq = document.getElementById("inp-arquivo");
        if (!inpFoto || !inpArq) return; // passo sem bloco de anexos (ex.: Presente)
        function addTodos(lista) {
          Array.prototype.forEach.call(lista, function (f) { r.arquivos.push(f); });
          renderStep();
        }
        document.getElementById("btn-foto").addEventListener("click", function () { inpFoto.click(); });
        document.getElementById("btn-arquivo").addEventListener("click", function () { inpArq.click(); });
        inpFoto.addEventListener("change", function () {
          if (inpFoto.files && inpFoto.files.length) addTodos(inpFoto.files);
        });
        inpArq.addEventListener("change", function () {
          if (inpArq.files && inpArq.files.length) addTodos(inpArq.files);
        });
        var chips = document.getElementById("wiz-chips");
        if (chips) {
          chips.addEventListener("click", function (ev) {
            var btn = ev.target.closest("button[data-rm]");
            if (!btn) return;
            r.arquivos.splice(parseInt(btn.getAttribute("data-rm"), 10), 1);
            renderStep();
          });
        }
      }

      /* ====================================================================
         COMPROVAÇÕES ENVIADAS PELA EPO (tempo real)
         O acesso do responsável da EPO sai antes da visita: ele anexa a
         comprovação de cada pergunta em alocacao_anexos. Aqui o auditor vê,
         no mesmo item, o que já chegou - via vw_comprovacoes_epo (que já
         resolve alocação -> epo/processo). Atualização por Realtime, com
         polling de 20s e recarga no foco da janela como rede de segurança.
         ==================================================================== */
      var comprovDemo = !(window.Auth && Auth.pronto && !Auth.modoDemo());

      var comprov = {
        idsPromise: null,   // { procId, itens: [uuid por índice], set: {uuid:true} }
        eposPromise: null,  // lista de EPOs ativas do banco
        canal: null,        // canal Realtime
        timer: null,        // polling do passo aberto
        seq: 0,             // invalida respostas de passos já trocados
        itemAtual: null,    // uuid do item na tela
        pendentes: 0,       // anexos novos vistos em OUTROS itens
        avisoStep: "",      // aviso desses outros itens, exibido no passo atual
        cache: null         // { idx, conteudo, n } do passo atual
      };

      function comprovTamanho(bytes) {
        var n = Number(bytes) || 0;
        if (!n) return "";
        if (n < 1024) return n + " B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
        return (n / (1024 * 1024)).toFixed(1) + " MB";
      }

      function comprovHora(iso) {
        if (!iso) return "";
        try {
          return new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
        } catch (e) { return ""; }
      }

      function comprovIcone(nome, contentType) {
        var ct = String(contentType || "").toLowerCase();
        var ext = String(nome || "").toLowerCase().split(".").pop();
        if (ct.indexOf("image/") === 0 || /^(jpg|jpeg|png|gif|webp|heic)$/.test(ext)) return "ti-photo";
        if (ct.indexOf("pdf") >= 0 || ext === "pdf") return "ti-file-typography";
        return "ti-file";
      }

      // Resolve UMA vez: processo (por slug) e itens_checklist na ordem oficial.
      function comprovIds() {
        if (comprov.idsPromise) return comprov.idsPromise;
        var db = Auth.cliente;
        comprov.idsPromise = db.from("processos").select("id")
          .eq("slug", processo.id).eq("ativo", true).maybeSingle()
          .then(function (r) {
            if (r.error) throw r.error;
            if (!r.data) throw new Error("processo fora do catálogo do banco: " + processo.id);
            var procId = r.data.id;
            return db.from("itens_checklist").select("id")
              .eq("processo_id", procId).eq("ativo", true).order("ordem")
              .then(function (ri) {
                if (ri.error) throw ri.error;
                var lista = (ri.data || []).map(function (x) { return x.id; });
                var set = {};
                lista.forEach(function (id) { set[id] = true; });
                comprov.itensSet = set;
                return { procId: procId, itens: lista, set: set };
              });
          });
        return comprov.idsPromise;
      }

      // uuid da EPO da tela. Depois de carregarContexto() o select já guarda o
      // uuid do banco; a busca por nome fica só como rede de segurança para o
      // caso de a lista real não ter carregado.
      function comprovEpoId() {
        return contexto().then(function () {
          if (eposDb) return state.epoId || null;
          var alvo = App.epoById(state.epoId);
          return Auth.cliente.from("epos").select("id, nome").eq("ativo", true)
            .then(function (r) {
              if (r.error) throw r.error;
              var lista = r.data || [];
              for (var i = 0; i < lista.length; i++) {
                if (alvo && lista[i].nome === alvo.nome) return lista[i].id;
              }
              return null;
            });
        });
      }

      function comprovCabecalho(n) {
        return (
          '<div class="wiz-comprov-head">' +
            '<i class="ti ti-inbox" aria-hidden="true"></i>' +
            "<span>Evidências já enviadas</span>" +
            (n ? '<span class="wiz-comprov-count tnum">' + n + "</span>" : "") +
          "</div>"
        );
      }

      function comprovPintar(conteudo, n, cachear) {
        if (cachear) comprov.cache = { idx: comprov.cacheIdx, conteudo: conteudo, n: n };
        var el = document.getElementById("wiz-comprov");
        if (!el) return;
        el.innerHTML =
          comprovCabecalho(n) +
          comprov.avisoStep +
          conteudo;
        ligarAberturaDeEvidencia(el);
      }

      // Abrir o que a Claro e a EPO enviaram: imagem e PDF em outra aba,
      // planilha e documento baixando. Um ouvinte no painel cobre tudo o que
      // for repintado depois.
      function ligarAberturaDeEvidencia(el) {
        if (!el || el.getAttribute("data-evid-ligado") === "1") return;
        el.setAttribute("data-evid-ligado", "1");
        el.addEventListener("click", function (ev) {
          var alvo = ev.target.closest("[data-abrir-evid]");
          if (!alvo) return;
          ev.preventDefault();
          App.abrirEvidencia(alvo.getAttribute("data-abrir-evid"), alvo.getAttribute("data-nome-evid"));
        });
      }

      var COMPROV_VAZIO = '<p class="wiz-comprov-msg">Ninguém enviou evidência para este item ainda.</p>';

      // A lista sai agrupada por origem: caixa vermelha da Claro, cinza da EPO.
      // O clique abre a evidencia de verdade - PDF e imagem em outra aba,
      // planilha e documento baixando no aparelho.
      function comprovItemHtml(a) {
        var ct = String(a.content_type || "");
        var nome = esc(a.nome_arquivo || "arquivo");
        var visual = (ct.indexOf("image/") === 0 && a.url)
          ? '<img class="wiz-comprov-thumb" src="' + esc(a.url) + '" alt="' + nome + '" loading="lazy">'
          : '<i class="ti ' + comprovIcone(a.nome_arquivo, ct) + '" aria-hidden="true"></i>';
        var partes = [];
        var tam = comprovTamanho(a.tamanho);
        if (tam) partes.push(tam);
        var hora = comprovHora(a.criado_em);
        if (hora) partes.push("enviado " + hora);
        if (a.responsavel_email) partes.push(esc(a.responsavel_email));
        var nomeHtml = a.url
          ? '<button type="button" class="wiz-comprov-nome" data-abrir-evid="' + esc(a.url) +
            '" data-nome-evid="' + nome + '">' + nome + "</button>"
          : '<span class="wiz-comprov-nome">' + nome + "</span>";
        var abrir = a.url
          ? '<button type="button" class="wiz-comprov-open" data-abrir-evid="' + esc(a.url) +
            '" data-nome-evid="' + nome + '" aria-label="Abrir ' + nome + '">' +
            '<i class="ti ti-external-link" aria-hidden="true"></i></button>'
          : "";
        return (
          '<li class="wiz-comprov-item">' + visual +
            '<div class="wiz-comprov-info">' + nomeHtml +
              '<span class="wiz-comprov-meta">' + partes.join(" · ") + "</span>" +
            "</div>" + abrir +
          "</li>"
        );
      }

      function comprovListaHtml(rows) {
        var porOrigem = { claro: [], epo: [] };
        rows.forEach(function (a) {
          var o = (a.origem === "claro") ? "claro" : "epo";
          porOrigem[o].push(a);
        });

        var html = "";
        ["claro", "epo"].forEach(function (chave) {
          var lista = porOrigem[chave];
          if (!lista.length) return;
          var m = App.origemMeta(chave);
          html +=
            '<div class="evid-box ' + m.cls + '" style="margin-top:10px;">' +
              '<span class="evid-box-titulo">' +
                '<i class="ti ' + m.icon + '" aria-hidden="true"></i>' + esc(m.label) +
                '<span class="conta">' + lista.length + (lista.length === 1 ? " arquivo" : " arquivos") + "</span>" +
              "</span>" +
              '<ul class="wiz-comprov-list">' + lista.map(comprovItemHtml).join("") + "</ul>" +
            "</div>";
        });
        return html;
      }

      // Modo demo/offline: 1 anexo fictício no primeiro item, sem rede.
      function comprovDemoRows() {
        var d = new Date();
        d.setHours(9, 12, 0, 0);
        return [{
          nome_arquivo: "nf-espelho-4821.pdf",
          content_type: "application/pdf",
          tamanho: 184320,
          criado_em: d.toISOString(),
          responsavel_email: "responsável da EPO",
          url: App.documentoDe("nf-espelho-4821.pdf")
        }];
      }

      // silencioso: recarga de fundo (Realtime, polling, foco) - não pisca o
      // estado de "carregando", mantém o conteúdo atual até chegar o novo.
      function comprovCarregar(step, silencioso) {
        var idx = step.pos - 1;
        comprov.cacheIdx = idx;
        var pedido = ++comprov.seq;

        if (comprovDemo) {
          if (idx === 0) {
            comprovPintar(
              comprovListaHtml(comprovDemoRows()), 1, true
            );
          } else {
            comprovPintar(
              COMPROV_VAZIO,
              0, true
            );
          }
          return;
        }

        if (!silencioso) comprovPintar('<p class="wiz-comprov-msg">Carregando evidências…</p>', 0, false);

        Promise.all([comprovIds(), comprovEpoId()]).then(function (rs) {
          var ids = rs[0], epoId = rs[1];
          // Com as perguntas vindas do cadastro, o id do passo já é o id do
          // cadastro. Casar por posição sobra para o catálogo local.
          var doPasso = step.item && step.item.id;
          var itemId = (doPasso && ids.set && ids.set[doPasso]) ? doPasso : ids.itens[idx];
          if (!itemId) throw new Error("item sem correspondente no banco");
          if (pedido === comprov.seq) comprov.itemAtual = itemId;

          // Com o relatorio pedido em mãos, lemos direto os anexos daquela
          // alocação: é o caminho mais direto e não depende de casar a EPO.
          if (aloc) {
            return Auth.cliente.from("alocacao_anexos")
              .select("id, origem, storage_path, nome_arquivo, content_type, tamanho, criado_em")
              .eq("alocacao_id", aloc.id).eq("item_id", itemId)
              .order("criado_em")
              .then(function (r) {
                if (r.error) throw r.error;
                return (r.data || []).map(function (a) {
                  a.responsavel_email = aloc.responsavel_email;
                  return a;
                });
              });
          }

          if (!epoId) throw new Error("EPO não encontrada no banco");
          return Auth.cliente.from("vw_comprovacoes_epo").select("*")
            .eq("epo_id", epoId).eq("processo_id", ids.procId).eq("item_id", itemId)
            .order("criado_em")
            .then(function (r) {
              if (r.error) throw r.error;
              return r.data || [];
            });
        }).then(function (rows) {
          if (pedido !== comprov.seq) return null;
          if (!rows.length) { comprovPintar(COMPROV_VAZIO, 0, true); return null; }
          return Promise.all(rows.map(function (a) {
            if (!a.storage_path) { a.url = null; return a; }
            // Com download: o tipo do arquivo no cofre e o que quem enviou
            // declarou, e um SVG servido como documento executa script na origem
            // do site. Assim o navegador salva em vez de abrir.
            return Auth.cliente.storage.from("evidencias")
              .createSignedUrl(a.storage_path, 3600,
                               { download: String(a.storage_path).split("/").pop() || "arquivo" })
              .then(function (u) { a.url = (u.data && u.data.signedUrl) || null; return a; },
                    function () { a.url = null; return a; });
          })).then(function (lista) {
            if (pedido !== comprov.seq) return;
            comprovPintar(comprovListaHtml(lista), lista.length, true);
          });
        }).catch(function (err) {
          if (pedido !== comprov.seq) return;
          console.warn("Evidências indisponíveis:", (err && err.message) || err);
          comprovPintar('<p class="wiz-comprov-msg">Não foi possível carregar as evidências agora.</p>', 0, true);
        });
      }

      // Realtime: uma assinatura por auditoria. O payload de alocacao_anexos
      // não traz epo_id/processo_id, então filtramos pelo item_id conhecido e
      // recarregamos pela view (que aplica o filtro de EPO e processo).
      function comprovAssinar() {
        if (comprovDemo || comprov.canal || !Auth.cliente) return;
        comprov.canal = Auth.cliente.channel("comprov-epo")
          .on("postgres_changes", { event: "*", schema: "public", table: "alocacao_anexos" }, function (payload) {
            var row = payload.new || payload.old || {};
            var itemId = row.item_id;
            if (!itemId || !comprov.itensSet || !comprov.itensSet[itemId]) return;
            // com relatorio pedido, ignora anexo de outra alocacao
            if (aloc && row.alocacao_id && row.alocacao_id !== aloc.id) return;
            var step = steps[cur];
            if (itemId === comprov.itemAtual && step && step.type === "item") {
              comprovCarregar(step, true);
            } else {
              comprov.pendentes += 1;
            }
          })
          .subscribe();
      }

      function comprovParar() {
        if (comprov.timer) { clearInterval(comprov.timer); comprov.timer = null; }
        comprov.itemAtual = null;
        comprov.seq += 1; // descarta respostas em voo do passo anterior
      }

      // Chamado no wire de cada passo de item
      function comprovIniciarPasso(step) {
        var idx = step.pos - 1;
        var mesmoPasso = !!(comprov.cache && comprov.cache.idx === idx);

        if (!mesmoPasso) {
          comprov.avisoStep = comprov.pendentes > 0
            ? '<p class="wiz-comprov-novo"><i class="ti ti-bell-ringing" aria-hidden="true"></i><span>' +
                comprov.pendentes + (comprov.pendentes > 1 ? " novas evidências chegaram" : " nova evidência chegou") +
                " em outros itens deste questionário.</span></p>"
            : "";
          comprov.pendentes = 0;
          comprov.cache = null;
        }

        if (mesmoPasso) {
          // re-render do mesmo item (troca de resposta, anexo): repinta do cache
          comprov.cacheIdx = idx;
          // O item continua sendo o mesmo. Sem reafirmar isto, uma evidencia
          // que chegasse agora seria contada como "de outro item" e viraria
          // aviso, em vez de aparecer no painel aberto.
          if (step.item && step.item.id) comprov.itemAtual = step.item.id;
          comprovPintar(comprov.cache.conteudo, comprov.cache.n, false);
        } else {
          comprovCarregar(step);
        }

        if (comprovDemo) return;
        comprovAssinar();
        if (comprov.timer) clearInterval(comprov.timer);
        comprov.timer = setInterval(function () {
          var s = steps[cur];
          if (s && s.type === "item") comprovCarregar(s, true);
          else comprovParar();
        }, 20000);
      }

      // Fallback: volta do app da câmera / troca de aba recarrega o painel
      window.addEventListener("focus", function () {
        var s = steps[cur];
        if (!comprovDemo && s && s.type === "item" && document.getElementById("wiz-comprov")) comprovCarregar(s, true);
      });

      window.addEventListener("pagehide", function () {
        comprovParar();
        if (comprov.canal && Auth.cliente) {
          Auth.cliente.removeChannel(comprov.canal);
          comprov.canal = null;
        }
      });

      function renderItem(step) {
        var it = step.item;
        var r = respostaDe(it.id);
        var precisaAgora = !!it.evidencia && (r.status === "conforme" || r.status === "nao");
        var evOk = temAnexo(r) || justOk(r);

        var tags = "";
        if (it.requerFoto) tags += ' <span class="evidence-tag"><i class="ti ti-camera" aria-hidden="true"></i>foto obrigatória</span>';
        if (it.grave) tags += ' <span class="evidence-tag tag-grave"><i class="ti ti-alert-triangle" aria-hidden="true"></i>NC grave</span>';

        var opts = [
          { val: "conforme", icon: "ti-check", label: "Conforme" },
          { val: "nao", icon: "ti-x", label: "Não conforme" },
          { val: "na", icon: "ti-minus", label: "Não se aplica" }
        ];

        return (
          '<p class="wiz-eyebrow">' + esc(processo.nome) + "</p>" +
          '<p class="wiz-subeyebrow">Item ' + step.pos + " de " + step.total + " deste processo</p>" +
          '<h1 class="wiz-question">' + esc(it.pergunta) + "</h1>" +
          '<div class="wiz-evidence"><i class="ti ti-file-check" aria-hidden="true"></i><span><b>Evidência esperada:</b> ' + esc(it.evidencia || "-") + tags + "</span></div>" +
          '<div class="wiz-comprov" id="wiz-comprov"></div>' +
          '<div class="wiz-options" id="wiz-options">' +
            opts.map(function (o) {
              var sel = r.status === o.val ? " is-selected" : "";
              return '<button type="button" class="wiz-opt' + sel + '" data-val="' + o.val + '"><i class="ti ' + o.icon + '" aria-hidden="true"></i>' + o.label + "</button>";
            }).join("") +
          "</div>" +
          '<div class="wiz-warn" id="wiz-warn" style="display:' + (precisaAgora && !evOk ? "flex" : "none") + ';">' +
            '<i class="ti ti-alert-triangle" aria-hidden="true"></i><span>Evidência obrigatória - anexe ou justifique.</span>' +
          "</div>" +
          anexoHtml(r) +
          '<div class="wiz-field" id="just-wrap" style="display:' + (precisaAgora && !temAnexo(r) ? "block" : "none") + ';">' +
            '<label for="f-just">Justificativa da ausência de evidência</label>' +
            '<textarea id="f-just" placeholder="Explique por que a evidência não pôde ser anexada">' + esc(r.just) + "</textarea>" +
          "</div>" +
          '<div class="wiz-field"><label for="f-obs">Observações</label><textarea id="f-obs" placeholder="Detalhes, divergências, contexto…">' + esc(r.obs) + "</textarea></div>"
        );
      }

      function renderItemCarregador(step) {
        var it = step.item;
        var r = respostaDe(it.id);
        var isAusente = r.status === "ausente";
        var tags = "";

        var opts = [
          { val: "presente", icon: "ti-check", label: "Presente" },
          { val: "ausente", icon: "ti-x", label: "Ausente" }
        ];

        // A justificativa só faz sentido quando o item não retornou. O campo de
        // anexo, não: toda pergunta aceita foto ou arquivo, do mesmo jeito que
        // o responsável da EPO vê do lado dele.
        var blocoAusente = "";
        if (isAusente) {
          blocoAusente =
            '<div class="wiz-warn" id="wiz-warn" style="display:' + (justOk(r) ? "none" : "flex") + ';">' +
              '<i class="ti ti-alert-triangle" aria-hidden="true"></i><span>Item ausente - justificativa e evidência são obrigatórias.</span>' +
            "</div>" +
            '<div class="wiz-field">' +
              '<label for="f-just">Justificativa da ausência (obrigatória)</label>' +
              '<textarea id="f-just" placeholder="Explique por que o item não retornou com o equipamento">' + esc(r.just) + "</textarea>" +
            "</div>";
        }

        return (
          '<p class="wiz-eyebrow">' + esc(carregadores.nome) + "</p>" +
