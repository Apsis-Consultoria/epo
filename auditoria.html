          '<p class="wiz-subeyebrow">Item ' + step.pos + " de " + step.total + "</p>" +
          '<h1 class="wiz-question">' + esc(it.item) + "</h1>" +
          '<div class="wiz-evidence"><i class="ti ti-plug" aria-hidden="true"></i><span>O item obrigatório retornou junto com o equipamento na retirada do assinante?' + tags + "</span></div>" +
          '<div class="wiz-comprov" id="wiz-comprov"></div>' +
          '<div class="wiz-options" id="wiz-options">' +
            opts.map(function (o) {
              var sel = r.status === o.val ? " is-selected" : "";
              return '<button type="button" class="wiz-opt' + sel + '" data-val="' + o.val + '"><i class="ti ' + o.icon + '" aria-hidden="true"></i>' + o.label + "</button>";
            }).join("") +
          "</div>" +
          blocoAusente +
          anexoHtml(r)
        );
      }

      // Um campo so: quem acompanhou a visita pela EPO. O nome de quem preenche
      // ja e a conta que esta preenchendo, e a data da visita foi perguntada na
      // primeira tela - perguntar de novo aqui deixava as duas divergirem, e
      // esta ficava em branco.
      function renderAssinaturas() {
        return (
          '<p class="wiz-eyebrow">' + esc(processo.nome) + " · Finalização</p>" +
          '<h1 class="wiz-question">Quem acompanhou pela EPO</h1>' +
          '<div class="wiz-field"><label for="f-resp-epo">Responsável pela EPO</label>' +
            '<input class="input" id="f-resp-epo" value="' + esc(state.assin.respEpo) + '" placeholder="Nome de quem acompanhou a visita"></div>'
        );
      }

      function renderResumo() {
        var r = computeScore();
        var tier = r.avaliaveis > 0 ? App.tierOf(r.pts) : null;
        var meta = tier ? App.tierMeta(tier) : null;
        var totalItens = processo.itens.length;

        var statsHtml, extra = "";
        if (isCarregadores) {
          statsHtml =
            '<div class="wiz-summary-stat"><b>' + r.counts.presente + "</b><span>Presente</span></div>" +
            '<div class="wiz-summary-stat"><b>' + r.counts.ausente + "</b><span>Ausente</span></div>" +
            '<div class="wiz-summary-stat"><b>' + r.counts.semResposta + "</b><span>Não respondidos</span></div>";
          var ausencias = processo.itens.filter(function (it) {
            var resp = state.respostas[it.id];
            return resp && resp.status === "ausente";
          });
          if (ausencias.length) {
            extra =
              '<h2 style="font-size:15px;font-weight:700;margin:0 0 10px;">Ausências registradas</h2>' +
              '<ul class="wiz-abs-list">' +
                ausencias.map(function (it) {
                  var resp = state.respostas[it.id];
                  return "<li><b>" + esc(it.item) + "</b>" + esc(resp.just || "Sem justificativa registrada.") + "</li>";
                }).join("") +
              "</ul>";
          }
        } else {
          statsHtml =
            '<div class="wiz-summary-stat"><b>' + r.counts.conforme + "</b><span>Conforme</span></div>" +
            '<div class="wiz-summary-stat"><b>' + r.counts.nao + "</b><span>Não conforme</span></div>" +
            '<div class="wiz-summary-stat"><b>' + r.counts.na + "</b><span>Não se aplica</span></div>" +
            '<div class="wiz-summary-stat"><b>' + r.counts.semResposta + "</b><span>Não respondidos</span></div>";
          var graves = processo.itens.filter(function (it) {
            var resp = state.respostas[it.id];
            return it.grave && resp && resp.status === "nao";
          });
          if (graves.length) {
            extra =
              '<h2 style="font-size:15px;font-weight:700;margin:0 0 10px;">Não conformidades graves</h2>' +
              '<ul class="wiz-abs-list">' +
                graves.map(function (it) {
                  return '<li><b><i class="ti ti-alert-triangle" aria-hidden="true"></i> NC grave</b>' + esc(it.pergunta) + "</li>";
                }).join("") +
              "</ul>";
          }
        }

        return (
          '<p class="wiz-eyebrow">' + esc(processo.nome) + " · Resumo</p>" +
          '<h1 class="wiz-question">Auditoria pronta para envio</h1>' +
          '<div class="wiz-summary-card">' +
            '<div class="wiz-summary-score tnum">' +
              (r.avaliaveis > 0 ? fmtNota(r.pts) : "sem nota") + "</div>" +
            '<div class="wiz-summary-tier">' + (meta ? '<span class="badge ' + meta.cls + '">' + meta.label + "</span>" : '<span class="badge">Sem avaliação</span>') + "</div>" +
            '<div class="wiz-summary-grid">' + statsHtml + "</div>" +
          "</div>" +
          extra +
          '<p class="hint-static" style="text-align:center;margin-bottom:16px;">' + r.answered + " de " + totalItens + " itens deste processo avaliados. " +
            "Ao enviar, as respostas e os anexos seguem para a conferência da equipe APSIS." + "</p>" +
          '<button type="button" class="wiz-btn wiz-btn-back" style="width:100%;flex:1 1 auto;margin-bottom:8px;" id="btn-rascunho"><i class="ti ti-device-floppy" aria-hidden="true"></i>Salvar rascunho</button>'
        );
      }

      // ------------------------------------------------------------- Render
      function stepAnswered(index) {
        var step = steps[index];
        if (step.type === "contagem") {
          var v = state.contagens[step.def.key];
          return v != null && !isNaN(v);
        }
        if (step.type === "checagem") {
          var rc = state.respostas[step.item.id];
          return !!(rc && rc.status);
        }
        if (step.type !== "item") return true;
        var it = step.item;
        var r = state.respostas[it.id];
        if (!r || !r.status) return false;
        if (isCarregadores) {
          // A tela diz "justificativa e evidencia sao obrigatorias" no item
          // ausente, mas so a justificativa era exigida. Ou cobra as duas, ou
          // o texto e falso; item ausente e o que mais precisa de prova.
          if (r.status === "ausente") return justOk(r) && temAnexo(r);
          return true;
        }
        return evidenciaOk(it, r);
      }

      function renderStep() {
        var step = steps[cur];
        comprovParar(); // encerra polling/consultas do passo anterior
        var html;
        if (step.type === "intro") html = renderIntro();
        else if (step.type === "identificacao") html = renderIdentificacao();
        else if (step.type === "tempo") html = renderTempo(step.def);
        else if (step.type === "contagem") html = renderContagem(step);
        else if (step.type === "resultado") html = renderResultado();
        else if (step.type === "checagem") html = renderChecagem(step);
        else if (step.type === "item") html = isCarregadores ? renderItemCarregador(step) : renderItem(step);
        else if (step.type === "assinaturas") html = renderAssinaturas();
        else html = isContagem ? renderResumoContagem() : renderResumo();

        main.innerHTML = html;
        main.scrollTop = 0;
        wireStep(step);
        updateChrome();
      }

      function wireStep(step) {
        if (step.type === "intro") {
          // a contagem da reversa não vem de auditoria pedida: não tem o botão
          var voltar = document.getElementById("btn-trocar-proc");
          if (voltar) {
            voltar.addEventListener("click", function () {
              window.location.href = urlSeletor();
            });
          }
        } else if (step.type === "identificacao") {
          var epoSel = document.getElementById("f-epo");
          epoSel.addEventListener("change", function () {
            state.epoId = epoSel.value;
            var e = epoAtual();
            if (e) {
              state.cidade = e.cidade || ""; state.uf = e.uf || "";
              document.getElementById("f-epo-local").textContent = state.cidade + " · " + state.uf;
            }
            comprov.eposPromise = null; // trocou de EPO: refaz a busca de anexos
            comprov.cache = null;
          });
          document.getElementById("f-data").addEventListener("input", function (ev) { state.data = ev.target.value; });
        } else if (step.type === "tempo") {
          var input = document.getElementById("f-tempo");
          var setVal = function (v) {
            v = Math.max(0, Math.round(v * 10) / 10);
            input.value = v;
            state.tempos[step.def.key] = v;
          };
          input.addEventListener("input", function () {
            var v = parseFloat(input.value);
            state.tempos[step.def.key] = isNaN(v) ? null : v;
          });
          Array.prototype.forEach.call(document.querySelectorAll(".wiz-stepper-btn"), function (btn) {
            btn.addEventListener("click", function () {
              var cur0 = parseFloat(input.value) || 0;
              setVal(cur0 + parseFloat(btn.getAttribute("data-step")) * 0.5);
            });
          });
        } else if (step.type === "contagem") {
          var inputC = document.getElementById("f-contagem");
          var setValC = function (v) {
            v = Math.max(0, Math.round(v));
            inputC.value = v;
            state.contagens[step.def.key] = v;
            updateChrome();
          };
          inputC.addEventListener("input", function () {
            var v = parseInt(inputC.value, 10);
            state.contagens[step.def.key] = isNaN(v) ? null : Math.max(0, v);
            updateChrome();
          });
          Array.prototype.forEach.call(document.querySelectorAll(".wiz-stepper-btn"), function (btn) {
            btn.addEventListener("click", function () {
              var cur0 = parseInt(inputC.value, 10) || 0;
              setValC(cur0 + parseInt(btn.getAttribute("data-step"), 10));
            });
          });
        } else if (step.type === "checagem") {
          var itC = step.item;
          var rC = respostaDe(itC.id);
          Array.prototype.forEach.call(document.querySelectorAll(".wiz-opt"), function (btn) {
            btn.addEventListener("click", function () {
              rC.status = btn.getAttribute("data-val");
              renderStep();
            });
          });
          var obsC = document.getElementById("f-obs");
          if (obsC) {
            obsC.addEventListener("input", function (ev) { rC.obs = ev.target.value; });
          }
        } else if (step.type === "item") {
          var it = step.item;
          var r = respostaDe(it.id);

          comprovIniciarPasso(step); // painel de evidências recebidas (tempo real)

          Array.prototype.forEach.call(document.querySelectorAll(".wiz-opt"), function (btn) {
            btn.addEventListener("click", function () {
              r.status = btn.getAttribute("data-val");
              renderStep(); // re-render: aviso/justificativa dependem da resposta
            });
          });

          wireAnexos(r);

          var just = document.getElementById("f-just");
          if (just) {
            just.addEventListener("input", function (ev) {
              r.just = ev.target.value;
              var warn = document.getElementById("wiz-warn");
              if (warn) {
                var pendente = isCarregadores
                  ? (r.status === "ausente" && !justOk(r))
                  : (!!it.evidencia && (r.status === "conforme" || r.status === "nao") && !temAnexo(r) && !justOk(r));
                warn.style.display = pendente ? "flex" : "none";
              }
              updateChrome();
            });
          }

          var obs = document.getElementById("f-obs");
          if (obs) {
            obs.addEventListener("input", function (ev) { r.obs = ev.target.value; });
          }
        } else if (step.type === "assinaturas") {
          document.getElementById("f-resp-epo").addEventListener("input", function (ev) { state.assin.respEpo = ev.target.value; });
        } else if (step.type === "resumo") {
          document.getElementById("btn-rascunho").addEventListener("click", function () {
            // Antes este botao apenas dizia "Rascunho salvo" e nao gravava nada:
            // quem fechava a tela confiando nele perdia tudo.
            if (!envioReal) { App.toast("Sem conexão com os dados agora: nada foi gravado."); return; }
            var b = this;
            b.disabled = true;
            Auth.sessao().then(function (sess) {
              b.disabled = false;
              if (!sess) {
                App.toast("Sua sessão expirou. Entre novamente nesta aba para não perder o preenchimento.");
                return;
              }
              mostrarEnvio(true);
              enviarReal(sess, false);
            }, function () {
              b.disabled = false;
              App.toast("Não foi possível confirmar o seu acesso agora. Tente de novo.");
            });
          });
        }
      }

      function updateChrome() {
        var step = steps[cur];
        var isIntro = step.type === "intro";
        var isLast = cur === steps.length - 1;

        headerEl.classList.toggle("is-intro", isIntro);

        // Progresso/contador ignoram a capa (passo 0)
        var qTotal = steps.length - 1;
        var pct = (cur / qTotal) * 100;
        progressFill.style.width = pct + "%";
        counterEl.textContent = cur + "/" + qTotal;

        backBtn.style.display = isIntro ? "none" : "";
        backBtn.disabled = cur === 0;

        nextBtn.classList.toggle("is-submit", isLast);
        if (isIntro) {
          nextBtn.innerHTML = (isContagem ? "Iniciar contagem" : "Iniciar auditoria") +
            '<i class="ti ti-arrow-right" aria-hidden="true"></i>';
        } else if (isLast) {
          nextBtn.innerHTML = (isContagem ? "Enviar contagem" : "Enviar auditoria") +
            '<i class="ti ti-send" aria-hidden="true"></i>';
        } else {
          nextBtn.innerHTML = 'Próxima<i class="ti ti-chevron-right" aria-hidden="true"></i>';
        }
        nextBtn.disabled = !stepAnswered(cur) || !catalogoPronto;
      }

      function showDone(gravadaNoBanco) {
        headerEl.style.display = "none";
        footer.style.display = "none";

        if (isContagem) {
          var rr = calcReversa();
          var okF = rr.pctFontes != null && rr.pctFontes >= rr.meta;
          var okC = rr.pctControles != null && rr.pctControles >= rr.meta;
          main.innerHTML =
            '<div class="wiz-done">' +
              '<div class="wiz-done-icon"><i class="ti ti-circle-check" aria-hidden="true"></i></div>' +
              '<h1 class="wiz-done-title">Contagem enviada</h1>' +
              '<p class="wiz-done-sub"><b>' + esc(CONTAGEM.nome) + "</b> registrada com sucesso.</p>" +
              '<div class="wiz-done-score">' +
                '<span class="badge ' + (okF ? "badge-success" : "badge-danger") + '">Fontes ' + fmtPctRev(rr.pctFontes) + "</span>" +
                '<span class="badge ' + (okC ? "badge-success" : "badge-danger") + '">Controles ' + fmtPctRev(rr.pctControles) + "</span>" +
              "</div>" +
              '<div class="wiz-done-actions">' +
                '<a class="wiz-btn wiz-btn-next" href="' + urlSeletor() + '"><i class="ti ti-clipboard-list" aria-hidden="true"></i>Outras auditorias pendentes</a>' +
                '<a class="wiz-btn wiz-btn-back" href="index"><i class="ti ti-home" aria-hidden="true"></i>Voltar à página inicial</a>' +
              "</div>" +
            "</div>";
          main.scrollTop = 0;
          return;
        }

        var r = computeScore();
        var tier = r.avaliaveis > 0 ? App.tierOf(r.pts) : null;
        var meta = tier ? App.tierMeta(tier) : null;

        main.innerHTML =
          '<div class="wiz-done">' +
            '<div class="wiz-done-icon"><i class="ti ti-circle-check" aria-hidden="true"></i></div>' +
            '<h1 class="wiz-done-title">Auditoria enviada</h1>' +
            '<p class="wiz-done-sub">Checklist de <b>' + esc(processo.nome) + "</b> concluído com sucesso. " +
              "Enviada para conferência: a equipe APSIS vai comparar suas respostas e evidências com as do responsável da EPO." + "</p>" +
            '<div class="wiz-done-score">' +
              (meta ? '<span class="badge ' + meta.cls + '">' + meta.label + "</span>" : "") +
              '<strong class="tnum">' +
                (r.avaliaveis > 0 ? fmtNota(r.pts) + " / 100" : "sem nota") + "</strong>" +
            "</div>" +
            '<div class="wiz-done-actions">' +
              '<a class="wiz-btn wiz-btn-next" href="' + urlSeletor() + '"><i class="ti ti-clipboard-list" aria-hidden="true"></i>Outras auditorias pendentes</a>' +
              '<a class="wiz-btn wiz-btn-back" href="index"><i class="ti ti-home" aria-hidden="true"></i>Voltar à página inicial</a>' +
            "</div>" +
          "</div>";
        main.scrollTop = 0;
      }

      // ------------------------------------------------- Envio real (Supabase)
      // Só quando há Supabase configurado, fora do modo demo e com sessão ativa.
      // Contagem da reversa não existe no catálogo do banco: segue local.
      function sanitizarNome(nome) {
        var s = String(nome || "arquivo").toLowerCase().replace(/[^a-z0-9._-]/g, "_");
        return s.length > 80 ? s.slice(-80) : s;
      }

      var sendingEl = null;
      function mostrarEnvio(on) {
        if (on) {
          if (!sendingEl) {
            sendingEl = document.createElement("div");
            sendingEl.className = "wiz-sending";
            sendingEl.innerHTML = '<div class="wiz-sending-spin" aria-hidden="true"></div><p>Enviando auditoria…</p>';
            document.body.appendChild(sendingEl);
          }
        } else if (sendingEl) {
          sendingEl.remove();
          sendingEl = null;
        }
        nextBtn.disabled = on;
      }

      var MAPA_STATUS_DB = { conforme: "conforme", nao: "nao_conforme", na: "na", presente: "presente", ausente: "ausente" };

      // selar = true envia de verdade; false grava e deixa como rascunho, que e
      // o que o botao "Salvar rascunho" precisa fazer - ele apenas mostrava
      // "Rascunho salvo" e nao gravava nada.
      function enviarReal(sess, selar) {
        selar = selar !== false;
        var cabecalho = null;
        // O pedido veio na URL e nao pode ser lido: gravar assim deixaria a
        // auditoria sem vinculo e a pendencia aberta para sempre.
        if (alocParam && alocFalhou) {
          mostrarEnvio(false);
          App.toast("Não foi possível confirmar o relatório pedido. Abra a auditoria de novo pela lista de pendentes.");
          updateChrome();
          return;
        }
        mostrarEnvio(true);
        var db = Auth.cliente;
        var epoMock = App.epoById(state.epoId);
        var procDb = null, itensDb = [], itensDbPorId = {}, audId = null;

        // Com as perguntas vindas do cadastro, o id da tela E o id do banco.
        // O casamento por posicao sobra para o catalogo local (demonstracao).
        function itemDoBanco(it, idx) {
          if (procDbId) return itensDbPorId[it.id] || null;
          return itensDb[idx] || null;
        }

        db.from("processos").select("id").eq("slug", processo.id).eq("ativo", true).single()
          .then(function (r) {
            if (r.error || !r.data) throw new Error("Processo não encontrado no banco: " + processo.id);
            procDb = r.data;
            return db.from("itens_checklist").select("id")
              .eq("processo_id", procDb.id).eq("ativo", true).order("ordem");
          })
          .then(function (r) {
            if (r.error) throw r.error;
            itensDb = r.data || [];
            itensDbPorId = {};
            itensDb.forEach(function (x) { itensDbPorId[x.id] = x; });
            return db.from("epos").select("id, nome").eq("ativo", true);
          })
          .then(function (r) {
            if (r.error) throw r.error;
            var lista = r.data || [];
            var epoDb = null;
            var i;
            // 1) id do banco (select já carregado por carregarContexto)
            for (i = 0; i < lista.length; i++) {
              if (lista[i].id === state.epoId) { epoDb = lista[i]; break; }
            }
            // 2) rede de segurança: casa pelo nome do catálogo local
            if (!epoDb) {
              for (i = 0; i < lista.length; i++) {
                if (epoMock && lista[i].nome === epoMock.nome) { epoDb = lista[i]; break; }
              }
            }
            // Sem casar id nem nome, a auditoria seria gravada na primeira EPO
            // da lista: nota, evidencia e historico iriam para a unidade errada,
            // com um aviso no console como unico sinal. Melhor recusar o envio.
            if (!epoDb) {
              var semEpo = new Error(
                "Não foi possível confirmar em qual unidade esta auditoria deve ser registrada. " +
                "Volte ao passo de identificação, escolha a EPO na lista e envie de novo."
              );
              semEpo.avisoParaTela = true;
              throw semEpo;
            }
            var sc = computeScore();
            cabecalho = {
              epo_id: epoDb.id,
              processo_id: procDb.id,
              alocacao_id: aloc ? aloc.id : null,
              auditor_id: sess.user.id,
              data_visita: state.data || new Date().toISOString().slice(0, 10),
              score: sc.avaliaveis > 0 ? Math.round(sc.pts * 100) / 100 : null,
              tier: sc.avaliaveis > 0 ? App.tierOf(sc.pts) : null,
              resp_epo: (state.assin.respEpo || "").trim() || null
            };
            // Cada tentativa criava uma auditoria nova. Envio que falhava no
            // meio deixava rascunho para tras, e a mesma visita aparecia tres
            // vezes no banco - com notas diferentes entre elas. O rascunho de
            // quem esta preenchendo, para esta unidade e este questionario, e
            // reaproveitado.
            var q = db.from("auditorias").select("id")
              .eq("epo_id", epoDb.id).eq("processo_id", procDb.id)
              .eq("auditor_id", sess.user.id).eq("status", "rascunho");
            q = aloc ? q.eq("alocacao_id", aloc.id) : q.is("alocacao_id", null);
            return q.order("criado_em", { ascending: false }).limit(1);
          })
          .then(function (r) {
            if (r.error) throw r.error;
            var antigo = r.data && r.data[0] ? r.data[0].id : null;
            if (!antigo) {
            // A auditoria nasce como RASCUNHO e so e selada depois que resposta,
            // tempo e evidencia estiverem gravados.
            //
            // Nao e detalhe de estilo: a permissao de escrever resposta exige
            // que a auditoria esteja em rascunho, a menos que quem envia seja
            // admin ou gestor. Nascendo como "enviada", o consultor de campo
            // gravava o cabecalho e TODAS as respostas eram recusadas - ficava
            // uma auditoria com nota e sem uma resposta sequer. Nunca apareceu
            // porque so admin testou ate agora.
              cabecalho.status = "rascunho";
              return db.from("auditorias").insert(cabecalho).select("id").single();
            }
            // Reaproveitando: atualiza o cabecalho e apaga as respostas antigas,
            // senao a auditoria ficaria com as respostas das duas tentativas.
            audId = antigo;
            return db.from("auditorias").update(cabecalho).eq("id", antigo).select("id")
              .then(function (ru) {
                if (ru.error) throw ru.error;
                return db.from("respostas").delete().eq("auditoria_id", antigo);
              })
              .then(function (rd) {
                if (rd && rd.error) throw rd.error;
                return { data: { id: antigo }, error: null };
              });
          })
          .then(function (r) {
            if (r.error) throw r.error;
            audId = r.data.id;
            // Respostas: a pergunta da tela E a pergunta do cadastro, casadas
            // pelo id. Antes era pela posicao, e uma pergunta incluida ou
            // removida no meio jogava cada resposta para a pergunta seguinte.
            var rows = [];
            var faltando = 0;
            processo.itens.forEach(function (it, idx) {
              var resp = state.respostas[it.id];
              var itemDb = itemDoBanco(it, idx);
              if (!resp || !resp.status) return;
              if (!itemDb) { faltando += 1; return; }
              rows.push({
                auditoria_id: audId,
                item_id: itemDb.id,
                status: MAPA_STATUS_DB[resp.status] || resp.status,
                observacao: (resp.obs || "").trim() || null,
                justificativa: (resp.just || "").trim() || null
              });
            });
            if (faltando) {
              var mudou = new Error(
                "O questionário mudou desde que esta tela foi aberta. " +
                "Abra a auditoria novamente para enviar com as perguntas atuais."
              );
              mudou.avisoParaTela = true;
              throw mudou;
            }
            if (!rows.length) return { data: [] };
            return db.from("respostas").insert(rows).select("id, item_id");
          })
          .then(function (r) {
            if (r.error) throw r.error;
            // Os tempos do ciclo eram digitados em campo e descartados no
            // envio. A tabela existe e estava vazia em todas as auditorias.
            var t = state.tempos || {};
            var algumTempo = ["chegada", "armazenagem", "distribuicao", "retornoCampo", "devolucao"]
              .some(function (k) { return t[k] !== null && t[k] !== undefined && t[k] !== ""; });
            if (!algumTempo) return r;
            return db.from("tempos_ciclo").insert({
              auditoria_id: audId,
              chegada: t.chegada,
              armazenagem: t.armazenagem,
              distribuicao: t.distribuicao,
              retorno_campo: t.retornoCampo,
              devolucao: t.devolucao
            }).then(function (rt) {
              if (rt && rt.error) console.warn("tempos do ciclo:", rt.error.message || rt.error);
              return r;   // o tempo nao pode derrubar o envio da auditoria
            }, function (e) {
              console.warn("tempos do ciclo:", e);
              return r;
            });
          })
          .then(function (r) {
            var respIdPorItemDb = {};
            (r.data || []).forEach(function (x) { respIdPorItemDb[x.item_id] = x.id; });
            // Fila de uploads: um a um, para não estourar conexões no celular
            var fila = [];
            processo.itens.forEach(function (it, idx) {
              var resp = state.respostas[it.id];
              var itemDb = itemDoBanco(it, idx);
              if (!resp || !itemDb || !temAnexo(resp)) return;
              var respostaId = respIdPorItemDb[itemDb.id];
              if (!respostaId) return;
              resp.arquivos.forEach(function (file) {
                fila.push({ file: file, itemDbId: itemDb.id, respostaId: respostaId });
              });
            });
            var p = Promise.resolve();
            fila.forEach(function (job) {
              p = p.then(function () {
                var path = "auditorias/" + audId + "/" + job.itemDbId + "/" + Date.now() + "-" + sanitizarNome(job.file.name);
                return db.storage.from("evidencias").upload(path, job.file).then(function (up) {
                  if (up.error) throw up.error;
                  return db.from("evidencias").insert({
                    resposta_id: job.respostaId,
                    storage_path: path,
                    tipo: (job.file.type || "").indexOf("image") === 0 ? "foto" : "arquivo",
                    origem: "consultor"
                  }).then(function (ins) { if (ins.error) throw ins.error; });
                });
              });
            });
            return p;
          })
          .then(function () {
            // Pedido de rascunho: para aqui. Fica gravado e recuperavel.
            if (!selar) return null;
            // Tudo gravado: agora a auditoria e selada. Falhando o selo, ela
            // fica como rascunho - recuperavel, e melhor do que selada e vazia.
            // A nota vai de novo aqui: a do insert e a do momento em que o
            // cabecalho nasceu, e entre um e outro a pessoa ainda responde.
            var sc = computeScore();
            return db.from("auditorias")
              .update({
                status: "enviada",
                enviada_em: new Date().toISOString(),
                score: sc.avaliaveis > 0 ? Math.round(sc.pts * 100) / 100 : null,
                tier: sc.avaliaveis > 0 ? App.tierOf(sc.pts) : null
              })
              .eq("id", audId).select("id")
              .then(function (rs) {
                if (rs.error) throw rs.error;
                if (!rs.data || !rs.data.length) {
                  var naoSelou = new Error(
                    "As respostas foram gravadas, mas não foi possível concluir o envio. " +
                    "Abra a auditoria novamente pela lista de pendentes."
                  );
                  naoSelou.avisoParaTela = true;
                  throw naoSelou;
                }
              })
              .then(function () {
                // O pedido tem de sair de pendente. Sem isto a auditoria ficava
                // enviada e a tela de EPOs continuava contando "10 pedidos, 10
                // pendentes", porque quem conta pendencia e o pedido, nao a
                // auditoria. Falhar aqui nao desfaz o envio: a auditoria esta
                // gravada, e o aviso diz que a pendencia continua aberta.
                if (!aloc || !aloc.id) return null;
                return db.from("alocacoes")
                  .update({ status: "enviada", enviada_em: new Date().toISOString() })
                  .eq("id", aloc.id).select("id")
                  .then(function (rp) {
                    if (rp.error || !rp.data || !rp.data.length) {
                      console.warn("pedido nao saiu de pendente", rp.error);
                      App.toast("Auditoria enviada. A pendência pode levar alguns instantes para sair da lista.");
                    }
                  }, function (e) { console.warn("pedido nao saiu de pendente", e); });
              });
          })
          .then(function () {
            if (!selar) {
              mostrarEnvio(false);
              App.toast("Rascunho salvo. Você pode continuar depois pela lista de pendentes.");
              nextBtn.disabled = false;
              return;
            }
            // encaminha as evidencias para a pasta oficial, em segundo plano
            if (audId && db.functions) {
              db.functions.invoke("sincronizar-sharepoint", { body: { auditoria_id: audId } })
                .then(function (r) {
                  if (r && r.error) console.warn("encaminhamento:", r.error.message || r.error);
                }, function (e) { console.warn("encaminhamento:", e); });
            }
            mostrarEnvio(false);
            showDone(true);
          })
          .catch(function (err) {
            mostrarEnvio(false);
            console.error("Falha ao enviar auditoria:", err);
            App.toast(err && err.avisoParaTela
              ? err.message
              : "Não foi possível enviar a auditoria. Confira a conexão e tente novamente.");
            updateChrome(); // reabilita o botão conforme o passo atual
          });
      }

      backBtn.addEventListener("click", function () {
        if (cur > 0) {
          cur -= 1;
          comprov.cache = null; // trocou de passo: recarrega do banco
          renderStep();
        }
      });

      nextBtn.addEventListener("click", function () {
        if (nextBtn.disabled) return;
        if (cur === steps.length - 1) {
          if (envioReal) {
            nextBtn.disabled = true; // evita duplo envio enquanto busca a sessão
            Auth.sessao().then(function (s) {
              if (s) { enviarReal(s); return; }
              // Sem sessão nada foi gravado. Mostrar a tela de conclusão aqui
              // faria o auditor ir embora achando que enviou, e a auditoria
              // inteira sumiria com a aba. O checklist fica na tela.
              nextBtn.disabled = false;
              App.toast("Sua sessão expirou. Entre novamente nesta aba para enviar sem perder o que foi preenchido.");
            }, function (err) {
              // A promessa rejeitou (rede caindo): reabilitar, senão o botão
              // fica travado e não existe mais caminho para enviar.
              console.error("sessão para envio:", err);
              nextBtn.disabled = false;
              App.toast("Não foi possível confirmar o seu acesso agora. Tente enviar de novo.");
            });
          } else {
            showDone(false);
          }
          return;
        }
        cur += 1;
        comprov.cache = null; // trocou de passo: recarrega do banco
        renderStep();
      });

      renderStep();

      // Perguntas do cadastro: enquanto não chegam, a capa fica sem avançar.
      // Chegando, os passos são remontados com o questionário atual.
      if (envioReal) {
        catalogo().then(function () {
          catalogoPronto = true;
          montarPassos();
          if (cur > steps.length - 1) cur = 0;
          renderStep();
        }, function (err) {
          console.error("catálogo do questionário:", err);
          falhaDoCatalogo((err && err.message) ||
            "Não foi possível carregar as perguntas agora. Tente novamente em alguns instantes.");
        });
      }

      // O campo Auditor mostra quem entrou. Antes vinha com um nome ficticio
      // do catalogo local e o valor digitado nao ia para lugar nenhum.
      if (window.Auth && Auth.perfil) {
        Auth.perfil().then(function (perf) {
          if (!perf || !perf.nome) return;
          state.auditor = perf.nome;
          var campo = document.getElementById("f-auditor");
          if (campo) campo.value = perf.nome;
        }, function () {});
      }

      // Contexto do banco (EPOs reais + relatorio pedido): a capa e a
      // identificacao sao repintadas quando os dados chegam.
      contexto().then(function () {
        if (catalogoFalhou) return;
        var s0 = steps[cur];
        if (s0 && (s0.type === "intro" || s0.type === "identificacao")) renderStep();
      });
    })();
  </script>
</body>
</html>
