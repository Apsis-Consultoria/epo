<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auditorias realizadas - Auditoria de EPOs</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/app.css?v=99">

  <style>
    /* Sem tabela de proposito. O compilado e uma pilha de blocos: no celular
       uma tabela com pergunta, resposta, observacao e justificativa viraria
       rolagem lateral, escondendo justamente o texto que importa ler. */
    .rz-busca { position: relative; flex: 1 1 260px; max-width: 420px; }
    .rz-busca i {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 17px; pointer-events: none;
    }
    .rz-busca .input { padding-left: 36px; }

    .rz-epo { margin-bottom: 22px; }
    .rz-epo-cab {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding-bottom: 10px; margin-bottom: 12px;
      border-bottom: 1.5px solid var(--border);
    }
    .rz-epo-info { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; }
    .rz-epo-info .nm { font-size: 15.5px; font-weight: 600; color: var(--text); }
    .rz-epo-info .loc { font-size: 12.5px; color: var(--text-2); }
    .rz-nota-media {
      display: inline-flex; align-items: baseline; gap: 5px;
      font-variant-numeric: tabular-nums;
    }
    .rz-nota-media b { font-size: 19px; font-weight: 700; color: var(--text); }
    .rz-nota-media span { font-size: 11.5px; color: var(--text-2); }

    .rz-aud {
      border: 1.5px solid var(--border); border-radius: var(--radius);
      background: var(--surface); margin-bottom: 10px; overflow: hidden;
    }
    .rz-aud-cab {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 13px 15px; background: transparent; border: 0;
      font-family: inherit; text-align: left; cursor: pointer;
    }
    .rz-aud-cab:hover { background: var(--surface-2); }
    .rz-ico {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; flex: none; border-radius: 9px;
      background: var(--primary-tint); color: var(--apsis-green); font-size: 18px;
    }
    .rz-aud-corpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .rz-aud-corpo .nm { font-size: 14.5px; font-weight: 600; color: var(--text); }
    .rz-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-2); }
    .rz-meta .m { display: inline-flex; align-items: center; gap: 4px; }
    .rz-meta .m i { font-size: 14px; }
    .rz-aud-fim { display: flex; align-items: center; gap: 10px; flex: none; }
    .rz-nota { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .rz-seta { color: var(--text-muted); transition: transform .18s ease; }
    .rz-aud.is-open .rz-seta { transform: rotate(90deg); }

    .rz-respostas { display: none; border-top: 1px solid var(--border); padding: 4px 0; }
    .rz-aud.is-open .rz-respostas { display: block; }
    .rz-resp {
      display: flex; gap: 11px; padding: 12px 15px;
      border-bottom: 1px solid var(--border);
    }
    .rz-resp:last-child { border-bottom: 0; }
    .rz-marca {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; flex: none; border-radius: 50%; font-size: 14px; margin-top: 1px;
    }
    .rz-marca.ok  { background: var(--success-bg); color: var(--success); }
    .rz-marca.nao { background: var(--danger-bg);  color: var(--danger); }
    .rz-marca.na  { background: var(--surface-2);  color: var(--text-muted); }
    .rz-resp-corpo { flex: 1; min-width: 0; }
    .rz-pergunta { font-size: 13.5px; color: var(--text); line-height: 1.45; }
    .rz-nota-texto {
      display: block; margin-top: 5px; font-size: 12.5px; color: var(--text-2);
      line-height: 1.5; word-break: break-word;
    }
    .rz-nota-texto b { color: var(--text); font-weight: 600; }
    .rz-grave {
      display: inline-flex; align-items: center; gap: 4px; margin-left: 6px;
      font-size: 11px; font-weight: 600; color: var(--danger);
    }

    /* ---------------------------------------------------------------- Correcao
       A tela mostra o que a equipe de campo enviou, e e nela que a coordenacao
       corrige. Os controles ficam dentro do painel aberto, nunca no cabecalho:
       o cabecalho ja e um botao, e botao dentro de botao nao vale. */
    .rz-barra {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 10px 15px; border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    .rz-barra .rz-rastro {
      flex: 1 1 100%; font-size: 12px; color: var(--text-2);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .rz-barra .rz-rastro i { font-size: 14px; }

    .rz-opcoes { display: flex; gap: 8px; margin-top: 9px; }
    .rz-opt {
      flex: 1 1 0; min-height: 38px; padding: 8px 10px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text-2);
      font: 600 12.5px Inter, sans-serif; cursor: pointer;
    }
    .rz-opt:hover { border-color: var(--border-strong); color: var(--text); }
    .rz-opt.is-sel { color: #fff; }
    .rz-opt-conforme.is-sel, .rz-opt-presente.is-sel {
      background: var(--success); border-color: var(--success);
    }
    .rz-opt-nao_conforme.is-sel, .rz-opt-ausente.is-sel {
      background: var(--danger); border-color: var(--danger);
    }
    .rz-opt-na.is-sel { background: var(--text-2); border-color: var(--text-2); }

    .rz-campo { display: block; margin-top: 9px; }
    .rz-campo > span {
      display: block; font-size: 11.5px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .3px; color: var(--text-muted); margin-bottom: 4px;
    }
    .rz-campo textarea {
      width: 100%; min-height: 54px; resize: vertical;
      padding: 9px 11px; font: 400 13px Inter, sans-serif; color: var(--text);
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .rz-campo textarea:focus {
      outline: none; border-color: var(--apsis-green);
      box-shadow: 0 0 0 3px var(--primary-tint);
    }
    .rz-resp-edit { background: var(--surface); }

    /* Celular: o cabecalho da auditoria empilha em vez de espremer a nota. */
    @media (max-width: 620px) {
      .rz-aud-cab { flex-wrap: wrap; }
      .rz-aud-corpo { flex: 1 1 100%; order: 2; }
      .rz-aud-fim { order: 1; margin-left: auto; }
      .rz-resp { padding: 12px 13px; }
      /* Um botao acima do outro, largura inteira: tres opcoes lado a lado num
         celular dao 90px cada e o rotulo sai cortado. */
      .rz-opcoes { flex-direction: column; }
      .rz-opt { flex: 1 1 auto; width: 100%; min-height: 42px; }
      .rz-barra .btn { flex: 1 1 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <script src="assets/data.js?v=99"></script>
  <script src="assets/app.js?v=99"></script>
  <script src="assets/supabase-config.js?v=99"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js?v=99"></script>
  <script>
    (function () {
      "use strict";

      Layout.mount("realizadas", "Auditorias realizadas");

      var esc = App.escapeHtml;
      var DEMO = (window.Auth && Auth.modoDemo()) || !(window.Auth && Auth.pronto);
      var page = document.getElementById("page");

      var linhas = [];        // uma por auditoria enviada
      var respostas = {};     // auditoria_id -> [ { pergunta, status, ... } ]
      var rastro = {};        // auditoria_id -> [ correcoes registradas ]
      var abertas = {};       // auditoria_id -> aberta
      var busca = "";
      var carregando = true;
      var falha = "";

      // A tela existe para ler o compilado e corrigir o que veio errado do
      // campo. Corrigir e da coordenacao: e o que o servidor aceita depois que
      // a auditoria foi enviada, entao o botao aparece so para quem ele aceita.
      var meuPapel = "";
      var podeCorrigir = false;
      var editando = null;    // auditoria em correcao
      var edicao = {};        // resposta_id -> o que mudou nela
      var salvando = false;

      var OPCOES_PADRAO = [
        { v: "conforme", t: "Conforme" },
        { v: "nao_conforme", t: "Não conforme" },
        { v: "na", t: "Não se aplica" }
      ];
      var OPCOES_PRESENCA = [
        { v: "presente", t: "Presente" },
        { v: "ausente", t: "Ausente" }
      ];

      var MARCA = {
        conforme:     { cls: "ok",  icone: "ti-check",  texto: "Conforme" },
        nao_conforme: { cls: "nao", icone: "ti-x",      texto: "Não conforme" },
        na:           { cls: "na",  icone: "ti-minus",  texto: "Não se aplica" },
        presente:     { cls: "ok",  icone: "ti-check",  texto: "Presente" },
        ausente:      { cls: "nao", icone: "ti-x",      texto: "Ausente" }
      };

      page.innerHTML =
        '<div class="card">' +
          '<div class="card-header">' +
            '<div class="section-title"><span class="title">Respostas enviadas</span></div>' +
            '<div class="card-header-action">' +
              '<div class="rz-busca">' +
                '<i class="ti ti-search" aria-hidden="true"></i>' +
                '<input class="input" id="rz-q" type="search" autocomplete="off" ' +
                  'placeholder="Buscar por EPO, cidade ou questionário" ' +
                  'aria-label="Buscar por EPO, cidade ou questionário">' +
              "</div>" +
            "</div>" +
          "</div>" +
          '<p class="rz-resumo muted" id="rz-resumo" style="font-size:12.5px;margin:0 0 14px;"></p>' +
          '<div id="rz-lista"></div>' +
        "</div>";

      var elLista = document.getElementById("rz-lista");
      var elResumo = document.getElementById("rz-resumo");

      function fmtData(iso) {
        if (!iso) return "";
        var p = String(iso).slice(0, 10).split("-");
        if (p.length !== 3) return "";
        return p[2] + "/" + p[1] + "/" + p[0];
      }

      function local(cidade, uf) {
        return [cidade, uf].filter(Boolean).join("/");
      }

      function fmtNota(n) {
        return n == null ? "sem nota" : String(Math.round(Number(n)));
      }

      function media(lista) {
        var v = lista.filter(function (x) { return x != null && !isNaN(x); });
        if (!v.length) return null;
        var soma = 0;
        v.forEach(function (x) { soma += Number(x); });
        return soma / v.length;
      }

      // Questionario de carregadores responde presente/ausente; o resto,
      // conforme/nao conforme/nao se aplica. Em vez de perguntar o tipo do
      // questionario, olha-se o que as respostas usam: e a mesma informacao,
      // sem depender do catalogo.
      function opcoesDe(lista) {
        var presenca = false;
        (lista || []).forEach(function (r) {
          if (r.status === "presente" || r.status === "ausente") presenca = true;
        });
        return presenca ? OPCOES_PRESENCA : OPCOES_PADRAO;
      }

      // Mesma conta do preenchimento: "nao se aplica" fica fora, e sem nada
      // avaliavel nao ha nota. Se a conta fosse diferente daqui para la, a
      // mesma auditoria teria duas notas.
      function pesoDe(r) {
        var p = (r && r.peso === null) || (r && r.peso === undefined) ? 1 : Number(r.peso);
        return (isNaN(p) || p <= 0) ? 1 : p;
      }

      function notaDe(lista) {
        var presenca = opcoesDe(lista) === OPCOES_PRESENCA;
        var bons = 0, ruins = 0;
        (lista || []).forEach(function (r) {
          if (!r.status) return;
          if (presenca) {
            if (r.status === "presente") bons += pesoDe(r);
            else if (r.status === "ausente") ruins += pesoDe(r);
            return;
          }
          if (r.status === "na") return;
          if (r.status === "conforme") bons += pesoDe(r); else ruins += pesoDe(r);
        });
        var soma = bons + ruins;
        if (!soma) return { score: null, tier: null };
        var pts = (bons / soma) * 100;
        return { score: Math.round(pts * 100) / 100, tier: App.tierOf(pts) };
      }

      // ------------------------------------------------------------------
      // Leitura
      // ------------------------------------------------------------------
      function descobrirPapel() {
        if (DEMO) {
          meuPapel = (Auth.papelDemo && Auth.papelDemo()) || "admin";
          podeCorrigir = meuPapel === "admin" || meuPapel === "gestor";
          return Promise.resolve();
        }
        if (!window.Auth || !Auth.perfil) return Promise.resolve();
        return Auth.perfil().then(function (p) {
          meuPapel = (p && p.papel) || "";
          podeCorrigir = meuPapel === "admin" || meuPapel === "gestor";
        }, function () { podeCorrigir = false; });
      }

      function carregar() {
        carregando = true; falha = "";
        if (DEMO) {
          linhas = [];
          carregando = false;
          return Promise.resolve();
        }
        var db = Auth.cliente;
        return db.from("auditorias")
          .select("id, epo_id, processo_id, score, tier, status, data_visita, enviada_em, " +
                  "resp_epo, epos!inner(nome, cidade, uf), processos!inner(nome, icone)")
          .in("status", ["enviada", "validada"])
          .order("enviada_em", { ascending: false })
          .then(function (r) {
            if (!r || r.error) {
              throw new Error((r && r.error && r.error.message) ||
                              "nao foi possivel ler as auditorias");
            }
            linhas = (r.data || []).map(function (a) {
              var e = a.epos || {};
              var p = a.processos || {};
              return {
                id: a.id, epoId: a.epo_id,
                epoNome: e.nome || "EPO", cidade: e.cidade || "", uf: e.uf || "",
                processoNome: p.nome || "Questionário",
                processoIcone: p.icone || "ti-clipboard-check",
                score: a.score == null ? null : Number(a.score),
                tier: a.tier || null,
                dataVisita: a.data_visita || "",
                enviadaEm: a.enviada_em || "",
                respEpo: a.resp_epo || "",
                validada: a.status === "validada"
              };
            });
            carregando = false;
          });
      }

      // As respostas de uma auditoria so sao lidas quando alguem abre: com
      // muitas auditorias, trazer tudo de uma vez deixaria a tela pesada sem
      // ninguem ter pedido.
      function carregarRespostas(audId) {
        if (respostas[audId]) return Promise.resolve(respostas[audId]);
        if (DEMO) { respostas[audId] = []; return Promise.resolve([]); }
        return Auth.cliente.from("respostas")
          .select("id, status, observacao, justificativa, " +
                  "itens_checklist!inner(pergunta, ordem, grave, evidencia_esperada, peso)")
          .eq("auditoria_id", audId)
          .then(function (r) {
            if (!r || r.error) {
              throw new Error((r && r.error && r.error.message) ||
                              "nao foi possivel ler as respostas");
            }
            var lista = (r.data || []).map(function (x) {
              var it = x.itens_checklist || {};
              return {
                id: x.id,
                pergunta: it.pergunta || "Pergunta",
                ordem: it.ordem == null ? 999 : it.ordem,
                grave: !!it.grave,
                peso: (it.peso === null || it.peso === undefined) ? 1 : Number(it.peso),
                status: x.status,
                observacao: x.observacao || "",
                justificativa: x.justificativa || ""
              };
            });
            lista.sort(function (a, b) { return a.ordem - b.ordem; });
            respostas[audId] = lista;
            return lista;
          });
      }

      // Correcao ja registrada nesta auditoria. Sem isto, auditoria corrigida
      // ficaria igual a auditoria intacta na tela.
      function carregarRastro(audId) {
        if (rastro[audId] || DEMO) { rastro[audId] = rastro[audId] || []; return Promise.resolve(rastro[audId]); }
        return Auth.cliente.from("auditoria_historico")
          .select("campo, de, para, quando")
          .eq("auditoria_id", audId)
          .order("quando", { ascending: false })
          .then(function (r) {
            rastro[audId] = (r && !r.error && r.data) ? r.data : [];
            return rastro[audId];
          }, function () { rastro[audId] = []; return rastro[audId]; });
      }

      // ------------------------------------------------------------------
      // Desenho
      // ------------------------------------------------------------------
      function visiveis() {
        var q = busca.toLowerCase();
        if (!q) return linhas;
        return linhas.filter(function (l) {
          return (l.epoNome + " " + l.cidade + " " + l.uf + " " + l.processoNome)
            .toLowerCase().indexOf(q) >= 0;
        });
      }

      function htmlResposta(r) {
        var m = MARCA[r.status] || { cls: "na", icone: "ti-help", texto: r.status || "" };
        var extra = "";
        if (r.observacao) {
          extra += '<span class="rz-nota-texto"><b>Observação:</b> ' + esc(r.observacao) + "</span>";
        }
        if (r.justificativa) {
          extra += '<span class="rz-nota-texto"><b>Justificativa:</b> ' + esc(r.justificativa) + "</span>";
        }
        return (
          '<div class="rz-resp">' +
            '<span class="rz-marca ' + m.cls + '" title="' + esc(m.texto) + '">' +
              '<i class="ti ' + m.icone + '" aria-hidden="true"></i></span>' +
            '<div class="rz-resp-corpo">' +
              '<span class="rz-pergunta">' + esc(r.pergunta) +
                (r.grave
                  ? '<span class="rz-grave"><i class="ti ti-alert-triangle" aria-hidden="true"></i>item grave</span>'
                  : "") +
              "</span>" +
              extra +
            "</div>" +
          "</div>"
        );
      }

      function htmlRespostaEdit(r, opcoes) {
        var e = edicao[r.id] || {};
        var st = e.status != null ? e.status : r.status;
        var obs = e.observacao != null ? e.observacao : r.observacao;
        var just = e.justificativa != null ? e.justificativa : r.justificativa;
        return (
          '<div class="rz-resp rz-resp-edit">' +
            '<div class="rz-resp-corpo">' +
              '<span class="rz-pergunta">' + esc(r.pergunta) +
                (r.grave
                  ? '<span class="rz-grave"><i class="ti ti-alert-triangle" aria-hidden="true"></i>item grave</span>'
                  : "") +
              "</span>" +
              '<div class="rz-opcoes" role="group">' +
                opcoes.map(function (o) {
                  return '<button type="button" class="rz-opt rz-opt-' + o.v +
                    (st === o.v ? " is-sel" : "") + '" data-marcar="' + esc(r.id) +
                    '" data-valor="' + o.v + '" aria-pressed="' +
                    (st === o.v ? "true" : "false") + '">' + esc(o.t) + "</button>";
                }).join("") +
              "</div>" +
              '<label class="rz-campo"><span>Observação</span>' +
                '<textarea data-resp="' + esc(r.id) + '" data-campo="observacao" rows="2">' +
                  esc(obs) + "</textarea></label>" +
              '<label class="rz-campo"><span>Justificativa</span>' +
                '<textarea data-resp="' + esc(r.id) + '" data-campo="justificativa" rows="2">' +
                  esc(just) + "</textarea></label>" +
            "</div>" +
          "</div>"
        );
      }

      function htmlBarra(l) {
        var linhaRastro = "";
        var reg = rastro[l.id];
        if (reg && reg.length) {
          linhaRastro = '<span class="rz-rastro">' +
            '<i class="ti ti-history" aria-hidden="true"></i>Corrigida em ' +
            esc(fmtData(reg[0].quando)) + "</span>";
        }
        if (!podeCorrigir) {
          return linhaRastro ? '<div class="rz-barra">' + linhaRastro + "</div>" : "";
        }
        var acoes = editando === l.id
          ? '<button class="btn btn-primary btn-sm" type="button" data-salvar="' + esc(l.id) + '"' +
              (salvando ? " disabled" : "") + ">" +
              '<i class="ti ti-device-floppy" aria-hidden="true"></i>' +
              (salvando ? "Salvando..." : "Salvar correções") + "</button>" +
            '<button class="btn btn-ghost btn-sm" type="button" data-cancelar="' + esc(l.id) + '"' +
              (salvando ? " disabled" : "") + ">Cancelar</button>"
          : '<button class="btn btn-ghost btn-sm" type="button" data-corrigir="' + esc(l.id) + '">' +
              '<i class="ti ti-pencil" aria-hidden="true"></i>Corrigir respostas</button>';
        return '<div class="rz-barra">' + acoes + linhaRastro + "</div>";
      }

      function htmlAuditoria(l) {
        var aberta = !!abertas[l.id];
        var tm = l.tier ? App.tierMeta(l.tier) : null;
        var meta = "";
        if (l.dataVisita) {
          meta += '<span class="m"><i class="ti ti-calendar-event" aria-hidden="true"></i>Visita ' +
            esc(fmtData(l.dataVisita)) + "</span>";
        }
        if (l.respEpo) {
          meta += '<span class="m"><i class="ti ti-user-check" aria-hidden="true"></i>' +
            esc(l.respEpo) + "</span>";
        }
        if (l.validada) {
          meta += '<span class="m"><i class="ti ti-rosette-discount-check" aria-hidden="true"></i>Validada</span>';
        }

        var lista = respostas[l.id];
        var corpo;
        if (!lista) {
          corpo = '<div class="rz-resp"><div class="rz-resp-corpo">' +
            '<span class="rz-pergunta muted">Carregando as respostas...</span>' +
            "</div></div>";
        } else if (!lista.length) {
          corpo = '<div class="rz-resp"><div class="rz-resp-corpo">' +
            '<span class="rz-pergunta muted">Nenhuma resposta registrada nesta auditoria.</span>' +
            "</div></div>";
        } else if (editando === l.id) {
          var opcoes = opcoesDe(lista);
          corpo = lista.map(function (r) { return htmlRespostaEdit(r, opcoes); }).join("");
        } else {
          corpo = lista.map(htmlResposta).join("");
        }
        corpo = (lista ? htmlBarra(l) : "") + corpo;

        return (
          '<article class="rz-aud' + (aberta ? " is-open" : "") + '" data-aud="' + esc(l.id) + '">' +
            '<button class="rz-aud-cab" type="button" data-abrir="' + esc(l.id) + '"' +
              ' aria-expanded="' + (aberta ? "true" : "false") + '">' +
              '<span class="rz-ico"><i class="ti ' + esc(l.processoIcone) + '" aria-hidden="true"></i></span>' +
              '<span class="rz-aud-corpo">' +
                '<span class="nm">' + esc(l.processoNome) + "</span>" +
                (meta ? '<span class="rz-meta">' + meta + "</span>" : "") +
              "</span>" +
              '<span class="rz-aud-fim">' +
                (tm ? '<span class="badge ' + tm.cls + '">' + tm.label + "</span>" : "") +
                '<span class="rz-nota">' + esc(fmtNota(l.score)) + "</span>" +
                '<i class="ti ti-chevron-right rz-seta" aria-hidden="true"></i>' +
              "</span>" +
            "</button>" +
            '<div class="rz-respostas">' + corpo + "</div>" +
          "</article>"
        );
      }

      function render() {
        if (falha) {
          elResumo.textContent = "";
          elLista.innerHTML = '<div class="empty">' +
            '<i class="ti ti-alert-triangle" aria-hidden="true"></i><p>' + esc(falha) + "</p></div>";
          return;
        }
        if (carregando) {
          elResumo.textContent = "";
          elLista.innerHTML = '<div class="empty">' +
            '<i class="ti ti-loader-2" aria-hidden="true"></i><p>Carregando as auditorias enviadas...</p></div>';
          return;
        }
        if (!linhas.length) {
          elResumo.textContent = "";
          elLista.innerHTML = '<div class="empty">' +
            '<i class="ti ti-clipboard-off" aria-hidden="true"></i>' +
            "<p>Nenhuma auditoria enviada até agora.</p>" +
            '<p class="muted" style="font-size:12.5px;">' +
              "As respostas aparecem aqui quando a equipe de campo envia um questionário preenchido." +
            "</p></div>";
          return;
        }

        var lista = visiveis();
        if (!lista.length) {
          elResumo.textContent = "";
          elLista.innerHTML = '<div class="empty">' +
            '<i class="ti ti-search-off" aria-hidden="true"></i>' +
            '<p>Nada encontrado para "' + esc(busca) + '".</p></div>';
          return;
        }

        // Agrupado por EPO: e assim que a coordenacao le o compilado, unidade
        // por unidade, e nao auditoria solta.
        var grupos = [];
        var indice = {};
        lista.forEach(function (l) {
          var k = String(l.epoId);
          if (!indice[k]) {
            indice[k] = { id: l.epoId, nome: l.epoNome, cidade: l.cidade, uf: l.uf, itens: [] };
            grupos.push(indice[k]);
          }
          indice[k].itens.push(l);
        });
        grupos.sort(function (a, b) { return a.nome.localeCompare(b.nome, "pt-BR"); });

        elResumo.textContent =
          lista.length + (lista.length === 1 ? " auditoria enviada" : " auditorias enviadas") +
          " em " + grupos.length + (grupos.length === 1 ? " EPO" : " EPOs");

        elLista.innerHTML = grupos.map(function (g) {
          var notas = g.itens.map(function (x) { return x.score; });
          var m = media(notas);
          return (
            '<section class="rz-epo">' +
              '<header class="rz-epo-cab">' +
                '<div class="rz-epo-info">' +
                  '<span class="nm">' + esc(g.nome) + "</span>" +
                  '<span class="loc">' + esc(local(g.cidade, g.uf)) + "</span>" +
                "</div>" +
                '<span class="rz-nota-media">' +
                  "<b>" + esc(fmtNota(m)) + "</b><span>nota média</span>" +
                "</span>" +
                '<span class="badge badge-success">' + g.itens.length +
                  (g.itens.length === 1 ? " enviada" : " enviadas") + "</span>" +
              "</header>" +
              g.itens.map(htmlAuditoria).join("") +
            "</section>"
          );
        }).join("");
      }

      // ------------------------------------------------------------------
      // Eventos
      // ------------------------------------------------------------------
      document.getElementById("rz-q").addEventListener("input", function () {
        busca = this.value || "";
        render();
      });

      elLista.addEventListener("click", function (ev) {
        // Marcar a resposta NAO repinta a lista: repintar aqui apagaria o que
        // esta sendo digitado nas caixas de texto ao lado e tiraria o foco.
        var opt = ev.target.closest("[data-marcar]");
        if (opt) {
          var rid = opt.getAttribute("data-marcar");
          var valor = opt.getAttribute("data-valor");
          if (!edicao[rid]) edicao[rid] = {};
          edicao[rid].status = valor;
          opt.parentNode.querySelectorAll(".rz-opt").forEach(function (b) {
            var sel = b.getAttribute("data-valor") === valor;
            b.classList.toggle("is-sel", sel);
            b.setAttribute("aria-pressed", sel ? "true" : "false");
          });
          return;
        }

        var abrirCorrecao = ev.target.closest("[data-corrigir]");
        if (abrirCorrecao) {
          editando = abrirCorrecao.getAttribute("data-corrigir");
          edicao = {};
          render();
          return;
        }

        var cancelar = ev.target.closest("[data-cancelar]");
        if (cancelar) {
          if (salvando) return;
          editando = null;
          edicao = {};
          render();
          return;
        }

        var salvar = ev.target.closest("[data-salvar]");
        if (salvar) {
          salvarCorrecoes(salvar.getAttribute("data-salvar"));
          return;
        }

        var btn = ev.target.closest("[data-abrir]");
        if (!btn) return;
        var id = btn.getAttribute("data-abrir");
        abertas[id] = !abertas[id];
        // Fechar o painel em correcao desfaz a correcao: o contrario seria
        // guardar mudanca que ninguem ve mais.
        if (!abertas[id]) {
          if (editando === id) { editando = null; edicao = {}; }
          render();
          return;
        }
        render();
        if (respostas[id]) return;
        Promise.all([carregarRespostas(id), carregarRastro(id)]).then(render, function (e) {
          respostas[id] = [];
          if (window.console && console.warn) console.warn("respostas", e);
          render();
        });
      });

      // Texto digitado vai para o rascunho da correcao sem repintar a tela.
      elLista.addEventListener("input", function (ev) {
        var ta = ev.target;
        if (!ta || !ta.getAttribute || !ta.getAttribute("data-resp")) return;
        var rid = ta.getAttribute("data-resp");
        if (!edicao[rid]) edicao[rid] = {};
        edicao[rid][ta.getAttribute("data-campo")] = ta.value;
      });

      // ------------------------------------------------------------------
      // Gravar a correcao
      //
      // Uma auditoria enviada e um resultado ja comunicado: a correcao grava
      // resposta por resposta, refaz a nota pela mesma conta do preenchimento
      // e, se a auditoria estava validada, tira a validacao - a conferencia
      // valia para a resposta anterior, nao para esta.
      // ------------------------------------------------------------------
      function salvarCorrecoes(audId) {
        if (salvando) return;
        var l = null;
        linhas.forEach(function (x) { if (String(x.id) === String(audId)) l = x; });
        var lista = respostas[audId] || [];
        if (!l || !lista.length) return;

        var mudou = [];
        lista.forEach(function (r) {
          var e = edicao[r.id];
          if (!e) return;
          var novo = {
            status: e.status != null ? e.status : r.status,
            observacao: e.observacao != null ? e.observacao : r.observacao,
            justificativa: e.justificativa != null ? e.justificativa : r.justificativa
          };
          if (novo.status === r.status &&
              novo.observacao === r.observacao &&
              novo.justificativa === r.justificativa) return;
          mudou.push({ r: r, novo: novo });
        });

        if (!mudou.length) {
          App.toast("Nada foi alterado.");
          editando = null; edicao = {};
          render();
          return;
        }

        if (DEMO) {
          App.toast("Sem conexao com os dados agora: nada foi gravado.");
          return;
        }

        salvando = true;
        render();

        var db = Auth.cliente;
        var cadeia = Promise.resolve();
        var recusou = false;

        mudou.forEach(function (m) {
          cadeia = cadeia.then(function () {
            if (recusou) return null;
            return db.from("respostas")
              .update({
                status: m.novo.status,
                observacao: m.novo.observacao || null,
                justificativa: m.novo.justificativa || null
              })
              .eq("id", m.r.id)
              .select("id")
              .then(function (r) {
                if (r.error) throw r.error;
                // Sem linha alterada, o acesso nao alcanca esta auditoria: o
                // servidor responde sucesso vazio, e a tela mostraria a
                // correcao com o banco intacto.
                if (!r.data || !r.data.length) { recusou = true; return null; }
                m.r.status = m.novo.status;
                m.r.observacao = m.novo.observacao;
                m.r.justificativa = m.novo.justificativa;
                return null;
              });
          });
        });

        cadeia
          .then(function () {
            if (recusou) return null;
            var n = notaDe(lista);
            var campos = { score: n.score, tier: n.tier };
            if (l.validada) campos.status = "enviada";
            return db.from("auditorias").update(campos).eq("id", audId).select("id")
              .then(function (r) {
                if (r.error) throw r.error;
                if (!r.data || !r.data.length) { recusou = true; return null; }
                l.score = n.score;
                l.tier = n.tier;
                if (campos.status) l.validada = false;
                return null;
              });
          })
          .then(function () {
            salvando = false;
            if (recusou) {
              App.toast("Seu acesso nao permite corrigir esta auditoria. Fale com a coordenacao da APSIS.");
              editando = null; edicao = {};
              render();
              return null;
            }
            editando = null; edicao = {};
            rastro[audId] = null;
            App.toast(mudou.length === 1
              ? "Resposta corrigida."
              : mudou.length + " respostas corrigidas.");
            return carregarRastro(audId).then(render);
          })
          .catch(function (e) {
            salvando = false;
            if (window.console && console.error) console.error("corrigir", e);
            App.toast("Nao foi possivel gravar a correcao agora. Tente novamente.");
            render();
          });
      }

      // ------------------------------------------------------------------
      // O papel sai na frente: sem ele, o botao de corrigir apareceria (ou
      // nao) errado no primeiro desenho.
      render();
      descobrirPapel().then(carregar).then(render, function (e) {
        carregando = false;
        falha = (e && e.message) || "Não foi possível carregar as auditorias agora.";
        render();
      });
    })();
  </script>
</body>
</html>
