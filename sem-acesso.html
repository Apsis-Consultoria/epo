<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Do que a pagina pode carregar. Sem isto qualquer endereco servia: script de
       fora, imagem de fora, chamada para fora. A lista abaixo e o que o sistema
       usa de verdade - a biblioteca do banco, o grafico, o mapa, as fontes, o
       captcha e o proprio projeto. O resto o navegador recusa.
       'unsafe-inline' segue necessario: as telas tem script e estilo escritos
       dentro do HTML. Tirar isso e reescrever as 21 telas, e fica para depois.
       frame-ancestors nao entra aqui: em <meta> o navegador ignora essa regra,
       ela so vale em cabecalho, e o servidor de paginas nao deixa mandar um. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://challenges.cloudflare.com;
    style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;
    img-src 'self' data: blob: https://vpkxoyfbxgnizymaurek.supabase.co https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://server.arcgisonline.com;
    connect-src 'self' https://vpkxoyfbxgnizymaurek.supabase.co https://challenges.cloudflare.com https://viacep.com.br https://nominatim.openstreetmap.org;
    frame-src https://challenges.cloudflare.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests;
  ">
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon-claro.svg?v=128">
  <!-- Reserva: o Safari nao usa favicon em SVG. -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png?v=128">
  <link rel="apple-touch-icon" href="assets/brand/favicon-180.png?v=128">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Acesso não liberado - Auditoria EPO's</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/carregando.css?v=128">
  <link rel="stylesheet" href="assets/portal.css?v=128" />
  <style>
    /* Esta tela carrega o Tailwind, e nao a folha do painel: os neutros da
       Claro vem escritos aqui - apoio #525252, secundario #767676, borda
       #DBDBDB - junto com o cartao (raio 12px, sombra 0 4px 8px) e o botao em
       capsula, que sao a forma da marca. */
    body { font-family: 'Roboto', system-ui, 'Segoe UI', Arial, sans-serif; color: #1F1D1D; }
    *, ::before, ::after { border-color: #DBDBDB; }
    .cartao { border-radius: 12px; box-shadow: 0 4px 8px rgba(31, 29, 29, .16); }
    .acao { border-radius: 500px; font-weight: 500; }
    .apoio { color: #525252; }
    .fraco { color: #767676; }
  </style>
</head>
<body>
  <div class="tela-carregando" id="tela-carregando" role="status" aria-label="Carregando">
    <span class="claro-loader" aria-hidden="true"></span>
  </div>
  <div class="relative min-h-screen bg-[#1F1D1D] overflow-hidden" style="font-family: Roboto, 'Segoe UI', sans-serif;">
    <img src="assets/brand/login-3.png" alt="" aria-hidden="true" onerror="this.style.display='none'"
      class="absolute inset-0 w-full h-full object-cover opacity-60" />
    <div class="absolute inset-0" style="background: linear-gradient(to top, rgba(31,29,29,.94), rgba(31,29,29,.65), rgba(31,29,29,.85));"></div>

    <div class="relative z-10 min-h-screen flex items-center justify-center px-5 py-10">
      <div class="cartao w-full max-w-md bg-white px-7 py-8 text-center">
        <img src="assets/brand/logo-claro.png" alt="Claro" onerror="this.style.display='none'"
          class="object-contain mx-auto mb-5" style="width:148px; height:auto;" />

        <h1 class="text-xl font-bold" style="color: rgb(218,41,28); font-family: Roboto, 'Segoe UI', Arial, sans-serif;">
          Acesso ainda não liberado
        </h1>

        <p class="apoio text-sm leading-relaxed mt-4">
          A sua conta foi criada, mas o acesso às informações ainda não foi liberado pela APSIS.
        </p>
        <p id="quem" class="fraco text-sm leading-relaxed mt-3"></p>
        <p class="apoio text-sm leading-relaxed mt-3">
          Fale com o seu contato na APSIS informando o e-mail acima. Assim que a liberação for
          feita, basta entrar de novo.
        </p>

        <button id="btn-conferir" class="acao w-full mt-6 py-3.5 px-6 text-white transition-colors disabled:opacity-60"
          style="background: rgb(218,41,28);">
          Já liberaram, conferir de novo
        </button>

        <p class="mt-4">
          <button id="btn-sair" class="fraco text-xs underline"
            style="background:none; border:0; padding:0; cursor:pointer;">
            Sair
          </button>
        </p>

        <p id="msg" class="text-xs mt-4 hidden"></p>
      </div>
    </div>
  </div>

  <script src="assets/supabase-config.js?v=128"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
          integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/auth.js?v=128"></script>
  <script>
    (function () {
      "use strict";
      var $ = function (id) { return document.getElementById(id); };

      function msg(texto, erro) {
        var el = $("msg");
        el.textContent = texto || "";
        if (!texto) { el.classList.add("hidden"); return; }
        el.classList.remove("hidden");
        el.style.color = erro ? "#DA291C" : "#006B4F";
      }

      if (!(window.Auth && Auth.pronto)) {
        $("quem").textContent = "";
        return;
      }

      $("btn-sair").addEventListener("click", function () { Auth.sair(); });

      Auth.sessao().then(function (s) {
        if (!s) { location.replace("login"); return; }
        $("quem").textContent = s.user && s.user.email ? s.user.email : "";
      });

      // Quem foi liberado enquanto olhava esta tela nao precisa sair e voltar:
      // o proprio sistema reconfere e, se ja tem papel, segue para dentro.
      $("btn-conferir").addEventListener("click", function () {
        var btn = this;
        btn.disabled = true;
        btn.textContent = "Conferindo...";
        msg("");

        Auth.cliente.rpc("sincronizar_meu_acesso").then(function (r) {
          var papel = r && r.data;
          if (papel && papel !== "sem_acesso") {
            msg("Acesso liberado. Entrando...");
            setTimeout(function () {
              Auth.telaInicial().then(function (d) { location.replace(d); },
                                     function () { location.replace("index"); });
            }, 600);
            return;
          }
          btn.disabled = false;
          btn.textContent = "Já liberaram, conferir de novo";
          msg("O acesso ainda não foi liberado.", true);
        }).catch(function () {
          btn.disabled = false;
          btn.textContent = "Já liberaram, conferir de novo";
          msg("Não foi possível conferir agora. Tente de novo em alguns instantes.", true);
        });
      });
    })();
  </script>
</body>
</html>
