<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso não liberado - Auditoria EPO's</title>
  <link rel="icon" type="image/png" href="assets/brand/logo-apsis.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="assets/portal.css?v=64" />
</head>
<body>
  <div class="relative min-h-screen bg-[#07130d] overflow-hidden" style="font-family: Inter, 'Segoe UI', sans-serif;">
    <img src="assets/brand/login-3.png" alt="" aria-hidden="true" onerror="this.style.display='none'"
      class="absolute inset-0 w-full h-full object-cover opacity-60" />
    <div class="absolute inset-0" style="background: linear-gradient(to top, rgba(7,19,13,.94), rgba(7,19,13,.65), rgba(7,19,13,.85));"></div>

    <div class="relative z-10 min-h-screen flex items-center justify-center px-5 py-10">
      <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl px-7 py-8 text-center">
        <img src="assets/brand/logo-apsis-transp.png" alt="APSIS" onerror="this.style.display='none'"
          class="h-16 object-contain mx-auto mb-4" />

        <h1 class="text-xl font-bold" style="color: rgb(26,71,49); font-family: Sora, 'Segoe UI', sans-serif;">
          Acesso ainda não liberado
        </h1>

        <p class="text-sm text-gray-600 leading-relaxed mt-4">
          A sua conta foi criada, mas o acesso às informações ainda não foi liberado pela APSIS.
        </p>
        <p id="quem" class="text-sm text-gray-500 leading-relaxed mt-3"></p>
        <p class="text-sm text-gray-600 leading-relaxed mt-3">
          Fale com o seu contato na APSIS informando o e-mail acima. Assim que a liberação for
          feita, basta entrar de novo.
        </p>

        <button id="btn-conferir" class="w-full mt-6 font-semibold py-3.5 px-6 rounded-xl text-white transition-colors disabled:opacity-60"
          style="background: rgb(26,71,49);">
          Já liberaram, conferir de novo
        </button>

        <p class="mt-4">
          <button id="btn-sair" class="text-xs text-gray-400 underline"
            style="background:none; border:0; padding:0; cursor:pointer;">
            Sair
          </button>
        </p>

        <p id="msg" class="text-xs mt-4 hidden"></p>
      </div>
    </div>
  </div>

  <script src="assets/supabase-config.js?v=64"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js?v=64"></script>
  <script>
    (function () {
      "use strict";
      var $ = function (id) { return document.getElementById(id); };

      function msg(texto, erro) {
        var el = $("msg");
        el.textContent = texto || "";
        if (!texto) { el.classList.add("hidden"); return; }
        el.classList.remove("hidden");
        el.style.color = erro ? "#dc2626" : "#16a34a";
      }

      if (!(window.Auth && Auth.pronto)) {
        $("quem").textContent = "";
        return;
      }

      $("btn-sair").addEventListener("click", function () { Auth.sair(); });

      Auth.sessao().then(function (s) {
        if (!s) { location.replace("login.html"); return; }
        $("quem").textContent = s.user && s.user.email ? s.user.email : "";
      });

      // Quem foi liberado enquanto olhava esta tela nao precisa sair e voltar:
      // o proprio sistema reconfere e, se ja tem papel, segue para dentro.
      $("btn-conferir").addEventListener("click", function () {
        var btn = this;
        btn.disabled = true;
        btn.textContent = "Conferindo...";
        msg("");

        Auth.cliente.rpc("sincronizar_meu_acesso").then(function (r) {
          var papel = r && r.data;
          if (papel && papel !== "sem_acesso") {
            msg("Acesso liberado. Entrando...");
            setTimeout(function () { location.replace("index.html"); }, 600);
            return;
          }
          btn.disabled = false;
          btn.textContent = "Já liberaram, conferir de novo";
          msg("O acesso ainda não foi liberado.", true);
        }).catch(function () {
          btn.disabled = false;
          btn.textContent = "Já liberaram, conferir de novo";
          msg("Não foi possível conferir agora. Tente de novo em alguns instantes.", true);
        });
      });
    })();
  </script>
</body>
</html>
