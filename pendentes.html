<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auditorias pendentes - Auditoria de EPOs</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/app.css?v=86">
  <style>
    /* Ajustes locais - tela de auditorias pendentes (escolher EPO e questionário) */

    .is-hidden { display: none; }

    /* ------ Busca ------ */
    .pd-busca { position: relative; margin-bottom: 10px; max-width: 460px; }
    .pd-busca > i {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      font-size: 18px; color: var(--text-muted); pointer-events: none;
    }
    .pd-busca .input { padding-left: 38px; }
    .pd-resumo { font-size: 12.5px; color: var(--text-muted); margin: 0 0 14px; }

    /* ------ Nível 1: cartões de EPO ------ */
    /* Lista das auditorias a preencher: uma linha por auditoria, com a acao
       na propria linha. Nao e grade de cartoes porque o que importa aqui e
       varrer de cima para baixo o que falta. */
    .pd-bloco { margin-bottom: 20px; }
    .pd-bloco-cab {
      display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
      padding-bottom: 10px; border-bottom: 1.5px solid var(--border);
    }
    .pd-bloco-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .pd-bloco-info .nm { font-size: 15.5px; font-weight: 600; color: var(--text); }
    .pd-bloco-info .loc { font-size: 12.5px; color: var(--text-2); }
    @media (max-width: 760px) {
      .pd-bloco-cab { flex-wrap: wrap; }
      .pd-bloco-cab .btn { flex: 1 1 auto; justify-content: center; }
    }

    .pd-lista { display: flex; flex-direction: column; gap: 10px; }
    .pd-item {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 13px 15px;
    }
    .pd-item-corpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .pd-item-corpo .nm { font-size: 14.5px; font-weight: 600; color: var(--text); }
    .pd-item-corpo .loc { font-size: 12.5px; color: var(--text-2); }
    .pd-item-fim { display: flex; align-items: center; gap: 8px; flex: none; }
    @media (max-width: 760px) {
      .pd-item { flex-wrap: wrap; }
      .pd-item-fim { width: 100%; flex-wrap: wrap; }
      .pd-item-fim .btn { flex: 1 1 auto; justify-content: center; }
    }

    .pd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .pd-card {
      display: flex; align-items: flex-start; gap: 12px; width: 100%;
      min-height: 84px; text-align: left; font-family: inherit;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 14px; cursor: pointer;
      transition: border-color .15s ease, box-shadow .15s ease, transform .1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .pd-card:hover { border-color: var(--apsis-green); box-shadow: var(--shadow-md); }
    .pd-card:active { transform: scale(.99); }
    .pd-icon {
      width: 42px; height: 42px; flex: 0 0 42px; border-radius: 12px;
      background: var(--primary-tint); color: var(--apsis-green);
      display: grid; place-items: center; font-size: 22px;
    }
    .pd-card-body { flex: 1; min-width: 0; }
    .pd-card-body .nm { display: block; font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .pd-card-body .loc { display: block; font-size: 12.5px; color: var(--text-2); margin-top: 1px; }
    .pd-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 9px; }
    .pd-anexos { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); }
    .pd-anexos i { font-size: 15px; color: var(--text-muted); }
    .pd-card > .pd-go { font-size: 20px; color: var(--text-muted); flex: 0 0 auto; margin-top: 10px; }

    /* ------ Nível 2: cabeçalho da EPO ------ */
    .pd-head {
      display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
    }
    .pd-head-info { flex: 1; min-width: 200px; }
    .pd-head-info h2 { font-size: 17px; font-weight: 600; color: var(--text); margin: 0; }
    .pd-head-info p { font-size: 13px; color: var(--text-2); margin: 2px 0 0; }

    /* ------ Nível 2: cartões de questionário ------ */
    .pd-grupo-t {
      display: flex; align-items: center; gap: 7px;
      font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
      color: var(--text-muted); margin: 20px 0 10px;
    }
    .pd-grupo-t:first-child { margin-top: 0; }
    .pd-grupo-t i { font-size: 15px; }

    .pd-rel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .pd-rel-top { display: flex; align-items: flex-start; gap: 12px; }
    .pd-rel-top .nm { display: block; font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.35; }
    .pd-rel-peso { font-size: 12px; color: var(--text-2); }

    .pd-lados { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
    .pd-lado {
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface-2); padding: 11px 12px; min-width: 0;
      display: flex; flex-direction: column; gap: 8px;
    }
    .pd-lado-t {
      display: flex; align-items: center; gap: 6px;
      font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
      color: var(--text-muted);
    }
    .pd-lado-t i { font-size: 15px; }
    .pd-lado-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .pd-lado-obs { font-size: 12.5px; color: var(--text-2); line-height: 1.45; }
    .pd-score { font-size: 20px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

    .pd-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; }
    .pd-meta .m { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); min-width: 0; }
    .pd-meta .m i { font-size: 15px; color: var(--text-muted); flex: 0 0 auto; }
    .pd-meta .m strong { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }

    .pd-nota {
      display: flex; align-items: flex-start; gap: 7px;
      font-size: 12.5px; color: var(--text-2); line-height: 1.45;
      background: var(--primary-tint); border-radius: var(--radius-sm);
      padding: 9px 11px; margin-top: 12px;
    }
    .pd-nota i { font-size: 15px; color: var(--apsis-green); flex: 0 0 auto; margin-top: 1px; }

    .pd-acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .pd-acoes .btn { text-decoration: none; }

    /* ------ Nova auditoria ------ */
    .pd-vazio-acao { margin-top: 14px; }

    @media (max-width: 700px) {
      .pd-grid { grid-template-columns: 1fr; }
      .pd-lados { grid-template-columns: 1fr; }
      .pd-busca { max-width: none; }
      .pd-card { min-height: 92px; padding: 15px; }
      .pd-acoes .btn { width: 100%; justify-content: center; min-height: 48px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <script src="assets/data.js?v=86"></script>
  <script src="assets/app.js?v=86"></script>
  <script src="assets/supabase-config.js?v=86"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js?v=86"></script>
  <script>
    (function () {
      "use strict";

      // "Nova auditoria" leva para o cadastro da EPO: e la que se marca quais
      // questionarios serao pedidos, e o pedido e o que faz a auditoria existir.
      var acoesTopo =
        '<button class="btn btn-primary btn-sm is-hidden" id="pd-nova" type="button">' +
          '<i class="ti ti-clipboard-plus" aria-hidden="true"></i>Nova auditoria' +
        "</button>";

      Layout.mount("pendentes", "Auditorias pendentes", acoesTopo);

      var esc = App.escapeHtml;
      var page = document.getElementById("page");
      var DEMO = (window.Auth && Auth.modoDemo()) || !(window.Auth && Auth.pronto);
      var db = window.Auth ? Auth.cliente : null;

      // ------------------------------------------------------------------
      // Estado
      // ------------------------------------------------------------------
      var linhas = [];          // linhas de vw_relatorios_pendentes
      var grupos = [];          // [{ id, nome, cidade, uf, relatorios, pendentes, concluidos, anexos }]
      var epoAberta = null;     // id da EPO aberta no nível 2
      var epoParam = App.getParam("epo"); // chegou do detalhe da EPO
      var busca = "";
      var carregou = false;
      // Botao que leva para outra tela so aparece se a pessoa alcanca aquela
      // tela: "Nova auditoria" leva para o cadastro da EPO, e "Ver nas
      // evidencias recebidas" leva para Evidencias. Sem isto a equipe de campo
      // clicava e era desviada de volta, sem explicacao.
      var podeEpos = true;
      var podeChecagem = true;
      var erro = "";
      var anexosAntes = {};     // alocacao_id -> n_anexos (detecta anexo novo)

      var canal = null;         // canal do Realtime
      var timer = null;         // recarga a cada 30s
      var agendada = null;      // debounce da recarga

      var STATUS_EPO = {
        pendente:     { label: "Pendente",     cls: "badge-baixa",   icone: "ti-clock" },
        em_andamento: { label: "Em andamento", cls: "badge-media",   icone: "ti-progress" },
        enviada:      { label: "Enviada",      cls: "badge-success", icone: "ti-cloud-check" }
      };

      var STATUS_AUD = {
        rascunho: { label: "Rascunho", cls: "badge-baixa",   icone: "ti-pencil" },
        enviada:  { label: "Enviada",  cls: "badge-media",   icone: "ti-send" },
        validada: { label: "Validada", cls: "badge-success", icone: "ti-rosette-discount-check" }
      };

      // ------------------------------------------------------------------
      // Helpers
      // ------------------------------------------------------------------
      function norm(s) {
        var t = String(s == null ? "" : s).toLowerCase();
        if (t.normalize) t = t.normalize("NFD").replace(/[̀-ͯ]/g, "");
        return t;
      }

      function fmtData(v) {
        if (!v) return "";
        var p = String(v).slice(0, 10).split("-");
        if (p.length !== 3) return String(v);
        return p[2] + "/" + p[1] + "/" + p[0];
      }

      function fmtDataHora(v) {
        if (!v) return "";
        var d = new Date(v);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleDateString("pt-BR") + " " +
          d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      }

      function local(cidade, uf) {
        return (cidade || "") + (uf ? "/" + uf : "");
      }

      function concluido(l) {
        return l.status_auditoria === "enviada" || l.status_auditoria === "validada";
      }

      function nAnexos(l) {
        return Number(l.n_anexos) || 0;
      }

      function badgeEpo(st) {
        var m = STATUS_EPO[st] || STATUS_EPO.pendente;
        return '<span class="badge ' + m.cls + '"><i class="ti ' + m.icone + '" aria-hidden="true"></i>' + m.label + "</span>";
      }

      function badgeAud(st) {
        var m = STATUS_AUD[st];
        if (!m) return '<span class="badge badge-baixa"><i class="ti ti-clipboard-off" aria-hidden="true"></i>Sem auditoria ainda</span>';
        return '<span class="badge ' + m.cls + '"><i class="ti ' + m.icone + '" aria-hidden="true"></i>' + m.label + "</span>";
      }

      function textoAnexos(n) {
        if (!n) return "nenhum anexo ainda";
        return n + (n === 1 ? " anexo recebido" : " anexos recebidos");
      }

      function linkPreencher(l) {
        var base = "auditoria.html?processo=" + encodeURIComponent(l.processo_slug || "");
        if (DEMO) return base + "&epo=" + encodeURIComponent(l.epo_id || "");
        return base + "&alocacao=" + encodeURIComponent(l.alocacao_id || "");
      }

      function avisoDemo() {
        return "";
      }

      // ------------------------------------------------------------------
      // Estrutura fixa da página (só os miolos são re-renderizados)
      // ------------------------------------------------------------------
      page.innerHTML =
        avisoDemo() +
        '<section id="pd-nivel1">' +
          '<div class="pd-busca">' +
            '<i class="ti ti-search" aria-hidden="true"></i>' +
            '<input class="input" id="pd-q" type="search" placeholder="Buscar por EPO, cidade ou questionário" autocomplete="off" aria-label="Buscar por EPO, cidade ou questionário">' +
          "</div>" +
          '<p class="pd-resumo" id="pd-resumo"></p>' +
          '<div id="pd-lista"></div>' +
          '<div id="pd-epos" class="is-hidden"></div>' +
        "</section>" +
        '<section id="pd-nivel2" class="is-hidden">' +
          '<button class="btn btn-ghost btn-sm" id="pd-voltar" type="button" style="margin-bottom:14px;">' +
            '<i class="ti ti-arrow-left" aria-hidden="true"></i>Voltar às EPOs' +
          "</button>" +
          '<div class="pd-head" id="pd-head"></div>' +
          '<div id="pd-rel"></div>' +
        "</section>" +

        "";

      var elNivel1 = document.getElementById("pd-nivel1");
      var elNivel2 = document.getElementById("pd-nivel2");
      var elEpos = document.getElementById("pd-epos");
      var elLista = document.getElementById("pd-lista");
      var elResumo = document.getElementById("pd-resumo");
      var elHead = document.getElementById("pd-head");
      var elRel = document.getElementById("pd-rel");

      // ------------------------------------------------------------------
      // Agrupamento por EPO
      // ------------------------------------------------------------------
      function agrupar() {
        var mapa = {};
        var lista = [];

        linhas.forEach(function (l) {
          var g = mapa[l.epo_id];
          if (!g) {
            g = mapa[l.epo_id] = {
              id: l.epo_id,
              nome: l.epo_nome || "EPO",
              cidade: l.cidade || "",
              uf: l.uf || "",
              relatorios: [],
              pendentes: 0,
              concluidos: 0,
              anexos: 0
            };
            lista.push(g);
          }
          g.relatorios.push(l);
          g.anexos += nAnexos(l);
          if (concluido(l)) g.concluidos += 1;
          else g.pendentes += 1;
        });

        lista.forEach(function (g) {
          g.relatorios.sort(function (a, b) {
            return (Number(a.processo_ordem) || 0) - (Number(b.processo_ordem) || 0);
          });
        });

        lista.sort(function (a, b) {
          if (b.pendentes !== a.pendentes) return b.pendentes - a.pendentes;
          return a.nome.localeCompare(b.nome, "pt-BR");
        });

        grupos = lista;
      }

      function grupoById(id) {
        for (var i = 0; i < grupos.length; i++) {
          if (String(grupos[i].id) === String(id)) return grupos[i];
        }
        return null;
      }

      function filtrar() {
        var q = norm(busca).trim();
        if (!q) return grupos;
        return grupos.filter(function (g) {
          return norm(g.nome).indexOf(q) >= 0 ||
            norm(g.cidade).indexOf(q) >= 0 ||
            norm(g.uf).indexOf(q) >= 0;
        });
      }

      // ------------------------------------------------------------------
      // Nível 1 - escolher a EPO
      // ------------------------------------------------------------------
      function cardEpo(g) {
        var tags = "";
        if (g.pendentes) {
          tags += '<span class="badge badge-media"><i class="ti ti-clipboard-list" aria-hidden="true"></i>' +
            g.pendentes + " a preencher</span>";
        }
        if (g.concluidos) {
          tags += '<span class="badge badge-success"><i class="ti ti-check" aria-hidden="true"></i>' +
            g.concluidos + (g.concluidos === 1 ? " concluído" : " concluídos") + "</span>";
        }
        tags += '<span class="pd-anexos"><i class="ti ti-paperclip" aria-hidden="true"></i>' +
          esc(textoAnexos(g.anexos)) + "</span>";

        return (
          '<button class="pd-card" type="button" data-epo="' + esc(g.id) + '">' +
            '<span class="pd-icon"><i class="ti ti-building-warehouse" aria-hidden="true"></i></span>' +
            '<span class="pd-card-body">' +
              '<span class="nm">' + esc(g.nome) + "</span>" +
              '<span class="loc">' + esc(local(g.cidade, g.uf)) + "</span>" +
              '<span class="pd-tags">' + tags + "</span>" +
            "</span>" +
            '<i class="ti ti-chevron-right pd-go" aria-hidden="true"></i>' +
          "</button>"
        );
      }

      // A tela abre com a LISTA das auditorias que ainda nao foram preenchidas,
      // e nao com a escolha da EPO. Antes eram dois passos: escolher a unidade
      // e depois o questionario - quem queria ver o que falta preencher tinha
      // de abrir uma EPO por vez para descobrir.
      function pendentesDaLista() {
        var q = (busca || "").toLowerCase();
        return linhas.filter(function (l) {
          if (concluido(l)) return false;
          if (!q) return true;
          return ((l.epo_nome || "") + " " + (l.cidade || "") + " " +
                  (l.processo_nome || "")).toLowerCase().indexOf(q) >= 0;
        }).sort(function (a, b) {
          // A visita mais proxima primeiro; sem data marcada, vai para o fim.
          var da = a.visita_prevista || "9999-12-31";
          var db2 = b.visita_prevista || "9999-12-31";
          if (da !== db2) return da < db2 ? -1 : 1;
          var na = (a.epo_nome || "").localeCompare(b.epo_nome || "", "pt-BR");
          if (na) return na;
          return (a.processo_ordem || 0) - (b.processo_ordem || 0);
        });
      }

      function linhaPendente(l) {
        var meta = "";
        if (l.visita_prevista) {
          meta += '<span class="m"><i class="ti ti-calendar-event" aria-hidden="true"></i>Visita ' +
            esc(fmtData(l.visita_prevista)) + "</span>";
        }
        if (l.responsavel_email) {
          meta += '<span class="m"><i class="ti ti-mail" aria-hidden="true"></i>' +
            esc(l.responsavel_email) + "</span>";
        }
        var n = nAnexos(l);
        meta += '<span class="m"><i class="ti ti-paperclip" aria-hidden="true"></i>' +
          esc(textoAnexos(n)) + "</span>";

        var situacao = l.status_auditoria === "rascunho"
          ? '<span class="badge badge-media">Começada</span>'
          : '<span class="badge badge-alta">A preencher</span>';

        return (
          '<article class="pd-item">' +
            '<span class="pd-icon"><i class="ti ' +
              esc(l.processo_icone || "ti-clipboard-list") + '" aria-hidden="true"></i></span>' +
            '<div class="pd-item-corpo">' +
              '<span class="nm">' + esc(l.processo_nome || "Questionário") + "</span>" +
              (meta ? '<div class="pd-meta">' + meta + "</div>" : "") +
            "</div>" +
            '<div class="pd-item-fim">' + situacao +
              '<a class="btn btn-primary btn-sm" href="' + esc(linkPreencher(l)) + '">' +
                '<i class="ti ti-clipboard-check" aria-hidden="true"></i>Preencher' +
              "</a>" +
            "</div>" +
          "</article>"
        );
      }

      function renderNivel1() {
        if (erro) {
          elResumo.textContent = "";
          elLista.innerHTML =
            '<div class="empty"><i class="ti ti-alert-triangle" aria-hidden="true"></i>' +
              "<div>" + esc(erro) + "</div>" +
            "</div>";
          return;
        }

        if (!carregou) {
          elResumo.textContent = "";
          elLista.innerHTML =
            '<div class="empty"><i class="ti ti-loader-2" aria-hidden="true"></i>' +
              "<div>Carregando as auditorias pedidas...</div>" +
            "</div>";
          return;
        }

        if (!linhas.length) {
          elResumo.textContent = "";
          elLista.innerHTML =
            '<div class="empty">' +
              '<i class="ti ti-clipboard-off" aria-hidden="true"></i>' +
              "<div>Nenhuma auditoria pedida até agora.</div>" +
              (podeEpos
                ? '<div class="pd-vazio-acao">' +
                    '<button class="btn btn-primary btn-sm" type="button" data-nova="1">' +
                      '<i class="ti ti-clipboard-plus" aria-hidden="true"></i>Nova auditoria' +
                    "</button>" +
                  "</div>"
                : "") +
            "</div>";
          return;
        }

        var lista = pendentesDaLista();
        var feitas = linhas.filter(concluido).length;
        var unidades = {};
        lista.forEach(function (l) { unidades[String(l.epo_id)] = true; });
        var nUn = Object.keys(unidades).length;
        elResumo.textContent =
          lista.length + (lista.length === 1 ? " auditoria a preencher" : " auditorias a preencher") +
          " em " + nUn + (nUn === 1 ? " EPO" : " EPOs") +
          (feitas ? " · " + feitas + (feitas === 1 ? " já enviada" : " já enviadas") : "");

        if (!lista.length) {
          elLista.innerHTML =
            '<div class="empty">' +
              '<i class="ti ' + (busca ? "ti-search-off" : "ti-checks") + '" aria-hidden="true"></i>' +
              "<div>" + (busca
                ? 'Nada a preencher para "' + esc(busca) + '".'
                : "Nada a preencher: todas as auditorias pedidas já foram enviadas.") + "</div>" +
            "</div>";
          return;
        }

        // Agrupado por EPO: pode haver mais de uma unidade liberada para a
        // mesma pessoa, e uma lista corrida misturava os questionarios de
        // todas. Cada unidade e um bloco, com o que falta preencher dentro.
        var porEpo = [];
        var indice = {};
        lista.forEach(function (l) {
          var k = String(l.epo_id);
          if (!indice[k]) {
            indice[k] = { id: l.epo_id, nome: l.epo_nome || "EPO",
                          cidade: l.cidade, uf: l.uf, itens: [] };
            porEpo.push(indice[k]);
          }
          indice[k].itens.push(l);
        });

        elLista.innerHTML = porEpo.map(function (g) {
          return (
            '<section class="pd-bloco">' +
              '<header class="pd-bloco-cab">' +
                '<span class="pd-icon"><i class="ti ti-building-warehouse" aria-hidden="true"></i></span>' +
                '<div class="pd-bloco-info">' +
                  '<span class="nm">' + esc(g.nome) + "</span>" +
                  '<span class="loc">' + esc(local(g.cidade, g.uf)) + "</span>" +
                "</div>" +
                '<span class="badge badge-alta">' + g.itens.length +
                  (g.itens.length === 1 ? " a preencher" : " a preencher") + "</span>" +
                '<button class="btn btn-ghost btn-sm" type="button" data-epo="' + esc(g.id) + '"' +
                  ' title="Ver todos os questionários desta EPO, inclusive os enviados">' +
                  '<i class="ti ti-list-search" aria-hidden="true"></i>Ver a EPO' +
                "</button>" +
              "</header>" +
              '<div class="pd-lista">' + g.itens.map(linhaPendente).join("") + "</div>" +
            "</section>"
          );
        }).join("");
      }

      // ------------------------------------------------------------------
      // Nível 2 - escolher o questionário da EPO
      // ------------------------------------------------------------------
      function ladoEpo(l) {
        var n = nAnexos(l);
        var hora = fmtDataHora(l.ultimo_anexo_em);
        var partes =
          '<div class="pd-lado-linha">' +
            badgeEpo(l.status_epo) +
            '<span class="pd-anexos"><i class="ti ti-paperclip" aria-hidden="true"></i>' +
              (n ? n + (n === 1 ? " anexo" : " anexos") : "sem anexos") +
            "</span>" +
          "</div>";
        if (n && hora) {
          partes += '<span class="pd-lado-obs">Último anexo em ' + esc(hora) + "</span>";
        }
        if (!n) {
          partes += '<span class="pd-lado-obs">O responsável ainda não anexou evidências.</span>';
        }
        return (
          '<div class="pd-lado">' +
            '<span class="pd-lado-t"><i class="ti ti-building-warehouse" aria-hidden="true"></i>Envios EPO</span>' +
            partes +
          "</div>"
        );
      }

      function ladoApsis(l) {
        var partes = '<div class="pd-lado-linha">' + badgeAud(l.status_auditoria);
        var temScore = concluido(l) && l.score !== null && l.score !== undefined && l.score !== "";
        if (temScore) {
          var score = Number(l.score);
          var tier = l.tier || App.tierOf(score);
          var tm = App.tierMeta(tier);
          partes += '<span class="pd-score">' + Math.round(score) + "</span>" +
            '<span class="badge ' + tm.cls + '">' + tm.label + "</span>";
        }
        partes += "</div>";
        if (temScore) {
          partes += '<span class="pd-lado-obs">score da vistoria APSIS</span>';
        } else if (l.status_auditoria === "rascunho") {
          partes += '<span class="pd-lado-obs">Questionário começado e ainda não enviado.</span>';
        } else if (!l.status_auditoria) {
          partes += '<span class="pd-lado-obs">Ninguém preencheu o questionário em campo ainda.</span>';
        }
        return (
          '<div class="pd-lado">' +
            '<span class="pd-lado-t"><i class="ti ti-clipboard-check" aria-hidden="true"></i>Envios APSIS</span>' +
            partes +
          "</div>"
        );
      }

      function cardRelatorio(l) {
        var meta = "";
        if (l.responsavel_email) {
          meta += '<span class="m"><i class="ti ti-mail" aria-hidden="true"></i>Responsável: <strong>' +
            esc(l.responsavel_email) + "</strong></span>";
        }
        if (l.visita_prevista) {
          meta += '<span class="m"><i class="ti ti-calendar-event" aria-hidden="true"></i>Visita prevista: <strong>' +
            esc(fmtData(l.visita_prevista)) + "</strong></span>";
        }
        if (concluido(l) && l.data_visita) {
          meta += '<span class="m"><i class="ti ti-calendar-check" aria-hidden="true"></i>Vistoria em: <strong>' +
            esc(fmtData(l.data_visita)) + "</strong></span>";
        }

        var acoes;
        if (concluido(l)) {
          acoes =
            (podeChecagem
              ? '<a class="btn btn-primary" href="checagem.html">' +
                  '<i class="ti ti-zoom-check" aria-hidden="true"></i>Ver nas evidências recebidas' +
                "</a>"
              : "") +
            '<a class="btn btn-ghost" href="' + esc(linkPreencher(l)) + '">' +
              '<i class="ti ti-refresh" aria-hidden="true"></i>Preencher novamente' +
            "</a>";
        } else {
          acoes =
            '<a class="btn btn-primary" href="' + esc(linkPreencher(l)) + '">' +
              '<i class="ti ti-clipboard-check" aria-hidden="true"></i>Preencher auditoria' +
            "</a>";
        }

        var peso = (l.peso === null || l.peso === undefined || l.peso === "")
          ? ""
          : '<span class="pd-rel-peso">peso ' + App.fmtPct(Number(l.peso)) + " do score</span>";

        return (
          '<article class="pd-rel">' +
            '<div class="pd-rel-top">' +
              '<span class="pd-icon"><i class="ti ' + esc(l.processo_icone || "ti-clipboard-list") + '" aria-hidden="true"></i></span>' +
              '<div class="grow">' +
                '<span class="nm">' + esc(l.processo_nome || "Questionário") + "</span>" +
                peso +
              "</div>" +
            "</div>" +
            '<div class="pd-lados">' + ladoEpo(l) + ladoApsis(l) + "</div>" +
            (meta ? '<div class="pd-meta">' + meta + "</div>" : "") +
            (l.observacao
              ? '<div class="pd-nota"><i class="ti ti-notes" aria-hidden="true"></i><span>' + esc(l.observacao) + "</span></div>"
              : "") +
            '<div class="pd-acoes">' + acoes + "</div>" +
          "</article>"
        );
      }

      function renderNivel2() {
        var g = grupoById(epoAberta);
        if (!g) {
          epoAberta = null;
          mostrarNivel1();
          return;
        }

        elHead.innerHTML =
          '<span class="pd-icon"><i class="ti ti-building-warehouse" aria-hidden="true"></i></span>' +
          '<div class="pd-head-info">' +
            "<h2>" + esc(g.nome) + "</h2>" +
            "<p>" + esc(local(g.cidade, g.uf)) + "</p>" +
          "</div>" +
          '<div class="pd-tags" style="margin-top:0;">' +
            '<span class="badge badge-media"><i class="ti ti-clipboard-list" aria-hidden="true"></i>' +
              g.pendentes + " a preencher</span>" +
            '<span class="badge badge-success"><i class="ti ti-check" aria-hidden="true"></i>' +
              g.concluidos + (g.concluidos === 1 ? " concluído" : " concluídos") + "</span>" +
            '<span class="pd-anexos"><i class="ti ti-paperclip" aria-hidden="true"></i>' +
              esc(textoAnexos(g.anexos)) + "</span>" +
          "</div>";

        var abertos = g.relatorios.filter(function (l) { return !concluido(l); });
        var fechados = g.relatorios.filter(concluido);

        var html = "";
        html +=
          '<div class="pd-grupo-t"><i class="ti ti-pencil-plus" aria-hidden="true"></i>Podem ser preenchidos</div>';
        html += abertos.length
          ? abertos.map(cardRelatorio).join("")
          : '<div class="empty"><i class="ti ti-checks" aria-hidden="true"></i>' +
              "<div>Todos os relatórios pedidos desta EPO já foram enviados.</div>" +
            "</div>";

        if (fechados.length) {
          html +=
            '<div class="pd-grupo-t"><i class="ti ti-circle-check" aria-hidden="true"></i>Já concluídos</div>' +
            fechados.map(cardRelatorio).join("");
        }

        elRel.innerHTML = html;
      }

      function mostrarNivel1() {
        elNivel2.classList.add("is-hidden");
        elNivel1.classList.remove("is-hidden");
        renderNivel1();
      }

      function mostrarNivel2(id) {
        epoAberta = id;
        elNivel1.classList.add("is-hidden");
        // O nivel 2 continua existindo para ver TODOS os questionarios de uma
        // unidade, inclusive os ja enviados: e o unico lugar que mostra o que
        // cada lado anexou. So deixou de ser a porta de entrada.

        elNivel2.classList.remove("is-hidden");
        renderNivel2();
        window.scrollTo(0, 0);
      }

      function renderAtual() {
        if (epoAberta) renderNivel2();
        else renderNivel1();
      }

      // ------------------------------------------------------------------
      // Nova auditoria
      //
      // Quem decide o que sera auditado e quem cria a EPO: o questionario
      // marcado no cadastro vira o relatorio pedido. Por isso o botao leva
      // para a edicao da EPO em vez de abrir um caminho paralelo aqui.
      // ------------------------------------------------------------------
      function irParaCadastroDaEpo() {
        // Abre a edicao da EPO no modo "nova auditoria": a unidade vem de lista
        // suspensa e os questionarios sao marcados ali mesmo.
        var url = "epos.html?auditoria=1";
        if (epoAberta) url += "&epo=" + encodeURIComponent(epoAberta);
        window.location.href = url;
      }

      document.getElementById("pd-nova").addEventListener("click", irParaCadastroDaEpo);

      if (window.Auth && Auth.podeTela) {
        Promise.all([Auth.podeTela("epos"), Auth.podeTela("checagem")])
          .then(function (r) {
            podeEpos = r[0];
            podeChecagem = r[1];
            document.getElementById("pd-nova").classList.toggle("is-hidden", !podeEpos);
            if (carregou) renderAtual();
          }, function () {
            document.getElementById("pd-nova").classList.remove("is-hidden");
          });
      } else {
        document.getElementById("pd-nova").classList.remove("is-hidden");
      }

      // ------------------------------------------------------------------
      // Dados - modo demonstração (mock coerente, nada é gravado)
      // ------------------------------------------------------------------
      function mockLinhas() {
        var eps = window.APP.epos || [];
        // Idem: sem cadastro, nada a inventar.
        var e1 = eps[0] || null;
        if (!e1) return [];
        var e2 = eps[1] || { id: "farol", nome: "EPO Farol", cidade: "Rio de Janeiro", uf: "RJ" };
        var e3 = eps[2] || { id: "vertice", nome: "EPO Vértice", cidade: "Belo Horizonte", uf: "MG" };
        var agora = Date.now();
        var seq = 0;

        function linha(epo, slug, dados) {
          var p = App.processoById(slug) || { nome: slug, icone: "ti-clipboard-list", peso: null };
          seq += 1;
          var l = {
            alocacao_id: "demo-aloc-" + seq,
            epo_id: epo.id,
            epo_nome: epo.nome,
            cidade: epo.cidade,
            uf: epo.uf,
            processo_id: slug,
            processo_slug: slug,
            processo_nome: p.nome,
            processo_icone: p.icone,
            processo_ordem: seq,
            peso: p.peso,
            responsavel_email: "responsavel." + slug + "@epo-demo.com.br",
            status_epo: "pendente",
            criado_em: new Date(agora - 8 * 864e5).toISOString(),
            visita_prevista: null,
            observacao: null,
            n_anexos: 0,
            ultimo_anexo_em: null,
            auditoria_id: null,
            status_auditoria: null,
            data_visita: null,
            score: null,
            tier: null
          };
          Object.keys(dados).forEach(function (k) { l[k] = dados[k]; });
          return l;
        }

        return [
          linha(e1, "recebimento-expedicao", {
            status_epo: "enviada",
            n_anexos: 7,
            ultimo_anexo_em: new Date(agora - 3 * 36e5).toISOString(),
            visita_prevista: "2026-08-04",
            observacao: "Conferir junto com o supervisor do turno da manhã."
          }),
          linha(e1, "reversa", {
            status_epo: "em_andamento",
            n_anexos: 3,
            ultimo_anexo_em: new Date(agora - 26 * 36e5).toISOString(),
            visita_prevista: "2026-08-04"
          }),
          linha(e1, "armazenagem", {
            status_epo: "enviada",
            n_anexos: 5,
            ultimo_anexo_em: new Date(agora - 5 * 864e5).toISOString(),
            auditoria_id: "demo-aud-1",
            status_auditoria: "enviada",
            data_visita: "2026-07-22",
            score: 78
          }),
          linha(e2, "reversa", {
            status_epo: "pendente",
            visita_prevista: "2026-08-11"
          }),
          linha(e2, "governanca", {
            status_epo: "em_andamento",
            n_anexos: 2,
            ultimo_anexo_em: new Date(agora - 50 * 36e5).toISOString(),
            auditoria_id: "demo-aud-2",
            status_auditoria: "rascunho"
          }),
          linha(e3, "presos", {
            status_epo: "pendente"
          })
        ];
      }

      // ------------------------------------------------------------------
      // Dados - Supabase (consulta única na view, agrupada no JS)
      // ------------------------------------------------------------------
      function detectarAnexosNovos(primeira) {
        var atual = {};
        linhas.forEach(function (l) {
          var n = nAnexos(l);
          atual[l.alocacao_id] = n;
          if (!primeira && anexosAntes.hasOwnProperty(l.alocacao_id) && n > anexosAntes[l.alocacao_id]) {
            App.toast("Chegou anexo novo em " + (l.processo_nome || "questionário"));
          }
        });
        anexosAntes = atual;
      }

      function aplicar(primeira) {
        detectarAnexosNovos(primeira);
        agrupar();
        carregou = true;
        erro = "";
        // ?epo= abre direto as auditorias daquela EPO (vem do detalhe da EPO)
        if (primeira && epoParam && !epoAberta) {
          var achou = false;
          for (var i = 0; i < grupos.length; i++) {
            if (String(grupos[i].id) === String(epoParam)) { achou = true; mostrarNivel2(grupos[i].id); break; }
          }
          if (achou) return;
          // A unidade veio no link mas nao tem relatorio pedido. Antes o
          // parametro era descartado sem dizer nada e a pessoa achava que a
          // tela tinha ignorado o clique.
          App.toast("Esta unidade ainda não tem relatório pedido.");
        }
        renderAtual();
      }

      function carregar(primeira) {
        if (DEMO) {
          linhas = mockLinhas();
          aplicar(primeira);
          return Promise.resolve();
        }
        if (!db) {
          erro = "Sessão indisponível. Entre novamente para ver as auditorias pendentes.";
          carregou = true;
          renderAtual();
          return Promise.resolve();
        }
        return db.from("vw_relatorios_pendentes")
          .select("*")
          .order("epo_nome")
          .order("processo_ordem")
          .then(function (r) {
            if (r.error) {
              carregou = true;
              if (!linhas.length) {
                console.error("vw_relatorios_pendentes", r.error);
                erro = "Não foi possível carregar as auditorias pendentes agora. Atualize a página para tentar de novo.";
                renderAtual();
              } else {
                App.toast("Não foi possível atualizar a lista agora.");
              }
              return;
            }
            linhas = r.data || [];
            aplicar(primeira);
          }, function () {
            carregou = true;
            if (!linhas.length) {
              erro = "Não foi possível carregar as auditorias pendentes.";
              renderAtual();
            }
          });
      }

      // ------------------------------------------------------------------
      // Tempo real - Realtime + foco da janela + a cada 30s
      // ------------------------------------------------------------------
      function agendarRecarga() {
        if (agendada) return; // debounce de 1,5s evita repetir a consulta
        agendada = setTimeout(function () {
          agendada = null;
          carregar(false);
        }, 1500);
      }

      function assinarRealtime() {
        if (DEMO || !db || canal) return;
        canal = db.channel("pendentes")
          .on("postgres_changes", { event: "*", schema: "public", table: "alocacao_anexos" }, agendarRecarga)
          .on("postgres_changes", { event: "*", schema: "public", table: "alocacoes" }, agendarRecarga)
          .subscribe();
      }

      function encerrar() {
        if (timer) { clearInterval(timer); timer = null; }
        if (agendada) { clearTimeout(agendada); agendada = null; }
        if (canal && db) { db.removeChannel(canal); canal = null; }
      }

      // ------------------------------------------------------------------
      // Eventos da tela
      // ------------------------------------------------------------------
      document.getElementById("pd-q").addEventListener("input", function () {
        busca = this.value || "";
        renderNivel1();
      });

      // O ouvinte fica no nivel 1 inteiro, e nao no antigo contentor das EPOs:
      // a lista de auditorias e outro elemento, e o clique nela nao chegava.
      elNivel1.addEventListener("click", function (ev) {
        if (ev.target.closest("[data-nova]")) { irParaCadastroDaEpo(); return; }
        var btn = ev.target.closest("[data-epo]");
        if (!btn) return;
        mostrarNivel2(btn.getAttribute("data-epo"));
      });

      document.getElementById("pd-voltar").addEventListener("click", function () {
        epoAberta = null;
        mostrarNivel1();
        window.scrollTo(0, 0);
      });

      window.addEventListener("focus", function () {
        if (!DEMO) agendarRecarga();
      });

      window.addEventListener("pagehide", encerrar);

      // ------------------------------------------------------------------
      // Início
      // ------------------------------------------------------------------
      // ?nova=1 chega da tela principal e nao depende de nenhuma consulta:
      // antes o desvio morava dentro do sucesso da carga, e uma falha deixava
      // o usuario numa tela de erro em vez de levar ao cadastro.
      if (App.getParam("nova") === "1") {
        irParaCadastroDaEpo();
        return;
      }

      renderNivel1();
      carregar(true);
      if (!DEMO) {
        assinarRealtime();
        timer = setInterval(function () { carregar(false); }, 30000);
      }
    })();
  </script>
</body>
</html>
