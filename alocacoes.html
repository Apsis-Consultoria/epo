<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alocações - Auditoria de EPOs</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/app.css?v=9">
  <style>
    /* Ajustes locais da tela de cadastro de EPO e pedido de relatórios */

    .aloc-demo-note {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12.5px; color: var(--text-2);
      background: var(--surface-2);
      border: 1px dashed var(--border-strong);
      border-radius: 999px;
      padding: 5px 12px;
      margin-bottom: 14px;
    }
    .aloc-demo-note i { font-size: 15px; color: var(--warning); }

    .aloc-epo { display: flex; flex-direction: column; min-width: 0; }
    .aloc-epo .nm { font-weight: 600; color: var(--text); font-size: 13.5px; }
    .aloc-epo .loc { font-size: 12px; color: var(--text-2); }

    .aloc-proc { display: inline-flex; align-items: center; gap: 7px; }
    .aloc-proc i { font-size: 16px; color: var(--text-2); }

    .aloc-email { color: var(--text); }
    .aloc-data { font-variant-numeric: tabular-nums; white-space: nowrap; }

    .aloc-anexos {
      display: inline-flex; align-items: center; gap: 5px;
      font-variant-numeric: tabular-nums;
    }
    .aloc-anexos i { font-size: 15px; color: var(--text-muted); }

    .badge-pendente     { background: var(--surface-2);  color: var(--text-2); }
    .badge-em-andamento { background: var(--warning-bg); color: var(--warning); }
    .badge-enviada      { background: var(--success-bg); color: var(--success); }

    /* Barra de filtro acima da tabela */
    .aloc-toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    .aloc-busca { position: relative; flex: 1 1 260px; min-width: 200px; }
    .aloc-busca i {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      font-size: 16px; color: var(--text-muted); pointer-events: none;
    }
    .aloc-busca .input { padding-left: 34px; }
    .aloc-toolbar .dica { font-size: 12.5px; color: var(--text-muted); }

    /* Agrupamento visual por EPO */
    .table tbody tr.grupo-inicio td { border-top: 1px solid var(--border-strong); }
    .table tbody tr:first-child.grupo-inicio td { border-top: 0; }

    /* Botões de ação da linha */
    .acoes-cel { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
    .btn-acao {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-2);
      cursor: pointer;
      transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .btn-acao i { font-size: 16px; }
    .btn-acao:hover { background: var(--primary-tint); color: var(--apsis-green); border-color: var(--apsis-green); }
    .btn-acao.danger:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }

    .aloc-loading { padding: 30px 14px; text-align: center; color: var(--text-muted); font-size: 13.5px; }

    .modal .nota-responsavel {
      display: flex; gap: 8px; align-items: flex-start;
      font-size: 12.5px; color: var(--text-2);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      margin-top: 4px;
    }
    .modal .nota-responsavel i { font-size: 15px; margin-top: 1px; color: var(--apsis-green); flex: none; }

    .field-row { display: flex; gap: 12px; }
    .field-row .field { flex: 1 1 0; min-width: 0; }
    .field-row .field.uf { flex: 0 0 110px; }

    /* Lista de questionários pedidos no cadastro */
    .procs-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    }
    .procs-head .procs-rotulo { font-size: 13px; font-weight: 500; color: var(--text); }
    .procs-head .procs-count { font-size: 12px; color: var(--text-muted); }
    .link-mini {
      border: 0; background: transparent; padding: 0;
      font-family: inherit; font-size: 12.5px; font-weight: 500;
      color: var(--apsis-green); cursor: pointer; text-decoration: underline;
    }
    .link-mini:hover { color: var(--apsis-orange); }
    .procs-box {
      display: flex; flex-direction: column; gap: 2px;
      max-height: 196px; overflow: auto;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      padding: 6px;
    }
    .proc-opt { width: 100%; padding: 6px 8px; border-radius: var(--radius-sm); }
    .proc-opt:hover { background: var(--surface-2); }
    .proc-opt i { font-size: 16px; color: var(--text-2); flex: none; }
    .proc-opt .nm { font-size: 13.5px; }
    .procs-vazio { font-size: 13px; color: var(--text-muted); padding: 10px 8px; }

    @media (max-width: 640px) {
      .field-row { flex-direction: column; gap: 0; }
      .field-row .field.uf { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <script src="assets/data.js?v=9"></script>
  <script src="assets/app.js?v=9"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    (function () {
      "use strict";

      var acoes =
        '<button class="btn btn-ghost btn-sm" id="btn-nova-epo" type="button">' +
          '<i class="ti ti-building-plus" aria-hidden="true"></i>Nova EPO' +
        "</button>" +
        '<button class="btn btn-primary btn-sm" id="btn-pedir-relatorios" type="button">' +
          '<i class="ti ti-file-plus" aria-hidden="true"></i>Pedir relatórios' +
        "</button>";

      Layout.mount("alocacoes", "Alocações", acoes);

      var esc = App.escapeHtml;
      var DEMO = (window.Auth && Auth.modoDemo()) || !(window.Auth && Auth.pronto);

      var UFS = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];

      var STATUS_META = {
        pendente:     { label: "Pendente",     cls: "badge-pendente" },
        em_andamento: { label: "Em andamento", cls: "badge-em-andamento" },
        enviada:      { label: "Enviada",      cls: "badge-enviada" }
      };

      var COLS = 9; // número de colunas da tabela (para o colspan)

      // ------------------------------------------------------------------
      // Estado
      // ------------------------------------------------------------------
      var epos = [];        // [{ id, nome, cidade, uf }]
      var processos = [];   // [{ id, slug, nome, icone, ordem }] - questionários pedíveis
      var alocacoes = [];   // relatórios pedidos (uma linha por questionário)
      var podeExcluir = DEMO; // admin/gestor (em demo, sempre)
      var demoSeq = 0;

      // ------------------------------------------------------------------
      // Estrutura estática da página
      // ------------------------------------------------------------------
      var htmlAviso = DEMO
        ? '<div class="aloc-demo-note"><i class="ti ti-flask" aria-hidden="true"></i>modo demonstração - nada é gravado</div>'
        : "";

      var htmlTabela =
        '<div class="card mb-0">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Relatórios pedidos por EPO</span>' +
              '<span class="subtitle">Cada linha é um questionário pedido ao responsável da EPO. Os anexos dele aparecem para o colaborador APSIS em tempo real</span>' +
            "</div>" +
            '<span class="acc-count" id="aloc-count" style="font-size:13px;color:var(--text-2);"></span>' +
          "</div>" +
          '<div class="aloc-toolbar">' +
            '<div class="aloc-busca">' +
              '<i class="ti ti-search" aria-hidden="true"></i>' +
              '<input class="input" id="aloc-filtro" type="search" placeholder="Filtrar por EPO, questionário ou e-mail do responsável" aria-label="Filtrar por EPO, questionário ou e-mail do responsável" autocomplete="off">' +
            "</div>" +
            '<span class="dica">Agrupado por EPO</span>' +
          "</div>" +
          '<div class="table-wrap">' +
            '<table class="table">' +
              "<thead><tr>" +
                "<th>EPO</th>" +
                "<th>Questionário</th>" +
                "<th>Responsável (e-mail)</th>" +
                "<th>Status</th>" +
                "<th>Visita prevista</th>" +
                "<th>Convite</th>" +
                "<th>Criado em</th>" +
                '<th class="num">Anexos</th>' +
                '<th class="num"></th>' +
              "</tr></thead>" +
              '<tbody id="aloc-body"><tr><td class="aloc-loading" colspan="9">Carregando relatórios pedidos...</td></tr></tbody>' +
            "</table>" +
          "</div>" +
        "</div>";

      var htmlOpcoesUf = UFS.map(function (u) {
        return '<option value="' + u + '"' + (u === "SP" ? " selected" : "") + ">" + u + "</option>";
      }).join("");

      // Bloco reaproveitado nos dois modais: questionários + visita + observação
      function blocoPedido(prefixo, rotulo) {
        return (
          '<div class="field">' +
            '<div class="procs-head">' +
              '<span class="procs-rotulo">' + rotulo + "</span>" +
              '<span class="procs-count" id="' + prefixo + '-procs-count"></span>' +
            "</div>" +
            '<div class="procs-box" id="' + prefixo + '-procs"></div>' +
            '<button class="link-mini" id="' + prefixo + '-procs-toggle" type="button" style="align-self:flex-start;">Marcar todos</button>' +
          "</div>" +
          '<div class="field-row">' +
            '<div class="field">' +
              '<label for="' + prefixo + '-visita">Visita prevista (opcional)</label>' +
              '<input class="input" id="' + prefixo + '-visita" type="date">' +
            "</div>" +
          "</div>" +
          '<div class="field" style="margin-bottom:4px;">' +
            '<label for="' + prefixo + '-obs">Observação (opcional)</label>' +
            '<textarea class="textarea" id="' + prefixo + '-obs" rows="2" style="min-height:62px;" placeholder="Ex.: priorizar notas fiscais dos últimos 30 dias"></textarea>' +
          "</div>"
        );
      }

      var htmlModalEpo =
        '<div class="modal-overlay" id="epo-modal" role="dialog" aria-modal="true" aria-labelledby="epo-modal-title">' +
          '<div class="modal">' +
            '<div class="modal-header">' +
              '<h2 class="modal-title" id="epo-modal-title">Nova EPO e relatórios pedidos</h2>' +
              '<button class="modal-close" id="epo-modal-close" type="button" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>' +
            "</div>" +
            '<div class="modal-body">' +
              '<div class="field">' +
                '<label for="epo-nome">Nome da EPO</label>' +
                '<input class="input" id="epo-nome" type="text" placeholder="Ex.: EPO Horizonte" autocomplete="off">' +
              "</div>" +
              '<div class="field-row">' +
                '<div class="field">' +
                  '<label for="epo-cidade">Cidade</label>' +
                  '<input class="input" id="epo-cidade" type="text" placeholder="Ex.: Campinas" autocomplete="off">' +
                "</div>" +
                '<div class="field uf">' +
                  '<label for="epo-uf">UF</label>' +
                  '<select class="select" id="epo-uf">' + htmlOpcoesUf + "</select>" +
                "</div>" +
              "</div>" +
              '<div class="field">' +
                '<label for="epo-email">E-mail do responsável da EPO</label>' +
                '<input class="input" id="epo-email" type="email" placeholder="nome@empresa.com.br" autocomplete="off">' +
                '<span class="hint">Deixe em branco para só cadastrar a EPO e pedir os relatórios depois.</span>' +
              "</div>" +
              blocoPedido("epo", "Relatórios pedidos agora") +
              '<div class="nota-responsavel">' +
                '<i class="ti ti-info-circle" aria-hidden="true"></i>' +
                "<span>O responsável recebe o convite por e-mail, entra com um código de verificação e anexa os documentos de cada pergunta. O colaborador APSIS vê os anexos na visita.</span>" +
              "</div>" +
            "</div>" +
            '<div class="modal-footer">' +
              '<button class="btn btn-ghost btn-sm" id="epo-modal-cancel" type="button">Cancelar</button>' +
              '<button class="btn btn-primary btn-sm" id="epo-modal-save" type="button"><i class="ti ti-check" aria-hidden="true"></i>Criar EPO</button>' +
            "</div>" +
          "</div>" +
        "</div>";

      var htmlModalAloc =
        '<div class="modal-overlay" id="aloc-modal" role="dialog" aria-modal="true" aria-labelledby="aloc-modal-title">' +
          '<div class="modal">' +
            '<div class="modal-header">' +
              '<h2 class="modal-title" id="aloc-modal-title">Pedir relatórios</h2>' +
              '<button class="modal-close" id="aloc-modal-close" type="button" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button>' +
            "</div>" +
            '<div class="modal-body">' +
              '<div class="field">' +
                '<label for="aloc-epo">EPO</label>' +
                '<select class="select" id="aloc-epo"></select>' +
              "</div>" +
              '<div class="field">' +
                '<label for="aloc-email">E-mail do responsável</label>' +
                '<input class="input" id="aloc-email" type="email" placeholder="nome@empresa.com.br" autocomplete="off">' +
              "</div>" +
              blocoPedido("aloc", "Questionários pedidos") +
              '<div class="nota-responsavel">' +
                '<i class="ti ti-info-circle" aria-hidden="true"></i>' +
                "<span>Um clique cria um pedido por questionário marcado. O responsável entra com este e-mail e vê apenas o envio de comprovações.</span>" +
              "</div>" +
            "</div>" +
            '<div class="modal-footer">' +
              '<button class="btn btn-ghost btn-sm" id="aloc-modal-cancel" type="button">Cancelar</button>' +
              '<button class="btn btn-primary btn-sm" id="aloc-modal-save" type="button"><i class="ti ti-check" aria-hidden="true"></i>Pedir relatórios' +
              "</button>" +
            "</div>" +
          "</div>" +
        "</div>";

      document.getElementById("page").innerHTML =
        '<p class="page-intro">' +
          "Quem cria a EPO (gerente da Claro ou da APSIS) decide na hora quais relatórios serão pedidos e quem é o responsável da EPO. " +
          "O responsável recebe o acesso por e-mail e anexa os documentos de cada pergunta, antes ou durante a visita. " +
          'O colaborador APSIS acha a EPO em <a href="pendentes.html">Relatórios pendentes</a>, vê o que já pode ser preenchido e responde o questionário pelo celular.' +
        "</p>" +
        htmlAviso +
        htmlTabela +
        htmlModalEpo +
        htmlModalAloc;

      // ------------------------------------------------------------------
      // Formatação
      // ------------------------------------------------------------------
      function fmtDataHora(v) {
        if (!v) return "-";
        var d = new Date(v);
        if (isNaN(d.getTime())) return "-";
        return d.toLocaleDateString("pt-BR") + " " +
          d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      }

      // Colunas date (YYYY-MM-DD): formata sem passar por fuso horário
      function fmtDataDia(v) {
        if (!v) return "-";
        var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
        if (m) return m[3] + "/" + m[2] + "/" + m[1];
        var d = new Date(v);
        if (isNaN(d.getTime())) return "-";
        return d.toLocaleDateString("pt-BR");
      }

      function badgeStatus(s) {
        var m = STATUS_META[s] || STATUS_META.pendente;
        return '<span class="badge ' + m.cls + '">' + m.label + "</span>";
      }

      function nomeProc(id) {
        for (var i = 0; i < processos.length; i++) {
          if (String(processos[i].id) === String(id)) return processos[i].nome;
        }
        return "questionário";
      }

      function procById(id) {
        for (var i = 0; i < processos.length; i++) {
          if (String(processos[i].id) === String(id)) return processos[i];
        }
        return null;
      }

      function epoById(id) {
        for (var i = 0; i < epos.length; i++) {
          if (String(epos[i].id) === String(id)) return epos[i];
        }
        return null;
      }

      function locDaEpo(e) {
        if (!e) return "";
        return e.cidade ? e.cidade + " · " + (e.uf || "") : (e.uf || "");
      }

      // ------------------------------------------------------------------
      // Link de acesso do responsável
      // ------------------------------------------------------------------
      function linkEnvio() {
        var origem = location.origin && location.origin !== "null" ? location.origin : "";
        if (origem) return origem + location.pathname.replace(/[^/]*$/, "") + "envio.html";
        var href = location.href.split("#")[0].split("?")[0];
        return href.replace(/[^/]*$/, "") + "envio.html";
      }

      function copiarFallback(txt) {
        try {
          var inp = document.createElement("input");
          inp.value = txt;
          inp.setAttribute("readonly", "readonly");
          inp.style.position = "fixed";
          inp.style.top = "-1000px";
          inp.style.opacity = "0";
          document.body.appendChild(inp);
          inp.select();
          if (inp.setSelectionRange) inp.setSelectionRange(0, txt.length);
          var ok = document.execCommand("copy");
          document.body.removeChild(inp);
          return !!ok;
        } catch (e) {
          return false;
        }
      }

      function copiarTexto(txt) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(txt).then(
            function () { return true; },
            function () { return copiarFallback(txt); }
          );
        }
        return Promise.resolve(copiarFallback(txt));
      }

      // ------------------------------------------------------------------
      // Convite por e-mail (Edge Function) - nunca trava a tela
      // ------------------------------------------------------------------
      function enviarConvite(alocacaoId) {
        if (DEMO || !alocacaoId) return Promise.resolve(false);
        var cli = window.Auth ? Auth.cliente : null;
        if (!cli || !cli.functions || !cli.functions.invoke) return Promise.resolve(false);
        try {
          return cli.functions.invoke("convidar-responsavel", { body: { alocacao_id: alocacaoId } })
            .then(
              function (r) { return !(r && r.error); },
              function () { return false; }
            );
        } catch (e) {
          return Promise.resolve(false);
        }
      }

      function avisarConviteManual() {
        var link = linkEnvio();
        return copiarTexto(link).then(function (ok) {
          App.toast(
            "O convite por e-mail ainda depende do SMTP. " +
            (ok ? "O link de acesso foi copiado - envie para o responsável." : "Copie o link manualmente: " + link)
          );
        });
      }

      // ------------------------------------------------------------------
      // Render da tabela (ordenada e agrupada por EPO)
      // ------------------------------------------------------------------
      function linhasOrdenadas() {
        return alocacoes.slice().sort(function (a, b) {
          var na = String(a.epoNome || ""), nb = String(b.epoNome || "");
          var c = na.localeCompare(nb, "pt-BR");
          if (c !== 0) return c;
          var oa = Number(a.procOrdem) || 0, ob = Number(b.procOrdem) || 0;
          if (oa !== ob) return oa - ob;
          return String(a.procNome || "").localeCompare(String(b.procNome || ""), "pt-BR");
        });
      }

      function linhasVisiveis() {
        var campo = document.getElementById("aloc-filtro");
        var q = campo ? campo.value.trim().toLowerCase() : "";
        var lista = linhasOrdenadas();
        if (!q) return lista;
        return lista.filter(function (a) {
          var alvo = (a.epoNome || "") + " " + (a.epoLoc || "") + " " + (a.procNome || "") + " " + (a.email || "");
          return alvo.toLowerCase().indexOf(q) >= 0;
        });
      }

      function renderLista() {
        var tbody = document.getElementById("aloc-body");
        var count = document.getElementById("aloc-count");
        var lista = linhasVisiveis();

        if (!alocacoes.length) {
          tbody.innerHTML =
            '<tr><td colspan="' + COLS + '" style="padding:0;border:0;">' +
              '<div class="empty">' +
                '<i class="ti ti-file-plus" aria-hidden="true"></i>' +
                "Nenhum relatório pedido ainda. Crie a EPO já marcando os questionários ou use \"Pedir relatórios\"." +
              "</div>" +
            "</td></tr>";
          count.textContent = "";
          return;
        }

        if (!lista.length) {
          tbody.innerHTML =
            '<tr><td colspan="' + COLS + '" style="padding:0;border:0;">' +
              '<div class="empty">' +
                '<i class="ti ti-search-off" aria-hidden="true"></i>' +
                "Nenhum relatório pedido corresponde ao filtro." +
              "</div>" +
            "</td></tr>";
          count.textContent = "0 de " + alocacoes.length;
          return;
        }

        var grupoAtual = null;
        tbody.innerHTML = lista.map(function (a) {
          var chave = String(a.epoId || a.epoNome);
          var inicio = chave !== grupoAtual;
          grupoAtual = chave;

          var celEpo = inicio
            ? '<div class="aloc-epo">' +
                '<span class="nm">' + esc(a.epoNome) + "</span>" +
                (a.epoLoc ? '<span class="loc">' + esc(a.epoLoc) + "</span>" : "") +
              "</div>"
            : "";

          var acoesLinha =
            '<button class="btn-acao" type="button" data-copiar="' + esc(a.id) + '" title="Copiar link de acesso do responsável" aria-label="Copiar link de acesso do responsável"><i class="ti ti-link" aria-hidden="true"></i></button>' +
            '<button class="btn-acao" type="button" data-convite="' + esc(a.id) + '" title="Reenviar convite por e-mail" aria-label="Reenviar convite para ' + esc(a.email) + '"><i class="ti ti-mail-forward" aria-hidden="true"></i></button>' +
            (podeExcluir
              ? '<button class="btn-acao danger" type="button" data-excluir="' + esc(a.id) + '" title="Excluir pedido" aria-label="Excluir pedido de ' + esc(a.email) + '"><i class="ti ti-trash" aria-hidden="true"></i></button>'
              : "");

          return (
            "<tr" + (inicio ? ' class="grupo-inicio"' : "") + ">" +
              "<td>" + celEpo + "</td>" +
              "<td>" +
                '<span class="aloc-proc"><i class="ti ' + esc(a.procIcone || "ti-clipboard-list") + '" aria-hidden="true"></i>' + esc(a.procNome) + "</span>" +
              "</td>" +
              '<td class="aloc-email">' + esc(a.email || "-") + "</td>" +
              "<td>" + badgeStatus(a.status) + "</td>" +
              '<td class="aloc-data">' + esc(fmtDataDia(a.visitaPrevista)) + "</td>" +
              '<td class="aloc-data">' + esc(a.conviteEnviadoEm ? fmtDataDia(a.conviteEnviadoEm) : "-") + "</td>" +
              '<td class="aloc-data">' + esc(fmtDataHora(a.criadoEm)) + "</td>" +
              '<td class="num"><span class="aloc-anexos"><i class="ti ti-paperclip" aria-hidden="true"></i>' + App.fmtNum(a.anexos) + "</span></td>" +
              '<td class="num"><span class="acoes-cel">' + acoesLinha + "</span></td>" +
            "</tr>"
          );
        }).join("");

        var total = alocacoes.length;
        count.textContent = lista.length === total
          ? total + (total === 1 ? " relatório pedido" : " relatórios pedidos")
          : lista.length + " de " + total;
      }

      // ------------------------------------------------------------------
      // Selects e listas de questionários dos modais
      // ------------------------------------------------------------------
      function preencherSelects() {
        var selEpo = document.getElementById("aloc-epo");
        selEpo.innerHTML = epos.length
          ? epos.map(function (e) {
              var loc = locDaEpo(e);
              return '<option value="' + esc(e.id) + '">' + esc(e.nome) + (loc ? " (" + esc(loc) + ")" : "") + "</option>";
            }).join("")
          : '<option value="">Nenhuma EPO cadastrada</option>';
      }

      function htmlProcs(prefixo) {
        if (!processos.length) return '<div class="procs-vazio">Nenhum questionário disponível.</div>';
        return processos.map(function (p, i) {
          var id = prefixo + "-proc-" + i;
          return (
            '<label class="checkbox proc-opt" for="' + id + '">' +
              '<input type="checkbox" id="' + id + '" value="' + esc(p.id) + '">' +
              '<i class="ti ' + esc(p.icone || "ti-clipboard-list") + '" aria-hidden="true"></i>' +
              '<span class="nm">' + esc(p.nome) + "</span>" +
            "</label>"
          );
        }).join("");
      }

      function caixasDe(prefixo) {
        var box = document.getElementById(prefixo + "-procs");
        if (!box) return [];
        return Array.prototype.slice.call(box.querySelectorAll('input[type="checkbox"]'));
      }

      function marcadosDe(prefixo) {
        var out = [];
        caixasDe(prefixo).forEach(function (c) {
          if (c.checked) out.push(c.value);
        });
        return out;
      }

      function atualizarResumo(prefixo) {
        var caixas = caixasDe(prefixo);
        var n = marcadosDe(prefixo).length;
        var alvoCount = document.getElementById(prefixo + "-procs-count");
        var alvoToggle = document.getElementById(prefixo + "-procs-toggle");
        if (alvoCount) alvoCount.textContent = n ? n + (n === 1 ? " marcado" : " marcados") : "nenhum marcado";
        if (alvoToggle) alvoToggle.textContent = (caixas.length && n === caixas.length) ? "Desmarcar todos" : "Marcar todos";
      }

      function renderProcs(prefixo) {
        var box = document.getElementById(prefixo + "-procs");
        if (box) box.innerHTML = htmlProcs(prefixo);
        atualizarResumo(prefixo);
      }

      function limparPedido(prefixo) {
        renderProcs(prefixo);
        document.getElementById(prefixo + "-visita").value = "";
        document.getElementById(prefixo + "-obs").value = "";
      }

      function wirePedido(prefixo) {
        var box = document.getElementById(prefixo + "-procs");
        var toggle = document.getElementById(prefixo + "-procs-toggle");
        box.addEventListener("change", function () { atualizarResumo(prefixo); });
        toggle.addEventListener("click", function () {
          var caixas = caixasDe(prefixo);
          if (!caixas.length) return;
          var todos = marcadosDe(prefixo).length === caixas.length;
          caixas.forEach(function (c) { c.checked = !todos; });
          atualizarResumo(prefixo);
        });
        atualizarResumo(prefixo);
      }

      wirePedido("epo");
      wirePedido("aloc");

      // ------------------------------------------------------------------
      // Criação em lote dos pedidos
      // ------------------------------------------------------------------
      function resumoPedido(res, email) {
        var partes = [];
        if (res.criados) {
          partes.push(res.criados + (res.criados === 1 ? " relatório pedido" : " relatórios pedidos") + (email ? " para " + email : ""));
        }
        if (res.dups.length) partes.push("já existiam: " + res.dups.join(", "));
        if (res.erros.length) partes.push("falharam: " + res.erros.join("; "));
        return partes.join(". ");
      }

      // Modo demonstração - grava só na memória da página
      function criarPedidosDemo(epo, procIds, email, visita, obs) {
        var res = { criados: 0, dups: [], erros: [], ids: [] };
        var agora = new Date().toISOString();
        procIds.forEach(function (pid) {
          var proc = procById(pid);
          var dup = alocacoes.some(function (a) {
            return String(a.epoId) === String(epo.id) && String(a.procId) === String(pid) && a.email === email;
          });
          if (dup) { res.dups.push(nomeProc(pid)); return; }
          demoSeq += 1;
          alocacoes.push({
            id: "demo-aloc-" + demoSeq,
            epoId: epo.id,
            epoNome: epo.nome,
            epoLoc: locDaEpo(epo),
            procId: pid,
            procNome: proc ? proc.nome : nomeProc(pid),
            procIcone: proc ? proc.icone : null,
            procOrdem: proc ? proc.ordem : 0,
            email: email,
            status: "pendente",
            criadoEm: agora,
            visitaPrevista: visita || null,
            conviteEnviadoEm: email ? agora : null,
            observacao: obs || null,
            anexos: 0
          });
          res.criados += 1;
          res.ids.push("demo-aloc-" + demoSeq);
        });
        return res;
      }

      // Supabase - insere uma linha por questionário para tratar duplicidade isolada
      function criarPedidos(epoId, procIds, email, visita, obs) {
        var res = { criados: 0, dups: [], erros: [], ids: [] };
        if (!procIds.length) return Promise.resolve(res);

        return Auth.sessao().then(function (s) {
          var criadoPor = s ? s.user.id : null;
          var cadeia = Promise.resolve();
          procIds.forEach(function (pid) {
            cadeia = cadeia.then(function () {
              var linha = {
                epo_id: epoId,
                processo_id: pid,
                responsavel_email: email,
                status: "pendente",
                criado_por: criadoPor,
                visita_prevista: visita || null,
                observacao: obs || null
              };
              return Auth.cliente.from("alocacoes").insert(linha).select("id").then(
                function (r) {
                  if (r.error) {
                    var msg = r.error.message || "";
                    if (r.error.code === "23505" || /duplicate|unique/i.test(msg)) {
                      res.dups.push(nomeProc(pid));
                    } else {
                      res.erros.push(nomeProc(pid) + " (" + msg + ")");
                    }
                    return;
                  }
                  res.criados += 1;
                  if (r.data && r.data[0]) res.ids.push(r.data[0].id);
                },
                function (err) {
                  res.erros.push(nomeProc(pid) + " (" + (err && err.message ? err.message : "erro inesperado") + ")");
                }
              );
            });
          });
          return cadeia.then(function () { return res; });
        });
      }

      // Convite: uma chamada por e-mail, nunca por questionário
      function convidarSeNecessario(res, email) {
        if (!email || !res.criados) return Promise.resolve();
        return enviarConvite(res.ids[0]).then(function (ok) {
          if (ok) { App.toast("Convite enviado para " + email + "."); return; }
          return avisarConviteManual();
        });
      }

      // ------------------------------------------------------------------
      // Dados - Supabase
      // ------------------------------------------------------------------
      function carregarPapel() {
        return Auth.sessao().then(function (s) {
          if (!s) return;
          return Auth.cliente.from("perfis").select("papel")
            .eq("user_id", s.user.id).maybeSingle()

              var papel = (r.data && r.data.papel) || "";

      function carregarEpos() {
        return Auth.cliente.from("epos")
          .select("id, nome, cidade, uf")
          .eq("ativo", true)
          .order("nome")
          .then(function (r) {
            if (r.error) { App.toast("Erro ao carregar EPOs: " + r.error.message); return; }
            epos = r.data || [];
          });
      }

      function carregarProcessos() {
        return Auth.cliente.from("processos")
          .select("id, slug, nome, icone, tipo, ordem")
          .eq("ativo", true)
          .order("ordem")
          .then(function (r) {
            if (r.error) { App.toast("Erro ao carregar questionários: " + r.error.message); return; }

              return p.tipo === "processo" || p.tipo === "itens_obrigatorios";
            });
          });

      function carregarAlocacoes() {
        return Auth.cliente.from("alocacoes")
          .select("id, epo_id, processo_id, responsavel_email, status, criado_em, visita_prevista, convite_enviado_em, observacao, epos(nome, cidade, uf), processos(nome, slug, icone, ordem)")
          .order("criado_em", { ascending: false })
          .then(function (r) {
            if (r.error) { App.toast("Erro ao carregar relatórios pedidos: " + r.error.message); return; }
            var linhas = r.data || [];

            // Contagem de anexos por alocação
            return Auth.cliente.from("alocacao_anexos")
              .select("alocacao_id")
              .then(function (ra) {
                var contagem = {};
                (ra.data || []).forEach(function (x) {
                  contagem[x.alocacao_id] = (contagem[x.alocacao_id] || 0) + 1;
                });
                alocacoes = linhas.map(function (a) {
                  var e = a.epos || {};
                  var p = a.processos || {};
                  return {
                    id: a.id,
                    epoId: a.epo_id,
                    epoNome: e.nome || "-",
                    epoLoc: locDaEpo(e),
                    procId: a.processo_id,
                    procNome: p.nome || "-",
                    procIcone: p.icone,
                    procOrdem: p.ordem || 0,
                    email: a.responsavel_email,
                    status: a.status,
                    criadoEm: a.criado_em,
                    visitaPrevista: a.visita_prevista,
                    conviteEnviadoEm: a.convite_enviado_em,
                    observacao: a.observacao,
                    anexos: contagem[a.id] || 0
                  };
                });
              });
          });
      }

      function recarregar() {
        return Promise.all([carregarEpos(), carregarProcessos(), carregarAlocacoes()])
          .then(function () {
            renderLista();
            preencherSelects();
            renderProcs("epo");
            renderProcs("aloc");
          });

      if (DEMO) {
        carregarDemo();

            '<tr><td class="aloc-loading" colspan="' + COLS + '">Não foi possível carregar os relatórios pedidos.</td></tr>';
        });

      // ------------------------------------------------------------------

      // ------------------------------------------------------------------
      // Modais (abre/fecha)
      // ------------------------------------------------------------------
      function wireModal(overlayId, closeIds) {
        var overlay = document.getElementById(overlayId);
        function fechar() { overlay.classList.remove("is-open"); }
        closeIds.forEach(function (id) {
          document.getElementById(id).addEventListener("click", fechar);
        });
        overlay.addEventListener("click", function (ev) {
          if (ev.target === overlay) fechar();
        });
        return { abrir: function () { overlay.classList.add("is-open"); }, fechar: fechar, el: overlay };
      }

      var modalEpo = wireModal("epo-modal", ["epo-modal-close", "epo-modal-cancel"]);
      var modalAloc = wireModal("aloc-modal", ["aloc-modal-close", "aloc-modal-cancel"]);

      document.addEventListener("keydown", function (ev) {
        if (ev.key !== "Escape") return;
        modalEpo.fechar();
        modalAloc.fechar();
      });

      document.getElementById("btn-nova-epo").addEventListener("click", function () {
        document.getElementById("epo-nome").value = "";
        document.getElementById("epo-cidade").value = "";
        document.getElementById("epo-uf").value = "SP";
        document.getElementById("epo-email").value = "";
        limparPedido("epo");
        modalEpo.abrir();
        document.getElementById("epo-nome").focus();
      });

      document.getElementById("btn-pedir-relatorios").addEventListener("click", function () {
        preencherSelects();
        document.getElementById("aloc-email").value = "";
        limparPedido("aloc");
        modalAloc.abrir();
        document.getElementById("aloc-epo").focus();
      });

      // ------------------------------------------------------------------
      // Criar EPO já pedindo os relatórios
      // ------------------------------------------------------------------
      document.getElementById("epo-modal-save").addEventListener("click", function () {
        var nome = document.getElementById("epo-nome").value.trim();
        var cidade = document.getElementById("epo-cidade").value.trim();
        var uf = document.getElementById("epo-uf").value;
        var email = document.getElementById("epo-email").value.trim().toLowerCase();
        var visita = document.getElementById("epo-visita").value;
        var obs = document.getElementById("epo-obs").value.trim();
        var procIds = marcadosDe("epo");

        if (!nome) { App.toast("Informe o nome da EPO."); return; }
        if (!cidade) { App.toast("Informe a cidade da EPO."); return; }
        if (email && !/^\S+@\S+\.\S+$/.test(email)) { App.toast("Informe um e-mail válido para o responsável."); return; }
        if (email && !procIds.length) { App.toast("Marque pelo menos um questionário para pedir ao responsável."); return; }
        if (procIds.length && !email) { App.toast("Informe o e-mail do responsável que vai enviar os documentos."); return; }

        if (DEMO) {
          var epoDemo = { id: "demo-epo-" + Date.now(), nome: nome, cidade: cidade, uf: uf };
          epos.push(epoDemo);
          epos.sort(function (a, b) { return String(a.nome).localeCompare(String(b.nome), "pt-BR"); });
          var resDemo = criarPedidosDemo(epoDemo, procIds, email, visita, obs);
          renderLista();
          preencherSelects();
          modalEpo.fechar();
          var resumoDemo = resumoPedido(resDemo, email);
          App.toast("EPO " + nome + " criada" + (resumoDemo ? " - " + resumoDemo : " sem relatórios pedidos") + " (demonstração - nada foi gravado).");
          return;
        }

        var btn = this;
        btn.disabled = true;
        Auth.cliente.from("clientes").select("id").limit(1)
          .then(function (r) {
            if (r.error || !r.data || !r.data.length) {
              throw new Error((r.error && r.error.message) || "Cliente não encontrado.");
            }
            return Auth.cliente.from("epos").insert({
              cliente_id: r.data[0].id,
              nome: nome,
              cidade: cidade,
              uf: uf,
              ativo: true
            }).select("id");
          })
          .then(function (r) {
            if (r.error) throw r.error;
            var novoId = r.data && r.data[0] ? r.data[0].id : null;
            if (!novoId || !procIds.length) {
              modalEpo.fechar();
              App.toast("EPO " + nome + " criada sem relatórios pedidos.");
              return recarregar();
            }
            return criarPedidos(novoId, procIds, email, visita, obs).then(function (res) {
              modalEpo.fechar();
              var resumo = resumoPedido(res, email);
              App.toast("EPO " + nome + " criada" + (resumo ? " com " + resumo : " sem relatórios pedidos") + ".");
              return convidarSeNecessario(res, email).then(recarregar);
            });
          })
          .catch(function (e) {
            App.toast("Não foi possível criar a EPO: " + (e && e.message ? e.message : "erro inesperado."));
          })
          .then(function () { btn.disabled = false; });
      });

      // ------------------------------------------------------------------
      // Pedir relatórios para uma EPO existente (vários de uma vez)
      // ------------------------------------------------------------------
      document.getElementById("aloc-modal-save").addEventListener("click", function () {
        var epoId = document.getElementById("aloc-epo").value;
        var email = document.getElementById("aloc-email").value.trim().toLowerCase();
        var visita = document.getElementById("aloc-visita").value;
        var obs = document.getElementById("aloc-obs").value.trim();
        var procIds = marcadosDe("aloc");

        if (!epoId) { App.toast("Selecione a EPO."); return; }
        if (!procIds.length) { App.toast("Marque pelo menos um questionário."); return; }
        if (!email || !/^\S+@\S+\.\S+$/.test(email)) { App.toast("Informe um e-mail válido para o responsável."); return; }

        if (DEMO) {
          var epoDemo = epoById(epoId) || { id: epoId, nome: "-", cidade: "", uf: "" };
          var resDemo = criarPedidosDemo(epoDemo, procIds, email, visita, obs);
          renderLista();
          modalAloc.fechar();
          App.toast(resumoPedido(resDemo, email) + " (demonstração - nada foi gravado).");
          return;
        }

        var btn = this;
        btn.disabled = true;
        criarPedidos(epoId, procIds, email, visita, obs)
          .then(function (res) {
            var epo = epoById(epoId);
            var alvo = epo ? epo.nome : "EPO";
            if (!res.criados && !res.dups.length && res.erros.length) {
              throw new Error(res.erros.join("; "));
            }
            modalAloc.fechar();
            App.toast(alvo + ": " + resumoPedido(res, email) + ".");
            return convidarSeNecessario(res, email).then(recarregar);
          })
          .catch(function (e) {
            App.toast("Não foi possível pedir os relatórios: " + (e && e.message ? e.message : "erro inesperado."));
          })
          .then(function () { btn.disabled = false; });
      });

      // ------------------------------------------------------------------
      // Ações da linha: copiar link, reenviar convite e excluir
      // ------------------------------------------------------------------
      function acharLinha(id) {
        for (var i = 0; i < alocacoes.length; i++) {
          if (String(alocacoes[i].id) === String(id)) return alocacoes[i];
        }
        return null;
      }

      document.getElementById("aloc-body").addEventListener("click", function (ev) {
        var btnCopiar = ev.target.closest("[data-copiar]");
        if (btnCopiar) {
          var link = linkEnvio();
          copiarTexto(link).then(function (ok) {
            App.toast(ok ? "Link de acesso copiado: " + link : "Não foi possível copiar. O link é " + link);
          });
          return;
        }

        var btnConvite = ev.target.closest("[data-convite]");
        if (btnConvite) {
          var idConvite = btnConvite.getAttribute("data-convite");
          var linhaConvite = acharLinha(idConvite);
          if (DEMO) {
            if (linhaConvite) linhaConvite.conviteEnviadoEm = new Date().toISOString();
            renderLista();
            App.toast("Convite reenviado (demonstração - nada foi gravado).");
            return;
          }
          btnConvite.disabled = true;
          enviarConvite(idConvite).then(function (ok) {
            btnConvite.disabled = false;
            if (ok) {
              App.toast("Convite reenviado" + (linhaConvite && linhaConvite.email ? " para " + linhaConvite.email : "") + ".");
              return recarregar();
            }
            return avisarConviteManual();
          });
          return;
        }

        var btnExcluir = ev.target.closest("[data-excluir]");
        if (!btnExcluir) return;
        var id = btnExcluir.getAttribute("data-excluir");
        var alvo = acharLinha(id);
        var quem = alvo ? alvo.procNome + " de " + alvo.email + " (" + alvo.epoNome + ")" : "este pedido";
        if (!window.confirm("Excluir o pedido de " + quem + "? Os anexos enviados deixarão de aparecer.")) return;

        if (DEMO) {
          alocacoes = alocacoes.filter(function (a) { return String(a.id) !== String(id); });
          renderLista();
          App.toast("Pedido excluído (demonstração - nada foi gravado).");
          return;
        }

        Auth.cliente.from("alocacoes").delete().eq("id", id)
          .then(function (r) {
            if (r.error) throw r.error;
            App.toast("Pedido excluído.");
            return recarregar();
          })
          .catch(function (e) {
            App.toast("Não foi possível excluir: " + (e && e.message ? e.message : "erro inesperado."));
          });
      });
    })();
  </script>
</body>
</html>
