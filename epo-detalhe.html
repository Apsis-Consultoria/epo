<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Do que a pagina pode carregar. Sem isto qualquer endereco servia: script de
       fora, imagem de fora, chamada para fora. A lista abaixo e o que o sistema
       usa de verdade - a biblioteca do banco, o grafico, o mapa, as fontes, o
       captcha e o proprio projeto. O resto o navegador recusa.
       'unsafe-inline' segue necessario: as telas tem script e estilo escritos
       dentro do HTML. Tirar isso e reescrever as 21 telas, e fica para depois.
       frame-ancestors nao entra aqui: em <meta> o navegador ignora essa regra,
       ela so vale em cabecalho, e o servidor de paginas nao deixa mandar um. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://challenges.cloudflare.com;
    style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;
    img-src 'self' data: blob: https://vpkxoyfbxgnizymaurek.supabase.co https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://server.arcgisonline.com;
    connect-src 'self' https://vpkxoyfbxgnizymaurek.supabase.co https://challenges.cloudflare.com https://viacep.com.br https://nominatim.openstreetmap.org;
    frame-src https://challenges.cloudflare.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests;
  ">
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon-claro.svg?v=141">
  <!-- Reserva: o Safari nao usa favicon em SVG. -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png?v=141">
  <link rel="apple-touch-icon" href="assets/brand/favicon-180.png?v=141">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <title>Detalhe da EPO - Auditoria de EPOs</title>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/fonts/tabler-icons.woff2?v3.11.0">
  <link rel="stylesheet" href="assets/icones.css?v=141">
  <link rel="stylesheet" href="assets/carregando.css?v=141">
  <link rel="stylesheet" href="assets/app.css?v=141">
  <style>
    /* Ajustes locais desta tela (pequenos; reutiliza o design system) */
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-weight: 500; margin-bottom: 16px; transition: color .15s ease; }
    .back-link:hover { color: var(--text); }
    .epo-title { font-size: 22px; font-weight: 600; letter-spacing: -.02em; color: var(--text); }
    .epo-head-score { min-width: 200px; }
    .epo-score-num { font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -.02em; color: var(--text); font-variant-numeric: tabular-nums; }
    .chart-wrap { position: relative; height: 280px; }
    .nc-list { display: flex; flex-direction: column; }
    .nc-item { display: flex; gap: 14px; padding: 16px 0; border-top: 1px solid var(--border); }
    .nc-item:first-child { border-top: 0; padding-top: 0; }
    .nc-thumb { flex: 0 0 76px; width: 76px; }
    .nc-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .nc-item-title { font-weight: 500; color: var(--text); }

    /* Logística reversa */
    .rev-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .rev-item { display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .rev-item-label { font-size: 12px; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
    .rev-item-value { font-size: 22px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .rev-item-sub { font-size: 12px; color: var(--text-muted); }

    /* Drill-down por processo (accordion macro -> micro) */
    .proc-acc { border-top: 1px solid var(--border); }
    .proc-acc:first-child { border-top: 0; }
    .proc-head {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 12px 4px; background: none; border: 0; cursor: pointer;
      font: inherit; color: var(--text); text-align: left;
    }
    .proc-head:hover { background: var(--surface-2); border-radius: 8px; }
    .proc-head-icon { flex: 0 0 auto; color: var(--text-2); font-size: 18px; display: grid; place-items: center; }
    .proc-head-nome { flex: 0 0 220px; font-weight: 500; min-width: 0; }
    .proc-head .score-row { flex: 1; min-width: 120px; }
    .proc-caret { flex: 0 0 auto; color: var(--text-muted); transition: transform .18s ease; }
    .proc-acc.is-open .proc-caret { transform: rotate(180deg); }
    .proc-items { display: none; padding: 4px 4px 14px 34px; }
    .proc-acc.is-open .proc-items { display: block; }
    .proc-item { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-top: 1px dashed var(--border); }
    .proc-item:first-child { border-top: 0; }
    .proc-item-q { flex: 1; min-width: 0; font-size: 13px; color: var(--text-2); }
    .proc-item .score-bar { flex: 0 0 120px; height: 6px; }
    .proc-item-pct { flex: 0 0 38px; text-align: right; font-size: 12px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    .badge-ofensor {
      display: inline-flex; align-items: center; gap: 4px; margin-left: 8px;
      padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
      background: var(--danger-bg); color: var(--danger); white-space: nowrap;
    }

    @media (max-width: 720px) {
      .rev-grid { grid-template-columns: 1fr; }
      .proc-head { flex-wrap: wrap; }
      .proc-head-nome { flex: 1 1 auto; }
      .proc-head .score-row { flex: 1 1 100%; order: 3; }
      .proc-items { padding-left: 4px; }
    }
    @media (max-width: 560px) { .epo-head-score { min-width: 0; } }
  </style>
</head>
<body>
  <div class="tela-carregando" id="tela-carregando" role="status" aria-label="Carregando">
    <span class="claro-loader" aria-hidden="true"></span>
  </div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
          integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/data.js?v=141"></script>
  <script src="assets/app.js?v=141"></script>
  <script src="assets/supabase-config.js?v=141"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
          integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/auth.js?v=141"></script>
  <script>
    (function () {
      "use strict";

      var APP = window.APP || {};
      var esc = App.escapeHtml;

      // -------------------------------------------------- Resolve a EPO
      // O mapa e a visao geral montam o link com o id do cadastro (uuid), que
      // nao existe no catalogo local. Cair na primeira EPO da lista abriria
      // outra unidade com outro nome e outra nota, sem ninguem perceber.
      var id = App.getParam("id");
      var epo = App.epoById(id);

      if (!epo && id) {
        Layout.mount("ranking", "Detalhe da EPO");
        document.getElementById("page").innerHTML =
          '<a class="back-link" href="ranking">' +
            '<i class="ti ti-arrow-left" aria-hidden="true"></i>Voltar ao ranking' +
          "</a>" +
          '<div class="card"><div class="empty">' +
            '<i class="ti ti-chart-histogram" aria-hidden="true"></i>' +
            "<div>Esta unidade ainda não tem histórico de auditoria para detalhar.</div>" +
            '<div class="text-muted" style="font-size:12.5px;margin-top:6px;">' +
              "O detalhamento aparece depois da primeira vistoria enviada e validada." +
            "</div>" +
          "</div></div>";
        return;
      }
      if (!epo) epo = APP.epos && APP.epos[0];

      if (!epo) {
        Layout.mount("ranking", "Detalhe da EPO");
        document.getElementById("page").innerHTML =
          '<div class="card"><div class="empty">' +
            '<i class="ti ti-mood-empty" aria-hidden="true"></i>' +
            "Nenhuma EPO encontrada." +
          "</div></div>";
        return;
      }

      // Sem nota nao ha selo. Antes o tierOf(null) devolvia "critico", e a
      // unidade que nunca foi visitada abria com selo vermelho de reprovada.
      var semNota = epo.score === null || epo.score === undefined || isNaN(epo.score);
      var tier = epo.tier || (semNota ? "nenhum" : App.tierOf(epo.score));
      var meta = App.tierMeta(tier);

      // Posição no ranking (por score desc). Quem nao tem nota vai para o fim:
      // subtracao com nulo nao ordena.
      var ordenadas = (APP.epos || []).slice().sort(function (a, b) {
        var na = a.score == null ? -1 : Number(a.score);
        var nb = b.score == null ? -1 : Number(b.score);
        return nb - na;
      });
      var posicao = ordenadas.findIndex(function (e) { return e.id === epo.id; }) + 1;
      var total = ordenadas.length;

      // Monta o shell - título = nome da EPO, item de menu ativo = Ranking
      Layout.mount("ranking", epo.nome);

      // -------------------------------------------------- Helpers locais
      function fmtData(iso) {
        if (!iso) return "-";
        var p = String(iso).split("-");
        return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso;
      }
      function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }
      function hexToRgba(hex, a) {
        hex = String(hex).replace("#", "");
        if (hex.length === 3) hex = hex.split("").map(function (c) { return c + c; }).join("");
        var n = parseInt(hex, 16);
        return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
      }

      var novaAuditoriaHref = "pendentes?epo=" + encodeURIComponent(epo.id);

      // -------------------------------------------------- Cabeçalho (identidade + score)
      var headerHtml =
        '<div class="card">' +
          '<div class="row-between wrap" style="gap:24px;">' +
            '<div class="stack stack-sm grow">' +
              '<div class="row wrap" style="gap:12px;">' +
                '<h2 class="epo-title">' + esc(epo.nome) + "</h2>" +
                '<span class="badge ' + meta.cls + '"><i class="ti ti-award" aria-hidden="true"></i>' + meta.label + "</span>" +
              "</div>" +
              '<div class="row wrap" style="gap:16px;">' +
                '<span class="muted row" style="gap:6px;"><i class="ti ti-map-pin" aria-hidden="true"></i>' + esc(epo.cidade) + " · " + esc(epo.uf) + "</span>" +
                '<span class="chip"><i class="ti ti-trophy" aria-hidden="true"></i>' + posicao + "º de " + total + " no ranking</span>" +
              "</div>" +
              '<div style="margin-top:8px;">' +
                '<a class="btn btn-primary" href="' + novaAuditoriaHref + '">' +
                  '<i class="ti ti-clipboard-list" aria-hidden="true"></i>Auditorias pendentes desta EPO' +
                "</a>" +
              "</div>" +
            "</div>" +
            '<div class="epo-head-score stack stack-sm">' +
              '<span class="kpi-label">Pontuação</span>' +
              '<div class="row" style="gap:8px; align-items:baseline;">' +
                '<span class="epo-score-num">' + App.fmtScore(epo.score) + "</span>" +
                '<span class="text-muted">/ 100</span>' +
              "</div>" +
              '<div class="score-bar"><div class="score-fill tier-' + tier +
                '" style="width:' + App.larguraScore(epo.score) + '%;"></div></div>' +
            "</div>" +
          "</div>" +
        "</div>";

      // -------------------------------------------------- KPIs
      function kpi(label, icon, value, deltaHtml) {
        return (
          '<div class="kpi">' +
            '<div class="kpi-top">' +
              '<span class="kpi-label">' + label + "</span>" +
              '<span class="kpi-icon"><i class="ti ' + icon + '" aria-hidden="true"></i></span>' +
            "</div>" +
            '<span class="kpi-value">' + value + "</span>" +
            (deltaHtml || "") +
          "</div>"
        );
      }

      var kpisHtml =
        '<div class="kpi-grid">' +
          kpi("Tempo de ciclo", "ti-clock-pause", App.fmtDias(epo.tempoCiclo)) +
          kpi("Conformidade", "ti-shield-check", App.fmtPct(epo.conformidade)) +
          kpi("Não conformidades", "ti-alert-triangle", App.fmtNum(epo.ncs)) +
          kpi(
            "Equipamentos",
            "ti-package",
            App.fmtNum(epo.equipamentos),
            '<span class="kpi-delta down"><i class="ti ti-alert-circle" aria-hidden="true"></i>' +
              App.fmtNum(epo.equipamentosParados) + " parados</span>"
          ) +
        "</div>";

      // -------------------------------------------------- Ciclo do equipamento
      function cicloStep(label, icon, value) {
        return (
          '<div class="cycle-step">' +
            '<div class="cycle-step-icon"><i class="ti ' + icon + '" aria-hidden="true"></i></div>' +
            '<div class="cycle-step-body">' +
              '<span class="cycle-step-label">' + label + "</span>" +
              '<span class="cycle-step-value">' + App.fmtDias(value) + "</span>" +
            "</div>" +
          "</div>"
        );
      }
      var seta = '<div class="cycle-arrow" aria-hidden="true"><i class="ti ti-arrow-right"></i></div>';

      var tempos = epo.tempos || {};
      var cicloHtml =
        '<div class="card">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Ciclo do material</span>' +
              '<span class="subtitle">Da chegada à devolução para a Claro - tempos médios desta EPO</span>' +
            "</div>" +
            '<div class="card-header-action"><span class="chip"><i class="ti ti-clock" aria-hidden="true"></i>Ciclo total: ' +
              App.fmtDias(epo.tempoCiclo) + "</span></div>" +
          "</div>" +
          '<div class="cycle">' +
            cicloStep("Chegada do material", "ti-truck-delivery", tempos.chegada) +
            seta +
            cicloStep("Armazenagem", "ti-building-warehouse", tempos.armazenagem) +
            seta +
            cicloStep("Distribuição ao técnico", "ti-package-export", tempos.distribuicao) +
            seta +
            cicloStep("Retorno de campo", "ti-package-import", tempos.retornoCampo) +
            seta +
            cicloStep("Devolução (reversa)", "ti-arrow-back-up", tempos.devolucao) +
          "</div>" +
        "</div>";

      // -------------------------------------------------- Logística reversa
      var rev = epo.reversa || {};
      var altoGiro = rev.altoGiro || {};

      function corPorNivel(pct, meta) {
        return pct >= meta ? "var(--success)" : "var(--danger)";
      }
      function barraMeta(pct, meta) {
        return (
          '<div class="score-bar">' +
            '<div class="score-fill" style="width:' + Math.min(100, pct) + "%; background:" + corPorNivel(pct, meta) + ';"></div>' +
            '<span class="meta-line" style="left:' + meta + '%;" title="Meta ' + meta + '%"></span>' +
          "</div>"
        );
      }

      var pctVolume = rev.saldoSistema ? Math.round((rev.volumeDevolvido / rev.saldoSistema) * 100) : 0;
      var metaFontes = rev.metaFontes != null ? rev.metaFontes : 75;
      var metaControles = rev.metaControles != null ? rev.metaControles : 75;

      var chipAltoGiro =
        '<span class="chip"><i class="ti ti-flame" aria-hidden="true"></i>Alto giro: ' +
          App.fmtNum(altoGiro.equipamentos) + " equip. · " +
          App.fmtNum(altoGiro.fontes) + " fontes · " +
          App.fmtNum(altoGiro.controles) + " controles</span>";

      var reversaHtml =
        '<div class="card">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Logística reversa</span>' +
              '<span class="subtitle">Devolução para a Claro - visão alto giro, meta de qualidade 75%</span>' +
            "</div>" +
            '<div class="card-header-action">' + chipAltoGiro + "</div>" +
          "</div>" +
          '<div class="rev-grid">' +
            '<div class="rev-item">' +
              '<span class="rev-item-label"><i class="ti ti-calendar-check" aria-hidden="true"></i>Aderência à calendarização</span>' +
              '<span class="rev-item-value">' + App.fmtPct(rev.aderenciaCalendario) + "</span>" +
              '<div class="score-bar"><div class="score-fill" style="width:' + (rev.aderenciaCalendario || 0) +
                "%; background:" + corPorNivel(rev.aderenciaCalendario || 0, 90) + ';"></div></div>' +
              '<span class="rev-item-sub">Devoluções realizadas no dia agendado</span>' +
            "</div>" +
            '<div class="rev-item">' +
              '<span class="rev-item-label"><i class="ti ti-package" aria-hidden="true"></i>Volume devolvido vs saldo no sistema</span>' +
              '<span class="rev-item-value">' + App.fmtNum(rev.volumeDevolvido) +
                ' <span class="text-muted" style="font-size:14px; font-weight:400;">de ' + App.fmtNum(rev.saldoSistema) + " (" + pctVolume + "%)</span></span>" +
              '<div class="score-bar"><div class="score-fill" style="width:' + Math.min(100, pctVolume) +
                "%; background:" + corPorNivel(pctVolume, 85) + ';"></div></div>' +
              '<span class="rev-item-sub">Diferença = equipamentos ainda não devolvidos</span>' +
            "</div>" +
            '<div class="rev-item">' +
              '<span class="rev-item-label"><i class="ti ti-plug" aria-hidden="true"></i>Fontes devolvidas <span class="' +
                ((rev.pctFontes || 0) >= metaFontes ? "delta-up" : "delta-down") + '" style="font-weight:600;">(meta ' + metaFontes + "%)</span></span>" +
              '<span class="rev-item-value" style="color:' + corPorNivel(rev.pctFontes || 0, metaFontes) + ';">' + App.fmtPct(rev.pctFontes) + "</span>" +
              barraMeta(rev.pctFontes || 0, metaFontes) +
              '<span class="rev-item-sub">% de fontes vs equipamentos devolvidos (reversa de qualidade)</span>' +
            "</div>" +
            '<div class="rev-item">' +
              '<span class="rev-item-label"><i class="ti ti-device-remote" aria-hidden="true"></i>Controles remotos devolvidos <span class="' +
                ((rev.pctControles || 0) >= metaControles ? "delta-up" : "delta-down") + '" style="font-weight:600;">(meta ' + metaControles + "%)</span></span>" +
              '<span class="rev-item-value" style="color:' + corPorNivel(rev.pctControles || 0, metaControles) + ';">' + App.fmtPct(rev.pctControles) + "</span>" +
              barraMeta(rev.pctControles || 0, metaControles) +
              '<span class="rev-item-sub">% de controles vs equipamentos devolvidos (reversa de qualidade)</span>' +
            "</div>" +
          "</div>" +
        "</div>";

      // -------------------------------------------------- Conformidade por processo (drill-down macro -> micro)
      var vistorias = epo.vistorias || [];
      var ultimaVistoria = vistorias.length ? vistorias[vistorias.length - 1] : null;

      var procHtml = "";
      if (ultimaVistoria && ultimaVistoria.secoes && ultimaVistoria.secoes.length) {
        var linhas = ultimaVistoria.secoes.map(function (sec) {
          var proc = App.processoById(sec.processoId);
          var icone = proc && proc.icone ? proc.icone : "ti-clipboard-check";
          var tierSec = App.tierOf(sec.pct);

          var itensOrdenados = (sec.itens || []).slice().sort(function (a, b) { return a.pct - b.pct; });
          var itensHtml = itensOrdenados.map(function (it, idx) {
            var ofensor = idx < 3
              ? '<span class="badge-ofensor"><i class="ti ti-alert-triangle" aria-hidden="true"></i>ofensor</span>'
              : "";
            var tierItem = App.tierOf(it.pct);
            return (
              '<div class="proc-item">' +
                '<span class="proc-item-q">' + esc(it.pergunta) + ofensor + "</span>" +
                '<div class="score-bar"><div class="score-fill tier-' + tierItem + '" style="width:' + it.pct + '%;"></div></div>' +
                '<span class="proc-item-pct">' + it.pct + "%</span>" +
              "</div>"
            );
          }).join("");

          return (
            '<div class="proc-acc">' +
              '<button class="proc-head" type="button" aria-expanded="false">' +
                '<span class="proc-head-icon"><i class="ti ' + icone + '" aria-hidden="true"></i></span>' +
                '<span class="proc-head-nome">' + esc(sec.nome) + "</span>" +
                '<div class="score-row">' +
                  '<div class="score-bar"><div class="score-fill tier-' + tierSec + '" style="width:' + sec.pct + '%;"></div></div>' +
                  '<span class="score-num">' + sec.pct + "%</span>" +
                "</div>" +
                '<i class="ti ti-chevron-down proc-caret" aria-hidden="true"></i>' +
              "</button>" +
              '<div class="proc-items">' + itensHtml + "</div>" +
            "</div>"
          );
        }).join("");

        procHtml =
          '<div class="card">' +
            '<div class="card-header">' +
              '<div class="section-title">' +
                '<span class="title">Conformidade por processo</span>' +
                '<span class="subtitle">Última vistoria (' + esc(ultimaVistoria.label) + ") - clique em um processo para ver os itens que mais ofenderam</span>" +
              "</div>" +
            "</div>" +
            '<div id="proc-list">' + linhas + "</div>" +
          "</div>";
      }

      // -------------------------------------------------- Gráfico de evolução
      var chartHtml =
        '<div class="card">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Evolução da pontuação</span>' +
              '<span class="subtitle">Últimos 6 meses</span>' +
            "</div>" +
          "</div>" +
          '<div class="chart-wrap"><canvas id="scoreChart" role="img" aria-label="Gráfico de linha da evolução da pontuação de ' +
            esc(epo.nome) + '"></canvas></div>' +
        "</div>";

      // -------------------------------------------------- Não conformidades
      var ordemGrav = { alta: 0, media: 1, baixa: 2 };
      var ncs = (epo.naoConformidades || []).slice().sort(function (a, b) {
        return (ordemGrav[a.gravidade] || 0) - (ordemGrav[b.gravidade] || 0);
      });

      var ncItens = ncs.map(function (nc) {
        var g = App.badgeGravidade(nc.gravidade);
        var thumb = nc.evidencia
          ? '<div class="nc-thumb"><div class="photo-ph sm"><i class="ti ti-photo" aria-hidden="true"></i></div></div>'
          : "";
        var fotoTag = nc.evidencia
          ? '<span class="evidence-tag"><i class="ti ti-camera" aria-hidden="true"></i>foto</span>'
          : "";
        return (
          '<div class="nc-item">' +
            thumb +
            '<div class="nc-body">' +
              '<div class="row wrap" style="gap:8px;">' +
                '<span class="badge ' + g.cls + '">' + g.label + "</span>" +
                '<span class="tag">' + esc(nc.processo) + "</span>" +
                fotoTag +
              "</div>" +
              '<div class="nc-item-title">' + esc(nc.item) + "</div>" +
              '<div class="muted">' + esc(nc.legenda) + "</div>" +
              '<div class="text-muted row" style="gap:6px;"><i class="ti ti-calendar" aria-hidden="true"></i>' + fmtData(nc.data) + "</div>" +
            "</div>" +
          "</div>"
        );
      }).join("");

      var ncBody = ncs.length
        ? '<div class="nc-list">' + ncItens + "</div>"
        : '<div class="empty"><i class="ti ti-circle-check" aria-hidden="true"></i>Nenhuma não conformidade registrada.</div>';

      var ncHtml =
        '<div class="card">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Não conformidades</span>' +
              '<span class="subtitle">Itens apontados na última auditoria</span>' +
            "</div>" +
            '<div class="card-header-action"><span class="chip">' + ncs.length + " registro" + (ncs.length === 1 ? "" : "s") + "</span></div>" +
          "</div>" +
          ncBody +
        "</div>";

      // Voltar para a tela de onde esta EPO foi aberta. O link fixo para o
      // ranking mandava para o lugar errado quem entrou pelo mapa ou pela lista.
      var TELAS_DE_ORIGEM = {
        "index": "Voltar à visão geral",
        "epos": "Voltar às EPOs",
        "ranking": "Voltar ao ranking",
        "comparar": "Voltar ao comparativo",
        "gerencial": "Voltar ao painel gerencial",
        "pendentes": "Voltar às auditorias pendentes"
      };

      function telaDeOrigem() {
        var padrao = { href: "ranking", rotulo: "Voltar ao ranking" };
        try {
          if (!document.referrer) return padrao;
          var u = new URL(document.referrer);
          if (u.origin !== location.origin) return padrao;
          var arq = u.pathname.split("/").pop() || "index";
          if (!TELAS_DE_ORIGEM[arq]) return padrao;
          return { href: arq + (u.search || ""), rotulo: TELAS_DE_ORIGEM[arq] };
        } catch (e) {
          return padrao;
        }
      }

      var volta = telaDeOrigem();

      // -------------------------------------------------- Render
      document.getElementById("page").innerHTML =
        '<a class="back-link" href="' + esc(volta.href) + '">' +
          '<i class="ti ti-arrow-left" aria-hidden="true"></i>' + esc(volta.rotulo) +
        "</a>" +
        '<div class="stack stack-lg">' +
          headerHtml +
          kpisHtml +
          cicloHtml +
          reversaHtml +
          procHtml +
          chartHtml +
          ncHtml +
        "</div>";

      // Accordion do drill-down por processo
      var procList = document.getElementById("proc-list");
      if (procList) {
        procList.addEventListener("click", function (ev) {
          var head = ev.target.closest(".proc-head");
          if (!head) return;
          var acc = head.closest(".proc-acc");
          var open = !acc.classList.contains("is-open");
          acc.classList.toggle("is-open", open);
          head.setAttribute("aria-expanded", open ? "true" : "false");
        });
      }

      // -------------------------------------------------- Chart.js
      var hist = epo.historico || [];
      if (window.Chart && hist.length) {
        Chart.defaults.font.family = cssVar("--font-base");
        Chart.defaults.color = cssVar("--text-2");

        var labels = hist.map(function (h) { return h.mes; });
        var dados = hist.map(function (h) { return h.score; });
        var cor = cssVar(tier === "ouro" ? "--ouro" : tier === "prata" ? "--prata" : "--bronze");
        var minY = Math.max(0, Math.min.apply(null, dados) - 6);
        var maxY = Math.min(100, Math.max.apply(null, dados) + 4);

        new Chart(document.getElementById("scoreChart"), {
          type: "line",
          data: {
            labels: labels,
            datasets: [{
              label: "Pontuação",
              data: dados,
              borderColor: cor,
              backgroundColor: hexToRgba(cor, 0.12),
              pointBackgroundColor: cor,
              pointBorderColor: cssVar("--surface"),
              pointBorderWidth: 2,
              pointRadius: 4,
              pointHoverRadius: 5,
              borderWidth: 2,
              tension: 0.35,
              fill: true
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { intersect: false, mode: "index" },
            scales: {
              y: {
                suggestedMin: minY,
                suggestedMax: maxY,
                ticks: { stepSize: 5 },
                grid: { color: cssVar("--border") },
                border: { display: false }
              },
              x: {
                grid: { display: false },
                border: { color: cssVar("--border") }
              }
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: cssVar("--text"),
                padding: 10,
                cornerRadius: 8,
                displayColors: false,
                callbacks: {
                  label: function (ctx) { return "Pontuação: " + ctx.parsed.y; }
                }
              }
            }
          }
        });
      }
    })();
  </script>
</body>
</html>
