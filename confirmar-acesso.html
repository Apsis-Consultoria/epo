<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Do que a pagina pode carregar. Sem isto qualquer endereco servia: script de
       fora, imagem de fora, chamada para fora. A lista abaixo e o que o sistema
       usa de verdade - a biblioteca do banco, o grafico, o mapa, as fontes, o
       captcha e o proprio projeto. O resto o navegador recusa.
       'unsafe-inline' segue necessario: as telas tem script e estilo escritos
       dentro do HTML. Tirar isso e reescrever as 21 telas, e fica para depois.
       frame-ancestors nao entra aqui: em <meta> o navegador ignora essa regra,
       ela so vale em cabecalho, e o servidor de paginas nao deixa mandar um. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://challenges.cloudflare.com;
    style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;
    img-src 'self' data: blob: https://vpkxoyfbxgnizymaurek.supabase.co https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://server.arcgisonline.com;
    connect-src 'self' https://vpkxoyfbxgnizymaurek.supabase.co https://challenges.cloudflare.com https://viacep.com.br https://nominatim.openstreetmap.org;
    frame-src https://challenges.cloudflare.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests;
  ">
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon-claro.svg?v=135">
  <!-- Reserva: o Safari nao usa favicon em SVG. -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png?v=135">
  <link rel="apple-touch-icon" href="assets/brand/favicon-180.png?v=135">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Confirmar acesso - Auditoria EPO's</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/carregando.css?v=135">
  <link rel="stylesheet" href="assets/portal.css?v=135" />
  <style>
    /* Esta tela carrega o Tailwind, e nao a folha do painel: os neutros da
       Claro vem escritos aqui - apoio #525252, secundario #767676, borda
       #DBDBDB - junto com o cartao (raio 12px, sombra 0 4px 8px) e o botao e o
       campo em capsula, que sao a forma da marca. */
    body { font-family: 'Roboto', system-ui, 'Segoe UI', Arial, sans-serif; color: #1F1D1D; }
    *, ::before, ::after { border-color: #DBDBDB; }
    .cartao { border-radius: 12px; box-shadow: 0 4px 8px rgba(31, 29, 29, .16); }
    .acao { border-radius: 500px; font-weight: 500; }
    .campo { border-radius: 500px; border: 1.5px solid #DBDBDB; color: #1F1D1D; }
    .campo:focus { outline: none; border-color: #DA291C; }
    .apoio { color: #525252; }
    .fraco { color: #767676; }
  </style>
</head>
<body>
  <div class="tela-carregando no-escuro" id="tela-carregando" role="status" aria-label="Carregando">
    <span class="claro-loader" aria-hidden="true"></span>
  </div>
  <div class="relative min-h-screen bg-[#1F1D1D] overflow-hidden" style="font-family: Roboto, 'Segoe UI', sans-serif;">
    <img src="assets/brand/login-2.png" alt="" aria-hidden="true" onerror="this.style.display='none'"
      class="absolute inset-0 w-full h-full object-cover opacity-60" />
    <div class="absolute inset-0" style="background: linear-gradient(to top, rgba(31,29,29,.94), rgba(31,29,29,.65), rgba(31,29,29,.85));"></div>

    <div class="relative z-10 min-h-screen flex items-center justify-center px-5 py-10">
      <div class="cartao w-full max-w-md bg-white px-7 py-8">
        <img src="assets/brand/logo-claro.png" alt="Claro" onerror="this.style.display='none'"
          class="object-contain mx-auto mb-5" style="width:148px; height:auto;" />

        <h1 class="text-xl font-bold text-center" style="color: rgb(218,41,28); font-family: Roboto, 'Segoe UI', Arial, sans-serif;">
          Confirme o seu acesso
        </h1>
        <p id="destino" class="apoio text-sm text-center mt-1 mb-6">Preparando o envio do código...</p>

        <!-- Campo do código -->
        <div id="form-codigo" class="hidden">
          <label class="apoio block text-left text-xs font-medium mb-1" for="codigo">
            Código de seis dígitos
          </label>
          <input id="codigo" type="text" inputmode="numeric" autocomplete="one-time-code"
            maxlength="7" placeholder="000000"
            class="campo w-full py-3 px-5 text-center"
            style="font-size:26px; font-weight:500; letter-spacing:.32em;" />

          <button id="btn-confirmar" class="acao w-full mt-5 py-3.5 px-6 text-white transition-colors disabled:opacity-60"
            style="background: rgb(218,41,28);">
            Confirmar e entrar
          </button>

          <div class="flex items-center justify-between mt-4">
            <button id="btn-reenviar" class="text-xs font-medium underline disabled:opacity-50"
              style="color: rgb(218,41,28); background:none; border:0; padding:0; cursor:pointer;">
              Enviar outro código
            </button>
            <button id="btn-sair" class="fraco text-xs underline"
              style="background:none; border:0; padding:0; cursor:pointer;">
              Entrar com outra conta
            </button>
          </div>

          <p class="fraco text-xs mt-5 leading-relaxed">
            O código vale por 10 minutos e serve para uma entrada só. Ninguém da APSIS vai pedir
            este código por telefone, e-mail ou mensagem.
          </p>
        </div>

        <!-- Não foi possível enviar -->
        <div id="sem-envio" class="hidden text-center">
          <p id="sem-envio-txt" class="apoio text-sm leading-relaxed"></p>
          <button id="btn-tentar" class="inline-block mt-5 text-sm font-medium underline"
            style="color: rgb(218,41,28); background:none; border:0; padding:0; cursor:pointer;">
            Tentar enviar de novo
          </button>
          <p class="mt-4">
            <button id="btn-sair-2" class="fraco text-xs underline"
              style="background:none; border:0; padding:0; cursor:pointer;">
              Voltar para a entrada
            </button>
          </p>
        </div>

        <p id="msg" class="text-xs text-center mt-4 hidden"></p>
      </div>
    </div>
  </div>

  <script src="assets/supabase-config.js?v=135"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
          integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/auth.js?v=135"></script>
  <script>
    (function () {
      "use strict";
      var $ = function (id) { return document.getElementById(id); };

      function msg(texto, erro) {
        var el = $("msg");
        el.textContent = texto || "";
        if (!texto) { el.classList.add("hidden"); return; }
        el.classList.remove("hidden");
        el.style.color = erro ? "#DA291C" : "#006B4F";
      }

      function falhaNoEnvio(texto) {
        $("form-codigo").classList.add("hidden");
        $("sem-envio").classList.remove("hidden");
        $("sem-envio-txt").textContent = texto;
        $("destino").textContent = "";
      }

      if (!(window.Auth && Auth.pronto)) {
        falhaNoEnvio("Não foi possível falar com o sistema agora. Atualize a página em alguns instantes.");
        return;
      }

      // Quem chega aqui sem sessao ou sem precisar de codigo nao tem o que
      // fazer nesta tela: volta para onde deveria estar.
      function situacaoInicial() {
        return Auth.sessao().then(function (s) {
          if (!s) { location.replace("login"); return null; }
          return Auth.mfaSituacao().then(function (m) {
            if (!m || !m.precisa) {
              // Codigo nao e mais necessario (ja confirmado nesta sessao): segue
              // para a tela da pessoa em vez de passar pela visao geral.
              Auth.telaInicial().then(function (d) { location.replace(d); },
                                     function () { location.replace("index"); });
              return null;
            }
            return s;
          });
        });
      }

      var enviando = false;

      function pedirCodigo(primeiraVez) {
        if (enviando) return;
        enviando = true;
        $("btn-reenviar").disabled = true;
        if (!primeiraVez) msg("Enviando...");

        Auth.mfaEnviarCodigo().then(function (d) {
          enviando = false;
          $("form-codigo").classList.remove("hidden");
          $("sem-envio").classList.add("hidden");
          $("destino").textContent = d.para
            ? "Enviamos um código para " + d.para
            : "Enviamos um código para o seu e-mail";
          msg(primeiraVez ? "" : "Código novo enviado.");
          $("codigo").value = "";
          $("codigo").focus();
          // Freio simples contra clique repetido: o servidor tambem limita.
          setTimeout(function () { $("btn-reenviar").disabled = false; }, 30000);
        }).catch(function (e) {
          enviando = false;
          $("btn-reenviar").disabled = false;
          var texto = (e && e.message) ||
            "Não foi possível enviar o código agora. Tente de novo em alguns instantes.";
          if (primeiraVez) falhaNoEnvio(texto);
          else msg(texto, true);
        });
      }

      function confirmar() {
        var codigo = ($("codigo").value || "").replace(/[^0-9]/g, "");
        if (codigo.length < 6) {
          msg("Digite os seis dígitos que chegaram no seu e-mail.", true);
          return;
        }
        var btn = $("btn-confirmar");
        btn.disabled = true;
        btn.textContent = "Confirmando...";

        Auth.mfaConfirmar(codigo).then(function (r) {
          if (r && r.ok) {
            msg("Acesso confirmado. Entrando...");
            setTimeout(function () {
              Auth.telaInicial().then(function (d) { location.replace(d); },
                                     function () { location.replace("index"); });
            }, 600);
            return;
          }
          btn.disabled = false;
          btn.textContent = "Confirmar e entrar";
          msg((r && r.motivo) || "Não foi possível confirmar agora.", true);
          $("codigo").select();
        }).catch(function () {
          btn.disabled = false;
          btn.textContent = "Confirmar e entrar";
          msg("Não foi possível confirmar agora. Tente de novo.", true);
        });
      }

      $("btn-confirmar").addEventListener("click", confirmar);
      $("btn-reenviar").addEventListener("click", function () { pedirCodigo(false); });
      $("btn-tentar").addEventListener("click", function () { pedirCodigo(true); });
      $("btn-sair").addEventListener("click", function () { Auth.sair(); });
      // Este botao ENCERRA a sessao antes de voltar. Como link simples ele
      // devolvia para a entrada com a sessao de pe, e a entrada mandava para
      // dentro outra vez: quem caia aqui sem conseguir receber o codigo nao tinha
      // saida nenhuma.
      $("btn-sair-2").addEventListener("click", function () { Auth.sair(); });

      $("codigo").addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") confirmar();
      });
      // Só dígitos, e confirma sozinho quando os seis chegam (inclusive colando).
      $("codigo").addEventListener("input", function () {
        var limpo = this.value.replace(/[^0-9]/g, "").slice(0, 6);
        if (limpo !== this.value) this.value = limpo;
        if (limpo.length === 6) confirmar();
      });

      situacaoInicial().then(function (s) {
        if (s) pedirCodigo(true);
      }).catch(function () {
        falhaNoEnvio("Não foi possível confirmar o seu acesso agora. Atualize a página em alguns instantes.");
      });
    })();
  </script>
</body>
</html>
