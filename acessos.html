<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Do que a pagina pode carregar. Sem isto qualquer endereco servia: script de
       fora, imagem de fora, chamada para fora. A lista abaixo e o que o sistema
       usa de verdade - a biblioteca do banco, o grafico, o mapa, as fontes, o
       captcha e o proprio projeto. O resto o navegador recusa.
       'unsafe-inline' segue necessario: as telas tem script e estilo escritos
       dentro do HTML. Tirar isso e reescrever as 21 telas, e fica para depois.
       frame-ancestors nao entra aqui: em <meta> o navegador ignora essa regra,
       ela so vale em cabecalho, e o servidor de paginas nao deixa mandar um. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://challenges.cloudflare.com;
    style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;
    img-src 'self' data: blob: https://vpkxoyfbxgnizymaurek.supabase.co https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://server.arcgisonline.com;
    connect-src 'self' https://vpkxoyfbxgnizymaurek.supabase.co https://challenges.cloudflare.com https://viacep.com.br https://nominatim.openstreetmap.org;
    frame-src https://challenges.cloudflare.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests;
  ">
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon-claro.svg?v=127">
  <!-- Reserva: o Safari nao usa favicon em SVG. -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png?v=127">
  <link rel="apple-touch-icon" href="assets/brand/favicon-180.png?v=127">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <title>Gerenciamento de acessos - Auditoria de EPOs</title>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/fonts/tabler-icons.woff2?v3.11.0">
  <link rel="stylesheet" href="assets/icones.css?v=127">
  <link rel="stylesheet" href="assets/carregando.css?v=127">
  <link rel="stylesheet" href="assets/app.css?v=127">
  <style>
    /* ---------------- Matriz de telas por cargo ---------------- */
    /* A caixa rola por dentro, e nao junto com a pagina. Sem isto o cabecalho
       era "sticky" mas nunca colava: sticky cola dentro do que ROLA, e o que
       rolava era a pagina inteira - a caixa ia embora com ela, levando os nomes
       dos cargos. Com 21 linhas, quem chegava no fim da tabela estava marcando
       caixinha sem ver de qual cargo era a coluna.

       No celular a tabela deixa de ser tabela (cada tela vira um cartao), e ai
       a altura maxima e removida: cortaria os cartoes. */
    .matrix-wrap {
      width: 100%;
      overflow: auto;
      max-height: 70vh;
      border-top: 1px solid var(--border);
    }
    .matrix { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
    .matrix thead th {
      position: sticky; top: 0; z-index: 3;
      background: var(--surface-2);
      text-align: center;
      font-size: 12px; font-weight: 500; color: var(--text-2);
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      /* Com border-collapse separate a borda de baixo rola junto e o cabecalho
         encosta nas linhas sem separacao. A sombra faz o corte. */
      box-shadow: 0 1px 0 var(--border);
    }
    /* A tela agora fica na linha e o cargo na coluna. São 16 telas e 5 cargos:
       no sentido anterior a tabela tinha 16 colunas e escondia o nome de quase
       todas atrás da rolagem lateral. Assim ela cresce para baixo, que é o lado
       em que a página já rola. */
    .matrix thead th.col-tela { text-align: left; left: 0; z-index: 4; min-width: 240px; }
    /* O nome do cargo pode quebrar em duas linhas. Preso numa linha so
       ("Equipe de Campo Apsis"), a tabela voltava a ter rolagem lateral - que
       era justamente o que se queria tirar. */
    .matrix thead th.col-cargo-h { min-width: 112px; white-space: normal; }
    .col-nota {
      display: block; font-size: 10.5px; font-weight: 400;
      color: var(--text-muted); text-transform: none; letter-spacing: 0;
    }
    .matrix tbody td {
      padding: 11px 8px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
      text-align: center;
      background: var(--surface);
    }
    .matrix tbody tr:last-child td { border-bottom: 0; }
    .matrix tbody td.col-tela { position: sticky; left: 0; z-index: 2; text-align: left; }
    .matrix tbody tr:hover td { background: var(--surface-2); }

    .tela-cel b { display: block; font-size: 13.5px; font-weight: 600; color: var(--text); }
    /* Como se chega até a tela. Em cinza porque é apoio, não o nome dela. */
    .tela-cel span { display: block; font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }

    .matrix tbody tr.linha-grupo td {
      background: var(--surface-2);
      font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
      color: var(--text-2); text-align: left; padding: 7px 10px;
      position: sticky; left: 0;
    }
    .matrix tbody tr.linha-grupo:hover td { background: var(--surface-2); }

    /* Caixa da matriz: 18px, na cor da marca quando marcada */
    .acc-check {
      appearance: none; -webkit-appearance: none;
      width: 18px; height: 18px; margin: 0;
      border: 1.5px solid var(--border-strong);
      border-radius: 4px;
      background: var(--surface);
      cursor: pointer;
      display: inline-block; vertical-align: middle; position: relative;
      transition: background .12s ease, border-color .12s ease;
    }
    .acc-check:hover:not(:disabled) { border-color: var(--primary); }
    .acc-check:checked { background: var(--primary); border-color: var(--primary); }
    .acc-check:checked::after {
      content: "";
      position: absolute; left: 5px; top: 1.5px;
      width: 5px; height: 9px;
      border: solid #fff; border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .acc-check:disabled { cursor: not-allowed; opacity: .75; }
    .acc-check:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--primary-tint); }

    .matriz-rodape {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      flex-wrap: wrap;
      padding: 12px 18px; border-top: 1px solid var(--border);
      font-size: 12.5px; color: var(--text-2);
    }

    /* ---------------- Lista de acessos ---------------- */
    .acc-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 18px; border-bottom: 1px solid var(--border); }
    .acc-search { position: relative; flex: 1 1 260px; max-width: 360px; }
    .acc-search i {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      font-size: 16px; color: var(--text-muted); pointer-events: none;
    }
    .acc-search .input { padding-left: 34px; }
    .acc-count { font-size: 13px; color: var(--text-2); }

    .pessoa-cel b { display: block; font-size: 13.5px; font-weight: 600; color: var(--text); }
    .pessoa-cel span { font-size: 12px; color: var(--text-2); }

    /* Uma linha so. Com quebra, "Desativar" caia para a segunda linha e os
       botoes da mesma pessoa apareciam em alturas diferentes. */
    .acc-acoes { display: flex; gap: 6px; flex-wrap: nowrap; justify-content: flex-end;
      margin-left: auto; }
    .acc-acoes .btn { white-space: nowrap; }
    .btn-apagar { color: var(--danger); }
    .btn-apagar:hover { background: var(--danger-bg); color: var(--danger); }
    @media (max-width: 1100px) {
      /* Sem espaco para os rotulos, todos viram icone: continua uma linha. */
      .acc-acoes .btn .btn-txt { display: none; }
    }

    .modal.modal-acesso { max-width: 520px; }

    .nota-acesso {
      display: flex; gap: 9px; align-items: flex-start;
      font-size: 12.5px; color: var(--text-2); line-height: 1.55;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px; margin-top: 6px;
    }
    .nota-acesso i { font-size: 16px; margin-top: 1px; color: var(--primary); flex: none; }

    .is-hidden { display: none !important; }

    @media (max-width: 900px) {
      .matrix thead th.col-tela { min-width: 200px; }
      .matrix thead th.col-cargo-h { min-width: 108px; }
    }

    /* Celular: nao ha largura para 5 colunas de cargo mais o nome da tela.
       Cada TELA passa a ser um cartao, e cada cargo uma linha com o nome ao
       lado da caixa - o nome era exatamente o que a rolagem escondia. */
    @media (max-width: 820px) {
      .matrix-wrap { overflow: visible; border-top: 0; max-height: none; }
      .matrix { display: block; width: 100%; }
      .matrix thead { display: none; }
      .matrix tbody { display: block; }
      .matrix tbody tr {
        display: block;
        border: 1.5px solid var(--border); border-radius: var(--radius-sm);
        background: var(--surface); padding: 12px 14px; margin-bottom: 12px;
      }
      .matrix tbody tr:hover td { background: transparent; }
      .matrix tbody td {
        display: flex; align-items: center; gap: 10px;
        position: static; border: 0; padding: 7px 0; min-height: 34px;
        text-align: left; width: auto; background: transparent;
      }
      .matrix tbody td::after {
        content: attr(data-cargo-nome);
        font-size: 13px; color: var(--text-2);
      }
      .matrix tbody td.col-tela {
        display: block; padding: 0 0 9px; margin-bottom: 6px;
        border-bottom: 1px solid var(--border); min-height: 0;
      }
      .matrix tbody td.col-tela::after { content: none; }
      /* O grupo vira um titulo solto entre os cartoes, sem moldura. */
      .matrix tbody tr.linha-grupo {
        border: 0; background: transparent; padding: 4px 0 2px; margin-bottom: 0;
      }
      .matrix tbody tr.linha-grupo td { display: block; padding: 0; }
      .matrix tbody tr.linha-grupo td::after { content: none; }
    }
  </style>
</head>
<body>
  <div class="tela-carregando" id="tela-carregando" role="status" aria-label="Carregando">
    <span class="claro-loader" aria-hidden="true"></span>
  </div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <script src="assets/data.js?v=127"></script>
  <script src="assets/app.js?v=127"></script>
  <script src="assets/supabase-config.js?v=127"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
          integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/auth.js?v=127"></script>
  <script>
    (function () {
      "use strict";

      var acoes =
        '<button class="btn btn-primary btn-sm is-hidden" id="btn-liberar" type="button">' +
          '<i class="ti ti-user-plus" aria-hidden="true"></i>Liberar acesso' +
        "</button>";

      Layout.mount("acessos", "Gerenciamento de acessos", acoes);

      var esc = App.escapeHtml;
      var DEMO = (window.Auth && Auth.modoDemo()) || !(window.Auth && Auth.pronto);

      var PAPEL_LABEL = {
        admin: "Admin Apsis",
        gestor: "Coordenação Apsis",
        auditor: "Equipe de Campo Apsis",
        cliente: "Gerencia Claro",
        responsavel: "Responsável pela EPO",
        sem_acesso: "Sem acesso liberado"
      };
      var BADGE_PAPEL = {
        admin: "badge-ouro", gestor: "badge-success", auditor: "badge-media",
        cliente: "badge-alta", responsavel: "badge-baixa", sem_acesso: "badge-danger"
      };

      // Cargos que a matriz controla. Administrador aparece travado: ele
      // alcança tudo por definição, e é por ele que se conserta um engano.
      var CARGOS = ["gestor", "auditor", "cliente", "responsavel"];

      // A matriz é montada sobre TODAS as telas guardadas do sistema, e não
      // sobre a lista do menu lateral: tela que existe e não está no menu
      // (o detalhe da EPO, o preenchimento do questionário) ficava fora, e
      // quem liberava um cargo não via essas telas em lugar nenhum.
      var telas = (window.APP && window.APP.telasSistema) || [];
      var presets = (window.APP && window.APP.papeisPreset) || {};

      // Ordem das colunas: quem alcança mais primeiro.
      var COLUNAS = ["admin", "gestor", "auditor", "cliente", "responsavel"];

      var permissoes = {};      // papel -> tela -> bool
      var mexidas = {};         // papel|tela -> bool, só o que mudou
      var liberados = [];
      var contas = [];
      var meuPapel = DEMO ? "admin" : "";
      var busca = "";
      var carregando = true;
      var falha = "";
      var editandoId = null;

      // ------------------------------------------------------------------
      // Estrutura
      // ------------------------------------------------------------------
      var htmlColunas = COLUNAS.map(function (c) {
        return '<th class="col-cargo-h">' + esc(PAPEL_LABEL[c]) +
          (c === "admin" ? '<span class="col-nota">alcança tudo</span>' : "") + "</th>";
      }).join("");

      document.getElementById("page").innerHTML =
        '<div class="card">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Telas por cargo</span>' +
              '<span class="subtitle" id="sub-matriz"></span>' +
            "</div>" +
          "</div>" +
          '<div class="matrix-wrap"><table class="matrix">' +
            '<thead><tr><th class="col-tela">Tela</th>' + htmlColunas + "</tr></thead>" +
            '<tbody id="matriz-corpo"></tbody>' +
          "</table></div>" +
          '<div class="matriz-rodape">' +
            '<span id="matriz-aviso"></span>' +
            '<span>' +
              '<button class="btn btn-ghost btn-sm is-hidden" type="button" id="btn-desfazer">Desfazer</button> ' +
              '<button class="btn btn-primary btn-sm is-hidden" type="button" id="btn-salvar-matriz">' +
                '<i class="ti ti-device-floppy" aria-hidden="true"></i>Salvar alterações</button>' +
            "</span>" +
          "</div>" +
        "</div>" +

        '<div class="card">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Acessos liberados</span>' +
            "</div>" +
            '<span class="acc-count" id="conta-liberados"></span>' +
          "</div>" +
          '<div class="acc-toolbar">' +
            '<div class="acc-search">' +
              '<i class="ti ti-search" aria-hidden="true"></i>' +
              '<input class="input" id="busca" type="search" autocomplete="off"' +
                ' placeholder="Filtrar por nome ou e-mail" aria-label="Filtrar por nome ou e-mail">' +
            "</div>" +
          "</div>" +
          '<div id="lista"></div>' +
        "</div>" +

        '<div class="card mb-0 is-hidden" id="card-contas">' +
          '<div class="card-header">' +
            '<div class="section-title">' +
              '<span class="title">Contas de acesso</span>' +
            "</div>" +
            '<span class="acc-count" id="conta-contas"></span>' +
          "</div>" +
          '<div id="lista-contas"></div>' +
        "</div>" +

        '<div class="modal-overlay" id="mod" role="dialog" aria-modal="true" aria-labelledby="mod-titulo">' +
          '<div class="modal modal-acesso">' +
            '<div class="modal-header">' +
              '<h2 class="modal-title" id="mod-titulo">Liberar acesso</h2>' +
              '<button class="modal-close" id="mod-fechar" type="button" aria-label="Fechar">' +
                '<i class="ti ti-x" aria-hidden="true"></i></button>' +
            "</div>" +
            '<div class="modal-body">' +
              '<div class="field">' +
                '<label for="f-email">E-mail</label>' +
                '<input class="input" id="f-email" type="email" autocomplete="off"' +
                  ' placeholder="o e-mail que a pessoa vai usar para entrar">' +
                '<span class="hint">Precisa ser o mesmo e-mail da conta dela.</span>' +
              "</div>" +
              '<div class="field">' +
                '<label for="f-nome">Nome</label>' +
                '<input class="input" id="f-nome" type="text" autocomplete="off"' +
                  ' placeholder="para você reconhecer na lista">' +
              "</div>" +
              '<div class="field">' +
                '<label for="f-papel">O que essa pessoa é</label>' +
                '<select class="select" id="f-papel"></select>' +
              "</div>" +
              '<div class="nota-acesso">' +
                '<i class="ti ti-info-circle" aria-hidden="true"></i>' +
                "<span>Ao liberar, a pessoa recebe um aviso por e-mail. Para entrar, ela pede " +
                "um código na tela de entrada e o código chega nesse mesmo e-mail. Não há senha.</span>" +
              "</div>" +
            "</div>" +
            '<div class="modal-footer">' +
              '<button class="btn btn-ghost" type="button" id="mod-cancelar">Cancelar</button>' +
              '<button class="btn btn-primary" type="button" id="mod-salvar">Liberar acesso</button>' +
            "</div>" +
          "</div>" +
        "</div>";

      var $ = function (id) { return document.getElementById(id); };

      // ------------------------------------------------------------------
      // Sem conexão
      // ------------------------------------------------------------------
      // Sem conexao a lista abre vazia. Antes nasciam aqui duas pessoas
      // inventadas: nome de gente em tela de acesso parece acesso de verdade,
      // e foi lido como tal.
      function catalogoSemConexao() { return []; }

      function permissoesDoPadrao() {
        var out = {};
        CARGOS.forEach(function (c) {
          out[c] = {};
          telas.forEach(function (t) {
            out[c][t.key] = !!(presets[c] && presets[c][t.key]);
          });
        });
        return out;
      }

      // Os cinco papeis do sistema, na ordem de sempre. A lista mostrava so
      // dois: quem precisava liberar administracao ou responsavel da EPO nao
      // tinha por onde.
      // Coordenacao e administracao continuam sendo escolha de administrador,
      // senao um coordenador criaria outro, e qualquer um criaria um
      // administrador. Para quem nao e administrador eles aparecem travados,
      // e nao escondidos: assim se ve que existem e de quem depende.
      function papeisQuePodeLiberar() {
        var todos = ["admin", "gestor", "auditor", "cliente", "responsavel"];
        return todos.map(function (v) {
          var soAdmin = (v === "admin" || v === "gestor");
          return { v: v, t: PAPEL_LABEL[v], travado: soAdmin && meuPapel !== "admin" };
        });
      }

      function souAdmin() { return meuPapel === "admin"; }

      // ------------------------------------------------------------------
      // Leitura
      // ------------------------------------------------------------------
      function descobrirPapel() {
        if (DEMO) { meuPapel = (Auth.papelDemo && Auth.papelDemo()) || "admin"; return Promise.resolve(); }
        return Auth.perfil().then(function (p) {
          meuPapel = (p && p.papel) || "";
        }).catch(function () { meuPapel = ""; });
      }

      // Uma tela nova entra em três lugares: nesta lista, no guard e na regra
      // do banco. Se um deles ficar atrás, a matriz deixa de valer para aquela
      // tela em silêncio - foi o que aconteceu com o detalhe da EPO. Esta
      // conferência compara os dois lados e avisa na própria tela.
      var descompasso = "";
      function conferirLista(dados) {
        var naLista = {}, noBanco = {};
        telas.forEach(function (t) { naLista[t.key] = true; });
        dados.forEach(function (x) { noBanco[x.tela] = true; });
        var soNoBanco = Object.keys(noBanco).filter(function (k) { return !naLista[k]; });
        var soNaLista = Object.keys(naLista).filter(function (k) { return !noBanco[k]; });
        var partes = [];
        if (soNoBanco.length) partes.push("o servidor guarda permissão para " + soNoBanco.join(", "));
        if (soNaLista.length) partes.push("ainda não há permissão guardada para " + soNaLista.join(", "));
        descompasso = partes.length
          ? "Confira o cadastro de telas: " + partes.join("; ") + "."
          : "";
      }

      function carregar() {
        carregando = true; falha = "";
        mexidas = {};
        if (DEMO) {
          permissoes = permissoesDoPadrao();
          liberados = catalogoSemConexao();
          contas = [];
          carregando = false;
          return Promise.resolve();
        }
        var db = Auth.cliente;
        return db.from("permissoes_papel").select("papel, tela, permitido")
          .then(function (r) {
            // Sem a tabela, a matriz mostra o padrão escrito no sistema. É o
            // mesmo que o menu usa como reserva: as duas pontas concordam.
            permissoes = permissoesDoPadrao();
            if (!r.error && r.data) {
              r.data.forEach(function (x) {
                if (!permissoes[x.papel]) permissoes[x.papel] = {};
                permissoes[x.papel][x.tela] = !!x.permitido;
              });
              conferirLista(r.data);
            }
            return db.from("acessos_autorizados")
              .select("id, email, nome, papel, ativo, observacao, " +
                      "convidado_em, primeiro_acesso_em, criado_em")
              .order("criado_em", { ascending: false });
          })
          .then(function (r) {
            if (!r || r.error) {
              throw new Error((r && r.error && r.error.message) || "falha ao ler os acessos");
            }
            liberados = r.data || [];
            return db.from("perfis").select("user_id, nome, papel").order("papel");
          })
          .then(function (r) {
            contas = (r && !r.error && r.data) ? r.data : [];
            carregando = false;
          });
      }

      // ------------------------------------------------------------------
      // Matriz
      // ------------------------------------------------------------------
      function render() {
        renderMatriz();
        renderLista();
        renderContas();
        $("btn-liberar").classList.toggle("is-hidden",
          !(meuPapel === "admin" || meuPapel === "gestor"));
      }

      function valorAtual(papel, tela) {
        var chave = papel + "|" + tela;
        if (mexidas.hasOwnProperty(chave)) return mexidas[chave];
        return !!(permissoes[papel] && permissoes[papel][tela]);
      }

      function renderMatriz() {
        // O unico texto que fica: sem ele, a matriz travada nao se explica.
        $("sub-matriz").textContent = souAdmin() ? "" : "Somente o administrador altera esta matriz.";

        var colunas = COLUNAS.length + 1;

        if (carregando) {
          $("matriz-corpo").innerHTML =
            '<tr><td class="col-tela" colspan="' + colunas + '">Carregando...</td></tr>';
          return;
        }

        var linhas = [];
        var grupoAtual = "";

        telas.forEach(function (t) {
          if (t.grupo !== grupoAtual) {
            grupoAtual = t.grupo;
            linhas.push('<tr class="linha-grupo"><td colspan="' + colunas + '">' +
              esc(grupoAtual) + "</td></tr>");
          }

          // "onde" existe porque metade destas telas não está no menu: sem
          // isso, liberar ou tirar uma tela é decidir no escuro.
          var celTela = '<td class="col-tela"><div class="tela-cel"><b>' + esc(t.label) + "</b>" +
            '<span>' + esc(t.onde) + "</span></div></td>";

          var celulas = COLUNAS.map(function (c) {
            // Administrador entra travado, para a matriz não parecer incompleta
            // e para deixar claro que é por ele que se conserta um engano.
            if (c === "admin") {
              return '<td data-cargo-nome="' + esc(PAPEL_LABEL.admin) + '">' +
                '<input type="checkbox" class="acc-check" checked disabled' +
                ' aria-label="' + esc(PAPEL_LABEL.admin + ", " + t.label + ", sempre liberado") + '">' +
                "</td>";
            }
            return '<td data-cargo-nome="' + esc(PAPEL_LABEL[c]) + '">' +
              '<input type="checkbox" class="acc-check" data-papel="' + c + '"' +
              ' data-tela="' + esc(t.key) + '"' + (valorAtual(c, t.key) ? " checked" : "") +
              (souAdmin() ? "" : " disabled") +
              ' aria-label="' + esc(PAPEL_LABEL[c] + ", " + t.label) + '">' +
              "</td>";
          }).join("");

          linhas.push("<tr>" + celTela + celulas + "</tr>");
        });

        $("matriz-corpo").innerHTML = linhas.join("");
        atualizarRodapeMatriz();
      }

      function atualizarRodapeMatriz() {
        var n = Object.keys(mexidas).length;
        $("btn-salvar-matriz").classList.toggle("is-hidden", n === 0);
        $("btn-desfazer").classList.toggle("is-hidden", n === 0);
        $("matriz-aviso").textContent = n === 0
          ? descompasso
          : n + (n === 1 ? " mudança ainda não salva." : " mudanças ainda não salvas.");
      }

      function salvarMatriz() {
        var chaves = Object.keys(mexidas);
        if (!chaves.length) return;

        var btn = $("btn-salvar-matriz");
        btn.disabled = true;

        if (DEMO) {
          App.toast("Sem conexão com os dados agora: nada foi gravado.");
          btn.disabled = false;
          return;
        }

        var linhas = chaves.map(function (k) {
          var partes = k.split("|");
          return { papel: partes[0], tela: partes[1], permitido: mexidas[k] };
        });

        Auth.cliente.from("permissoes_papel")
          .upsert(linhas, { onConflict: "papel,tela" }).select("papel")
          .then(function (r) {
            btn.disabled = false;
            if (r.error) {
              App.toast(r.error.message || "Não foi possível salvar agora.");
              return;
            }
            if (!r.data || !r.data.length) {
              App.toast("Somente o administrador altera as telas por cargo.");
              return;
            }
            App.toast(linhas.length + (linhas.length === 1 ? " mudança salva." : " mudanças salvas.") +
              " Quem estiver com a tela aberta vê a diferença no próximo carregamento.");
            return carregar().then(render);
          })
          .catch(function () {
            btn.disabled = false;
            App.toast("Não foi possível salvar agora. Tente novamente.");
          });
      }

      $("matriz-corpo").addEventListener("change", function (ev) {
        var el = ev.target;
        if (!el || !el.getAttribute || !el.getAttribute("data-papel")) return;
        var papel = el.getAttribute("data-papel");
        var tela = el.getAttribute("data-tela");
        var chave = papel + "|" + tela;
        var original = !!(permissoes[papel] && permissoes[papel][tela]);
        if (el.checked === original) delete mexidas[chave];
        else mexidas[chave] = el.checked;
        atualizarRodapeMatriz();
      });

      $("btn-salvar-matriz").addEventListener("click", salvarMatriz);
      $("btn-desfazer").addEventListener("click", function () {
        mexidas = {};
        renderMatriz();
      });

      // ------------------------------------------------------------------
      // Lista de acessos
      // ------------------------------------------------------------------
      function situacao(a) {
        if (!a.ativo) return '<span class="badge badge-baixa">Desativado</span>';
        if (a.primeiro_acesso_em) {
          return '<span class="badge badge-success">Já entrou</span>' +
            '<span class="muted" style="display:block;font-size:11.5px;">' +
            esc(fmtQuando(a.primeiro_acesso_em)) + "</span>";
        }
        if (a.convidado_em) {
          return '<span class="badge badge-media">Convidado</span>' +
            '<span class="muted" style="display:block;font-size:11.5px;">' +
            esc(fmtQuando(a.convidado_em)) + "</span>";
        }
        // Liberar acesso ja envia o e-mail. Se convidado_em esta vazio, o envio
        // falhou: dizer "ainda nao convidado" faria parecer passo pendente de
        // alguem, quando o que falta e tentar de novo.
        return '<span class="badge badge-danger">Convite não saiu</span>';
      }

      function fmtQuando(iso) {
        if (!iso) return "";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        function p(n) { return (n < 10 ? "0" : "") + n; }
        return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() +
               " às " + p(d.getHours()) + "h" + p(d.getMinutes());
      }

      function visiveis() {
        var q = busca.toLowerCase();
        if (!q) return liberados;
        return liberados.filter(function (a) {
          return ((a.nome || "") + " " + (a.email || "")).toLowerCase().indexOf(q) >= 0;
        });
      }

      // O rotulo vai num <span> proprio para o CSS poder esconde-lo em tela
      // estreita sem perder o botao: o title e o aria-label ficam sempre, entao
      // o botao continua com nome para quem usa leitor de tela.
      function botao(acao, id, rotulo, classe, icone, titulo) {
        var nome = rotulo || titulo || "";
        return '<button class="btn btn-sm ' + classe + '" type="button" data-acao="' + acao +
          '" data-id="' + esc(id) + '"' +
          ' aria-label="' + esc(nome) + '" title="' + esc(nome) + '">' +
          (icone ? '<i class="ti ' + icone + '" aria-hidden="true"></i>' : "") +
          (rotulo ? '<span class="btn-txt">' + esc(rotulo) + "</span>" : "") +
          "</button>";
      }

      function renderLista() {
        var alvo = $("lista");
        if (carregando) {
          alvo.innerHTML = '<div class="empty"><p>Carregando...</p></div>';
          return;
        }
        if (falha) {
          alvo.innerHTML = '<div class="empty">' +
            '<i class="ti ti-alert-circle" aria-hidden="true"></i><p>' + esc(falha) + "</p></div>";
          return;
        }
        if (!liberados.length) {
          alvo.innerHTML = '<div class="empty">' +
            '<i class="ti ti-user-off" aria-hidden="true"></i>' +
            "<p>Nenhum acesso liberado ainda. Use <b>Liberar acesso</b> para começar.</p></div>";
          $("conta-liberados").textContent = "";
          return;
        }

        var lista = visiveis();
        $("conta-liberados").textContent = lista.length === liberados.length
          ? liberados.length + (liberados.length === 1 ? " pessoa" : " pessoas")
          : lista.length + " de " + liberados.length;

        if (!lista.length) {
          alvo.innerHTML = '<div class="empty">' +
            '<i class="ti ti-filter-off" aria-hidden="true"></i>' +
            "<p>Ninguém com esse filtro.</p></div>";
          return;
        }

        var podeMexer = meuPapel === "admin" || meuPapel === "gestor";

        alvo.innerHTML =
          '<div class="table-wrap"><table class="table tabela-cartao">' +
            "<thead><tr>" +
              // Nao existe coluna de cliente: o unico cliente do sistema e a
              // Claro, e o cargo ja diz se a pessoa e da APSIS ou da Claro.
              // A coluna mostrava "-" ou "Claro" e nada mais.
              "<th>Pessoa</th><th>O que é</th><th>Situação</th>" +
              '<th class="num">Ações</th>' +
            "</tr></thead><tbody>" +
            lista.map(function (a) {
              var b = [];
              if (podeMexer) {
                // Sempre reenvio: o primeiro envio sai junto com a liberacao,
                // e nao ha caminho para mandar o primeiro acesso a mao.
                b.push(botao("convidar", a.id, "Reenviar convite", "btn-ghost", "ti-mail"));
                b.push(botao("editar", a.id, "", "btn-ghost btn-icon", "ti-pencil",
                  "Alterar este acesso"));
                b.push(botao(a.ativo ? "desativar" : "ativar", a.id,
                  a.ativo ? "Desativar" : "Ativar", "btn-ghost",
                  a.ativo ? "ti-user-off" : "ti-user-check"));
                // Apagar e definitivo e nao tem volta: fica com quem administra.
                if (souAdmin()) {
                  b.push(botao("apagar", a.id, "", "btn-ghost btn-icon btn-apagar",
                    "ti-trash", "Apagar este acesso"));
                }
              }
              return "<tr>" +
                '<td class="cartao-titulo"><div class="pessoa-cel"><b>' + esc(a.nome || "sem nome") + "</b>" +
                  "<span>" + esc(a.email) + "</span></div></td>" +
                '<td data-rotulo="O que é"><span class="badge ' + (BADGE_PAPEL[a.papel] || "badge-baixa") + '">' +
                  esc(PAPEL_LABEL[a.papel] || a.papel) + "</span></td>" +
                '<td data-rotulo="Situação">' + situacao(a) + "</td>" +
                '<td class="num cartao-acoes"><span class="acc-acoes">' + b.join("") + "</span></td>" +
              "</tr>";
            }).join("") +
          "</tbody></table></div>";
      }

      function renderContas() {
        var card = $("card-contas");
        if (carregando || !contas.length) { card.classList.add("is-hidden"); return; }
        card.classList.remove("is-hidden");

        var esperando = contas.filter(function (c) { return c.papel === "sem_acesso"; }).length;
        $("conta-contas").textContent = contas.length +
          (contas.length === 1 ? " conta" : " contas") +
          (esperando ? ", " + esperando + " esperando liberação" : "");

        // Conta que existe sem estar na lista de acessos so dava para apagar por
        // fora da tela: foi o que aconteceu com uma sobra de teste. Aqui ela
        // tem o mesmo botao de apagar da outra lista.
        var podeApagar = souAdmin();
        $("lista-contas").innerHTML =
          '<div class="table-wrap"><table class="table tabela-cartao">' +
            "<thead><tr><th>Pessoa</th><th>O que é hoje</th>" +
              (podeApagar ? '<th class="num">Ações</th>' : "") +
            "</tr></thead><tbody>" +
            contas.map(function (c) {
              return "<tr>" +
                '<td class="cartao-titulo"><div class="pessoa-cel"><b>' + esc(c.nome || "sem nome") + "</b></div></td>" +
                '<td data-rotulo="O que é hoje"><span class="badge ' + (BADGE_PAPEL[c.papel] || "badge-baixa") + '">' +
                  esc(PAPEL_LABEL[c.papel] || c.papel) + "</span></td>" +

                (podeApagar
                  ? '<td class="num cartao-acoes"><span class="acc-acoes">' +
                      botao("apagar-conta", c.user_id, "", "btn-ghost btn-icon btn-apagar",
                            "ti-trash", "Apagar esta conta") +
                    "</span></td>"
                  : "") +
              "</tr>";
            }).join("") +
          "</tbody></table></div>";
      }

      // ------------------------------------------------------------------
      // Modal
      // ------------------------------------------------------------------
      function abrirModal(a) {
        editandoId = a ? a.id : null;
        $("mod-titulo").textContent = a ? "Alterar acesso" : "Liberar acesso";
        $("mod-salvar").textContent = a ? "Salvar" : "Liberar acesso";

        $("f-papel").innerHTML = papeisQuePodeLiberar().map(function (p) {
          return '<option value="' + p.v + '"' + (p.travado ? " disabled" : "") + ">" +
            esc(p.t) + (p.travado ? " (só administrador)" : "") + "</option>";
        }).join("");

        $("f-email").value = a ? (a.email || "") : "";
        $("f-nome").value = a ? (a.nome || "") : "";
        $("f-papel").value = a ? a.papel : "cliente";
        $("f-email").disabled = !!a;

        $("mod").classList.add("is-open");
        setTimeout(function () { (a ? $("f-nome") : $("f-email")).focus(); }, 60);
      }

      function fecharModal() {
        $("mod").classList.remove("is-open");
        editandoId = null;
      }

      function salvar() {
        var email = ($("f-email").value || "").trim().toLowerCase();
        var nome = ($("f-nome").value || "").trim();
        var papel = $("f-papel").value;
        if (!/^\S+@\S+\.\S+$/.test(email)) { App.toast("Informe um e-mail válido."); return; }

        var btn = $("mod-salvar");
        var rotuloBotao = btn.textContent;
        btn.disabled = true;

        if (DEMO) {
          App.toast("Sem conexão com os dados agora: nada foi gravado.");
          btn.disabled = false;
          fecharModal();
          return;
        }

        // O cliente nao vem daqui: e sempre a Claro, e quem preenche pelo papel
        // e o servidor. Perguntar isso era pedir para escolher entre uma opcao.
        var linha = { email: email, nome: nome || null, papel: papel };
        var db = Auth.cliente;
        var acao = editandoId
          ? db.from("acessos_autorizados").update(linha).eq("id", editandoId).select("id")
          : db.from("acessos_autorizados").insert(linha).select("id");

        acao.then(function (r) {
          btn.disabled = false;
          if (r.error) {
            if (String(r.error.code) === "23505" || /duplicad|unique/i.test(r.error.message || "")) {
              App.toast("Este e-mail já está na lista. Procure por ele acima.");
              return;
            }
            App.toast(r.error.message || "Não foi possível salvar agora.");
            return;
          }
          if (!r.data || !r.data.length) {
            App.toast("Seu acesso não permite liberar pessoas. Fale com a coordenação da APSIS.");
            return;
          }
          if (editandoId) {
            App.toast("Acesso alterado.");
            fecharModal();
            return carregar().then(render);
          }

          // Liberar e enviar sao um passo so: nao existe mandar o primeiro
          // acesso a mao. Antes a liberacao terminava pedindo que alguem
          // clicasse em Convidar depois, e quem esquecia deixava a pessoa
          // liberada sem nunca receber nada.
          btn.disabled = true;
          btn.textContent = "Enviando o acesso...";
          return enviarAcesso(r.data[0].id).then(function (env) {
            btn.disabled = false;
            btn.textContent = rotuloBotao;
            fecharModal();
            App.toast(env.ok
              ? "Acesso liberado e enviado para " + email + "."
              : "Acesso liberado, mas o e-mail não saiu" +
                (env.motivo ? ": " + env.motivo : "") +
                ". Use Reenviar convite na lista.");
            return carregar().then(render);
          });
        }).catch(function () {
          btn.disabled = false;
          btn.textContent = rotuloBotao;
          App.toast("Não foi possível salvar agora. Tente novamente.");
        });
      }

      // ------------------------------------------------------------------
      // Ações da linha
      // ------------------------------------------------------------------
      function porId(id) {
        var achado = null;
        liberados.forEach(function (a) { if (a.id === id) achado = a; });
        return achado;
      }

      function mudarAtivo(a, ativo, botaoEl) {
        if (DEMO) { App.toast("Sem conexão com os dados agora: nada foi gravado."); return; }
        botaoEl.disabled = true;
        Auth.cliente.from("acessos_autorizados")
          .update({ ativo: ativo }).eq("id", a.id).select("id")
          .then(function (r) {
            botaoEl.disabled = false;
            if (r.error || !r.data || !r.data.length) {
              App.toast("Não foi possível alterar agora. Tente novamente.");
              return;
            }
            App.toast(ativo
              ? "Acesso reativado."
              : "Acesso retirado. Se a pessoa estiver com a tela aberta, ela perde o acesso agora.");
            return carregar().then(render);
          })
          .catch(function () {
            botaoEl.disabled = false;
            App.toast("Não foi possível alterar agora. Tente novamente.");
          });
      }

      // O motivo da falha vem no CORPO da resposta, e nao na mensagem do erro.
      // Sem ler o corpo, qualquer falha de envio aparecia como "nao foi
      // possivel enviar" - e era justamente o motivo que faltava para
      // descobrir por que o e-mail nao chega.
      function motivoDaFalha(err) {
        var ctx = err && err.context;
        if (ctx && typeof ctx.json === "function") {
          return ctx.json().then(function (d) {
            return { ok: false, motivo: (d && d.motivo) || "" };
          }, function () { return { ok: false, motivo: "" }; });
        }
        return { ok: false, motivo: (err && err.message) || "" };
      }

      // Um caminho so de envio, para o e-mail da liberacao e o do reenvio nao
      // divergirem.
      function enviarAcesso(id) {
        var cli = window.Auth ? Auth.cliente : null;
        if (!cli || !cli.functions || !cli.functions.invoke) {
          return Promise.resolve({ ok: false, motivo: "" });
        }
        return cli.functions.invoke("convidar-responsavel", { body: { acesso_id: id } })
          .then(function (r) {
            if (r.error) return motivoDaFalha(r.error);
            var d = r.data || {};
            return { ok: !!d.ok, motivo: d.motivo || "" };
          }, motivoDaFalha);
      }

      function convidar(a, botaoEl) {
        if (DEMO) { App.toast("Sem conexão com os dados agora: nada foi enviado."); return; }
        botaoEl.disabled = true;
        var rotulo = botaoEl.innerHTML;
        botaoEl.textContent = "Enviando...";

        enviarAcesso(a.id).then(function (env) {
          botaoEl.disabled = false;
          botaoEl.innerHTML = rotulo;
          if (!env.ok) {
            App.toast("O e-mail não saiu" + (env.motivo ? ": " + env.motivo : "") + ".");
            return;
          }
          App.toast("Acesso enviado para " + a.email + ".");
          return carregar().then(render);
        });
      }

      function apagar(a, botaoEl) {
        if (DEMO) { App.toast("Sem conexão com os dados agora: nada foi apagado."); return; }
        botaoEl.disabled = true;
        Auth.cliente.rpc("acesso_apagar", { p_id: a.id })
          .then(function (r) {
            botaoEl.disabled = false;
            if (r.error) {
              App.toast(r.error.message || "Não foi possível apagar agora. Tente novamente.");
              return;
            }
            var d = r.data || {};
            // Conta que assina trabalho ja registrado nao desaparece, senao a
            // auditoria ficaria sem autor. Dizer "apagado" e ponto esconderia
            // isso de quem clicou.
            App.toast(d.tinha_conta && !d.conta_apagada
              ? "Acesso apagado. A pessoa não entra mais. O nome dela continua nos " +
                "trabalhos que ela assinou."
              : "Acesso apagado.");
            return carregar().then(render);
          })
          .catch(function (e) {
            botaoEl.disabled = false;
            App.toast((e && e.message) || "Não foi possível apagar agora. Tente novamente.");
          });
      }

      function apagarConta(c, botaoEl) {
        if (DEMO) { App.toast("Sem conexão com os dados agora: nada foi apagado."); return; }
        botaoEl.disabled = true;
        Auth.cliente.rpc("conta_apagar", { p_user: c.user_id })
          .then(function (r) {
            botaoEl.disabled = false;
            if (r.error) {
              App.toast(r.error.message || "Não foi possível apagar agora. Tente novamente.");
              return;
            }
            var d = r.data || {};
            App.toast(d.conta_apagada
              ? "Conta apagada."
              : "Conta sem acesso. Ela não entra mais, mas continua nos trabalhos que assinou.");
            return carregar().then(render);
          })
          .catch(function (e) {
            botaoEl.disabled = false;
            App.toast((e && e.message) || "Não foi possível apagar agora. Tente novamente.");
          });
      }

      $("lista-contas").addEventListener("click", function (ev) {
        if (!ev.target.closest) return;
        var b = ev.target.closest('[data-acao="apagar-conta"]');
        if (!b) return;
        var id = b.getAttribute("data-id");
        var c = null;
        contas.forEach(function (x) { if (String(x.user_id) === String(id)) c = x; });
        if (!c) return;
        App.confirmar({
          titulo: "Apagar a conta",
          texto: (c.nome || "Esta pessoa") + " deixa de ter conta neste sistema.\n\n" +
                 "Vale para o login e para a liberação: as duas coisas somem, e não há " +
                 "como reativar. Para dar acesso de novo, será preciso liberar e convidar " +
                 "outra vez.\n\n" +
                 "O que ela já fez fica: auditoria, contagem e cronograma continuam com o " +
                 "nome dela.",
          confirmar: "Apagar de vez", cancelar: "Voltar", perigo: true
        }).then(function (ok) { if (ok) apagarConta(c, b); });
      });

      $("lista").addEventListener("click", function (ev) {
        if (!ev.target.closest) return;
        var b = ev.target.closest("[data-acao]");
        if (!b) return;
        var a = porId(b.getAttribute("data-id"));
        if (!a) return;
        var acao = b.getAttribute("data-acao");

        if (acao === "editar") { abrirModal(a); return; }
        if (acao === "convidar") { convidar(a, b); return; }
        if (acao === "ativar") { mudarAtivo(a, true, b); return; }
        if (acao === "apagar") {
          App.confirmar({
            titulo: "Apagar o acesso",
            texto: (a.nome || a.email) + " sai da lista e não volta.\n\n" +
                   "Não é o mesmo que retirar o acesso: aqui a liberação e o login da " +
                   "pessoa deixam de existir, e não há como reativar. Para liberar de novo, " +
                   "será preciso cadastrar e convidar outra vez.\n\n" +
                   "O que ela já fez no sistema fica: auditoria, contagem e cronograma " +
                   "continuam com o nome dela.",
            confirmar: "Apagar de vez", cancelar: "Voltar", perigo: true
          }).then(function (ok) { if (ok) apagar(a, b); });
          return;
        }
        if (acao === "desativar") {
          App.confirmar({
            titulo: "Retirar o acesso",
            texto: (a.nome || a.email) + " deixa de enxergar o sistema.\n\n" +
                   "Vale na hora: se a pessoa estiver com a tela aberta, o acesso cai no mesmo " +
                   "movimento. A conta e o histórico ficam guardados, e dá para reativar depois.",
            confirmar: "Retirar o acesso", cancelar: "Voltar", perigo: true
          }).then(function (ok) { if (ok) mudarAtivo(a, false, b); });
        }
      });

      $("btn-liberar").addEventListener("click", function () { abrirModal(null); });
      $("mod-fechar").addEventListener("click", fecharModal);
      $("mod-cancelar").addEventListener("click", fecharModal);
      $("mod-salvar").addEventListener("click", salvar);
      $("mod").addEventListener("click", function (ev) { if (ev.target === this) fecharModal(); });
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape" && $("mod").classList.contains("is-open")) fecharModal();
      });

      var timer = null;
      $("busca").addEventListener("input", function () {
        var v = this.value;
        if (timer) clearTimeout(timer);
        timer = setTimeout(function () { busca = v.trim(); renderLista(); }, 180);
      });

      // ------------------------------------------------------------------
      render();
      descobrirPapel()
        .then(carregar)
        .then(render)
        .catch(function () {
          carregando = false;
          falha = "Não foi possível carregar os acessos agora. " +
                  "Atualize a página em alguns instantes.";
          render();
        });
    })();
  </script>
</body>
</html>
