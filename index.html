<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visão geral - Auditoria de EPOs</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="assets/app.css?v=6">

  <style>
    /* Ajustes locais só desta tela - tudo via tokens do design system. */

    /* Faixa de abertura: contexto da carteira + ação principal */
    .hero-acao {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 26px 28px;
      border-radius: var(--radius);
      background: linear-gradient(120deg, var(--primary), var(--primary-600));
      color: #fff;
      box-shadow: var(--shadow-md);
    }
    .hero-acao-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .hero-acao-eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
      color: rgba(255, 255, 255, .75);
    }
    .hero-acao-eyebrow i { font-size: 15px; color: var(--apsis-orange-light); }
    .hero-acao-title { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
    .hero-acao-desc { font-size: 13px; color: rgba(255, 255, 255, .85); max-width: 520px; }
    .cta-nova-btn {
      flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      background: #fff;
      color: var(--primary);
      font-size: 15px;
      font-weight: 600;
      padding: 14px 26px;
      border-radius: var(--radius);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .cta-nova-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0, 0, 0, .22); }
    .cta-nova-btn i { font-size: 20px; color: var(--apsis-orange); }
    @media (max-width: 900px) {
      .hero-acao { flex-direction: column; align-items: stretch; gap: 18px; padding: 20px; }
      .cta-nova-btn { width: 100%; min-height: 54px; }
    }

    /* Variações de cor do ícone dos KPIs (mantêm o layout do componente) */
    .kpi-icon.is-danger  { background: var(--danger-bg);  color: var(--danger); }
    .kpi-icon.is-warning { background: var(--warning-bg); color: var(--warning); }
    .kpi-icon.is-success { background: var(--success-bg); color: var(--success); }

    /* Gráficos */
    .donut-wrap { position: relative; width: 176px; height: 176px; flex: 0 0 auto; }
    .donut-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
    .donut-total { display: block; font-size: 30px; font-weight: 600; line-height: 1; color: var(--text); }
    .chart-box { position: relative; height: 200px; }

    .legend { display: flex; flex-direction: column; gap: 2px; }
    .legend-item { display: flex; align-items: center; gap: 11px; padding: 8px 0; }
    .legend-item:not(:last-child) { border-bottom: 1px solid var(--border); }
    .legend-dot { width: 12px; height: 12px; border-radius: 4px; flex: 0 0 auto; }
    .legend-body { display: flex; flex-direction: column; line-height: 1.25; }
    .legend-label { font-weight: 500; color: var(--text); }
    .legend-hint { font-size: 12px; }
    .legend-count { margin-left: auto; font-size: 16px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

    /* Listas de EPOs (Top / Precisam de atenção) */
    .epo-list { display: flex; flex-direction: column; }
    .epo-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 8px; border-radius: var(--radius-sm);
      transition: background .12s ease;
    }
    .epo-item:hover { background: var(--surface-2); }
    .epo-item:not(:last-child) { border-bottom: 1px solid var(--border); }
    .epo-item .avatar { background: var(--surface-2); color: var(--text-2); }
    .epo-name { font-weight: 500; color: var(--text); }
    .epo-sub { display: block; font-size: 12px; margin-top: 4px; }
    .epo-chevron { color: var(--text-muted); font-size: 18px; flex: 0 0 auto; }

    /* Ciclo do material: barra proporcional + passos numerados */
    .fluxo { display: flex; flex-direction: column; gap: 18px; }
    .fluxo-barra {
      display: flex; gap: 3px; height: 10px;
      border-radius: 99px; overflow: hidden;
      background: var(--surface-2);
    }
    .fluxo-seg { background: var(--primary); opacity: .35; border-radius: 99px; transition: opacity .15s ease; }
    .fluxo-seg.is-critica { background: var(--apsis-orange); opacity: 1; }

    .fluxo-passos { display: flex; align-items: stretch; gap: 4px; }
    .fluxo-passo {
      flex: 1 1 0; min-width: 0;
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      padding: 14px 14px 12px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      position: relative;
    }
    .fluxo-passo.is-critica { background: var(--warning-bg); box-shadow: inset 0 0 0 1px rgba(244, 121, 32, .28); }
    .fluxo-num {
      position: absolute; top: 10px; right: 12px;
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .fluxo-icone {
      width: 34px; height: 34px; border-radius: 10px;
      display: grid; place-items: center;
      background: var(--surface); color: var(--primary);
      font-size: 19px; margin-bottom: 2px;
    }
    .fluxo-passo.is-critica .fluxo-icone { color: var(--apsis-orange); }
    .fluxo-label { font-size: 12px; color: var(--text-2); line-height: 1.3; }
    .fluxo-dias { font-size: 19px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.1; }
    .fluxo-passo.is-critica .fluxo-dias { color: var(--warning); }
    .fluxo-pct { font-size: 11px; color: var(--text-muted); }
    .fluxo-sep { align-self: center; color: var(--border-strong); font-size: 16px; flex: 0 0 auto; }

    .fluxo-rodape {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding-top: 4px; font-size: 12px; color: var(--text-2);
    }
    .fluxo-rodape i { font-size: 15px; vertical-align: -2px; margin-right: 5px; }
    .fluxo-rodape strong { color: var(--text); font-variant-numeric: tabular-nums; }
    .fluxo-legenda { color: var(--text-muted); }
    .fluxo-legenda i { color: var(--apsis-orange); }

    @media (max-width: 900px) {
      .fluxo-passos { flex-direction: column; gap: 8px; }
      .fluxo-passo { flex-direction: row; align-items: center; gap: 12px; padding: 12px 14px; }
      .fluxo-passo .fluxo-icone { margin-bottom: 0; flex: 0 0 34px; }
      .fluxo-passo .fluxo-label { flex: 1 1 auto; font-size: 13px; }
      .fluxo-passo .fluxo-dias { font-size: 16px; }
      .fluxo-pct { display: none; }
      .fluxo-num { display: none; }
      .fluxo-sep { display: none; }
    }

    /* Qualidade da reversa (fontes e controles remotos x meta 75%) */
    .reversa-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
    .reversa-item { display: flex; flex-direction: column; gap: 10px; }
    .reversa-label { font-weight: 500; color: var(--text); }
    .reversa-num { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .reversa-bar { height: 10px; }
    .reversa-hint { font-size: 12px; }

    @media (max-width: 640px) {
      .reversa-grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <script src="assets/data.js?v=6"></script>
  <script src="assets/app.js?v=6"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    (function () {
      "use strict";

      var acoes =
        '<a class="btn btn-primary" href="auditoria.html">' +
          '<i class="ti ti-plus" aria-hidden="true"></i>Nova auditoria' +
        '</a>';
      Layout.mount("geral", "Visão geral", acoes);

      var APP = window.APP;
      var epos = APP.epos.slice().sort(function (a, b) { return b.score - a.score; });
      var kpis = APP.kpis;
      var regras = APP.tierRules;

      // -------- Cálculos derivados (tudo a partir de APP.epos) --------
      function mediaTempo(campo) {
        var s = 0;
        epos.forEach(function (e) { s += e.tempos[campo]; });
        return s / epos.length;
      }
      var avgChegada = mediaTempo("chegada");
      var avgArmazenagem = mediaTempo("armazenagem");
      var avgDistribuicao = mediaTempo("distribuicao");
      var avgRetorno = mediaTempo("retornoCampo");
      var avgDevolucao = mediaTempo("devolucao");

      var totalEquip = epos.reduce(function (s, e) { return s + e.equipamentos; }, 0);

      var altaCount = 0;
      epos.forEach(function (e) {
        (e.naoConformidades || []).forEach(function (nc) {
          if (nc.gravidade === "alta") altaCount++;
        });
      });

      var meses = epos[0].historico.map(function (h) { return h.mes; });
      var scoreMensal = meses.map(function (m, i) {
        var s = 0;
        epos.forEach(function (e) { s += e.historico[i].score; });
        return Math.round((s / epos.length) * 10) / 10;
      });

      var top = epos.slice(0, 3);
      var atencao = epos.slice(-3).reverse(); // do pior para o menos pior

      // -------- Helpers de render --------
      function iniciais(nome) {
        return nome.replace(/^EPO\s+/i, "").trim().slice(0, 2).toUpperCase();
      }

      function epoRow(e, atencaoMode) {
        var tm = App.tierMeta(e.tier);
        var sub = atencaoMode
          ? App.fmtNum(e.ncs) + " não-conformidades · " + App.fmtPct(e.conformidade) + " conformidade"
          : e.cidade + " · " + e.uf;
        return (
          '<a class="epo-item" href="epo-detalhe.html?id=' + encodeURIComponent(e.id) + '">' +
            '<span class="avatar" aria-hidden="true">' + iniciais(e.nome) + '</span>' +
            '<span class="grow">' +
              '<span class="row-between">' +
                '<span class="epo-name">' + App.escapeHtml(e.nome) + '</span>' +
                '<span class="badge ' + tm.cls + '">' + tm.label + '</span>' +
              '</span>' +
              '<span class="score-row" style="margin-top:8px">' +
                '<span class="score-bar"><span class="score-fill tier-' + e.tier + '" style="width:' + e.score + '%"></span></span>' +
                '<span class="score-num">' + e.score + '</span>' +
              '</span>' +
              '<span class="epo-sub muted">' + App.escapeHtml(sub) + '</span>' +
            '</span>' +
            '<i class="ti ti-chevron-right epo-chevron" aria-hidden="true"></i>' +
          '</a>'
        );
      }

      function kpi(icon, iconMod, label, value, sub, subIcon) {
        return (
          '<div class="kpi">' +
            '<div class="kpi-top">' +
              '<span class="kpi-label">' + label + '</span>' +
              '<span class="kpi-icon ' + (iconMod || "") + '"><i class="ti ' + icon + '" aria-hidden="true"></i></span>' +
            '</div>' +
            '<div class="kpi-value">' + value + '</div>' +
            '<div class="kpi-delta flat"><i class="ti ' + subIcon + '" aria-hidden="true"></i>' + sub + '</div>' +
          '</div>'
        );
      }

      // Linha do tempo do ciclo: cada etapa ocupa espaço proporcional aos dias,
      // deixando visível onde o material fica mais tempo parado.
      function cicloTimeline(etapas) {
        var total = etapas.reduce(function (s, e) { return s + e.dias; }, 0);
        var maior = Math.max.apply(null, etapas.map(function (e) { return e.dias; }));
        var faixa = etapas.map(function (e) {
          var pct = total > 0 ? (e.dias / total) * 100 : 0;
          var critica = e.dias === maior;
          return '<span class="fluxo-seg' + (critica ? " is-critica" : "") + '" style="flex:' + pct.toFixed(2) + ';" ' +
            'title="' + e.label + ': ' + App.fmtDias(e.dias) + '"></span>';
        }).join("");

        var passos = etapas.map(function (e, i) {
          var critica = e.dias === maior;
          var pct = total > 0 ? Math.round((e.dias / total) * 100) : 0;
          return (
            '<div class="fluxo-passo' + (critica ? " is-critica" : "") + '">' +
              '<span class="fluxo-num">' + (i + 1) + '</span>' +
              '<span class="fluxo-icone"><i class="ti ' + e.icon + '" aria-hidden="true"></i></span>' +
              '<span class="fluxo-label">' + e.label + '</span>' +
              '<span class="fluxo-dias">' + App.fmtDias(e.dias) + '</span>' +
              '<span class="fluxo-pct">' + pct + '% do ciclo</span>' +
            '</div>'
          );
        }).join('<i class="ti ti-chevron-right fluxo-sep" aria-hidden="true"></i>');

        return (
          '<div class="fluxo">' +
            '<div class="fluxo-barra" role="img" aria-label="Distribuição dos dias entre as etapas do ciclo">' + faixa + '</div>' +
            '<div class="fluxo-passos">' + passos + '</div>' +
            '<div class="fluxo-rodape">' +
              '<span><i class="ti ti-clock" aria-hidden="true"></i>Ciclo completo: <strong>' + App.fmtDias(total) + '</strong></span>' +
              '<span class="fluxo-legenda"><i class="ti ti-alert-triangle" aria-hidden="true"></i>Etapa mais demorada em destaque</span>' +
            '</div>' +
          '</div>'
        );
      }

      function reversaBar(label, pct, meta) {
        var ok = pct >= meta;
        var cor = ok ? "var(--success)" : "var(--danger)";
        var cls = ok ? "delta-up" : "delta-down";
        return (
          '<div class="reversa-item">' +
            '<div class="row-between">' +
              '<span class="reversa-label">' + label + '</span>' +
              '<span class="reversa-num ' + cls + '">' + App.fmtPct(pct) + '</span>' +
            '</div>' +
            '<span class="score-bar reversa-bar" role="img" aria-label="' + label + ': ' + App.fmtPct(pct) + ', meta ' + App.fmtPct(meta) + '">' +
              '<span class="score-fill" style="width:' + pct + '%; background:' + cor + '"></span>' +
              '<span class="meta-line" style="left:' + meta + '%"></span>' +
            '</span>' +
            '<span class="reversa-hint muted">meta ' + App.fmtPct(meta) + '</span>' +
          '</div>'
        );
      }

      var reversaMedia = kpis.reversaQualidadeMedia;
      var cicloNum = Number(kpis.tempoMedioCiclo).toLocaleString("pt-BR", {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1
      });

      var dist = kpis.distribuicao;

      // -------- Montagem da página --------
      var html =
        '<div class="stack stack-lg">' +

          // (1) Faixa de abertura + ação principal
          '<section class="hero-acao">' +
            '<div class="hero-acao-main">' +
              '<span class="hero-acao-eyebrow"><i class="ti ti-building-broadcast-tower" aria-hidden="true"></i>Auditoria de EPOs · Claro</span>' +
              '<span class="hero-acao-title">Visão geral da carteira</span>' +
              '<span class="hero-acao-desc">' + App.fmtNum(kpis.eposAuditadas) + ' EPOs auditadas · ciclo médio de ' + App.fmtDias(kpis.tempoMedioCiclo) + ' da chegada à devolução para a Claro.</span>' +
            '</div>' +
            '<a class="cta-nova-btn" href="auditoria.html">' +
              '<i class="ti ti-clipboard-check" aria-hidden="true"></i>Nova auditoria' +
            '</a>' +
          '</section>' +

          // (2) KPIs
          '<section class="kpi-grid">' +
            kpi("ti-building-warehouse", "", "EPOs auditadas", App.fmtNum(kpis.eposAuditadas),
                dist.ouro + " ouro · " + dist.prata + " prata · " + dist.bronze + " bronze · " + dist.critico + " crítico", "ti-award") +
            kpi("ti-player-pause", "is-warning", "Equipamentos parados", App.fmtNum(kpis.equipParados),
                "de " + App.fmtNum(totalEquip) + " no total", "ti-stack-2") +
            kpi("ti-clock", "", "Tempo médio de ciclo", App.fmtDias(kpis.tempoMedioCiclo),
                "meta " + App.fmtDias(10), "ti-target") +
            kpi("ti-circle-check", "is-success", "Conformidade média", App.fmtPct(kpis.conformidadeMedia),
                "meta " + App.fmtPct(85), "ti-target") +
            kpi("ti-alert-triangle", "is-danger", "Não-conformidades", App.fmtNum(kpis.ncTotal),
                App.fmtNum(altaCount) + " de gravidade alta", "ti-flame") +
          '</section>' +

          // (3) Ciclo do material
          '<section class="card">' +
            '<div class="card-header">' +
              '<div class="section-title">' +
                '<h2 class="title">Ciclo do material</h2>' +
                '<span class="subtitle">Médias das 8 EPOs, em dias - da chegada à devolução para a Claro</span>' +
              '</div>' +
            '</div>' +
            cicloTimeline([
              { icon: "ti-truck-delivery",      label: "Chegada",               dias: avgChegada },
              { icon: "ti-building-warehouse",  label: "Armazenagem",           dias: avgArmazenagem },
              { icon: "ti-user-share",          label: "Distribuição",          dias: avgDistribuicao },
              { icon: "ti-arrow-back",          label: "Retorno de campo",      dias: avgRetorno },
              { icon: "ti-send",                label: "Devolução à Claro",     dias: avgDevolucao }
            ]) +
          '</section>' +

          // (3b) Qualidade da reversa
          '<section class="card">' +
            '<div class="card-header">' +
              '<div class="section-title">' +
                '<h2 class="title">Qualidade da reversa</h2>' +
                '<span class="subtitle">Fontes e controles remotos devolvidos junto aos equipamentos · média das 8 EPOs · meta 75%</span>' +
              '</div>' +
            '</div>' +
            '<div class="reversa-grid">' +
              reversaBar("Fontes devolvidas", reversaMedia.pctFontes, 75) +
              reversaBar("Controles remotos devolvidos", reversaMedia.pctControles, 75) +
            '</div>' +
          '</section>' +

          // (4) Panorama: distribuição por tier + evolução do score
          '<section class="grid-2">' +
            '<div class="card">' +
              '<div class="card-header">' +
                '<div class="section-title">' +
                  '<h2 class="title">Distribuição por tier</h2>' +
                  '<span class="subtitle">Classificação atual das EPOs</span>' +
                '</div>' +
              '</div>' +
              '<div class="row wrap" style="gap:24px">' +
                '<div class="donut-wrap">' +
                  '<canvas id="donutTier" role="img" aria-label="Distribuição por tier: ' +
                    dist.ouro + ' ouro, ' + dist.prata + ' prata, ' + dist.bronze + ' bronze, ' + dist.critico + ' crítico"></canvas>' +
                  '<div class="donut-center">' +
                    '<span class="donut-total">' + App.fmtNum(kpis.eposAuditadas) + '</span>' +
                    '<span class="muted" style="font-size:12px">EPOs</span>' +
                  '</div>' +
                '</div>' +
                '<div class="legend grow">' +
                  legendItem("var(--ouro)", "Ouro", "≥ " + regras.ouroMin + " pts", dist.ouro) +
                  legendItem("var(--prata)", "Prata", regras.prataMin + "–" + (regras.ouroMin - 1) + " pts", dist.prata) +
                  legendItem("var(--bronze)", "Bronze", regras.bronzeMin + "–" + (regras.prataMin - 1) + " pts", dist.bronze) +
                  legendItem("var(--critico)", "Crítico", "< " + regras.bronzeMin + " pts", dist.critico) +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="card">' +
              '<div class="card-header">' +
                '<div class="section-title">' +
                  '<h2 class="title">Score médio mensal</h2>' +
                  '<span class="subtitle">Média das 8 EPOs · fevereiro a julho</span>' +
                '</div>' +
              '</div>' +
              '<div class="chart-box">' +
                '<canvas id="lineScore" role="img" aria-label="Evolução do score médio mensal das EPOs"></canvas>' +
              '</div>' +
            '</div>' +
          '</section>' +

          // (5) Top EPOs + Precisam de atenção
          '<section class="grid-2">' +
            '<div class="card">' +
              '<div class="card-header">' +
                '<div class="section-title">' +
                  '<h2 class="title">Top EPOs</h2>' +
                  '<span class="subtitle">Melhores classificadas do ciclo</span>' +
                '</div>' +
                '<a class="btn btn-ghost btn-sm card-header-action" href="ranking.html">' +
                  '<i class="ti ti-trophy" aria-hidden="true"></i>Ver ranking' +
                '</a>' +
              '</div>' +
              '<div class="epo-list">' + top.map(function (e) { return epoRow(e, false); }).join("") + '</div>' +
            '</div>' +
            '<div class="card">' +
              '<div class="card-header">' +
                '<div class="section-title">' +
                  '<h2 class="title">Precisam de atenção</h2>' +
                  '<span class="subtitle">Menores scores e mais não-conformidades</span>' +
                '</div>' +
              '</div>' +
              '<div class="epo-list">' + atencao.map(function (e) { return epoRow(e, true); }).join("") + '</div>' +
            '</div>' +
          '</section>' +

        '</div>';

      function legendItem(color, label, hint, count) {
        return (
          '<div class="legend-item">' +
            '<span class="legend-dot" style="background:' + color + '"></span>' +
            '<span class="legend-body">' +
              '<span class="legend-label">' + label + '</span>' +
              '<span class="legend-hint muted">' + hint + '</span>' +
            '</span>' +
            '<span class="legend-count">' + App.fmtNum(count) + '</span>' +
          '</div>'
        );
      }

      document.getElementById("page").innerHTML = html;

      // -------- Gráficos (Chart.js) --------
      if (window.Chart) {
        var css = function (n) {
          return getComputedStyle(document.documentElement).getPropertyValue(n).trim();
        };
        Chart.defaults.font.family = "Inter, system-ui, sans-serif";
        Chart.defaults.color = css("--text-2");

        var donut = document.getElementById("donutTier");
        if (donut) {
          new Chart(donut, {
            type: "doughnut",
            data: {
              labels: ["Ouro", "Prata", "Bronze", "Crítico"],
              datasets: [{
                data: [dist.ouro, dist.prata, dist.bronze, dist.critico],
                backgroundColor: [css("--ouro"), css("--prata"), css("--bronze"), css("--critico")],
                borderColor: css("--surface"),
                borderWidth: 2,
                hoverOffset: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: "70%",
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: function (c) { return " " + c.label + ": " + c.parsed + " EPOs"; }
                  }
                }
              }
            }
          });
        }

        var line = document.getElementById("lineScore");
        if (line) {
          var ctx = line.getContext("2d");
          var grad = ctx.createLinearGradient(0, 0, 0, 200);
          grad.addColorStop(0, "rgba(79,70,229,.18)");
          grad.addColorStop(1, "rgba(79,70,229,0)");
          new Chart(line, {
            type: "line",
            data: {
              labels: meses,
              datasets: [{
                data: scoreMensal,
                borderColor: css("--primary"),
                backgroundColor: grad,
                fill: true,
                tension: .35,
                borderWidth: 2,
                pointRadius: 3,
                pointBackgroundColor: css("--primary"),
                pointBorderColor: css("--surface"),
                pointBorderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: function (c) { return " Score médio: " + c.parsed.y; }
                  }
                }
              },
              scales: {
                y: {
                  suggestedMin: 70,
                  suggestedMax: 90,
                  ticks: { stepSize: 5 },
                  grid: { color: css("--border") }
                },
                x: {
                  grid: { display: false }
                }
              }
            }
          });
        }
      }
    })();
  </script>
</body>
</html>
