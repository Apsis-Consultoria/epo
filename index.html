<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visão geral - Auditoria de EPOs</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="assets/app.css?v=13">

  <style>
    /* Ajustes locais só desta tela - tudo via tokens do design system. */

    /* ---------------- Mapa das EPOs ---------------- */
    .mapa-caixa { position: relative; }
    #mapa-epos {
      height: min(56vh, 520px); min-height: 340px; width: 100%;
      background: var(--surface-2);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    @media (max-width: 900px) { #mapa-epos { height: 48vh; min-height: 300px; } }

    .mapa-camadas {
      position: absolute; z-index: 500; top: 12px; right: 12px;
      display: flex; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow-sm);
    }
    .mapa-camadas button {
      border: 0; background: transparent; cursor: pointer; font-family: inherit;
      font-size: 12.5px; font-weight: 600; color: var(--text-2);
      padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px;
    }
    .mapa-camadas button.is-on { background: var(--primary); color: #fff; }
    .mapa-camadas button + button { border-left: 1px solid var(--border); }

    .selo-filtros { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 18px 0; }
    .selo-chip {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 999px; padding: 6px 13px 6px 9px;
      font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text-2);
      cursor: pointer; transition: border-color .15s ease, opacity .15s ease;
    }
    .selo-chip:hover { border-color: var(--border-strong); }
    .selo-chip.is-off { opacity: .42; }
    .selo-chip .pino {
      width: 22px; height: 22px; flex: 0 0 22px; border-radius: 50%;
      display: grid; place-items: center; color: #fff; font-size: 13px;
    }
    .selo-chip b { color: var(--text); font-variant-numeric: tabular-nums; }

    .pino-mapa {
      width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center; color: #fff; font-size: 18px;
      border: 2.5px solid #fff; box-shadow: 0 2px 8px rgba(15, 33, 24, .35);
    }
    .pino-mapa.is-aprox { border-style: dashed; }

    .leaflet-popup-content { margin: 12px 14px; font-family: Inter, sans-serif; }
    .pop-nome { font-size: 15px; font-weight: 600; color: var(--text); margin: 0 0 2px; }
    .pop-local { font-size: 12.5px; color: var(--text-2); margin: 0 0 10px; }
    .pop-linha { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .pop-score { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1; }
    .pop-obs { font-size: 12px; color: var(--text-muted); margin: 0 0 10px; }
    .pop-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--primary); color: #fff; text-decoration: none;
      font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-sm);
    }
    .mapa-fora { font-size: 12.5px; color: var(--text-2); padding: 12px 18px 0; }

    /* Faixa de abertura: contexto da carteira + ação principal */
    .hero-acao {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 24px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--apsis-orange);
      box-shadow: var(--shadow-sm);
    }
    .hero-acao-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .hero-acao-title { font-size: 18px; font-weight: 600; color: var(--text); letter-spacing: -.01em; }
    .hero-acao-desc { font-size: 13px; color: var(--text-2); max-width: 560px; }
    .cta-nova-btn {
      flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: var(--radius-sm);
      transition: background .15s ease;
    }
    .cta-nova-btn:hover { background: var(--primary-600); }
    .cta-nova-btn i { font-size: 18px; }
    .cta-nova-btn.is-ghost { background: var(--surface-2); color: var(--text); }
    .cta-nova-btn.is-ghost:hover { background: var(--border); }
    .hero-acao-btns { display: flex; gap: 10px; flex: 0 0 auto; }
    @media (max-width: 900px) {
      .hero-acao { flex-direction: column; align-items: stretch; gap: 16px; padding: 18px; border-left-width: 3px; }
      .hero-acao-btns { flex-direction: column; }
      .cta-nova-btn { width: 100%; min-height: 52px; }
    }

    /* Variações de cor do ícone dos KPIs (mantêm o layout do componente) */
    .kpi-icon.is-danger  { background: var(--danger-bg);  color: var(--danger); }
    .kpi-icon.is-warning { background: var(--warning-bg); color: var(--warning); }
    .kpi-icon.is-success { background: var(--success-bg); color: var(--success); }

    /* Gráficos */
    .donut-wrap { position: relative; width: 176px; height: 176px; flex: 0 0 auto; }
    .donut-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
    .donut-total { display: block; font-size: 30px; font-weight: 600; line-height: 1; color: var(--text); }
    .chart-box { position: relative; height: 200px; }

    .legend { display: flex; flex-direction: column; gap: 2px; }
    .legend-item { display: flex; align-items: center; gap: 11px; padding: 8px 0; }
    .legend-item:not(:last-child) { border-bottom: 1px solid var(--border); }
    .legend-dot { width: 12px; height: 12px; border-radius: 4px; flex: 0 0 auto; }
    .legend-body { display: flex; flex-direction: column; line-height: 1.25; }
    .legend-label { font-weight: 500; color: var(--text); }
    .legend-hint { font-size: 12px; }
    .legend-count { margin-left: auto; font-size: 16px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

    /* Listas de EPOs (Top / Precisam de atenção) */
    .epo-list { display: flex; flex-direction: column; }
    .epo-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 8px; border-radius: var(--radius-sm);
      transition: background .12s ease;
    }
    .epo-item:hover { background: var(--surface-2); }
    .epo-item:not(:last-child) { border-bottom: 1px solid var(--border); }
    .epo-item .avatar { background: var(--surface-2); color: var(--text-2); }
    .epo-name { font-weight: 500; color: var(--text); }
    .epo-sub { display: block; font-size: 12px; margin-top: 4px; }
    .epo-chevron { color: var(--text-muted); font-size: 18px; flex: 0 0 auto; }

    /* Qualidade da reversa (fontes e controles remotos x meta 75%) */
    .reversa-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
    .reversa-item { display: flex; flex-direction: column; gap: 10px; }
    .reversa-label { font-weight: 500; color: var(--text); }
    .reversa-num { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .reversa-bar { height: 10px; }
    .reversa-hint { font-size: 12px; }

    @media (max-width: 640px) {
      .reversa-grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <script src="assets/data.js?v=13"></script>
  <script src="assets/app.js?v=13"></script>
  <script src="assets/geo-br.js?v=13"></script>
  <script src="assets/supabase-config.js?v=13"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js?v=13"></script>
  <script>
    (function () {
      "use strict";

      Layout.mount("geral", "Visão geral");

      var APP = window.APP;
      var epos = APP.epos.slice().sort(function (a, b) { return b.score - a.score; });
      var kpis = APP.kpis;
      var regras = APP.tierRules;

      // -------- Cálculos derivados (tudo a partir de APP.epos) --------
      var totalEquip = epos.reduce(function (s, e) { return s + e.equipamentos; }, 0);

      var altaCount = 0;
      epos.forEach(function (e) {
        (e.naoConformidades || []).forEach(function (nc) {
          if (nc.gravidade === "alta") altaCount++;
        });
      });

      var meses = epos[0].historico.map(function (h) { return h.mes; });
      var scoreMensal = meses.map(function (m, i) {
        var s = 0;
        epos.forEach(function (e) { s += e.historico[i].score; });
        return Math.round((s / epos.length) * 10) / 10;
      });

      var top = epos.slice(0, 3);
      var atencao = epos.slice(-3).reverse(); // do pior para o menos pior

      // -------- Helpers de render --------
      function iniciais(nome) {
        return nome.replace(/^EPO\s+/i, "").trim().slice(0, 2).toUpperCase();
      }

      function epoRow(e, atencaoMode) {
        var tm = App.tierMeta(e.tier);
        var sub = atencaoMode
          ? App.fmtNum(e.ncs) + " não-conformidades · " + App.fmtPct(e.conformidade) + " conformidade"
          : e.cidade + " · " + e.uf;
        return (
          '<a class="epo-item" href="epo-detalhe.html?id=' + encodeURIComponent(e.id) + '">' +
            '<span class="avatar" aria-hidden="true">' + iniciais(e.nome) + '</span>' +
            '<span class="grow">' +
              '<span class="row-between">' +
                '<span class="epo-name">' + App.escapeHtml(e.nome) + '</span>' +
                '<span class="badge ' + tm.cls + '">' + tm.label + '</span>' +
              '</span>' +
              '<span class="score-row" style="margin-top:8px">' +
                '<span class="score-bar"><span class="score-fill tier-' + e.tier + '" style="width:' + e.score + '%"></span></span>' +
                '<span class="score-num">' + e.score + '</span>' +
              '</span>' +
              '<span class="epo-sub muted">' + App.escapeHtml(sub) + '</span>' +
            '</span>' +
            '<i class="ti ti-chevron-right epo-chevron" aria-hidden="true"></i>' +
          '</a>'
        );
      }

      function kpi(icon, iconMod, label, value, sub, subIcon) {
        return (
          '<div class="kpi">' +
            '<div class="kpi-top">' +
              '<span class="kpi-label">' + label + '</span>' +
              '<span class="kpi-icon ' + (iconMod || "") + '"><i class="ti ' + icon + '" aria-hidden="true"></i></span>' +
            '</div>' +
            '<div class="kpi-value">' + value + '</div>' +
            '<div class="kpi-delta flat"><i class="ti ' + subIcon + '" aria-hidden="true"></i>' + sub + '</div>' +
          '</div>'
        );
      }

      function reversaBar(label, pct, meta) {
        var ok = pct >= meta;
        var cor = ok ? "var(--success)" : "var(--danger)";
        var cls = ok ? "delta-up" : "delta-down";
        return (
          '<div class="reversa-item">' +
            '<div class="row-between">' +
              '<span class="reversa-label">' + label + '</span>' +
              '<span class="reversa-num ' + cls + '">' + App.fmtPct(pct) + '</span>' +
            '</div>' +
            '<span class="score-bar reversa-bar" role="img" aria-label="' + label + ': ' + App.fmtPct(pct) + ', meta ' + App.fmtPct(meta) + '">' +
              '<span class="score-fill" style="width:' + pct + '%; background:' + cor + '"></span>' +
              '<span class="meta-line" style="left:' + meta + '%"></span>' +
            '</span>' +
            '<span class="reversa-hint muted">meta ' + App.fmtPct(meta) + '</span>' +
          '</div>'
        );
      }

      var reversaMedia = kpis.reversaQualidadeMedia;
      var cicloNum = Number(kpis.tempoMedioCiclo).toLocaleString("pt-BR", {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1
      });

      var dist = kpis.distribuicao;

      // -------- Montagem da página --------
      var html =
        '<div class="stack stack-lg">' +

          // (1) Faixa de abertura + ação principal
          '<section class="hero-acao">' +
            '<div class="hero-acao-main">' +
              '<span class="hero-acao-title">Visão geral da carteira</span>' +
              '<span class="hero-acao-desc">' + App.fmtNum(kpis.eposAuditadas) + ' EPOs auditadas para a Claro · ciclo médio de ' + App.fmtDias(kpis.tempoMedioCiclo) + ' da chegada à devolução.</span>' +
            '</div>' +
            '<a class="cta-nova-btn" href="pendentes.html">' +
              '<i class="ti ti-clipboard-list" aria-hidden="true"></i>Auditorias pendentes' +
            '</a>' +
          '</section>' +

          // (1b) Mapa das EPOs - só para gerente da Claro e admin da APSIS.
          // Preenchido depois, quando o papel de quem entrou é conhecido.
          '<section class="card" id="card-mapa" hidden></section>' +

          // (2) KPIs
          '<section class="kpi-grid">' +
            kpi("ti-building-warehouse", "", "EPOs auditadas", App.fmtNum(kpis.eposAuditadas),
                dist.ouro + " ouro · " + dist.prata + " prata · " + dist.bronze + " bronze · " + dist.critico + " crítico", "ti-award") +
            kpi("ti-player-pause", "is-warning", "Equipamentos parados", App.fmtNum(kpis.equipParados),
                "de " + App.fmtNum(totalEquip) + " no total", "ti-stack-2") +
            kpi("ti-clock", "", "Tempo médio de ciclo", App.fmtDias(kpis.tempoMedioCiclo),
                "meta " + App.fmtDias(10), "ti-target") +
            kpi("ti-circle-check", "is-success", "Conformidade média", App.fmtPct(kpis.conformidadeMedia),
                "meta " + App.fmtPct(85), "ti-target") +
            kpi("ti-alert-triangle", "is-danger", "Não-conformidades", App.fmtNum(kpis.ncTotal),
                App.fmtNum(altaCount) + " de gravidade alta", "ti-flame") +
          '</section>' +

          // (3) Qualidade da reversa
          '<section class="card">' +
            '<div class="card-header">' +
              '<div class="section-title">' +
                '<h2 class="title">Qualidade da reversa</h2>' +
                '<span class="subtitle">Fontes e controles remotos devolvidos junto aos equipamentos · média das 8 EPOs · meta 75%</span>' +
              '</div>' +
            '</div>' +
            '<div class="reversa-grid">' +
              reversaBar("Fontes devolvidas", reversaMedia.pctFontes, 75) +
              reversaBar("Controles remotos devolvidos", reversaMedia.pctControles, 75) +
            '</div>' +
          '</section>' +

          // (4) Panorama: distribuição por tier + evolução do score
          '<section class="grid-2">' +
            '<div class="card">' +
              '<div class="card-header">' +
                '<div class="section-title">' +
                  '<h2 class="title">Distribuição por tier</h2>' +
                  '<span class="subtitle">Classificação atual das EPOs</span>' +
                '</div>' +
              '</div>' +
              '<div class="row wrap" style="gap:24px">' +
                '<div class="donut-wrap">' +
                  '<canvas id="donutTier" role="img" aria-label="Distribuição por tier: ' +
                    dist.ouro + ' ouro, ' + dist.prata + ' prata, ' + dist.bronze + ' bronze, ' + dist.critico + ' crítico"></canvas>' +
                  '<div class="donut-center">' +
                    '<span class="donut-total">' + App.fmtNum(kpis.eposAuditadas) + '</span>' +
                    '<span class="muted" style="font-size:12px">EPOs</span>' +
                  '</div>' +
                '</div>' +
                '<div class="legend grow">' +
                  legendItem("var(--ouro)", "Ouro", "≥ " + regras.ouroMin + " pts", dist.ouro) +
                  legendItem("var(--prata)", "Prata", regras.prataMin + "-" + (regras.ouroMin - 1) + " pts", dist.prata) +
                  legendItem("var(--bronze)", "Bronze", regras.bronzeMin + "-" + (regras.prataMin - 1) + " pts", dist.bronze) +
                  legendItem("var(--critico)", "Crítico", "< " + regras.bronzeMin + " pts", dist.critico) +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="card">' +
              '<div class="card-header">' +
                '<div class="section-title">' +
                  '<h2 class="title">Score médio mensal</h2>' +
                  '<span class="subtitle">Média das 8 EPOs · fevereiro a julho</span>' +
                '</div>' +
              '</div>' +
              '<div class="chart-box">' +
                '<canvas id="lineScore" role="img" aria-label="Evolução do score médio mensal das EPOs"></canvas>' +
              '</div>' +
            '</div>' +
          '</section>' +

          // (5) Top EPOs + Precisam de atenção
          '<section class="grid-2">' +
            '<div class="card">' +
              '<div class="card-header">' +
                '<div class="section-title">' +
                  '<h2 class="title">Top EPOs</h2>' +
                  '<span class="subtitle">Melhores classificadas do ciclo</span>' +
                '</div>' +
                '<a class="btn btn-ghost btn-sm card-header-action" href="ranking.html">' +
                  '<i class="ti ti-trophy" aria-hidden="true"></i>Ver ranking' +
                '</a>' +
              '</div>' +
              '<div class="epo-list">' + top.map(function (e) { return epoRow(e, false); }).join("") + '</div>' +
            '</div>' +
            '<div class="card">' +
              '<div class="card-header">' +
                '<div class="section-title">' +
                  '<h2 class="title">Precisam de atenção</h2>' +
                  '<span class="subtitle">Menores scores e mais não-conformidades</span>' +
                '</div>' +
              '</div>' +
              '<div class="epo-list">' + atencao.map(function (e) { return epoRow(e, true); }).join("") + '</div>' +
            '</div>' +
          '</section>' +

        '</div>';

      function legendItem(color, label, hint, count) {
        return (
          '<div class="legend-item">' +
            '<span class="legend-dot" style="background:' + color + '"></span>' +
            '<span class="legend-body">' +
              '<span class="legend-label">' + label + '</span>' +
              '<span class="legend-hint muted">' + hint + '</span>' +
            '</span>' +
            '<span class="legend-count">' + App.fmtNum(count) + '</span>' +
          '</div>'
        );
      }

      document.getElementById("page").innerHTML = html;

      // -------- Gráficos (Chart.js) --------
      if (window.Chart) {
        var css = function (n) {
          return getComputedStyle(document.documentElement).getPropertyValue(n).trim();
        };
        Chart.defaults.font.family = "Inter, system-ui, sans-serif";
        Chart.defaults.color = css("--text-2");

        var donut = document.getElementById("donutTier");
        if (donut) {
          new Chart(donut, {
            type: "doughnut",
            data: {
              labels: ["Ouro", "Prata", "Bronze", "Crítico"],
              datasets: [{
                data: [dist.ouro, dist.prata, dist.bronze, dist.critico],
                backgroundColor: [css("--ouro"), css("--prata"), css("--bronze"), css("--critico")],
                borderColor: css("--surface"),
                borderWidth: 2,
                hoverOffset: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: "70%",
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: function (c) { return " " + c.label + ": " + c.parsed + " EPOs"; }
                  }
                }
              }
            }
          });
        }

        var line = document.getElementById("lineScore");
        if (line) {
          var ctx = line.getContext("2d");
          var grad = ctx.createLinearGradient(0, 0, 0, 200);
          grad.addColorStop(0, "rgba(79,70,229,.18)");
          grad.addColorStop(1, "rgba(79,70,229,0)");
          new Chart(line, {
            type: "line",
            data: {
              labels: meses,
              datasets: [{
                data: scoreMensal,
                borderColor: css("--primary"),
                backgroundColor: grad,
                fill: true,
                tension: .35,
                borderWidth: 2,
                pointRadius: 3,
                pointBackgroundColor: css("--primary"),
                pointBorderColor: css("--surface"),
                pointBorderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: function (c) { return " Score médio: " + c.parsed.y; }
                  }
                }
              },
              scales: {
                y: {
                  suggestedMin: 70,
                  suggestedMax: 90,
                  ticks: { stepSize: 5 },
                  grid: { color: css("--border") }
                },
                x: {
                  grid: { display: false }
                }
              }
            }
          });
        }
      }
      // ------------------------------------------------------------------
      // Mapa das EPOs no Brasil.
      // Aparece só para o gerente da Claro e para o admin da APSIS: é a leitura
      // de carteira que esses dois papéis abrem o sistema para ver. O selo do
      // pino vem da nota da última vistoria; crítico virou sinal de atenção.
      // ------------------------------------------------------------------
      (function mapaDasEpos() {
        var card = document.getElementById("card-mapa");
        if (!card || typeof L === "undefined" || !window.GeoBR) return;

        var escM = App.escapeHtml;
        var SELOS = {
          ouro:    { label: "Ouro",         icone: "ti-medal",          cor: "#C08A2B" },
          prata:   { label: "Prata",        icone: "ti-medal",          cor: "#7E8592" },
          bronze:  { label: "Bronze",       icone: "ti-medal",          cor: "#B06A3B" },
          critico: { label: "Atenção",      icone: "ti-alert-triangle", cor: "#EF4444" },
          nenhum:  { label: "Sem vistoria", icone: "ti-map-pin",        cor: "#94A3B8" }
        };
        var ORDEM = ["ouro", "prata", "bronze", "critico", "nenhum"];

        var ligados = { ouro: true, prata: true, bronze: true, critico: true, nenhum: true };
        var unidades = [];
        var mapa = null, camadaPinos = null, camadas = {};

        function papelDe() {
          // Protótipo e demonstração mostram o mapa: é o que a Claro vê na reunião.
          if (!window.Auth || !Auth.pronto || Auth.modoDemo()) return Promise.resolve("admin");
          return Auth.perfil().then(function (p) { return p ? p.papel : null; });
        }

        function dataBr(iso) {
          if (!iso) return "";
          var p = String(iso).slice(0, 10).split("-");
          return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : "";
        }

        function seloDe(u) {
          if (u.score === null || u.score === undefined) return "nenhum";
          return u.tier || App.tierOf(u.score);
        }

        function montarCasca() {
          card.hidden = false;
          card.innerHTML =
            '<div class="card-header">' +
              '<div class="section-title">' +
                '<h2 class="title">EPOs no Brasil</h2>' +
                '<span class="subtitle">Selo de cada EPO pela nota da última vistoria · quem está crítico aparece com sinal de atenção</span>' +
              "</div>" +
            "</div>" +
            '<div class="selo-filtros" id="selo-filtros"></div>' +
            '<div class="mapa-fora" id="mapa-fora" hidden></div>' +
            '<div class="mapa-caixa">' +
              '<div class="mapa-camadas">' +
                '<button type="button" data-camada="ruas" class="is-on"><i class="ti ti-map" aria-hidden="true"></i>Ruas</button>' +
                '<button type="button" data-camada="satelite"><i class="ti ti-satellite" aria-hidden="true"></i>Satélite</button>' +
              "</div>" +
              '<div id="mapa-epos"></div>' +
            "</div>";
        }

        function criarMapa() {
          mapa = L.map("mapa-epos", {
            center: GeoBR.CENTRO,
            zoom: 4,
            scrollWheelZoom: false   // a roda continua rolando a página
          });
          mapa.on("click", function () { mapa.scrollWheelZoom.enable(); });
          mapa.on("mouseout", function () { mapa.scrollWheelZoom.disable(); });

          camadas.ruas = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 18, attribution: "&copy; OpenStreetMap"
          });
          camadas.satelite = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            { maxZoom: 18, attribution: "Imagens: Esri" }
          );
          camadas.ruas.addTo(mapa);
          camadaPinos = L.layerGroup().addTo(mapa);

          card.querySelector(".mapa-camadas").addEventListener("click", function (ev) {
            var b = ev.target.closest("[data-camada]");
            if (!b) return;
            var qual = b.getAttribute("data-camada");
            Object.keys(camadas).forEach(function (k) {
              if (mapa.hasLayer(camadas[k])) mapa.removeLayer(camadas[k]);
            });
            camadas[qual].addTo(mapa);
            card.querySelectorAll(".mapa-camadas button").forEach(function (el) {
              el.classList.toggle("is-on", el === b);
            });
          });
        }

        function iconeDe(u) {
          var m = SELOS[u.selo];
          return L.divIcon({
            className: "",
            html: '<div class="pino-mapa' + (u.precisao === "endereco" ? "" : " is-aprox") + '" ' +
                  'style="background:' + m.cor + '"><i class="ti ' + m.icone + '"></i></div>',
            iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -18]
          });
        }

        function baloneDe(u) {
          var m = SELOS[u.selo];
          var local = [u.cidade, u.uf].filter(Boolean).join(" · ");
          var nota = (u.score === null || u.score === undefined)
            ? '<p class="pop-obs">Ainda sem vistoria registrada.</p>'
            : '<div class="pop-linha"><span class="pop-score">' + App.fmtNum(u.score) + "</span>" +
              '<span class="badge ' + App.tierMeta(u.selo).cls + '">' + escM(m.label) + "</span></div>" +
              (u.dataVisita ? '<p class="pop-obs">Última vistoria em ' + escM(u.dataVisita) + ".</p>" : "");
          var aviso = u.precisao === "endereco" ? "" :
            '<p class="pop-obs">Posição aproximada pel' +
            (u.precisao === "cidade" ? "a cidade: o endereço" : "o estado: cidade e endereço") +
            " ainda não está no cadastro da EPO.</p>";
          return '<p class="pop-nome">' + escM(u.nome) + "</p>" +
            '<p class="pop-local">' + escM(local || "Local não informado") + "</p>" +
            nota + aviso +
            '<a class="pop-btn" href="epo-detalhe.html?id=' + encodeURIComponent(u.id) + '">' +
            '<i class="ti ti-arrow-right" aria-hidden="true"></i>Ver a EPO</a>';
        }

        function visiveis() {
          return unidades.filter(function (u) { return u.ponto && ligados[u.selo]; });
        }

        function desenharPinos() {
          camadaPinos.clearLayers();
          var lista = visiveis();
          lista.forEach(function (u) {
            L.marker(u.ponto, { icon: iconeDe(u), title: u.nome })
              .bindPopup(baloneDe(u), { maxWidth: 280 })
              .addTo(camadaPinos);
          });
          if (lista.length) {
            mapa.fitBounds(lista.map(function (u) { return u.ponto; }), { padding: [40, 40], maxZoom: 10 });
          } else {
            mapa.fitBounds(GeoBR.LIMITES);
          }
        }

        function renderFiltros() {
          var cont = document.getElementById("selo-filtros");
          var conta = {};
          ORDEM.forEach(function (s) { conta[s] = 0; });
          unidades.forEach(function (u) { conta[u.selo] += 1; });

          cont.innerHTML = ORDEM.filter(function (s) { return conta[s] > 0; }).map(function (s) {
            var m = SELOS[s];
            return '<button class="selo-chip" type="button" data-selo="' + s + '" aria-pressed="true">' +
              '<span class="pino" style="background:' + m.cor + '"><i class="ti ' + m.icone + '" aria-hidden="true"></i></span>' +
              escM(m.label) + " <b>" + conta[s] + "</b></button>";
          }).join("");

          cont.addEventListener("click", function (ev) {
            var b = ev.target.closest("[data-selo]");
            if (!b) return;
            var s = b.getAttribute("data-selo");
            ligados[s] = !ligados[s];
            b.classList.toggle("is-off", !ligados[s]);
            b.setAttribute("aria-pressed", ligados[s] ? "true" : "false");
            desenharPinos();
          });
        }

        function renderFora() {
          var fora = unidades.filter(function (u) { return !u.ponto; });
          var el = document.getElementById("mapa-fora");
          if (!fora.length) { el.hidden = true; return; }
          el.hidden = false;
          el.innerHTML = '<i class="ti ti-map-pin-off" aria-hidden="true"></i> ' +
            "Sem cidade nem endereço no cadastro, fora do mapa: " +
            fora.map(function (u) { return escM(u.nome); }).join(", ") + ".";
        }

        // O mapa nasce dentro de um cartão que ainda está sendo montado, e o
        // menu lateral pode recolher depois. Sem recalcular o tamanho o mapa
        // fica com as peças fora de lugar, então ele passa a reagir a qualquer
        // mudança de largura.
        function reagirAoTamanho() {
          var caixa = document.getElementById("mapa-epos");
          var ultimo = 0;
          var recalcular = function () {
            if (!mapa || !caixa) return;
            var l = caixa.clientWidth;
            if (l === ultimo) return;
            ultimo = l;
            if (l > 0) mapa.invalidateSize();
          };
          setTimeout(recalcular, 60);
          window.addEventListener("resize", recalcular);
          if (typeof ResizeObserver === "function") {
            new ResizeObserver(recalcular).observe(caixa);
          }
        }

        function montar(brutos) {
          unidades = brutos.map(function (e) {
            var pos = GeoBR.pontoDaEpo(e);
            var u = {
              id: e.id, nome: e.nome, cidade: e.cidade || "", uf: e.uf || "",
              score: (e.score === null || e.score === undefined) ? null : Number(e.score),
              tier: e.tier || null,
              dataVisita: dataBr(e.dataVisita),
              ponto: pos.ponto, precisao: pos.precisao
            };
            u.selo = seloDe(u);
            return u;
          });
          if (!unidades.length) return;
          GeoBR.espalhar(unidades);

          montarCasca();
          criarMapa();
          renderFiltros();
          renderFora();
          desenharPinos();
          reagirAoTamanho();
        }

        function daDemo() {
          return (APP.epos || []).map(function (e) {
            return {
              id: e.id, nome: e.nome, cidade: e.cidade, uf: e.uf,
              endereco: e.endereco || null, lat: e.lat, lng: e.lng,
              score: e.score, tier: e.tier,
              dataVisita: (e.vistorias && e.vistorias.length)
                ? e.vistorias[e.vistorias.length - 1].data : null
            };
          });
        }

        function doBanco() {
          var db = Auth.cliente;
          return db.from("epos")
            .select("id, nome, cidade, uf, endereco, lat, lng")
            .eq("ativo", true).order("nome")
            .then(function (r) {
              if (r.error) throw new Error(r.error.message);
              var lista = r.data || [];
              if (!lista.length) return [];
              return db.from("auditorias")
                .select("epo_id, score, tier, data_visita, enviada_em, status")
                .in("status", ["enviada", "validada"])
                .order("data_visita", { ascending: false })
                .then(function (ra) {
                  var ultima = {};
                  if (!ra.error) {
                    (ra.data || []).forEach(function (a) {
                      if (!ultima[a.epo_id]) ultima[a.epo_id] = a;
                    });
                  }
                  return lista.map(function (e) {
                    var a = ultima[e.id];
                    e.score = a ? a.score : null;
                    e.tier = a ? a.tier : null;
                    e.dataVisita = a ? (a.data_visita || a.enviada_em) : null;
                    return e;
                  });
                });
            });
        }

        papelDe().then(function (papel) {
          if (papel !== "cliente" && papel !== "admin") return;
          var usaBanco = window.Auth && Auth.pronto && Auth.cliente && !Auth.modoDemo();
          if (!usaBanco) { montar(daDemo()); return; }
          return doBanco().then(montar, function (err) {
            console.error("mapa das EPOs:", err);
          });
        }).catch(function (err) {
          console.error("mapa das EPOs:", err);
        });
      })();
    })();
  </script>
</body>
</html>
